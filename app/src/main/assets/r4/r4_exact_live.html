#room:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 52% 62%,transparent 17%,rgba(3,5,19,.14) 65%,rgba(1,3,12,.34));pointer-events:none}
#room-glow{position:absolute;inset:-8%;z-index:1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 22% 37% at 35% 34%,color-mix(in srgb,var(--c2) 42%,transparent),transparent),radial-gradient(ellipse 29% 30% at 72% 65%,color-mix(in srgb,var(--c1) 38%,transparent),transparent),radial-gradient(ellipse 24% 40% at 18% 82%,color-mix(in srgb,var(--c3) 26%,transparent),transparent);opacity:calc(.60 * var(--glow));animation:ambient-cycle 15s ease-in-out infinite alternate;will-change:transform,opacity}
#lights{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.beam{position:absolute;display:block;width:1px;height:120%;top:-10%;background:linear-gradient(transparent,color-mix(in srgb,var(--c1) 32%,transparent),transparent);filter:blur(7px);box-shadow:0 0 30px 5px var(--c2);opacity:.38;transform:rotate(21deg);animation:beam-pulse var(--timeline) ease-in-out infinite alternate}
.beam:nth-child(1){left:20%;animation-delay:-2s}.beam:nth-child(2){left:55%;animation-delay:-5s;--c1:#34ccff}.beam:nth-child(3){left:82%;animation-delay:-7s;--c1:#aa55ff}
#sparks{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.spark{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;box-shadow:0 0 12px 2px currentColor;opacity:0;animation:drift var(--duration) ease-in-out var(--delay) infinite;will-change:transform}
#mouse-light{position:absolute;left:50%;top:50%;z-index:3;width:280px;height:280px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,157,.11),transparent 67%);mix-blend-mode:screen;filter:blur(18px);pointer-events:none;transition:left .16s,top .16s}
/* Native-size hit areas align with the illustrated reference, yet stay clickable. */
#reference-hotspots{position:absolute;inset:0;z-index:7;pointer-events:none;display:block}
.hit{position:absolute;background:transparent;border:1px solid transparent;border-radius:13px;pointer-events:auto;color:transparent;transition:box-shadow .22s,background .22s,transform .22s}
.hit:hover,.hit:focus-visible{box-shadow:0 0 0 1px var(--c1),0 0 24px 4px color-mix(in srgb,var(--c1) 55%,transparent);background:rgba(255,201,108,.05)}
#nav-top{position:absolute;left:27%;right:24%;top:0;height:7%;display:flex;z-index:8;justify-content:space-between;align-items:center;gap:7px;direction:ltr}
#nav-top button{padding:8px 11px;border-radius:999px;background:rgba(1,5,21,.13);font-size:clamp(9px,1.12vw,16px);min-width:12%;opacity:0;transition:background .2s,opacity .2s,color .2s}
#nav-top button:hover,#nav-top button.chosen{opacity:1;background:rgba(8,12,26,.72);color:var(--c1);box-shadow:0 0 0 1px var(--c1)}
#nav-rail{position:absolute;left:0;top:22%;bottom:21%;width:10.5%;z-index:9;display:flex;flex-direction:column;gap:.2%;justify-content:space-between}
#nav-rail button{flex:1;background:transparent;border-radius:8px;opacity:0;font-size:12px}
#nav-rail button:hover,#nav-rail button.chosen{opacity:1;background:linear-gradient(90deg,rgba(255,180,70,.25),transparent);box-shadow:inset 2px 0 var(--c1)}
/* Dynamic shelf masks only the baked card shelf, while preserving room edges and neon floor. */
#card-vault{position:absolute;z-index:6;left:10.2%;right:3.8%;top:28.2%;height:39.2%;overflow:visible;perspective:900px;pointer-events:none}
#card-bg{position:absolute;inset:0 -1%;border-radius:20px;background:linear-gradient(to bottom,rgba(6,12,20,.80),rgba(9,10,20,.90) 82%,rgba(9,12,22,.04));backdrop-filter:blur(11px);mask-image:linear-gradient(to bottom,transparent 0%,black 8%,black 90%,transparent 100%)}
#cards{position:absolute;inset:3% 0 1%;display:flex;align-items:center;justify-content:center;gap:clamp(5px,.65vw,14px);direction:ltr;pointer-events:auto;perspective:1100px}
.card{position:relative;flex:0 0 12.9%;height:76%;border-radius:10px;border:1px solid rgba(255,255,255,.44);box-shadow:0 13px 30px #000c;overflow:hidden;cursor:pointer;background:#0a1420;transform-style:preserve-3d;transform:translateZ(0) rotateY(-2deg);transition:transform .45s cubic-bezier(.18,.89,.25,1.06),box-shadow .35s,height .35s,opacity .35s;animation:card-float calc(7.5s * var(--speed)) ease-in-out infinite alternate}
.card:nth-child(even){animation-delay:-3s}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.active{flex-basis:18.2%;height:94%;border-color:#ffe5a5;transform:translateY(-9px) translateZ(90px) rotateY(0deg);box-shadow:0 0 0 2px rgba(255,213,135,.89),0 0 21px 3px rgba(255,196,81,.85),0 20px 42px #000d;z-index:4;animation:active-float calc(5s * var(--speed)) ease-in-out infinite alternate}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(114deg,rgba(255,255,255,.20),transparent 28% 70%,rgba(255,255,255,.07));mix-blend-mode:screen}
.card:hover:not(.active){transform:translateY(-5px) translateZ(22px) rotateY(0deg);box-shadow:0 0 18px 3px #ffd58d70}
.card strong{position:absolute;left:0;right:0;bottom:0;padding:23px 4px 10px;background:linear-gradient(transparent,#08090eff);font-size:clamp(8px,1.08vw,16px);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-align:center;color:#fff;text-shadow:0 1px 4px black}
.card .badge{position:absolute;right:5px;top:6px;z-index:2;background:#0b1017c2;border-radius:100%;padding:4px 6px;font-size:10px;color:#ffe29a;opacity:0;transition:opacity .2s}.card.active .badge{opacity:1}
#stage-light{position:absolute;pointer-events:none;z-index:5;bottom:23%;left:30%;right:22%;height:11%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,198,62,.26),transparent 68%);box-shadow:0 0 14px var(--c1);filter:blur(7px);animation:platform-glow 3.5s ease-in-out infinite alternate}
#meta{position:absolute;left:20%;right:16%;bottom:7.5%;height:18%;z-index:10;border-radius:19px;display:flex;align-items:center;gap:1.7%;padding:0.9% 1.1%;direction:ltr;box-shadow:0 3px 22px #0009;background:linear-gradient(140deg,rgba(5,10,19,.95),rgba(8,8,18,.92));border:1px solid rgba(255,213,151,.30);backdrop-filter:blur(14px)}
#meta-cover{height:100%;width:21%;border-radius:10px;background-position:center;background-size:cover;box-shadow:0 0 0 1px #ffffff55;flex-shrink:0}
#meta-info{flex:1;min-width:0}#meta-info h2{font-size:clamp(13px,1.7vw,27px);margin:0 0 8px;color:#fff}#meta-info p{margin:0;color:#d8d7dd;font-size:clamp(9px,1vw,14px);line-height:1.4;max-width:38ch}
.chip{display:inline-block;border:1px solid #9b8a7170;border-radius:100px;padding:3px 8px;margin:0 2px 8px 0;font-size:clamp(8px,.8vw,12px);color:#eae2d7}
#meta-actions{display:flex;flex-direction:column;align-items:stretch;gap:11px;width:21%;min-width:100px}
.primary{border:1px solid #ffe5ad;color:#21130a;font-weight:800;padding:10px 8px;border-radius:999px;background:linear-gradient(135deg,#ffe4a6,#b47b37);box-shadow:0 0 16px 2px #ffd27e96;animation:button-breathe 3s ease-in-out infinite alternate}
.secondary{border:1px solid #7b7880a0;background:#10131f;border-radius:999px;padding:8px}
#app-panels{position:absolute;z-index:15;right:2%;top:8.2%;width:min(280px,32vw);display:none;border-radius:18px;background:linear-gradient(#111428e9,#0b0b16f5);border:1px solid #d5a46a9c;backdrop-filter:blur(17px);padding:14px;box-shadow:0 12px 40px #000e}
#app-panels.open{display:block;animation:panel-in .28s ease-out both}#app-panels h3{margin:3px 0 15px;font-size:16px}
.panel-option{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 8px;border-top:1px solid #ffffff17;background:transparent;text-align:right;font-size:13px}
.panel-option:hover{background:#ffffff13}.small{font-size:11px;color:#ccbdc6}
#modal-wrap{position:absolute;z-index:25;inset:0;background:#0009;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
#modal-wrap.open{display:flex}#modal{width:min(490px,95vw);border:1px solid #ffe09c80;border-radius:21px;background:linear-gradient(#13203be9,#080d1ff7);padding:23px;box-shadow:0 20px 70px #000d;animation:panel-in .2s ease-out both;text-align:right}#modal h2{margin:0 0 10px}#modal p{line-height:1.6;color:#d0d6de}
#modal button{margin:5px;padding:9px 15px;border-radius:11px;background:#293046}
#toast{position:absolute;z-index:30;bottom:3%;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;border:1px solid #e9c88891;background:#0d1224e8;padding:10px 22px;border-radius:100px;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;font-size:12px}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toggle-mobile,#mobile-head{display:none}
body.low-fx #lights,body.low-fx #sparks,body.low-fx #mouse-light{display:none}body.low-fx #room,body.low-fx #room-glow,body.low-fx .card,body.low-fx #stage-light,body.low-fx .primary{animation:none!important}
@keyframes scene-pan{0%{transform:scale(1.02) translate(-.25%,-.7%)}100%{transform:scale(1.062) translate(.45%,.4%)}}
@keyframes ambient-cycle{0%{opacity:.18;transform:translateX(-2%) scale(1)}55%{opacity:calc(.7 * var(--glow));transform:translateX(2%) scale(1.10)}100%{opacity:.42;transform:translateY(-2%) scale(1.04)}}
@keyframes beam-pulse{from{opacity:.10;transform:translateX(-15px) rotate(21deg)}to{opacity:.55;transform:translateX(21px) rotate(22deg)}}
@keyframes drift{0%,100%{opacity:0;transform:translateY(20px) translateX(0) scale(.4)}40%,80%{opacity:.65;transform:translateY(-35px) translateX(16px) scale(1)}}
@keyframes card-float{from{translate:0 0}to{translate:0 -4px}}@keyframes active-float{from{translate:0 -2px}to{translate:0 4px}}
@keyframes platform-glow{0%{opacity:.3;scale:.85}to{opacity:.95;scale:1.12}}@keyframes button-breathe{to{box-shadow:0 0 18px 6px #ffc867cb}}
@keyframes panel-in{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (max-aspect-ratio:1/1){
 #room{background-size:auto 100%;background-position:51% center;filter:blur(3px) saturate(1.2)}
 #reference-hotspots,#nav-rail,#nav-top{display:none}
 #mobile-head{display:flex;position:absolute;top:0;left:0;right:0;z-index:14;padding:14px;align-items:center;justify-content:space-between;background:linear-gradient(#050b1de9,transparent)}
 #mobile-head .logo{font-size:24px;font-weight:900;letter-spacing:1px;color:#ffca78}
 #toggle-mobile{display:block;border-radius:12px;border:1px solid #f4c7838c;background:#111a31dd;padding:8px 15px}
 #card-vault{top:23%;left:0;right:0;height:39%}
 #card-bg{inset:-3% 0;background:#07101bb5;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}
 #cards{inset:0 0;justify-content:flex-start;overflow:auto;gap:12px;padding:0 14vw;scroll-snap-type:x mandatory;perspective:600px;scrollbar-width:none}#cards::-webkit-scrollbar{display:none}
 .card{flex:0 0 48%;height:78%;min-width:160px;scroll-snap-align:center;animation:none}.card.active{flex:0 0 56%;height:92%;transform:translateY(-4px) scale(1.04)}.card strong{font-size:15px}
 #meta{left:4%;right:4%;bottom:10%;height:22%;padding:10px;gap:10px}#meta-cover{width:31%}#meta-info h2{font-size:17px}#meta-info p{font-size:10px}#meta-info .chip{font-size:9px}#meta-actions{width:29%;min-width:85px}#meta-actions button{font-size:11px;padding:9px 4px}
 #app-panels{width:min(330px,89vw);top:61px;right:3%}
 #stage-light{bottom:35%;left:16%;right:16%}
}
@media (prefers-reduced-motion:reduce){#room,#room-glow,.beam,.spark,.card,#stage-light,.primary{animation:none!important}}
</style>
</head>
<body>
<div id="app">
<div id="room"></div><div id="room-glow"></div><div id="lights"><i class="beam"></i><i class="beam"></i><i class="beam"></i></div><div id="sparks"></div><div id="mouse-light"></div>
<div id="reference-hotspots">
<button class="hit" style="left:0%;top:0%;width:17%;height:10%" onclick="toast('R4 PC Gaming — النسخة التفاعلية')" aria-label="R4 PC Gaming"></button>
<button class="hit" style="right:6%;top:0%;width:15%;height:7.5%" onclick="togglePanel()" aria-label="الإعدادات"></button>
<button class="hit" style="left:0%;bottom:0%;width:17%;height:14%" onclick="togglePanel()" aria-label="قائمة الأدوات"></button>
</div>
<nav id="nav-top"><button onclick="navAction('الرئيسية',this)" class="chosen">الرئيسية</button><button onclick="navAction('الألعاب',this)">الألعاب</button><button onclick="navAction('المكتبة',this)">المكتبة</button><button onclick="navAction('المفضلة',this)">المفضلة</button><button onclick="togglePanel()">الإعدادات</button></nav>
<nav id="nav-rail"><button onclick="navAction('كل الألعاب',this)" class="chosen" aria-label="كل الألعاب">الكل</button><button onclick="navAction('الأكشن',this)">أكشن</button><button onclick="navAction('المغامرات',this)">مغامرات</button><button onclick="navAction('RPG',this)">RPG</button><button onclick="navAction('التصويب',this)">تصويب</button><button onclick="navAction('السباق',this)">سباق</button><button onclick="navAction('المفضلة',this)">مفضلة</button></nav>
<div id="mobile-head"><div class="logo">R4 <small style="color:#fff;font-size:11px">PC GAMING</small></div><button id="toggle-mobile" onclick="togglePanel()">☰ القائمة</button></div>
<div id="stage-light"></div><div id="card-vault"><div id="card-bg"></div><div id="cards" aria-label="معرض الألعاب"></div></div>
<div id="meta"><div id="meta-cover"></div><div id="meta-info"><h2 id="game-title"></h2><div id="chips"></div><p id="game-description"></p></div><div id="meta-actions"><button class="primary" id="play-btn" onclick="playSelected()">▶ تشغيل</button><button class="secondary" onclick="showDetails()">التفاصيل ⓘ</button></div></div>
<div id="app-panels"><h3>✦ لوحة تحكم R4</h3><button class="panel-option" onclick="cycleLighting()"><span>الإضاءة الديناميكية</span><b id="lighting-label">سينمائية</b></button><button class="panel-option" onclick="cycleQuality()"><span>جودة المؤثرات</span><b id="quality-label">عالية</b></button><button class="panel-option" onclick="toggleAmbient()"><span>الخلفية المتحركة</span><b id="ambient-label">مفعلة</b></button><button class="panel-option" onclick="addGame()"><span>إضافة لعبة إلى المعرض</span><b>＋</b></button><button class="panel-option" onclick="openFiles()"><span>مستكشف الملفات</span><b>▣</b></button><button class="panel-option" onclick="changeOrientation()"><span>اتجاه الواجهة تلقائي / أفقي / عمودي</span><b>↻</b></button><button class="panel-option" onclick="togglePanel()"><span>إغلاق القائمة</span><b>✕</b></button><p class="small">هذه معاينة تفاعلية مستقلة، وليست محاكي Windows أو قياسات حقيقية للأداء.</p></div>

let sourceGames=[...initialGames];let games=[...sourceGames];let selected=3;let category='all';const favoriteIds=new Set(['elden']);let settingsOpen=false;let quality=2;let lighting=0;let ambient=true;let timeout=null;
const cards=document.getElementById('cards');const app=document.getElementById('app');
function render(){cards.replaceChildren();games.forEach((g,i)=>{const c=document.createElement('button');c.className='card'+(i===selected?' active':'');c.ariaLabel='اختيار '+g.name;c.title=g.name;c.addEventListener('click',()=>{if(i===selected)playSelected();else select(i)});c.innerHTML='';if(COVERS[g.id]){const img=new Image();img.src='data:image/webp;base64,'+COVERS[g.id];img.alt=g.name;c.append(img)}else{let p=document.createElement('div');p.style.cssText='height:100%;background:linear-gradient(135deg,#253763,#502e79);display:grid;place-items:center;padding:16px;';p.textContent='🎮';c.append(p)}let title=document.createElement('strong');title.textContent=g.name;c.append(title);let tag=document.createElement('span');tag.className='badge';tag.textContent=i===selected?'★':'◈';c.append(tag);cards.append(c)});const game=games[selected];if(!game){document.getElementById('game-title').textContent='مكتبة الألعاب فارغة';document.getElementById('game-description').textContent='أضف لعبة EXE من القائمة.';document.getElementById('meta-cover').style.backgroundImage='none';return;}document.getElementById('game-title').textContent=game.name;document.getElementById('game-description').textContent=game.desc;const cover=COVERS[game.id];document.getElementById('meta-cover').style.backgroundImage=cover?'url(data:image/webp;base64,'+cover+')':'linear-gradient(140deg,#445494,#27223c)';const chips=document.getElementById('chips');chips.replaceChildren();game.genres.forEach(g=>{const span=document.createElement('span');span.className='chip';span.textContent=g;chips.append(span)})}
function select(i){selected=i;render();if(window.innerWidth<window.innerHeight){cards.children[i]?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}}

function showModal(title,msg){document.getElementById('modal-title').textContent=title;document.getElementById('modal-content').textContent=msg;document.getElementById('modal-wrap').classList.add('open')}
function closeModal(){document.getElementById('modal-wrap').classList.remove('open')}
function playSelected(){const g=games[selected];if(!g){toast('ماكو لعبة محددة');return;}if(window.Native&&typeof Native.play==='function'){Native.play(g.nativeIndex??selected);return}if(window.R4Native&&typeof R4Native.playGame==='function'){R4Native.playGame(g.nativeIndex??selected);return}showModal('▶ '+g.name,'هذه تجربة الواجهة الحيّة. في النسخة التجريبية ماكو تشغيل EXE داخل المتصفح؛ من نعتمدها داخل R4 PC Gaming راح ينربط هذا الزر بمحرك تشغيل اللعبة الموجود بدون تعديل نظام التحكم.')}
function showDetails(){const g=games[selected];if(!g)return;if(window.Native&&typeof Native.profile==='function'){Native.profile(g.nativeIndex??selected);return}showModal('ⓘ '+g.name,g.desc+'\nالتصنيف: '+g.genres.join(' • '))}
window.r4ShowProfile=function(p){if(!p)return;const title=String(p.title||'لعبة Windows');const rows=['المسار: '+String(p.profile||'AUTO'),'المعمارية: '+String(p.architecture||'غير محدد'),'الرسوميات المكتشفة: '+String(p.api||'غير محدد'),'محرك اللعبة: '+String(p.engine||'غير محدد'),'نوع ملف التشغيل: '+String(p.role||'غير محدد'),'درجة الثقة: '+String(p.confidence||'غير محددة'),'التوصية: '+String(p.recommendation||'الفحص لا يكفي')];showModal('◈ فحص توافق '+title,rows.join('\n'))};
function navAction(label,el){document.querySelectorAll('#nav-rail button,#nav-top button').forEach(x=>x.classList.remove('chosen'));el?.classList.add('chosen');let group=label;if(['كل الألعاب','الرئيسية','الألعاب','المكتبة'].includes(label))group='all';const tags={'الأكشن':'أكشن','المغامرات':'مغامرة','RPG':'RPG','التصويب':'تصويب','السباق':'سباق'};games=group==='all'?[...sourceGames]:group==='المفضلة'?sourceGames.filter(g=>favoriteIds.has(g.id)):sourceGames.filter(g=>g.genres.includes(tags[group]||group));selected=Math.min(games.length-1,Math.max(0,games.findIndex(g=>g.id==='elden')));render();toast(games.length?'القسم: '+label+' • '+games.length+' ألعاب':'ماكو ألعاب ضمن '+label)}
function togglePanel(){settingsOpen=!settingsOpen;document.getElementById('app-panels').classList.toggle('open',settingsOpen)}
function openFiles(){if(window.Native&&typeof Native.files==='function'){Native.files();return}toast('مستكشف الملفات يتوفر داخل APK')}
function changeOrientation(){if(window.Native&&typeof Native.orientation==='function'){Native.orientation();return}toast('الاتجاه يتغير تلقائياً مع تدوير جهازك')}
function cycleLighting(){lighting=(lighting+1)%4;const colors=[['#ffc96c','#22a7ff','#9b50ff'],['#28d4ff','#5173ff','#d856ff'],['#ff496d','#ffbb54','#e36adf'],['#a3ffad','#72eaff','#ffd88a']][lighting];['--c1','--c2','--c3'].forEach((v,i)=>document.documentElement.style.setProperty(v,colors[i]));document.getElementById('lighting-label').textContent=['سينمائية','نيون أزرق','غروب أحمر','طبيعة مضيئة'][lighting]}
function cycleQuality(){quality=(quality+1)%3;document.body.classList.toggle('low-fx',quality===0);document.documentElement.style.setProperty('--glow',quality===2?1:quality===1?.65:0);document.documentElement.style.setProperty('--timeline',quality===2?'8s':'13s');document.getElementById('quality-label').textContent=['اقتصادية','متوسطة','عالية'][quality]}
function toggleAmbient(){ambient=!ambient;document.getElementById('ambient-label').textContent=ambient?'مفعلة':'متوقفة';app.style.animationPlayState=ambient?'running':'paused';document.querySelectorAll('#room,#room-glow,.beam,.spark,#stage-light').forEach(n=>n.style.animationPlayState=ambient?'running':'paused')}
function addGame(){if(window.Native&&typeof Native.add==='function'){Native.add();return}if(window.R4Native&&typeof R4Native.addGame==='function'){R4Native.addGame();return}document.getElementById('file').click()}
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const name=f.name.replace(/\.exe$/i,'');if(!/\.exe$/i.test(f.name)){toast('الملف مو بصيغة EXE');return}const id='custom'+Date.now();sourceGames.push({id,name,genres:['Windows EXE'],desc:'ملف مضاف للتجربة البصرية فقط. التشغيل يحتاج التطبيق.'});games=[...sourceGames];selected=games.length-1;render();toast('انضافت بطاقة '+name+' للمعاينة')});
window.addEventListener('keydown',event=>{if(event.key==='ArrowRight')select((selected+1)%games.length);if(event.key==='ArrowLeft')select((selected-1+games.length)%games.length);if(event.key==='Escape'){closeModal();if(settingsOpen)togglePanel()}if(event.key==='Enter'&&document.activeElement===document.body)playSelected()});
const root=document.getElementById('app');root.addEventListener('pointermove',e=>{if(window.matchMedia('(hover:none)').matches)return;const x=e.clientX/window.innerWidth,y=e.clientY/window.innerHeight;document.getElementById('mouse-light').style.left=e.clientX+'px';document.getElementById('mouse-light').style.top=e.clientY+'px';document.getElementById('room').style.transform=`translate(${(x-.5)*-5}px,${(y-.5)*-5}px) scale(1.04)`},{passive:true});root.addEventListener('pointerleave',()=>document.getElementById('room').style.transform='');
const sparkRoot=document.getElementById('sparks');for(let i=0;i<18;i++){const s=document.createElement('div');s.className='spark';s.style.setProperty('--x',(5+(i*67)%92)+'%');s.style.setProperty('--y',(9+(i*31)%87)+'%');s.style.setProperty('--size',(1+(i%3))+'px');s.style.setProperty('--duration',(4+i%6)+'s');s.style.setProperty('--delay','-'+(i%9)+'s');s.style.color=['#f8c777','#45b9fc','#e285ff'][i%3];sparkRoot.append(s)}

// R4 Android shell API: native application may replace demo entries with its
// real EXE index and supply local cover data. No arbitrary EXE path is passed
// across the JavaScript bridge; Android validates the selected game index.
window.r4SetGames=function(list){if(!Array.isArray(list))return;sourceGames=list.map((x,i)=>({id:x.id||('native-'+i),name:String(x.name||'Windows Game'),genres:Array.isArray(x.genres)?x.genres:['Windows EXE'],desc:String(x.desc||'لعبة Windows مضافة إلى مكتبتك.'),nativeIndex:i}));games=[...sourceGames];selected=0;render()};
window.r4SetGameCover=function(index,dataUri){if(index<0||index>=sourceGames.length)return;const game=sourceGames[index];if(typeof dataUri!=='string'||!dataUri.startsWith('data:image/'))return;COVERS[game.id]=dataUri.split(',')[1];render()};
window.r4RenameGame=function(index,name){if(index<0||index>=sourceGames.length||typeof name!=='string')return;sourceGames[index].name=name;render()};
document.addEventListener('visibilitychange',()=>{document.querySelectorAll('#room,#room-glow,.beam,.spark,.card,#stage-light').forEach(el=>el.style.animationPlayState=document.hidden?'paused':ambient?'running':'paused')});
window.r4Paused=function(paused){document.querySelectorAll('#room,#room-glow,.beam,.spark,.card,#stage-light,.primary').forEach(el=>el.style.animationPlayState=paused?'paused':ambient?'running':'paused');};
if(window.Native&&typeof Native.play==='function'){sourceGames=[];games=[];selected=0;}
render();
</script>
</body></html>
