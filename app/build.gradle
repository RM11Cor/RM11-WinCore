plugins {
    id 'com.android.application'
}
android {
    namespace 'com.rm11cor.carxstreet.portlab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rm11cor.carxstreet.portlab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-source-inspector'
        resConfigs 'ar', 'en'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
