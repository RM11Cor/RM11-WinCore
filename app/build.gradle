plugins { id 'com.android.application' }

// Files-only rebuild keeps the ORIGINAL Android applicationId and original
// release key. All installed private data remain intact during an update.
def rm11KeystoreFile = System.getenv('RM11_RELEASE_KEYSTORE')
def rm11KeystorePassword = System.getenv('RM11_RELEASE_PASSWORD')

android {
    namespace 'com.rm11.autocore'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rm11.autocore'
        minSdk 29
        targetSdk 35
        versionCode 128
        versionName '4.0.49-windows-workspace'
    }
    // Only this source tree becomes DEX. Old Wine/X11/Desktop/Intro source
    // remains only in Git history/tree for possible future reimplementation.
    // It is NOT compiled or shipped inside this cleanup APK.
    sourceSets {
        main {
            java.setSrcDirs(['src/main/filesonly/java'])
            assets.setSrcDirs([])
            jniLibs.setSrcDirs([])
            res.setSrcDirs([])
        }
        test { java.setSrcDirs([]) }
        androidTest { java.setSrcDirs([]) }
    }
    signingConfigs {
        stable {
            if (rm11KeystoreFile && rm11KeystorePassword) {
                storeFile file(rm11KeystoreFile)
                storePassword rm11KeystorePassword
                keyAlias 'rm11-autocore'
                keyPassword rm11KeystorePassword
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No third-party AAR, X11, CMake, native JNI, Wine, FEX or graphics deps.
}
