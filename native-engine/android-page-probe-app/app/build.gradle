plugins { id 'com.android.application' }

// Standalone side-by-side KERNIX native kernel page diagnostic. The original
// KERNIX app (org.kernix.host) and its v0.27 signing/update lineage remain
// untouched. No temporary debug or random CI certificate is publishable.
def storePath = System.getenv('KERNIX_APK_KEYSTORE_PATH')
def password = System.getenv('KERNIX_APK_SIGNING_PASSWORD')
def stableSigner = storePath != null && !storePath.isEmpty() &&
                   password != null && !password.isEmpty()
android {
    namespace 'org.kernix.pageprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'org.kernix.pageprobe'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1-c3d3-kernel-page-only'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        kernixUpdate {
            if(stableSigner) {
                storeFile file(storePath)
                storePassword password
                keyAlias 'kernix-update'
                keyPassword password
                storeType 'PKCS12'
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.kernixUpdate
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
gradle.taskGraph.whenReady { graph ->
    def publishing = graph.allTasks.any { t ->
        t.project == project &&
        (t.name == 'assembleRelease' || t.name == 'packageRelease' ||
         t.name == 'bundleRelease')
    }
    if(publishing && !stableSigner) {
        throw new GradleException('C3-D3 signed release requires original KERNIX persistent keystore')
    }
}
