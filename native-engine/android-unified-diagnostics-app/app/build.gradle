plugins { id 'com.android.application' }
def store=System.getenv('KERNIX_APK_KEYSTORE_PATH')
def pass=System.getenv('KERNIX_APK_SIGNING_PASSWORD')
def validSigning=store!=null && !store.isEmpty() && pass!=null && !pass.isEmpty()
def versionText=System.getenv('KERNIX_DIAGNOSTICS_VERSION_CODE') ?: '1'
if (!(versionText ==~ /[1-9][0-9]{0,7}/)) throw new GradleException('Non-monotonic/invalid diagnostics versionCode requested')
android {
 namespace 'org.kernix.diagnostics'
 compileSdk 35
 defaultConfig {
  applicationId 'org.kernix.diagnostics'
  minSdk 26
  targetSdk 28
  versionCode Integer.parseInt(versionText)
  versionName '0.1-one-upgradeable-probe-not-released'
  ndk { abiFilters 'arm64-v8a' }
 }
 signingConfigs {
  originalKernix {
   if(validSigning) {
    storeFile file(store)
    storePassword pass
    keyAlias 'kernix-update'
    keyPassword pass
    storeType 'PKCS12'
    v1SigningEnabled true
    v2SigningEnabled true
   }
  }
 }
 packaging { jniLibs { useLegacyPackaging=true } }
 buildTypes {
  debug { minifyEnabled false }
  release { minifyEnabled false; signingConfig signingConfigs.originalKernix }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
gradle.taskGraph.whenReady { g ->
 if(g.allTasks.any { t->t.project==project && t.name=='assembleRelease' } && !validSigning)
  throw new GradleException('Stable KERNIX diagnostics signing identity required: cannot publish unsigned APK')
}
