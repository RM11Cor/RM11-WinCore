plugins { id 'com.android.application' }
def storePath=System.getenv('KERNIX_APK_KEYSTORE_PATH')
def password=System.getenv('KERNIX_APK_SIGNING_PASSWORD')
def stable=storePath!=null && !storePath.isEmpty() &&
           password!=null && !password.isEmpty()
android {
    namespace 'org.kernix.roprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'org.kernix.roprobe'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '0.2-c3d6r2-kernel-chosen-ro-no-fex'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        kernixUpdate {
            if(stable) {
                storeFile file(storePath)
                storePassword password
                keyAlias 'kernix-update'
                keyPassword password
                storeType 'PKCS12'
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.kernixUpdate
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
gradle.taskGraph.whenReady { graph ->
    def release=graph.allTasks.any { t ->
        t.project==project && ['assembleRelease','packageRelease','bundleRelease'].contains(t.name)
    }
    if(release && !stable)
        throw new GradleException('C3-D6 release requires pinned original KERNIX update certificate')
}
