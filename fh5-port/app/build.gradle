plugins { id 'com.android.application' }

// Stable signing is provided by GitHub Actions using existing protected repository
// secrets; never put the PKCS#12 private key or password in source control.
def stableKeyPath = System.getenv('FH5_STABLE_KEYSTORE')
def stableKeyPassword = System.getenv('FH5_STABLE_PASSWORD')

android {
    signingConfigs {
        if (stableKeyPath && stableKeyPassword) {
            stableRelease {
                storeFile file(stableKeyPath)
                storePassword stableKeyPassword
                keyAlias 'fh5-release'
                keyPassword stableKeyPassword
                storeType 'pkcs12'
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    namespace 'com.fh5.port'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fh5.port'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName 'P3.0-graph-convergence'
        ndk { abiFilters 'arm64-v8a' }
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (stableKeyPath && stableKeyPassword) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
