      - name: Publish direct APK prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v4.0.89-native-wine-activity'
          ASSET='app/build/outputs/apk/release/app-release.apk'
          EXTERNAL_ASSET='external-test/rm11-external-smoke-v270.exe'
          GUI_ASSET='external-test/rm11-gui-smoke-v271.exe'
          # CI check: refuse to publish a release from a syntactically invalid
          # single-quoted notes literal. Deliberately no external operations.
          bash -n <<'RM11_RELEASE_SHELL_CHECK'
          gh release create "$TAG" "$ASSET" --target main \
            --title 'RM11-WinCore v4.0.89 Wine Native Process Activity and Binary Identity Evidence' \
            --notes 'v4.0.89: Device v488 APK166 diagnostic sees 97 same-UID processes and one wineserver but no recognized Wine client argv, despite v486 Wine trace showing CarX launcher PE and USER32 loaded. Existing match relies on libwineprobe.so argv only. Add Wine native identity from app-owned proc exe link/comm/argv, plus aggregate app-owned CPU-tick changes by individual native PID across 20-second intervals. Reports categories/counts only, no PIDs or game paths. Preserve v488 evidence and game/Wine/Mesa/prefix baseline. Game rendering remains unverified.'
          RM11_RELEASE_SHELL_CHECK
          # Only the current branch head may publish: older concurrent Actions
          # builds must not overwrite the newest signed APK.
          CURRENT_SHA="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping release for outdated build $GITHUB_SHA (head is $CURRENT_SHA)"
            exit 0
          fi
          # GitHub release-create rejects GITHUB_TOKEN when target_commitish
          # changes .github/workflows relative to the default branch (403).
          # Anchor the DISTRIBUTION TAG to main, but the APK is built from
          # verified source GITHUB_SHA in the rm11-v415 feature branch.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target main \
              --title 'RM11-WinCore v4.0.89 Wine Native Process Activity and Binary Identity Evidence' \
               --notes 'v4.0.89: v488 on-device ZIP (APK166) 105s game run; Wine PE image and windows DLL loaded but native census 97 app-owned processes, 0 loader matches with argv-only, 1 wineserver. Improve identification using app-owned /proc exe symlink and comm, and independently compare total same-UID native CPU ticks and number of CPU-advancing PIDs even if the Wine executable remains unclassified. Maintain bounded, privacy-respecting first/live/final reports and signed APK. No Wine, renderer, game or prefix mutations. VersionCode 167.' \
              --prerelease
          fi
