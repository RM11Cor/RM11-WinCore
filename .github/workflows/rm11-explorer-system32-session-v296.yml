          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          p=Path('app/src/main/assets/runtime/rm11-seh-probe-v460-x64.exe')
          b=p.read_bytes()
          assert 1024<len(b)<350000, len(b)
          assert b[:2]==b'MZ'
          pe=struct.unpack_from('<I',b,0x3c)[0]
          assert 64<=pe<len(b)-30
          assert b[pe:pe+4]==b'PE\x00\x00'
          assert struct.unpack_from('<H',b,pe+4)[0]==0x8664, 'probe is not x64 PE'
          assert struct.unpack_from('<H',b,pe+24)[0]==0x20b, 'probe is not PE32+'
          sections=struct.unpack_from('<H',b,pe+6)[0]
          optional=struct.unpack_from('<H',b,pe+20)[0]
          sh=pe+24+optional
          names={b[sh+i*40:sh+i*40+8].split(b'\x00')[0]
                 for i in range(sections)}
          assert b'.pdata' in names, 'missing x64 exception unwind section'
          assert hashlib.sha256(b).hexdigest()==p.with_name(p.name+'.sha256').read_text().strip()
          print('RM11_V460_PINNED_WIN64_SEH_PROBE_PE_AND_UNWIND_METADATA_VERIFIED')
          PY
