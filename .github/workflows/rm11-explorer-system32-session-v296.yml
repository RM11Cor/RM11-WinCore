          test -s tests/native/test_v444_font_process_gate.c
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build APK using existing release signing identity
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RM11_RELEASE_KEYSTORE_B64"
          test -n "$RM11_RELEASE_PASSWORD"
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" -alias rm11-autocore >/dev/null
          export RM11_RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          gradle --no-daemon --stacktrace :app:assembleRelease
          # Device explicitly rejected v4.0.26 despite a valid public SHA256
          # and signer identity. This variant DOES NOT change runtime/app data.
          # Force deterministic alignment BEFORE signature and explicitly use
          # Android's v1/v2/v3 schemes from the original stable keystore.
          # Re-sign after alignment: changing ZIP bytes after signing breaks v2/v3.
          APK='app/build/outputs/apk/release/app-release.apk'
          ALIGNED="$RUNNER_TEMP/rm11-v427-aligned-unsigned.apk"
          SIGNED="$RUNNER_TEMP/rm11-v427-install-compatible.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BT/zipalign" -c -v -p 4 "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$RM11_RELEASE_KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias rm11-autocore \
            --ks-pass env:RM11_RELEASE_PASSWORD \
            --key-pass env:RM11_RELEASE_PASSWORD \
            --min-sdk-version 29 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --min-sdk-version 29 --max-sdk-version 36 --print-certs "$SIGNED" \
            > "$RUNNER_TEMP/rm11-v427-signature-report.txt"
          python3 - "$SIGNED" <<'PY'
          import sys,struct,hashlib
          from zipfile import ZipFile
          asset='assets/runtime/rm11-seh-probe-v460-x64.exe'
          with ZipFile(sys.argv[1]) as apk:
            probe=apk.read(asset)
            pinned=apk.read(asset+'.sha256').decode().strip()
            assert len(probe)>1024 and probe[:2]==b'MZ'
            hdr=struct.unpack_from('<I',probe,0x3c)[0]
            assert probe[hdr:hdr+4]==b'PE\x00\x00'
            assert struct.unpack_from('<H',probe,hdr+4)[0]==0x8664
            assert hashlib.sha256(probe).hexdigest()==pinned
          with ZipFile(sys.argv[1]) as apk:
            asset='assets/runtime/rm11-fiber-seh-probe-v461-x64.exe'
            blob=apk.read(asset)
            digest=apk.read(asset+'.sha256').decode().strip()
            assert hashlib.sha256(blob).hexdigest()==digest
            pe=struct.unpack_from('<I',blob,0x3c)[0]
            assert blob[pe:pe+4]==b'PE'+bytes((0,0))
            assert struct.unpack_from('<H',blob,pe+4)[0]==0x8664
          print('RM11_V461_SIGNED_APK_FIBER_SEH_SHA256_AND_ARCH_VERIFIED')
          print('RM11_V460_SIGNED_APK_WIN64_SEH_BINARY_SHA256_AND_ARCH_VERIFIED')
          PY
          # Diagnostic output is displayed when matching checks fail.
          cat "$RUNNER_TEMP/rm11-v427-signature-report.txt"
          grep -Ei 'Verified using v[123](\\.1)? scheme' "$RUNNER_TEMP/rm11-v427-signature-report.txt" || true
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/rm11-v427-signature-report.txt"
          grep -Eiq 'Verified using v3 scheme.*: true' "$RUNNER_TEMP/rm11-v427-signature-report.txt"
          echo 'RM11_V427_V3_SIGNATURE_VERIFIED_WITH_ORIGINAL_CERT'
          "$BT/zipalign" -c -v -p 4 "$SIGNED"
          unzip -tqq "$SIGNED"
          mv "$SIGNED" "$APK"
          sha256sum "$APK"
      - name: Verify APK signature and preserve Wine libraries
        run: |
