          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='com.rm11.autocore' versionCode='87' versionName='4.0.4-wine-freetype-soname'"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          files={
            'assets/runtime/rm11-wine-stack.zip':'app/src/main/assets/runtime/rm11-wine-stack.zip',
            'assets/runtime/rm11-prefix-prepared.zip':'app/src/main/assets/runtime/rm11-prefix-prepared.zip',
            'lib/arm64-v8a/libwineprobe.so':'app/src/main/jniLibs/arm64-v8a/libwineprobe.so',
            'lib/arm64-v8a/libwine_ntdll.so':'app/src/main/jniLibs/arm64-v8a/libwine_ntdll.so',
            'lib/arm64-v8a/libwineserverrm11.so':'app/src/main/jniLibs/arm64-v8a/libwineserverrm11.so',
          }
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as a:
            assert a.getinfo('classes.dex').file_size>1000
            assert a.getinfo('lib/arm64-v8a/librm11_wine_data_redirect.so').file_size>1000
            assert a.getinfo('lib/arm64-v8a/librm11cpuprobe.so').file_size>5000
            assert a.getinfo('lib/arm64-v8a/libwine_ws2_32.so').file_size>8000
            assert a.getinfo('lib/arm64-v8a/libwine_win32u.so').file_size>100000
            assert a.getinfo('lib/arm64-v8a/libwine_winex11.so').file_size>200000
            assert a.getinfo('lib/arm64-v8a/librm11_freetype_core.so').file_size>100000
            assert a.getinfo('lib/arm64-v8a/libfreetype.so').file_size>100000
            assert a.read('lib/arm64-v8a/libfreetype.so')==a.read('lib/arm64-v8a/librm11_freetype_core.so')
            assert a.getinfo('lib/arm64-v8a/libXlorie.so').file_size>300000
            assert a.getinfo('assets/third_party/TermuxX11-GPLv3-LICENSE.txt').file_size>30000
            assert a.getinfo('assets/third_party/TermuxX11-native-build-provenance.txt').file_size>400
            xkb_zip=a.read('assets/x11/xkb-data.zip')
            xkb_m=json.loads(a.read('assets/x11/xkb-data-manifest.json'))
            assert hashlib.sha256(xkb_zip).hexdigest()==xkb_m['sha256']
            assert a.getinfo('assets/x11/xkb-data-copyright.txt').file_size>600
            with ZipFile(__import__('io').BytesIO(xkb_zip)) as xkb:
              for x in xkb_m['required_files']:
                assert len(xkb.read(x))>20,x
            with ZipFile('app/src/main/assets/runtime/rm11-wine-stack.zip') as original:
              winex11=original.read('lib/wine/aarch64-unix/winex11.so')
            assert a.read('lib/arm64-v8a/libwine_winex11.so')==winex11
            for xlib in ('libX11.so','libXext.so','libandroid-sysvshm.so'):
              assert a.getinfo('lib/arm64-v8a/'+xlib).file_size>1000, xlib
            with ZipFile('app/src/main/assets/runtime/rm11-wine-stack.zip') as original:
              win32u=original.read('lib/wine/aarch64-unix/win32u.so')
            assert a.read('lib/arm64-v8a/libwine_win32u.so')==win32u
            with ZipFile('app/src/main/assets/runtime/rm11-wine-stack.zip') as original:
              expected=original.read('lib/wine/aarch64-unix/ws2_32.so')
            assert a.read('lib/arm64-v8a/libwine_ws2_32.so')==expected
            for companion in ('libarm64ecfex.so','libwow64fex.so'):
              archive_path='lib/arm64-v8a/'+companion
              assert a.getinfo(archive_path).file_size>6000,archive_path
              assert a.read(archive_path)[:4]==bytes((127,69,76,70)),archive_path
            assert a.getinfo('assets/runtime/rm11-fex-unixlib-provenance.txt').file_size>70
            for entry,src in files.items():
              assert hashlib.sha256(a.read(entry)).digest()==hashlib.sha256(Path(src).read_bytes()).digest(),entry
          import json
          content=Path('app/src/main/assets/runtime/rm11-x11-provenance.json').read_bytes()
          m=json.loads(content)
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as audit_apk:
            assert audit_apk.read('assets/runtime/rm11-x11-provenance.json')==content
            for item in m['native_arm64_libraries']:
              entry='lib/arm64-v8a/'+item['library']
              data=audit_apk.read(entry)
              assert hashlib.sha256(data).hexdigest()==item['sha256'],entry
              assert data[:4]==bytes((127,69,76,70)),entry
          provenance=Path('app/src/main/assets/runtime/rm11-freetype-ndk-v301.json').read_bytes()
          font_manifest=json.loads(provenance)
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as font_apk:
            assert font_apk.read('assets/runtime/rm11-freetype-ndk-v301.json')==provenance
            lib='lib/arm64-v8a/'+font_manifest['target']
            blob=font_apk.read(lib)
            assert len(blob)==font_manifest['bytes']
            alias=font_apk.read('lib/arm64-v8a/libfreetype.so')
            assert alias==blob
            assert hashlib.sha256(alias).hexdigest()==font_manifest['wine_native_soname_sha256']
            assert hashlib.sha256(blob).hexdigest()==font_manifest['sha256'],lib
            assert font_apk.getinfo('assets/licenses/FreeType-2.13.3-LICENSE.TXT').file_size>500
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as a:
            native_probe=a.read('lib/arm64-v8a/librm11_wine_font_probe.so')
            assert len(native_probe)>2000 and native_probe[:4]==b'\x7fELF'
            assert b'Java_com_rm11_autocore_runtime_WineNativeFontProbe_probeNative' in native_probe
            assert a.getinfo('classes.dex').file_size>100000
          print('PASS: separately signed JNI raster probe packaged into APK')
          print('PASS: SHA256 verified isolated NDK FreeType core inside signed APK')
          print('PASS: SHA256-verified 8 native ARM64 X11 client libraries in signed APK')
          print('PASS: signed diagnostic APK, Wine assets preserved')
          PY
      - name: Store signed APK artifact
