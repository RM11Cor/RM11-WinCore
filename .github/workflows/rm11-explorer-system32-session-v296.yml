          grep -Fq 'new StringBuilder("RM11_V310_READ_ONLY_DESKTOP_PATH_AUDIT' app/src/main/java/com/rm11/autocore/runtime/WineDesktopPathAudit.java
          grep -Fq 'WineDesktopPathAudit.inspect(layout)' app/src/main/java/com/rm11/autocore/WineAutoDesktopRunner.java
          grep -Fq 'RM11_V310_READ_ONLY_DESKTOP_PATH_AUDIT' app/src/main/java/com/rm11/autocore/runtime/WineDesktopPathAudit.java
          grep -Fq 'Files.readSymbolicLink(path)' app/src/main/java/com/rm11/autocore/runtime/WineDesktopPathAudit.java
          grep -Fq 'RM11_V307_PRESERVED_FIRST_FAILURE_BEGIN' app/src/main/java/com/rm11/autocore/WineAutoDesktopRunner.java
          grep -Fq 'RM11_V307_FIRST_FAILURE: WINESERVER_EXIT=' app/src/main/java/com/rm11/autocore/WineAutoDesktopRunner.java
          grep -Fq 'RM11_V307_FIRST_FAILURE: WINEFILE_EXIT=' app/src/main/java/com/rm11/autocore/WineAutoDesktopRunner.java
      - name: Build audited native Lorie AAR from pinned GPLv3 X.Org source
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;29.0.14206865'
          sudo apt-get install -qq -y bison flex pkg-config ninja-build cmake git python3 binutils
          UPSTREAM_PIN='7e5f5c5c9226e2cdab392b2efba91bc4bd86463e'
          SRC="$RUNNER_TEMP/termux-x11-v4"
          git clone --filter=blob:none --no-checkout https://github.com/termux/termux-x11.git "$SRC"
          git -C "$SRC" fetch --depth=1 origin "$UPSTREAM_PIN"
          git -C "$SRC" checkout --detach "$UPSTREAM_PIN"
          git -C "$SRC" submodule sync --recursive
          git -C "$SRC" submodule update --init --recursive --depth=1 --jobs=4
          python3 - "$SRC/lorie/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          data=path.read_text()
          old="def hostApplicationId = hostProject.android.defaultConfig.applicationId ?: hostProject.android.namespace"
          assert data.count(old)==1
          data=data.replace(old,"def hostApplicationId = 'com.rm11.autocore'")
          path.write_text(data)
          PY
          (cd "$SRC" && chmod +x ./gradlew && ./gradlew :lorie:assembleDebug --no-daemon --max-workers=4 -Pandroid.injected.build.abi=arm64-v8a)
          mkdir -p app/libs app/src/main/assets/third_party "$RUNNER_TEMP/v4-provenance"
          cp "$SRC/lorie/build/outputs/aar/lorie-debug.aar" app/libs/lorie-debug.aar
          cp "$SRC/LICENSE" app/src/main/assets/third_party/TermuxX11-GPLv3-LICENSE.txt
          {
            echo 'RM11 v4 Termux:X11 corresponding source provenance'
            echo 'Upstream: https://github.com/termux/termux-x11'
            echo "Pinned SHA: $UPSTREAM_PIN"
            echo 'License: GPL-3.0, source and submodule revisions pinned by the build recipe'
            echo 'Build patch: replace hostApplicationId with com.rm11.autocore in lorie/build.gradle'
            echo 'Native server inside RM11 APK; no external Termux app required.'
            git -C "$SRC" submodule status --recursive
          } > app/src/main/assets/third_party/TermuxX11-native-build-provenance.txt
          python3 tools/v4_verify_lorie_aar.py --aar app/libs/lorie-debug.aar --report "$RUNNER_TEMP/v4-provenance/native-android-aar.json"
          grep -Fq 'RM11NativeX11Service' app/src/main/AndroidManifest.xml
          grep -Fq 'RM11NativeWineActivity' app/src/main/AndroidManifest.xml
          grep -Fq 'RM11NativeDisplayConnector.connectIfNeeded' app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java
          grep -Fq 'bindService(nativeIntent,this,Context.BIND_AUTO_CREATE)' app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java
          grep -Fq 'params.width=dp(78)' app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java
          grep -Fq 'android:process=":rm11_xorg"' app/src/main/AndroidManifest.xml
          grep -Fq 'return ensureStarted()?entry:null;' app/src/main/java/com/termux/x11/RM11NativeX11Service.java
          grep -Fq 'NativeXorgLifecycleDiagnostics.phase(this,"BEFORE_XORG_JNI_START")' app/src/main/java/com/termux/x11/RM11NativeX11Service.java
          grep -Fq 'NativeXorgLifecycleDiagnostics.phase(this,"AFTER_XORG_JNI_START")' app/src/main/java/com/termux/x11/RM11NativeX11Service.java
          grep -Fq 'NativeXorgLifecycleDiagnostics.recentServiceExits(context)' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          grep -Fq 'native-xorg/process-exits.json' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          grep -Fq 'getHistoricalProcessExitReasons(null,0,12)' app/src/main/java/com/rm11/autocore/runtime/NativeXorgLifecycleDiagnostics.java
          grep -Fq 'NativeXkbConfigProvisioner.ensure(this)' app/src/main/java/com/termux/x11/RM11NativeX11Service.java
          grep -Fq 'Os.setenv("XKB_CONFIG_ROOT",xkbRoot.getCanonicalPath(),true)' app/src/main/java/com/termux/x11/RM11NativeX11Service.java
          grep -Fq 'RM11_V403_XKB_ASSET_SHA256_MISMATCH' app/src/main/java/com/rm11/autocore/runtime/NativeXkbConfigProvisioner.java
          grep -Fq 'RM11_V402_XORG_BINDER_DIED' app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java
          grep -Fq 'if(++attempts<40)' app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java
          grep -Fq 'android:process=":rm11_xorg"' app/src/main/AndroidManifest.xml
          grep -Fq "implementation files('libs/lorie-debug.aar')" app/build.gradle
          echo RM11_V4_NATIVE_XORG_LORIE_AAR_INTEGRATED_IN_APP_SOURCE
      - name: Bundle checked Ubuntu xkb-data required by Termux X.Org startup
        run: |
          set -euo pipefail
          # Native CmdEntryPoint.start() returns JNI_FALSE if XKB_CONFIG_ROOT
          # is unset or missing; RM11 previously exited with status 1 here.
          sudo apt-get install -qq -y xkb-data
          test -s /usr/share/X11/xkb/rules/evdev
          test -s /usr/share/X11/xkb/keycodes/evdev
          test -s /usr/share/X11/xkb/symbols/us
          test -s /usr/share/doc/xkb-data/copyright
          python3 tools/package_xkb_config_v403.py \
            --root /usr/share/X11/xkb \
            --copyright /usr/share/doc/xkb-data/copyright \
            --output app/src/main/assets/x11/xkb-data.zip \
            --metadata app/src/main/assets/x11/xkb-data-manifest.json \
            --license app/src/main/assets/x11/xkb-data-copyright.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          base=Path('app/src/main/assets/x11')
          m=json.loads((base/'xkb-data-manifest.json').read_text())
          archive=base/'xkb-data.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==m['sha256']
          assert m['files']>=100
          with ZipFile(archive) as z:
            assert len(z.namelist())==m['files']
            assert sum(i.file_size for i in z.infolist())==m['uncompressed_bytes']
            for required in m['required_files']:
              assert len(z.read(required))>20,required
          print('RM11_V403_XKB_BUNDLE_CONTENT_AND_SHA256_VALIDATED')
          PY
      - name: Set versionCode 87 and run tests
        run: |
          set -euo pipefail
          python3 tools/compile_shaders.py
          python3 scripts-check.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          assert s.count('versionCode 31')==1
          assert s.count("versionName '2.5.6-nls-redirect'")==1
          p.write_text(s.replace('versionCode 31','versionCode 87',1).replace("versionName '2.5.6-nls-redirect'","versionName '4.0.4-wine-freetype-soname'",1))
          PY
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build APK using existing release signing identity
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
