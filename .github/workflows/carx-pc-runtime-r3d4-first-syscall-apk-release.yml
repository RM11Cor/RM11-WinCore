        run: |
          set -euo pipefail
          echo 'CARX_R3A_STABLE_SIGNING_READY=false' >> "$GITHUB_ENV"
          if [[ -z "$SIGN_B64" || -z "$SIGN_PASS" ]]; then
            echo '::warning::Stable KERNIX signing secrets unavailable; no release will be published.'
            exit 0
          fi
          PASS="$(printf '%s' "$SIGN_PASS" | tr -d '[:space:]')"
          if [[ "$(printf '%s' "$PASS" | wc -c)" -ne 48 ]]; then
            echo '::warning::Stable key password format invalid.'
            exit 0
          fi
          umask 077
          if ! printf '%s' "$SIGN_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/carx-r3a-stable.p12"; then
            echo '::warning::Cannot decode KERNIX signing keystore; no release published.'
            exit 0
          fi
          SHA="$(sha256sum "$RUNNER_TEMP/carx-r3a-stable.p12" | cut -d' ' -f1)"
          if [[ "$SHA" != fc4fcce82a85df0cb87d6f1cf3f9fce57555353ce9f2d05d7940c645e86e16e6 ]]; then
            echo '::warning::Keystore fingerprint mismatch; refusing release.'
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/carx-r3a-stable.p12" -storetype PKCS12 -alias kernix-update -storepass "$PASS" > /dev/null 2>&1; then
            echo '::warning::Keystore alias/password mismatch.'
            exit 0
          fi
          echo "CARX_R3A_STABLE_KEYSTORE=$RUNNER_TEMP/carx-r3a-stable.p12" >> "$GITHUB_ENV"
          echo "CARX_R3A_STABLE_SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
