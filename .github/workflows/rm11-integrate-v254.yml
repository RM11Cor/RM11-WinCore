# Single-file web import for RM11-WinCore v2.5.4
# Upload to the .github/workflows directory using the GitHub website.
# Contains new source files only. No third-party runtime binaries or APKs.
name: RM11 v2.5.4 - Import Runtime Foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rm11-integrate-v254.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rm11-integrate-v254
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode and integrate verified source
        shell: bash
        run: |
          set -euo pipefail
          if ! git remote get-url origin | grep -q 'RM11Cor/RM11-WinCore'; then
            echo 'Wrong repository; import refused.' >&2
            exit 1
          fi
          if grep -q 'runtimeIntegrationAuditButton' app/src/main/java/com/rm11/autocore/MainActivity.java; then
            echo 'Already integrated; skipping source modification.'
