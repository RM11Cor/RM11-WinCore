      - name: Validate sources and compile new Java classes
        shell: bash
        run: |
          set -euo pipefail
          # The legacy checker expects CI-generated shader headers only when GITHUB_ACTIONS=true.
          # The check here is a SOURCE validation and does not claim APK runtime success.
          GITHUB_ACTIONS=false python3 scripts-check.py
          mkdir -p /tmp/rm11-integration-classes
          javac -encoding UTF-8 -d /tmp/rm11-integration-classes \
            app/src/main/java/com/rm11/autocore/runtime/RuntimeLayout.java \
            app/src/main/java/com/rm11/autocore/integration/*.java
          git diff --check
          echo 'PASS: source checks and compilation of new Java runtime modules.'
      - name: Commit integration into source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/com/rm11/autocore/integration \
            app/src/test/java/com/rm11/autocore/integration \
            app/src/main/java/com/rm11/autocore/MainActivity.java \
            app/src/main/java/com/rm11/autocore/runtime/BionicLaunchEnvironment.java \
            app/build.gradle scripts-check.py \
            docs/runtime-integration-v1.md tools/apply-integration-v1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes: runtime foundation already integrated.'
          else
            git commit -m 'feat: v2.5.4 runtime catalog, drive mapping and ELF audit'
            git push origin HEAD:main
            echo 'Committed to main. Pushes using GITHUB_TOKEN do NOT trigger other push workflows.'
          fi
