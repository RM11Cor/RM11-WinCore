name: RM11 v2.7.8 - Independent Win64 X11 GUI Window Test

on:
  push:
    branches: [rm11-v278-gui-window-hold]
    paths:
      - ".github/workflows/rm11-gui-window-hold-v278.yml"
      - "tools/rm11_gui_hold_v278.c"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win64-test:
    if: github.repository == 'RM11Cor/RM11-WinCore'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Setup preinstalled Visual Studio 2022 x64 C compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build test EXE using native Windows 64-bit compiler
        run: |
          New-Item -Type Directory -Force external-test | Out-Null
          cl.exe /nologo /O1 /W4 /WX /GS- /TC tools/rm11_gui_hold_v278.c /Fe:external-test/rm11-gui-hold-v278.exe /link /ENTRY:mainCRTStartup /SUBSYSTEM:CONSOLE /NODEFAULTLIB kernel32.lib user32.lib gdi32.lib
          if ($LASTEXITCODE -ne 0) { throw "MSVC Win64 cross-test compilation failed" }
          @'
          import struct,hashlib
          from pathlib import Path
          p=Path("external-test/rm11-gui-hold-v278.exe")
          data=p.read_bytes()
          assert 1024<len(data)<16*1024*1024,len(data)
          assert data[:2]==b"MZ"
          pe=struct.unpack_from("<I",data,0x3c)[0]
          assert data[pe:pe+4]==b"PE\0\0"
          assert struct.unpack_from("<H",data,pe+4)[0]==0x8664
          assert struct.unpack_from("<H",data,pe+24)[0]==0x20b
          assert struct.unpack_from("<H",data,pe+24+0x44)[0]==3
          for word in (b"RM11_EXTERNAL_GUI_WINDOW_CREATED",
                       b"RM11_GUI_V278_TOUCH_RECEIVED",
                       b"RM11_GUI_V278_TIMER_ELAPSED"):
            assert word in data, word
          print("WINDOW_TEST_EXE_PE64_VERIFIED")
          print("File bytes",len(data))
          print("SHA256",hashlib.sha256(data).hexdigest())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "PE64 verification failed" }
      - name: Save direct EXE test artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM11-v2.7.8-Windows-X11-Window-Hold-EXE
          path: external-test/rm11-gui-hold-v278.exe
          if-no-files-found: error
      - name: Publish direct EXE test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v2.7.8-gui-window-hold-test"
          $asset = "external-test/rm11-gui-hold-v278.exe"
          gh release view $tag --repo RM11Cor/RM11-WinCore 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo RM11Cor/RM11-WinCore --clobber
          } else {
            gh release create $tag $asset --repo RM11Cor/RM11-WinCore --target $env:GITHUB_SHA --title "RM11 GUI 25-second window test for APK v2.7.7" --notes "Win64 GUI test EXE only, not APK. Use installed RM11 v2.7.7 and XServer XSDL in split-screen. Tap local X11 GUI test and select EXE. A visible window remains for 25 seconds and logs user touch. Wine/FEX runtime unchanged. A return code alone does not prove visibility." --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed" }
