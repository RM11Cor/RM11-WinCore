name: CarX v12 SubMesh Geometry Headers ARM64 TEST (NOT GAME)
on:
  push:
    branches: [carx-native-v12-submesh-header]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v11-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated v10 branch
        uses: actions/checkout@v4
      - name: Extract source without original game binaries
        run: |
          set -euo pipefail
          tar -tzf CarX_v12_CI_source_without_reference.tar.gz | head -40
          tar -xzf CarX_v12_CI_source_without_reference.tar.gz
          test -f app/src/main/cpp/unityfs_directory.c
          grep -q 'submesh_probe' app/src/main/cpp/unityfs_directory.c
          grep -q 'type_tree_inspection' app/src/main/cpp/unityfs_directory.c
          grep -q 'PASS_BOUNDED_TYPETREE_NODES' app/src/main/cpp/unityfs_directory.c
          grep -q 'test_mesh_submesh_header_real_layout' tests/test_serialized_v22.py
          test -f tests/test_serialized_v22.py
          grep -q 'CarX_NativeFoundation_v12_Report.json' app/src/main/java/com/carx/nativefoundation/MainActivity.java
          grep -q "applicationId 'com.carx.nativefoundation.test.updates'" app/build.gradle
          grep -q "versionCode 1200" app/build.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Discover or provision Android SDK command line tools
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_HOME/cmdline-tools"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            mkdir -p /tmp/carx-cmdtools
            curl -fLsS --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o /tmp/carx-cmdtools.zip
            unzip -q /tmp/carx-cmdtools.zip -d /tmp/carx-cmdtools
            mv /tmp/carx-cmdtools/cmdline-tools "$SDK_HOME/cmdline-tools/carx-tools"
            SDKMANAGER="$SDK_HOME/cmdline-tools/carx-tools/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate x86 reference from original CarX instruction prefixes
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          clang -O1 -std=c11 -Wall -Wextra -Werror -fPIE -pie \
            tests/source_fixture/generate_reference_x86.c \
            tests/source_fixture/original_prefixes_x86.S \
            -o /tmp/carx-x86-original-reference
          /tmp/carx-x86-original-reference > app/src/main/assets/x86_reference_v2100.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('app/src/main/assets/x86_reference_v2100.txt').read_bytes()
          assert len(b.splitlines()) == 1025
          sha=hashlib.sha256(b).hexdigest()
          p=Path('app/src/main/java/com/carx/nativefoundation/MainActivity.java')
          old='7d4eb4eb338d4fe3d7d5a29146b4dd248bb893b42a33b4a7461f9fdf0b6125ad'
          assert old in p.read_text()
          p.write_text(p.read_text().replace(old,sha))
          Path('REFERENCE_SHA256').write_text(sha+'\n')
          PY
          export CARX_REFERENCE_SHA="$(cat REFERENCE_SHA256)"
          bash run_host.sh
      - name: Build Android ARM64 debug APK (temporary key; needs private re-signing)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK architecture, ID and version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | tee /tmp/list-apk.txt
          grep -Fq 'lib/arm64-v8a/libcarx_native.so' /tmp/list-apk.txt
          ! grep -Eiq 'GameAssembly.dll|UnityPlayer.dll|wine|fexcore|qemu' /tmp/list-apk.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep -Fq "name='com.carx.nativefoundation.test.updates' versionCode='1200'"
          unzip -p "$apk" lib/arm64-v8a/libcarx_native.so > /tmp/libcarx_native.so
          readelf -h /tmp/libcarx_native.so | grep -q 'AArch64'
          sha256sum "$apk" > CarX_v12_debug.apk.sha256
      - name: Upload build only (NOT distributable until v8 key re-signs)
        uses: actions/upload-artifact@v4
        with:
          name: CarX-v12-SUBMESH-DEBUG-REQUIRES-SAME-KEY-RESIGN
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            CarX_v12_debug.apk.sha256
          if-no-files-found: error