name: KERNIX G0 C original GNU 80-85 same Linux ARM64 FEX PID IFUNC85 zero STLR AWATCH 20 forged
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_l40_c_irelative85_after_five_same_fex_awatch_plan.py'
      - 'native-engine/tools/kernix_g0_l40_c_irelative85_after_five_same_fex_independent_gate.py'
      - '.github/workflows/kernix-g0-l40-c-irelative85-after-five-original-arm64-fex.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-original-five-GNU-and-real-zero-IFUNC85-native-hardware-AWATCH-one-FEX-pid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Require original SHA GNU libc/ldso proof and real five same-PID FEX hardware writer audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 41846530666 43068123299 43157219154 43156579389; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$id --jq .conclusion)" = success
          done
      - name: Download source-original immutable GNU libc ld-linux x86-64 ELF triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download independently attested original GNU 147 individual source records
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43068123299
          name: KERNIX-G0-Original-147-Distinct-Source-Writer-Native-Receipts-147-Of-147-No-Loader-Closure
          github-token: ${{ github.token }}
          path: inputs/ledger147
      - name: Reuse pinned original real Linux ARM64 FEXCore native runtime
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43078736764
          name: KERNIX-G0-Parallel20-Shared-True-ARM64-FEX-Original-GNU-Runtime
          github-token: ${{ github.token }}
          path: inputs/FEX
      - name: Re-derive original 5 GLOB DAT and source85 IFUNC zero-store x86 GNU opcode and GDB script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            native-engine/tools/kernix_g0_l40_c_irelative85_after_five_same_fex_awatch_plan.py \
            native-engine/tools/kernix_g0_l40_c_irelative85_after_five_same_fex_independent_gate.py
          python3 native-engine/tools/kernix_g0_l40_c_irelative85_after_five_same_fex_awatch_plan.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . \
            dist/C-ifunc85-source
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('dist/C-ifunc85-source')
          d=json.loads((root/'KERNIX-G0-C-80-85-Five-Then-Zero-IFUNC85-One-FEX-AWATCH-SOURCE-ONLY.json').read_text())
          g=(root/'kernix-g0-c-five-original-stores-then-irelative85-awatch-one-FEX-pid.gdb').read_bytes()
          assert d['native_fex_gdb_script_sha256']==hashlib.sha256(g).hexdigest()
          assert d['original_IRELATIVE_source_index']==85
          assert d['original_IRELATIVE_old_qword']=='0x0'
          assert d['original_GNU_ldso_x86_store_opcode']=='498906'
          assert d['actual_real_FEX_native_zero_to_zero_writer_proven_by_plan'] is False
          assert d['original_resolver_entry_or_return_executed_proven_by_plan'] is False
          assert d['all_six_same_guest_native_writers_proven_by_plan'] is False
          print('KERNIX_G0_C_IFUNC85_ORIGINAL_SHA_SOURCE_PLAN_PASS_NOT_REAL_NATIVE')
          PY
          B=inputs/FEX/kernix-parallel20-authentic-original-FEX-package.tar.gz
          test "$(sha256sum "$B" | cut -d ' ' -f1)" = "$(cat inputs/FEX/parallel20-package.sha256)"
          tar -C dist -xzf "$B"
          test -s dist/parallel20-package/FEXCore-lib/libFEXCore.so
          test -s dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64
      - name: Install original AArch64 native GDB controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash native-engine/tools/kernix_ci_arm64_apt_mirror_failover.sh gdb
          command -v gdb
      - name: Execute exact original GNU 80-84 five native stores then 85 HW AWATCH zero-to-zero in SAME real FEX PID
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/dist/parallel20-package/FEXCore-lib"
          mkdir -p dist/C-ifunc85-real
          set +e
          timeout -k 5s 180s gdb -q -nx -batch \
            -x dist/C-ifunc85-source/kernix-g0-c-five-original-stores-then-irelative85-awatch-one-FEX-pid.gdb \
            --args dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64 \
            dist/parallel20-package/original-source-pinned-root \
            >dist/C-ifunc85-real/original-gnu-C-first-five-then-ifunc85-one-FEX-pid.gdb.log 2>&1
          rc=$?
          set -e
          echo "$rc" > dist/C-ifunc85-real/gdb.exit
          grep '^KERNIX_G0_L40_C_' dist/C-ifunc85-real/original-gnu-C-first-five-then-ifunc85-one-FEX-pid.gdb.log || true
          echo KERNIX_G0_C_IFUNC85_ORIGINAL_ZERO_TO_ZERO_NATIVE_AWATCH_GDB_RC "$rc"
          test "$rc" = 0
      - name: Independently verify six original GNU native hardware writes in ONE FEX PID and reject false AWATCH reads
        shell: bash
        run: |
          set -euo pipefail
          python3 native-engine/tools/kernix_g0_l40_c_irelative85_after_five_same_fex_independent_gate.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . \
            dist/C-ifunc85-real \
            dist/C-ifunc85-independent
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("dist/C-ifunc85-independent/KERNIX-G0-C-Original-80-85-Six-Native-STLR-Stores-One-FEX-PID-IFUNC85-RET-OPEN.json")
          d=json.loads(p.read_text())
          assert d['source_indices_same_real_FEX_native_writer_PID']==[80,81,82,83,84,85]
          assert d['original_source85_zero_to_zero_native_hardware_store'] is True
          assert d['original_source85_native_store_guest_RIP']=='0x80100fd60'
          assert len(d['twenty_source85_false_native_writer_claims_rejected'])==20
          assert d['original_source85_resolver_entry_and_RET_execution_proven'] is False
          assert d['stage_C_40_native_GNU_writers_proven'] is False
          assert d['all_147_one_process_loader_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_C_REAL_ORIGINAL_80_85_SIX_STORES_ONE_FEX_PID_IFUNC85_ZERO_TO_ZERO_PROOF_ONLY')
          PY
      - name: Preserve raw original ARM64 FEX GDB access and independent writer evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-C-Original-GNU-Five-Then-IFUNC85-Real-Zero-STLR-One-PID-20-Forged-No-RET-Claim
          path: |
            dist/C-ifunc85-real/original-gnu-C-first-five-then-ifunc85-one-FEX-pid.gdb.log
            dist/C-ifunc85-real/gdb.exit
            dist/C-ifunc85-independent/KERNIX-G0-C-Original-80-85-Six-Native-STLR-Stores-One-FEX-PID-IFUNC85-RET-OPEN.json
          retention-days: 30
          if-no-files-found: warn
