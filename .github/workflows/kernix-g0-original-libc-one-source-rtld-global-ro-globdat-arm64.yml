  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-original-libc-one-source-rtld-global-ro-globdat-arm64.yml'
      - 'native-engine/android-host/kernix_g0_source_pinned_libc_large_ro_guest_map.h'
      - 'native-engine/android-host/kernix_g0_original_libc_synthetic_x86_stat_abi.h'
