name: KERNIX G0 real original ELF64 DT_RELR source compact bitmap RW PT_LOAD witness Linux native Android Bionic BUILDONLY
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-original-source-relr-rw-target-native-linux-bionic-buildonly.yml'
      - 'native-engine/android-host/kernix_g0_source_verified_guest_elf_fd_kernel.h'
      - 'native-engine/android-host/kernix_g0_original_source_relr_target_witness.h'
      - 'native-engine/android-host/kernix_g0_guest_owned_anonymous_vm_kernel.h'
      - 'native-engine/android-host/tests/kernix_g0_original_source_elf64_relr_target_witness_native_linux_bionic.cpp'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-original-elf-guest-file-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/original
      - name: Verify and prepare disposable exact GNU x86 original main interpreter libc fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('inputs/original/original-guest')
          expected={
             'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
             'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
             'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')
          }
          assert {str(f.relative_to(p)) for f in p.rglob('*') if f.is_file()}==set(expected)
          proof=json.loads(Path('inputs/original/proven-guest-triad.json').read_text())
          assert proof['original_real_FEX_linux_arm64_execution_run']==41842294261
          for path,(n,sha) in expected.items():
            src=p/path
            assert src.is_file() and not src.is_symlink()
            b=src.read_bytes()
            assert len(b)==n and hashlib.sha256(b).hexdigest()==sha
            assert proof['files'][path]['sha256']==sha
            target=Path('dist/disposable-source-triad')/path
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(b)
            target.chmod(0o600)
          Path('dist/source-evidence.json').write_text(json.dumps({
              'schema':'kernix.g0.original-source-ELF-immutable-guest-openat-read-pread-linux-Bionic-buildonly.v1',
              'source_original_guest_run':41846530666,
              'main_sha256':expected['bin/kernix-g2e-dynamic-guest'][1],
              'ldlinux_sha256':expected['lib64/ld-linux-x86-64.so.2'][1],
              'libc_sha256':expected['lib/x86_64-linux-gnu/libc.so.6'][1],
              'device_runtime':False,
              'original_ldso_relocation_completed_inside_embedded_FEXCore':False,
              'FEX_guest_file_syscall_opcodes_executed':False
           },indent=2)+'\n')
          print('KERNIX_G0_ORIGINAL_SHA256_PINNED_X86_GNU_ELF_TRIAD_SOURCE_READY')
          PY
      - name: Decode genuine SHA-pinned x86_64 ELF DT_RELR bitmap and select original PT_LOAD RW nonexec source target
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g0_original_source_elf64_relr_target_witness_native_linux_bionic.cpp \
            -o dist/kernix-g0-verified-original-elf-fd-guest-native
          timeout -k 2s 25s dist/kernix-g0-verified-original-elf-fd-guest-native \
            "$PWD/dist/disposable-source-triad" \
            >dist/guest-fd-snapshot.stdout 2>dist/guest-fd-snapshot.stderr
          test ! -s dist/guest-fd-snapshot.stderr
          grep -Fq 'KERNIX_G0_REAL_ORIGINAL_SHA256_ELF64_DYNAMIC_RELR_COMPACT_SOURCE_RW_TARGET_AND_ADDEND_LINUX_PASS_NO_GUEST_WRITE' \
            dist/guest-fd-snapshot.stdout
          echo KERNIX_G0_REAL_SOURCE_GNU_ELF_DT_RELR_TARGET_RWX_GUARD_AND_ADDEND_NATIVE_LINUX_PASS_NO_GUEST_RELOCATION
      - name: Prove no regressions to guest anonymous mmap mprotect getrandom and old source ELF FD service
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'kernix_g0_guest_owned_anonymous_vm_kernel_test.cpp:KERNIX_G0_REAL_NATIVE_LINUX_X86_GUEST_ANON_MMAP_MUNMAP_OWNER_HELD_RW_AND_DENIALS_HOST_PASS_NOT_FEX_ANDROID' \
            'kernix_g0_guest_owned_native_mprotect_ro_rw_4k_16k_policy_test.cpp:KERNIX_G0_ACTUAL_OWNER_HELD_GUEST_ANON_X86_MPROTECT_RW_RO_RW_AND_UNMAP_LINUX_NATIVE_PASS_NOT_ORIGINAL_ELF_RELRO' \
            'kernix_g0_guest_owned_getrandom_native_linux_bionic_test.cpp:KERNIX_G0_NATIVE_OWNER_ONLY_X86_GUEST_GETRANDOM_318_WRITABLE_GUEST_VMA_BOUNDED_TRUE_KERNEL_ENTROPY_PASS_NOT_FEX_OR_PHONE'; do
            file="${spec%%:*}"
            marker="${spec#*:}"
            out="dist/${file%.cpp}"
            clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
              -Inative-engine/android-host "native-engine/android-host/tests/$file" -o "$out"
            timeout -k 2s 15s "$out" >"$out.stdout"
            grep -Fxq "$marker" "$out.stdout"
          done
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g0_source_verified_guest_elf_fd_kernel_native_test.cpp \
            -o dist/kernix-g0-original-source-guest-openat-regression
          timeout -k 2s 15s dist/kernix-g0-original-source-guest-openat-regression \
            "$PWD/dist/disposable-source-triad" >dist/existing-guest-elf-FD.stdout
          grep -Fxq 'KERNIX_G0_EXACT_SOURCE_ELF_GUEST_OPENAT_READ_PREAD64_CLOSE_IMMUTABLE_SNAPSHOT_OWNER_ONLY_NATIVE_LINUX_PASS_NOT_FEX_OR_PHONE' \
            dist/existing-guest-elf-FD.stdout
          echo KERNIX_G0_EXACT_OWNED_ANON_MMAP_MPROTECT_GETRANDOM_LINUX_REGRESSION_PASS
      - name: Crosscompile exact hostless x86 snapshot FD guest service Android AArch64 Bionic only
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          NDK="$SDK/ndk/27.2.12479018"
          if ! test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"; then
            "$SDKMANAGER" 'ndk;27.2.12479018'
          fi
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          "$CC" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host -c \
            native-engine/android-host/tests/kernix_g0_original_source_elf64_relr_target_witness_native_linux_bionic.cpp \
            -o dist/kernix-g0-original-ELF-guest-fd-snapshot-android-bionic-arm64.o
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h dist/kernix-g0-original-ELF-guest-fd-snapshot-android-bionic-arm64.o | grep -E 'Machine:.*AArch64'
          echo KERNIX_G0_ORIGINAL_ELF64_DT_RELR_SOURCE_TARGET_NATIVE_WITNESS_BIONIC_COMPILE_PASS_NOT_PHONE
      - name: Machine-readable bounded evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('dist/guest-fd-snapshot.stdout')
          marker='KERNIX_G0_REAL_ORIGINAL_SHA256_ELF64_DYNAMIC_RELR_COMPACT_SOURCE_RW_TARGET_AND_ADDEND_LINUX_PASS_NO_GUEST_WRITE'
          d={
            'schema':'kernix.g0.original-x86-GNU-ELF64-DT_RELR-compact-bitmap-original-PT_LOAD-RW-nonexec-target-native-Bionic-preflight-only.v1',
            'source_sha':os.environ['GITHUB_SHA'],
            'original_main_libc_ldlinux_Sha256_source_attested':Path('dist/source-evidence.json').exists(),
            'bounded_native_guest_file_service_passed':p.is_file() and marker in p.read_text(),
            'guest_original_ELF_file_mmap_executed_under_real_FEX':False,
            'real_original_GNU_source_DT_RELR_bitmap_decoder_attested':p.is_file() and marker in p.read_text(),
            'original_guest_RELR_relocation_executed_under_FEX':False,
            'original_ldlinux_dynamic_relocation_executed':False,
            'native_guest_x86_file_mmap_PROT_EXEC_supported':False,
            'actual_original_GNU_ldlinux_PT_LOAD_file_mapped':False,
            'native_host_page_16K_guest_4K_subpage_implemented':False,
            'complete_GNU_ldlinux_relocation_and_dependency_loader':False,
            'Android_phone_executed':False,'Wine_Proton_or_games':False
          }
          Path('dist/guest-file-service-evidence.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G0-Original-ELF64-Source-DT-RELR-RW-Target-Linux-Bionic-BUILDONLY
          path: |
            dist/*.json
            dist/*.stdout
            dist/*.stderr
            dist/*.o
          if-no-files-found: warn
          retention-days: 30
