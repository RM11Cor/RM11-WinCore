name: KERNIX G0 original 147 GNU source cohorts after independent 61 FEX native writers
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_libc_147_ledger61_after_twentytwo_native_batch.py'
      - '.github/workflows/kernix-g0-original-libc-147-source-ledger61-cohorts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-147-source-cohorts-after-61-independently-certified-native-writers:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed until four new genuine IFUNC145-146 ARM64 writer receipts are independently attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            status="$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/42853758150 --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/42853758150 --jq .conclusion)" = success
              echo KERNIX_G0_ORIGINAL_61_FEX_NATIVE_WRITER_GATE_SUCCESS
              exit 0
            fi
            sleep 12
          done
          echo KERNIX_G0_ORIGINAL_61_WRITER_GATE_NOT_COMPLETE_FAIL_CLOSED
          exit 1
      - name: Download unchanged original GNU Linux x86 ELF libc/ldso/guest triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download prior genuine IFUNC124 one FEX CALL C3 RET native stack READ GNU writer proof
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42827886594
          name: KERNIX-G0-Original-IFUNC124-Dynamic-C3-RET-One-Guest-Native-HW-Read-GNU-Writer-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/prior124
      - name: Download original IFUNC125-128 four genuinely attested FEX hardware writers
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42832626066
          name: KERNIX-G0-IFUNC125-128-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/prior43
      - name: Download original IFUNC129-132 four independently proven FEX hardware writer receipts
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42836109827
          name: KERNIX-G0-IFUNC129-132-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/new47
      - name: Download original IFUNC133-136 four independently proven FEX hardware writer receipts
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42840714050
          name: KERNIX-G0-IFUNC133-136-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/new51
      - name: Download independently attested original IFUNC137-140 genuine FEX ARM64 hardware writers
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42844416071
          name: KERNIX-G0-IFUNC137-140-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/new55
      - name: Download original IFUNC141-144 independently authenticated real native FEX writes
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42848697286
          name: KERNIX-G0-IFUNC141-144-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/new59
      - name: Download final consecutive original GNU IFUNC145-146 two independent ARM64 FEX writer receipts
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42853758150
          name: KERNIX-G0-IFUNC145-146-Two-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/new61
      - name: Verify original SHA-locked 147 type cohorts and native 39 plus 4 plus 4 plus 4 plus 4 plus 4 plus 2 proofs without double counts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_libc_147_ledger61_after_twentytwo_native_batch.py
          python3 native-engine/tools/kernix_g0_original_libc_147_ledger61_after_twentytwo_native_batch.py \
            inputs/triad/original-guest \
            inputs/prior124/original-libc-IFUNC124-original-one-FEX-CALL-C3-RET-native-stack-read-GNU-writer-INDEPENDENT-PROOF.json \
            inputs/prior43/original-libc-IFUNC125-128-four-independent-native-hardware-writer-batch-PROOF.json \
            inputs/new47/original-libc-IFUNC129-132-four-independent-native-hardware-writer-batch-PROOF.json \
            inputs/new51/original-libc-IFUNC133-136-four-independent-native-hardware-writer-batch-PROOF.json \
            inputs/new55/original-libc-IFUNC137-140-four-independent-native-hardware-writer-batch-PROOF.json \
            inputs/new59/original-libc-IFUNC141-144-four-independent-native-hardware-writer-batch-PROOF.json \
            inputs/new61/original-libc-IFUNC145-146-two-independent-native-hardware-writer-batch-PROOF.json \
            dist/original-libc-147-source-batch-native-proof-ledger61-NO-NEW-HW-RUN.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/original-libc-147-source-batch-native-proof-ledger61-NO-NEW-HW-RUN.json').read_text())
          assert d['original_relocations_total']==147
          assert d['previously_independently_attested_native_writer_target_count']==61
          assert d['remaining_requires_separate_native_hardware_evidence']==86
          assert len(d['previously_attested_original_source_indices'])==61
          assert len(d['remaining_non_IFUNC_DT_RELA_indices'])==85
          assert len(d['remaining_IFUNC_indices'])==1
          assert d['native_batch125_128_proven_in_four_separate_FEX_guest_processes'] is True
          assert d['native_batch129_132_proven_in_four_separate_FEX_guest_processes'] is True
          assert d['native_batch133_136_proven_in_four_separate_FEX_guest_processes'] is True
          assert d['native_batch137_140_proven_in_four_separate_FEX_guest_processes'] is True
          assert d['native_batch141_144_proven_in_four_separate_FEX_guest_processes'] is True
          assert d['native_batch145_146_proven_in_two_separate_FEX_guest_processes'] is True
          assert d['new_native_hardware_attestations_in_this_source_inventory']==0
          assert d['new_GNU_CALL_RET_stack_READ_attestations_from_this_batch']==0
          assert d['all_147_same_guest_native_execution_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_SOURCE_COHORTS_61_ALREADY_INDEPENDENT_NATIVE_GNU_WRITERS_86_PENDING_NO_NEW_RUNTIME_PROOF')
          PY
      - name: Archive exact original GNU 147-source entry coverage and bound native 61 writer ledger
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-147-Source-Cohorts-61-Prior-Native-Writers-86-Pending
          path: dist/original-libc-147-source-batch-native-proof-ledger61-NO-NEW-HW-RUN.json
          retention-days: 30
