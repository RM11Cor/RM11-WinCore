name: CarX Native Foundation v7 Stable Test Key — Verify & Publish Signed APK
on:
  push:
    branches:
      - carx-native-v7-updates
    paths:
      - 'dist/CarX_NativeFoundation_v7*.apk'
      - '.github/workflows/carx-native-v7-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signed APK(s)
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android build tools for certificate verification
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_HOME/cmdline-tools"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            mkdir -p /tmp/carx-cmdtools
            curl -fLsS --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o /tmp/carx-commandlinetools.zip
            unzip -q /tmp/carx-commandlinetools.zip -d /tmp/carx-cmdtools
            mv /tmp/carx-cmdtools/cmdline-tools "$SDK_HOME/cmdline-tools/carx-tools"
            SDKMANAGER="$SDK_HOME/cmdline-tools/carx-tools/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_HOME" 'build-tools;35.0.0'
      - name: Verify official signing certificate, package ID and update codes
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK_SIGNER="$SDK_HOME/build-tools/35.0.0/apksigner"
          AAPT="$SDK_HOME/build-tools/35.0.0/aapt"
          test -x "$APK_SIGNER"
          test -x "$AAPT"
          CERT="9a339d62994d35fb6762605b3134ea6d9493c82fe6ebb05b8cc6393347dfdf6f"
          for code in 700 701; do
            if [[ "$code" == 700 ]]; then
              apk="dist/CarX_NativeFoundation_v7_UPDATE_TRACK_TEST_NOT_GAME.apk"
            else
              apk="dist/CarX_NativeFoundation_v7_1_UPGRADE_PROOF_TEST_NOT_GAME.apk"
            fi
            if [[ ! -f "$apk" ]]; then continue; fi
            test -s "$apk"
            "$APK_SIGNER" verify --min-sdk-version 26 --verbose --print-certs "$apk" | tee "/tmp/verify-$code.txt"
            grep -Fqi "$CERT" "/tmp/verify-$code.txt"
            "$AAPT" dump badging "$apk" | tee "/tmp/badging-$code.txt"
            grep -Fq "name='com.carx.nativefoundation.test.updates' versionCode='$code'" "/tmp/badging-$code.txt"
            unzip -t "$apk" | tail -2
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libcarx_native.so'
            ! unzip -l "$apk" | grep -Eiq 'UnityPlayer.dll|GameAssembly.dll|wine|fexcore|qemu'
            sha256sum "$apk" > "$apk.sha256"
          done
          test -f "dist/CarX_NativeFoundation_v7_UPDATE_TRACK_TEST_NOT_GAME.apk"
      - name: Publish validated TEST-only GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for code in 700 701; do
            if [[ "$code" == 700 ]]; then
              apk="dist/CarX_NativeFoundation_v7_UPDATE_TRACK_TEST_NOT_GAME.apk"
              tag="carx-native-foundation-v7-update-test-20261113"
              title="CarX Native Foundation v7 — New Update Channel TEST (NOT GAME)"
              notes="One-time parallel install next to v6 due to old differing debug-signing keys. New package com.carx.nativefoundation.test.updates, fixed signing cert, versionCode 700. Technical ARM64/Vulkan/UnityFS harness ONLY; not a playable CarX port."
            else
              apk="dist/CarX_NativeFoundation_v7_1_UPGRADE_PROOF_TEST_NOT_GAME.apk"
              tag="carx-native-foundation-v7-1-update-proof-20261113"
              title="CarX Native Foundation v7.1 — SAME SIGNATURE Update TEST (NOT GAME)"
              notes="Same package and signing certificate as v7; versionCode 701. Install over v7 WITHOUT uninstalling. Native ARM64/Vulkan/UnityFS technical harness ONLY, not a playable CarX port."
            fi
            [[ -f "$apk" ]] || continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Already published: $tag"
              continue
            fi
            gh release create "$tag" "$apk" "$apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          done
