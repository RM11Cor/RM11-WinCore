name: KERNIX G0 independent original glibc IFUNC native x86_64 reference
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tests/kernix_g0_x86_native_original_glibc_ifunc_reference.c'
      - '.github/workflows/kernix-g0-x86-native-glibc-ifunc-reference.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  independent-original-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/original
      - name: Authenticate exact original 3 ELF sources, compile native x86 reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p dist
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          origin=Path('inputs/original/original-guest')
          proof=json.loads(Path('inputs/original/proven-guest-triad.json').read_text())
          assert proof['original_real_FEX_linux_arm64_execution_run']==41842294261
          expected={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(p.relative_to(origin)) for p in origin.rglob('*') if p.is_file()}==set(expected)
          dest=Path('dist/native-reference-source')
          for name,(length,sha) in expected.items():
            b=(origin/name).read_bytes()
            assert len(b)==length
            assert hashlib.sha256(b).hexdigest()==sha
            assert proof['files'][name]['sha256']==sha
            out=dest/name
            out.parent.mkdir(parents=True,exist_ok=True)
            out.write_bytes(b)
            out.chmod(0o500 if name.startswith(('lib64/','bin/')) else 0o400)
          print('KERNIX_G0_X86_NATIVE_REFERENCE_EXACT_PINNED_ELF_SHA256_PASS')
          PY
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            native-engine/tests/kernix_g0_x86_native_original_glibc_ifunc_reference.c \
            -o dist/kernix-g0-x86-native-glibc-oracle
          readelf -h dist/kernix-g0-x86-native-glibc-oracle | grep -Fq 'Advanced Micro Devices X86-64'
          test "$(readelf -d dist/kernix-g0-x86-native-glibc-oracle | grep -c 'Shared library: \[libc.so.6\]')" = 1
      - name: Execute independent native x86_64 GNU ld-linux + glibc IFUNC comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          src=Path('dist/native-reference-source').resolve()
          ldso=str(src/'lib64/ld-linux-x86-64.so.2')
          libc=str(src/'lib/x86_64-linux-gnu/libc.so.6')
          exe=str(Path('dist/kernix-g0-x86-native-glibc-oracle').resolve())
          command=[ldso,'--inhibit-cache','--library-path',
                   str(src/'lib/x86_64-linux-gnu'),exe,libc,ldso]
          env=os.environ.copy()
          env.pop('LD_LIBRARY_PATH',None)
          run=subprocess.run(command,capture_output=True,text=True,
                             env=env,timeout=40,check=False)
          Path('dist/x86-native-ifunc-oracle.stdout').write_text(run.stdout)
          Path('dist/x86-native-ifunc-oracle.stderr').write_text(run.stderr)
          print(run.stdout[-16000:]);print(run.stderr[-4000:])
          # A distinct native GNU ld-linux read-only oracle now verifies
          # *all* 1067 original source libc DT_RELR qwords. This is a
          # reference on native x86, not evidence of FEX guest store RIPs.
          relr_summary=next((ln for ln in run.stdout.splitlines()
            if ln.startswith('KERNIX_G0_X86_NATIVE_LIBC_1067_RELR_REFERENCE_SUMMARY ')),None)
          relr_fields=dict(re.findall(
            r'\b(words|targets|source_backed|native_matches|native_unrelocated|post_main_changed)=([0-9]+)',
            relr_summary or ''))
          relr_valid=bool(
            relr_summary and
            relr_fields=={'words':'32','targets':'1067',
                'source_backed':'1067','native_matches':'1065',
                'native_unrelocated':'0','post_main_changed':'2'} and
            'post_main_source_vas_204370_and_204378_verified=1' in relr_summary and
            'post_main_cause_and_guest_store_rips_unproven=1' in relr_summary and
            'original_libc_native_relocated=1' in relr_summary and
            'original_source_libc_sha_externally_attested=1' in relr_summary and
            'no_guest_FEX_store_RIP_trace=1' in relr_summary and
            'no_guest_or_native_relocation_writes_by_audit=1' in relr_summary and
            run.stdout.count('KERNIX_G0_X86_NATIVE_LIBC_1067_RELR_REFERENCE_SUMMARY')==1)
          summary=next((ln for ln in run.stdout.splitlines()
            if ln.startswith('KERNIX_G0_X86_NATIVE_IFUNC_REFERENCE_SUMMARY ')),None)
          rows=[ln for ln in run.stdout.splitlines() if
            ln.startswith('KERNIX_G0_X86_NATIVE_IFUNC_REFERENCE_ROW ')]
          fields=dict(re.findall(r'\b([a-z0-9_]+)=([0-9a-f]+)',summary or ''))
          # Compare the same exact source relocation index 85 with
          # the previously *observed* Linux ARM64 FEX slot (zero).
          # Native x86 and translated guest CPUID may differ, so a
          # disagreement is a diagnosis lead, not a platform verdict.
          index85=[ln for ln in rows if 'source_rela_index=85 ' in ln]
          index85_fields=dict(re.findall(
            r'\b(source_rela_index|target_va|resolver_va|zero|result_in_source_rx)=([0-9a-f]+)',
            index85[0])) if len(index85)==1 else {}
          native_zero=fields.get('source_index85_native_zero')
          native_value=fields.get('source_index85_native_value')
          native_index85_record_valid=bool(
            native_zero in ('0','1') and native_value is not None and
            index85_fields.get('source_rela_index')=='85' and
            index85_fields.get('target_va')=='2014c8' and
            index85_fields.get('resolver_va')=='c8570' and
            index85_fields.get('zero')==native_zero and
            (int(native_value,16)==0)==(native_zero=='1'))
          if native_index85_record_valid:
            if native_zero=='1':
              native_fex_comparison='both_observed_zero_cpuid_equivalence_not_proven'
            else:
              native_fex_comparison='native_nonzero_fex_zero_cpuid_or_guest_resolution_needs_trace'
          else:
            native_fex_comparison='invalid_reference_observation'
          all_ok=bool(run.returncode==0 and relr_valid and summary and len(rows)==46 and
            native_index85_record_valid and
            fields.get('source_rela')=='86' and
            fields.get('source_jmprel')=='61' and
            fields.get('ifunc_total')=='46' and
            int(fields.get('native_nonzero','-1'))+
               int(fields.get('native_zero','-1'))==46 and
            int(fields.get('native_nonzero_result_inside_source_rx','-1'))+
               int(fields.get('native_nonzero_result_outside_source_rx','-1'))==
               int(fields.get('native_nonzero','-2')) and
            fields.get('pinned_original_ldso_loaded')=='1' and
            fields.get('pinned_original_libc_loaded')=='1' and
            fields.get('native_x86_64_execution')=='1' and
            fields.get('fex_arm64_cpuid_may_differ')=='1' and
            fields.get('no_fex_guest_execution_proof')=='1' and
            fields.get('no_ifunc_semantic_equivalence_claim')=='1' and
            sum('source_rela_index=85 ' in ln for ln in rows)==1)
          evidence={
            'schema':'kernix.g0.exact-original-glibc-native-x86_64-ifunc-reference.v1',
            'git_sha':os.environ['GITHUB_SHA'],
            'original_ldso_sha256':'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae',
            'original_libc_sha256':'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906',
            'native_reference_runner':'ubuntu-22.04-x86_64',
            'native_process_exit':run.returncode,
            'source_glibc_irelative_count':len(rows),
            'native_glibc_1067_relr_post_main_source_locked_reference_verified':relr_valid,
            'native_glibc_at_original_relro_seal_1067_all_values_verified':False,
            'native_glibc_post_main_mutated_original_source_vas':['0x204370','0x204378'],
            'native_glibc_two_post_main_data_writes_attributed_to_original_x86_instruction':False,
            'native_glibc_1067_relr_source_expected_values':relr_fields,
            'native_x86_ifunc_and_relr_oracle_does_not_trace_guest_FEX_store_RIPs':True,
            'source_index85_comparison_reference_only':fields.get('source_index85_native_zero'),
            'source_index85_original_relocation_va':'0x2014c8',
            'source_index85_original_resolver_va':'0xc8570',
            'source_index85_native_value_hex':native_value,
            'source_index85_native_row':index85_fields,
            'source_index85_native_record_consistent':native_index85_record_valid,
            'source_index85_fex_linux_arm64_zero_baseline_run':42376040127,
            'source_index85_fex_linux_arm64_observed_zero':True,
            'source_index85_native_vs_fex_classification':native_fex_comparison,
            'source_index85_is_a_correct_IFUNC_result_proven':False,
            'native_counts':fields,
            'native_runs_pinned_ldso_and_libc':all_ok,
            'fex_observed_45_nonzero_1_zero':True,
            'fex_and_native_cpuid_equivalent_proven':False,
            'original_ifunc_result_semantically_correct_proven':False,
            'android_tested':False,
            'wine_or_games_tested':False}
          Path('dist/x86-native-ifunc-reference-evidence.json').write_text(
            json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          assert all_ok,'Native exact-source IFUNC reference did not pass'
          print('KERNIX_G0_NATIVE_X86_ORIGINAL_LIBC_RELR_REFERENCE',relr_fields)
          print('KERNIX_G0_NATIVE_X86_IFUNC_INDEX85_VS_FEX_REFERENCE',
            native_fex_comparison,'native_value',native_value)
          print('KERNIX_G0_INDEPENDENT_NATIVE_X86_64_ORIGINAL_LIBC_IFUNC_REFERENCE_PASS')
          PY
      - name: Run exact source original main under pinned GNU ldso and glibc with native x86 syscall trace
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          src=Path('dist/native-reference-source').resolve()
          ldso=src/'lib64/ld-linux-x86-64.so.2'
          libc=src/'lib/x86_64-linux-gnu/libc.so.6'
          main=src/'bin/kernix-g2e-dynamic-guest'
          pinned={
            main:(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            ldso:(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            libc:(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')
          }
          for f,(size,digest) in pinned.items():
            raw=f.read_bytes()
            assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
          assert os.access(main,os.X_OK) and os.access(ldso,os.X_OK)
          env=os.environ.copy()
          for k in ('LD_LIBRARY_PATH','LD_PRELOAD','LD_AUDIT','LD_DEBUG'):
            env.pop(k,None)
          command=[str(ldso),'--inhibit-cache','--library-path',
                   str(libc.parent),str(main)]
          trace=Path('dist/x86-native-original-main-syscalls.strace')
          # strace defaults to a 32-byte abbreviated write buffer.
          # Never shorten the exact puts output assertion: capture >=256.
          traced=['strace','-qq','-f','-s','256','-o',str(trace),
             '-e','trace=mprotect,brk,arch_prctl,set_tid_address,set_robust_list,rseq,write,exit_group',
             *command]
          try:
            run=subprocess.run(traced,capture_output=True,text=True,
                               env=env,timeout=40,check=False)
          except subprocess.TimeoutExpired:
            raise SystemExit('Native pinned original main timed out after 40s')
          Path('dist/x86-native-original-main.stdout').write_text(run.stdout)
          Path('dist/x86-native-original-main.stderr').write_text(run.stderr)
          source=trace.read_text()
          Path('dist/x86-native-original-main-strace-summary.txt').write_text(
            '\n'.join(x for x in source.splitlines()
              if any(token in x for token in
                ('mprotect(','arch_prctl(','rseq(','exit_group(','write(1,')))+'\n')
          expected='KERNIX_G2E_REAL_GLIBC_IMPORTED_PUTS_EXECUTED\n'
          pt_calls=[
            (int(a,16),int(n)) for a,n in re.findall(
              r'mprotect\((0x[0-9a-f]+), ([0-9]+), PROT_READ\)\s+=\s+0',
              source)]
          mprotect_libc_16k=any(n==16384 for _,n in pt_calls)
          mprotect_main_4k=any(n==4096 for _,n in pt_calls)
          distinct_ranges=len(set((a,n) for a,n in pt_calls))
          # Read all three *source* PT_GNU_RELRO segments, rather than
          # assuming a trace's unlabelled address belongs to an ELF.
          # The page-rounded source sizes are compared to native
          # mprotect() lengths; ASLR base provenance is still separate.
          import struct
          def original_relro_source_span(path):
            data=path.read_bytes()
            assert data[:6]==b'\x7fELF\x02\x01'
            eh_phoff=struct.unpack_from('<Q',data,32)[0]
            eh_phentsize,eh_phnum=struct.unpack_from('<HH',data,54)
            assert eh_phentsize==56 and 0<eh_phnum<=128
            assert eh_phoff+eh_phentsize*eh_phnum<=len(data)
            spans=[]
            for k in range(eh_phnum):
              p_type,p_flags,p_offset,p_vaddr,p_paddr,p_filesz,p_memsz,p_align=struct.unpack_from(
                  '<IIQQQQQQ',data,eh_phoff+k*eh_phentsize)
              if p_type!=0x6474e552:continue # PT_GNU_RELRO
              start=p_vaddr & ~4095
              end=(p_vaddr+p_memsz+4095)&~4095
              assert p_memsz>0 and end>start
              spans.append({'source_va':hex(p_vaddr),
                'page_start':hex(start),'page_end':hex(end),
                'rounded_bytes':end-start})
            assert len(spans)==1,(str(path),spans)
            return spans[0]
          relro_sources={k:original_relro_source_span(f)
            for k,f in [('main',main),('libc',libc),('ldso',ldso)]}
          rounded_source_lengths=sorted(
            item['rounded_bytes'] for item in relro_sources.values())
          rounded_observed_lengths=sorted(n for _,n in pt_calls)
          exact_three_source_relro_spans_match_native_syscalls=bool(
            len(pt_calls)==3 and
            rounded_source_lengths==rounded_observed_lengths and
            rounded_source_lengths==[4096,8192,16384])
          write_seen=('write(1, "KERNIX_G2E_REAL_GLIBC_IMPORTED_PUTS_EXECUTED\\n"' in source)
          exit_seen=bool(re.search(r'exit_group\(0\)\s+=\s+\?',source))
          original_completed=bool(
            run.returncode==0 and run.stdout==expected and
            run.stderr=='' and write_seen and exit_seen and
            mprotect_libc_16k and mprotect_main_4k and distinct_ranges==3 and
            exact_three_source_relro_spans_match_native_syscalls)
          evidence={
            'schema':'kernix.g0.exact-original-main-native-x86_64-loader-end-to-end-reference.v1',
            'git_sha':os.environ['GITHUB_SHA'],
            'runner':'ubuntu-22.04-x86_64',
            'main_sha256':pinned[main][1],
            'original_ldso_sha256':pinned[ldso][1],
            'original_libc_sha256':pinned[libc][1],
            'execution':'unmodified exact source main through explicit pinned ldso --inhibit-cache --library-path pinned libc',
            'source_original_main_exit':run.returncode,
            'source_original_main_stdout_exact':run.stdout==expected,
            'source_original_main_stdout':run.stdout,
            'source_original_main_stderr_empty':run.stderr=='',
            'native_x86_puts_write_syscall_observed':write_seen,
            'native_x86_exit_group_zero_observed':exit_seen,
            'native_x86_mprotect_readonly_observations':len(pt_calls),
            'native_x86_distinct_readonly_mprotect_ranges':distinct_ranges,
            'native_x86_libc_16384_readonly_mprotect_seen':mprotect_libc_16k,
            'native_x86_main_4096_readonly_mprotect_seen':mprotect_main_4k,
            'source_exact_pt_gnu_relro_spans':relro_sources,
            'native_readonly_mprotect_rounded_lengths':rounded_observed_lengths,
            'all_three_source_relro_page_lengths_match_native_mprotect':exact_three_source_relro_spans_match_native_syscalls,
            'native_original_main_loader_returned_successfully':original_completed,
            'fex_linux_arm64_original_main_completed':False,
            'fex_linux_arm64_main_relro_seal_authorized':False,
            'android_bionic_original_main_completed':False,
            'wine_proton_executed':False,
            'windows_game_executed':False
          }
          Path('dist/x86-native-original-main-reference.json').write_text(
            json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          print('KERNIX_G0_X86_NATIVE_MAIN_ORIGINAL_STDOUT',repr(run.stdout))
          print('KERNIX_G0_X86_NATIVE_MAIN_ORIGINAL_MPROTECT_COUNTS',
             len(pt_calls),'16k',mprotect_libc_16k,'4k',mprotect_main_4k)
          print('KERNIX_G0_X86_NATIVE_ORIGINAL_THREE_RELRO_SPANS',
            relro_sources)
          print('KERNIX_G0_X86_NATIVE_ORIGINAL_THREE_RELRO_LENGTHS_MATCH',
            exact_three_source_relro_spans_match_native_syscalls)
          print('KERNIX_G0_X86_NATIVE_MAIN_ORIGINAL_EXIT',run.returncode)
          if not original_completed:
            print(source[-10000:])
            raise SystemExit('Pinned original x86-64 native main and original loader closure reference FAILED')
          print('KERNIX_G0_X86_NATIVE_PINNED_ORIGINAL_MAIN_LDSO_LIBC_PUTS_EXIT_AND_RELRO_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G0-Independent-Native-X86-Original-IFUNC-Reference
          path: |
            dist/x86-native-ifunc-oracle.stdout
            dist/x86-native-ifunc-oracle.stderr
            dist/x86-native-ifunc-reference-evidence.json
            dist/x86-native-original-main.stdout
            dist/x86-native-original-main.stderr
            dist/x86-native-original-main-syscalls.strace
            dist/x86-native-original-main-strace-summary.txt
            dist/x86-native-original-main-reference.json
          if-no-files-found: warn
