name: Publish FH5 Native Port P2.1 Permanently Signed
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - .github/workflows/fh5-port-p21-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-p21:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exactly verified signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 43167050863 --repo "$GITHUB_REPOSITORY" \
            --name FH5-Native-Port-P2.1-PERMANENT-SIGNED-arm64 --dir dist
          test -s dist/app-release.apk
          printf '%s  %s\n' 'a8fc60b0a5c6161b9261fd3e6a2576bc4cd61485c47816bd8e05694543b36513' 'dist/app-release.apk' | sha256sum -c -
          mv dist/app-release.apk dist/FH5-Native-Port-P2.1-Permanent-Signed.apk
      - name: Publish new updateable stable-signature release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='fh5-native-port-p2-1-stable-signing-2026-11-12'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Stable P2.1 release already published."
            exit 0
          fi
          cat > notes.md <<'EOF'
          # FH5 Native Port P2.1 — Permanent Signing Fix (Experimental)

          **This is a signing/upgrade fix** on top of P2. No new game execution capabilities.
          - Signed with a permanent *dedicated* FH5 signing certificate.
          - Encrypted PKCS#12 signing material remains protected by existing repository secrets; not shipped inside the APK.
          - Android application ID: `com.fh5.port`.
          - `versionCode=4`; future versions must increment it.
          - Certificate SHA-256: `4c5fb057ca8775bede11e95ab53b748b46f823d6ba1f89b7dd174a2a6f7f1bf6`.
          - APK SHA-256: `a8fc60b0a5c6161b9261fd3e6a2576bc4cd61485c47816bd8e05694543b36513`.

          ## Important: one-time migration
          P0/P1/P2 APKs used per-run random debug signing keys. Android cannot update them in-place
          because their signer certificate differs. **Uninstall the old P0/P1/P2 test app once**,
          then install P2.1. Later P3+ builds from the permanent signing pipeline can update
          P2.1 in place, without uninstalling, as long as the same app ID/signature and a larger
          versionCode are retained.
          Original Forza ZIP in shared storage remains untouched when uninstalling the test app.

          ## Current functionality
          - Standalone Android APK; direct Vulkan rendering test
          - Read-only ZIP64 metadata index for selected game archive
          - Synthetic limited x86-64 to ARM64 execution proof (result 42)
          - **Not a playable Forza Horizon 5 port yet**; no original game executable is run
          - No Bannerlator/Winlator UI required

          CI validation: https://github.com/RM11Cor/RM11-WinCore/actions/runs/43167050863
          EOF
          gh release create "$tag" dist/FH5-Native-Port-P2.1-Permanent-Signed.apk \
            --target fh5-android-auto-tests \
            --title 'FH5 Native Port P2.1 — Permanent Signing Fix (Experimental)' \
            --notes-file notes.md --prerelease
