name: KERNIX G0 original GNU DT_RELA10 source-only after 72 native writers
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_rela10_source_after_72.py'
      - '.github/workflows/kernix-g0-original-rela10-source-after72.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-original-source-rela10-no-hardware-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require prior 72 original source writer ledger succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/42959515463 --jq .status)" = completed
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/42959515463 --jq .conclusion)" = success
          echo KERNIX_ORIGINAL_72_LEDGER_GATE_SUCCESS
      - name: Download authentic original x86 GNU Linux source triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download independently verified unique 72 original source writer ledger
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42959515463
          name: KERNIX-G0-Original-147-Source-Cohorts-72-Prior-Native-Writers-75-Pending
          github-token: ${{ github.token }}
          path: inputs/ledger72
      - name: Source-only decode authentic GNU DT_RELA10 type symbol addend and target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_rela10_source_after_72.py
          python3 native-engine/tools/kernix_g0_original_rela10_source_after_72.py \
            inputs/triad/original-guest \
            inputs/ledger72 \
            dist/original-libc-DT-RELA10-unique-source-no-native-proof.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dist/original-libc-DT-RELA10-unique-source-no-native-proof.json").read_text())
          assert d["original_source_index"]==10
          assert d["original_table"]=="DT_RELA"
          assert d["original_table_ordinal"]==10
          assert d["prior_independently_attested_native_writers"]==72
          assert d["remaining_requires_native_hardware_proof"]==75
          assert d["new_native_attestations"]==0
          assert d["source_only_no_native_writer_proven"] is True
          assert d["Android_Bionic_Wine_Proton_games_proven"] is False
          print("KERNIX_G0_RELA10_SOURCE_PREP_NO_WRITER_ATTESTED")
          PY
      - name: Archive bounded original source metadata only
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-DTRELA10-Source-Only-After72
          path: dist/original-libc-DT-RELA10-unique-source-no-native-proof.json
          retention-days: 30
