name: KERNIX private Android update signer readiness (no APK)
on:
  push:
    branches: [kernix-native-engine-v1]
    paths: ['.github/workflows/kernix-signing-secrets-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-private-signing-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check repository secrets without revealing their values
        shell: bash
        env:
          KERNIX_SIGNING_KEYSTORE_BASE64: ${{ secrets.KERNIX_SIGNING_KEYSTORE_BASE64 }}
          KERNIX_APK_SIGNING_PASSWORD: ${{ secrets.KERNIX_APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${KERNIX_SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret KERNIX_SIGNING_KEYSTORE_BASE64"
            missing=1
          fi
          if [ -z "${KERNIX_APK_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret KERNIX_APK_SIGNING_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Use Settings > Secrets and variables > Actions > Repository secrets for RM11Cor/RM11-WinCore (not Variables or Environment secrets)."
            exit 1
          fi
          # The official password TXT ends in a newline. When pasted on
          # Android, Actions secret can accidentally include that newline.
          # The fixed KERNIX signing password contains no whitespace.
          KERNIX_APK_SIGNING_PASSWORD="$(printf '%s' "$KERNIX_APK_SIGNING_PASSWORD" | tr -d '[:space:]')"
          if [ "${#KERNIX_APK_SIGNING_PASSWORD}" -ne 48 ]; then
            echo "::error::KERNIX_APK_SIGNING_PASSWORD value is not the expected 48-character password; paste the CONTENT of KERNIX_SIGNING_PASSWORD.txt."
            exit 1
          fi
          store="$RUNNER_TEMP/kernix-update-signing-check.p12"
          trap 'rm -f "$store"' EXIT
          umask 077
          # Permit harmless mobile-editor whitespace but reject any invalid
          # base64 characters and never log or echo the private key.
          if ! printf '%s' "$KERNIX_SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$store" 2>/dev/null; then
            rm -f "$store"
            echo "::error::KERNIX_SIGNING_KEYSTORE_BASE64 is not valid Base64. Paste the ENTIRE CONTENTS of KERNIX_APK_KEYSTORE_BASE64.txt (not the filename, ZIP, or old secret name)."
            exit 1
          fi
          test "$(sha256sum "$store" | awk '{print $1}')" = \
            'fc4fcce82a85df0cb87d6f1cf3f9fce57555353ce9f2d05d7940c645e86e16e6' || {
              echo "::error::The supplied signing keystore value does not match the pinned permanent KERNIX identity."
              exit 1
            }
          keytool -list -v -storetype PKCS12 -keystore "$store" -alias kernix-update \
            -storepass "$KERNIX_APK_SIGNING_PASSWORD" > "$RUNNER_TEMP/kernix-cert-check.txt" || {
              echo "::error::KERNIX signing password or private keystore alias is invalid."
              exit 1
            }
          grep -Fq 'SHA256: A7:47:35:BC:30:B5:3E:59:05:89:D8:FF:5C:23:3F:72:DC:0E:4D:DF:6E:31:29:39:D6:68:AE:30:C4:6B:6F:8E' \
            "$RUNNER_TEMP/kernix-cert-check.txt" || {
              echo "::error::KERNIX signing certificate fingerprint mismatch."
              exit 1
            }
          rm -f "$RUNNER_TEMP/kernix-cert-check.txt"
          echo KERNIX_PRIVATE_PERMANENT_UPDATE_SIGNER_READY
