name: RM11 Mini Graphics Ladder - Win64
on:
  push:
    branches: [rm11-mini-d3d11-stage-proof]
    paths:
      - 'tools/mini_graphics/**'
      - '.github/workflows/rm11-mini-d3d11-stage-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mini-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 x86-64 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build Windows 64-bit display tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          x86_64-w64-mingw32-gcc -Os -Wall -Wextra -Werror -mwindows \
            tools/mini_graphics/rm11_gdi_green.c -o out/RM11-GDI-GREEN.exe \
            -lgdi32 -luser32
          x86_64-w64-mingw32-g++ -Os -Wall -Wextra -Werror -mwindows \
            tools/mini_graphics/rm11_d3d11_blue.cpp -o out/RM11-D3D11-BLUE.exe \
            -ld3d11 -ldxgi -luuid -luser32
          x86_64-w64-mingw32-g++ -Os -Wall -Wextra -Werror -mwindows \
            tools/mini_graphics/rm11_d3d11_stage_proof.cpp -o out/RM11-D3D11-STAGE-PROOF.exe \
            -ld3d11 -ldxgi -luuid -luser32 -lgdi32
          file out/*.exe
          x86_64-w64-mingw32-objdump -f out/*.exe | tee out/pe-architecture.txt
          grep -q 'pei-x86-64' out/pe-architecture.txt
          sha256sum out/*.exe > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RM11-MINI-GRAPHICS-LADDER-WIN64
          path: out/
          if-no-files-found: error
