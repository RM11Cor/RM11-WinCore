name: KERNIX G0 original GNU DT_RELA19 GLOB_DAT loc1 two real FEX ARM64 native writer independent
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_rela19_globdat_sym1581_native_independent_gate.py'
      - '.github/workflows/kernix-g0-original-rela19-globdat-sym1581-native-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-native-original-gnu-rela19-globdat-independent-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require authentic Linux ARM64 FEX source watch and awatch two guest run archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 43007302303 42999387935; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .status)" = completed
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .conclusion)" = success
          done
          for i in $(seq 1 150); do
            status="$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43007582742 --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43007582742 --jq .conclusion)" = success
              echo KERNIX_G0_DTRELA16_GLOBDAT_REAL_ARM64_FEX_RAW_WATCH_AWATCH_AVAILABLE_BEFORE_INDEPENDENT_PROOF
              exit 0
            fi
            sleep 12
          done
          echo KERNIX_G0_DTRELA16_GLOBDAT_NATIVE_WRITER_RAW_PROOF_NOT_AVAILABLE_FAIL_CLOSED
          exit 1
          echo KERNIX_G0_ORIGINAL_GLOBDAT_SOURCE_WATCH_AWATCH_LINUX_ARM64_FEX_RAW_READY_NOT_NATIVE_CERT
      - name: Download exact source SHA x86 GNU ELF libc ldso guest triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download authentic x86 GNU GLOB_DAT19 loc1 source plan
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43007302303
          name: KERNIX-G0-Original-DTRELA19-GNU-Source-Type-And-Symbol-Plan-Prior81-NO-Native-Proof
          github-token: ${{ github.token }}
          path: inputs/source
      - name: Download two real FEX ARM64 GNU GLOB_DAT19 source hardware watch and awatch traces
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43007582742
          name: KERNIX-G0-Focused-Original-DTRELA19-GLOBDAT-Sym1581-Two-FEX-ARM64-Raw-Only
          github-token: ${{ github.token }}
          path: inputs/native
      - name: Download previous independently certified 78 original GNU target writer source ledger
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42999387935
          name: KERNIX-G0-Original-147-Source-Cohorts-81-Prior-Native-Writers-66-Pending
          github-token: ${{ github.token }}
          path: inputs/prior81
      - name: Independently verify GNU GLOB_DAT sym1581 original MOV [RAX],R9 to ARM64 STLR X13,[X4] two guest runs plus 16 negative cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_rela19_globdat_sym1581_native_independent_gate.py
          python3 native-engine/tools/kernix_g0_original_rela19_globdat_sym1581_native_independent_gate.py \
            inputs/triad/original-guest inputs/source inputs/native inputs/prior81 \
            dist/original-libc-DT-RELA19-GLOBDAT-Sym1581-One-Original-FEX-ARM64-Independent-Writer-PROOF.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/original-libc-DT-RELA19-GLOBDAT-Sym1581-One-Original-FEX-ARM64-Independent-Writer-PROOF.json')
          d=json.loads(p.read_text())
          assert d['original_source_indices']==[19]
          assert d['prior_independently_certified_native_hardware_target_count']==81
          assert d['new_distinct_original_GNU_native_hardware_writer_targets']==1
          assert d['unique_original_libc_native_hardware_writer_target_count']==82
          assert d['two_separate_FEX_guest_original_GLOBDAT_hardware_write_processes'] is True
          w=d['one_original_GNU_RELA19_GLOBDAT_Sym1581_native_writer_receipt']
          assert w['original_relocation_type']=='R_X86_64_GLOB_DAT'
          assert w['source_symbol_index']==1581
          assert w['source_symbol_name']=='loc1'
          assert w['original_source_signed_addend']==0
          assert w['original_guest_hardware_write_target']=='0x804202de8'
          assert w['source_original_qword']=='0x0'
          assert w['observed_native_writer_qword']=='0x80420b038'
          assert w['observed_native_pointer_value']==34428989496
          assert w['original_x86_GNU_loader_JIT_entry']=='0x80100fb8b'
          assert w['original_GNU_x86_loader_store_opcode']=='4c8908'
          assert w['native_real_AArch64_store']=='stlr x13, [x4]'
          assert w['native_source_value_register']=='x13'
          assert w['source_guest_x86_to_ARM64_hardware_writer_proven'] is True
          assert w['full_GLOB_DAT_symbol_scope_preemption_versioning_proven'] is False
          assert len(d['sixteen_fake_original_GLOBDAT_native_hardware_traces_rejected'])==16
          assert d['original_GLOB_DAT_full_dynamic_symbol_scope_preemption_and_versioning_proven'] is False
          assert d['one_single_FEX_guest_process_for_all_82_writers_proven'] is False
          assert d['original_147_relocations_all_in_single_guest_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_ORIGINAL_GNU_GLOBDAT19_NATIVE_WRITER_82_OF_147_INDEPENDENT_REAL_FEX_NO_ANDROID')
          PY
      - name: Archive original GLOB_DAT source writer only after independently rejecting 16 forged hardware traces
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-DTRELA19-GLOBDAT-Sym1581-Two-FEX-ARM64-Independent-Writer-Proof
          path: dist/original-libc-DT-RELA19-GLOBDAT-Sym1581-One-Original-FEX-ARM64-Independent-Writer-PROOF.json
          retention-days: 30
          if-no-files-found: error
