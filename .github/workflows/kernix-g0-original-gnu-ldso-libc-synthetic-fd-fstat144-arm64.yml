name: KERNIX G0 genuine GNU ldlinux pinned libc synthetic FD fstat5 x86 stat144 Linux ARM64 TEST ONLY
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-original-gnu-ldso-libc-synthetic-fd-fstat144-arm64.yml'
      - 'native-engine/android-host/kernix_g0_original_libc_synthetic_x86_stat_abi.h'
      - 'native-engine/android-host/kernix_g0_original_fex_sigbus_backpatch_linux_arm64_diagnostic.h'
      - 'native-engine/android-host/kernix_g0_guest_owned_anonymous_vm_kernel.h'
      - 'native-engine/android-host/kernix_g0_source_verified_guest_elf_fd_kernel.h'
      - 'native-engine/android-host/kernix_g0_guest_owned_anonymous_vm_kernel.h'
      - 'native-engine/android-host/kernix_g2e_c3d7b_kernel_selected_pie_guest_vas.h'
      - 'native-engine/android-host/kernix_g2e_c3d7g_native_pt_load_wx_apply_gate.h'
      - 'native-engine/android-host/kernix_g2e_c3d8a_original_loader_handoff_barrier.h'
