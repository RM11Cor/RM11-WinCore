          tar -xzf "$RUNNER_TEMP/rm11-v2415.tar.gz" -C "$RUNNER_TEMP/rm11-v2415-source"
          if grep -Fq "versionName '2.4.15-alpha'" app/build.gradle && \
             test -s app/src/main/cpp/pe64_micro_core.c; then
            echo 'v2.4.15 source already integrated; rebuilding.'
          else
            python3 "$RUNNER_TEMP/rm11-v2415-source/apply.py" "$GITHUB_WORKSPACE"
          fi
          git diff --exit-code -- .github/workflows/
          grep -Fq "versionCode 16" app/build.gradle
          grep -Fq "versionName '2.4.15-alpha'" app/build.gradle
          grep -Fq "applicationId 'com.rm11.autocore'" app/build.gradle
          test -s app/src/main/assets/rm11-smoke-pe64.exe
          test -s app/src/main/cpp/pe64_micro_core.c
          test -s app/src/main/java/com/rm11/autocore/Pe64MicroRuntime.java

      - name: Run 21 native PE64/x86 translator checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rm11-native-test"
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iapp/src/main/cpp \
            app/src/main/cpp/pe64_micro_core.c \
            tests/native/test_pe64_micro.c \
            -o "$RUNNER_TEMP/rm11-native-test/micro-test"
          "$RUNNER_TEMP/rm11-native-test/micro-test" \
            app/src/main/assets/rm11-smoke-pe64.exe
          python3 tools/build_pe64_smoke.py "$RUNNER_TEMP/rm11-native-test/rebuilt.exe"
          cmp app/src/main/assets/rm11-smoke-pe64.exe "$RUNNER_TEMP/rm11-native-test/rebuilt.exe"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Vulkan GLSL shaders
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
          python3 tools/compile_shaders.py

      - name: Validate all tracked source and run JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts-check.py
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Load permanent release signing key
        shell: bash
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RM11_RELEASE_KEYSTORE_B64"
          test -n "$RM11_RELEASE_PASSWORD"
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rm11-autocore-release.p12"
          chmod 600 "$RUNNER_TEMP/rm11-autocore-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/rm11-autocore-release.p12" \
            -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" \
            -alias rm11-autocore >/dev/null
          echo "RM11_RELEASE_KEYSTORE=$RUNNER_TEMP/rm11-autocore-release.p12" >> "$GITHUB_ENV"

      - name: Build signed ARM64 APK
        env:
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify stable certificate and APK upgrade identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          REPORT="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$REPORT"
          grep -Fq 'Signer #1 certificate SHA-256 digest: d398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' <<< "$REPORT"
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.rm11.autocore' versionCode='16' versionName='2.4.15-alpha'" <<< "$BADGING"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RM11-WinCore-v2.4.15-PE64-TRANSLATOR-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit tested code to main without modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/build.gradle app/src/main/cpp/CMakeLists.txt \
            app/src/main/cpp/pe64_micro_core.h app/src/main/cpp/pe64_micro_core.c \
            app/src/main/cpp/pe64_micro_jni.c \
            app/src/main/java/com/rm11/autocore/MainActivity.java \
            app/src/main/java/com/rm11/autocore/Pe64MicroRuntime.java \
            app/src/main/assets/rm11-smoke-pe64.exe \
            tests/native/test_pe64_micro.c tools/build_pe64_smoke.py \
            scripts-check.py docs/RUNTIME-MICRO-PE64-v2.4.15.md
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo '::error::Refusing unauthorized workflow edit'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'v2.4.15 code already committed.'
          else
            git commit -m "feat: RM11 2.4.15 bounded Windows PE64 entry translation proof"
            git push origin HEAD:main
          fi
