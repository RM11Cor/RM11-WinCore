name: KERNIX G2-C real ARM64 FEX direct x86 dynamic PIE entry

on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2c-real-fex-dynamic-pie-arm64.yml'
      - 'native-engine/ci/kernix_g2c_native_arm64_real_fex.sh'
      - 'native-engine/ci/kernix_g2c_build_mit_guest_fixture.sh'
      - 'tools/kernix_g2c_mit_16k_ptload_gate.py'
      - 'native-engine/android-host/kernix_g2c_mit_owned_guest_snapshots.h'
      - 'native-engine/android-guest/kernix_g2c_mit_interpreter_placeholder.S'
      - 'native-engine/android-guest/kernix_g2c_mit_needed_placeholder.S'
      - 'native-engine/android-guest/kernix_g2c_dynamic_pie_direct_entry_witness.S'
      - 'native-engine/android-host/kernix_g2c_fex_dynamic_pie_direct_entry_probe.cpp'
      - 'native-engine/android-host/tests/kernix_g2c_linux_arm64_preflight.cpp'
      - 'native-engine/android-host/kernix_g2b_readonly_host_install.h'
      - 'native-engine/android-host/kernix_guest_elf64_readonly_image.h'
      - 'native-engine/android-host/kernix_g2b_guest_host_reservations.h'
      - 'native-engine/android-host/kernix_g2b_guest_launch_plan.h'
      - 'native-engine/android-host/kernix_guest_linux_x86_initial_stack.h'
      - 'native-engine/android-host/kernix_g2c_snapshot_elf_source.h'
      - 'native-engine/android-host/kernix_g2c_native_readonly_guest_snapshots.h'
      - 'native-engine/android-host/kernix_g2c_mit_owned_guest_snapshots.h'
      - 'native-engine/android-host/kernix_g2c_native_fixed_guest_fd_guard.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-original-fex-direct-dynamic-pie:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout only independent KERNIX source branch
        uses: actions/checkout@v4
        with:
          ref: kernix-native-engine-v1
      - name: Run actual pinned FEXCore ARM64 JIT with fixed x86 dynamic PIE and ABI witness
        shell: bash
        run: bash native-engine/ci/kernix_g2c_native_arm64_real_fex.sh
      - name: Preserve strict executable evidence including failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G2C-real-FEX-ARM64-dynamic-PIE-direct-entry-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            dist/g2c-result.json
            dist/g2c-snapshot-fex-result.json
            dist/g2c-mit-original-fex-result.json
            dist/g2c-mit-snapshot-fex-result.json
            dist/g2c-mit16k-snapshot-fex-result.json
            dist/g2c-mit16k-snapshot-fex.stdout
            dist/g2c-mit16k-snapshot-fex.stderr
            dist/g2c-mit-16k-guest-v2/bin/kernix-mit-dynamic-app
            dist/g2c-mit-16k-guest-v2/lib64/ld-kernix-g2c-mit-placeholder.so.1
            dist/g2c-mit-16k-guest-v2/lib/x86_64-linux-gnu/libkernix-g2c-mit-placeholder.so.1
            dist/g2c-mit-snapshot-fex.stdout
            dist/g2c-mit-snapshot-fex.stderr
            dist/g2c-mit-original-fex.stdout
            dist/g2c-mit-original-fex.stderr
            dist/g2c-mit-only-main-elf-abi.txt
            dist/g2c-mit-only-three-elf-sha256.txt
            dist/g2c-mit-only-source-and-elf-manifest.json
            dist/g2c-mit-only-rootfs/bin/kernix-mit-dynamic-app
            dist/g2c-mit-only-rootfs/lib64/ld-kernix-g2c-mit-placeholder.so.1
            dist/g2c-mit-only-rootfs/lib/x86_64-linux-gnu/libkernix-g2c-mit-placeholder.so.1
            dist/g2c-snapshot-fex.stdout
            dist/g2c-snapshot-fex.stderr
            dist/g2c.stdout
            dist/g2c.stderr
            dist/g2c-fex-configure.log
            dist/g2c-fex-build.log
            dist/g2c-fex-driver-compile.log
            dist/g2c-guest-elf-sha256.txt
            dist/kernix-g2c-guest-elf-evidence.txt
            dist/kernix-g2c-x86-dynamic-pie.elf
            dist/FEX-LICENSE.txt
            dist/g2c-android-fixed-fixture-v1.tar.gz
            dist/g2c-android-fixed-fixture-v1.sha256
            dist/g2c-android-fixed-fixture-v1/manifest.json
