name: KERNIX G0 four independent GNU DT_RELA81-84 source-only manifest after genuine 141 native writers
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_batch81_84_source_after141.py'
      - '.github/workflows/kernix-g0-batch81-84-source-after141.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-gnu-four-source-tuples-and-individual-watch-plans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require independently certified 141 writer ledger, not just previous source scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 43064065588 43064217681; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .status)" = completed
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .conclusion)" = success
          done
      - name: Download original SHA-locked GNU libc and loader
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download independently verified 141 original target writer ledger
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43064217681
          name: KERNIX-G0-Original-147-Source-Ledger-After-Independent-Batch71-80
          github-token: ${{ github.token }}
          path: inputs/ledger141
      - name: Verify four individual original ELF relocation symbols and assemble four GDB plans source-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_batch81_84_source_after141.py
          python3 native-engine/tools/kernix_g0_original_batch81_84_source_after141.py \
            inputs/triad/original-guest \
            inputs/ledger141/KERNIX-G0-GNU-147-Source-Cohorts-After-10-Target-Independent-Batch71-80.json \
            . dist
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dist/KERNIX-G0-Original-GNU-DTRELA81-84-Source-Batch-Only-No-Native-Proof.json").read_text())
          assert d["schema"]=="kernix.g0.original-gnu-libc-globdat-ten-original-source-targets81-84-after-141.v1"
          assert d["original_relocations_total"]==147
          assert d["prior_independently_certified_original_writer_count"]==141
          assert d["remaining_requires_individual_hardware_proof"]==6
          assert d["original_source_indices"]==list(range(81,85))
          assert len(d["four_original_gnu_source_relocation_metadata"])==4
          assert len(set(r["target"] for r in d["four_original_gnu_source_relocation_metadata"]))==4
          assert all(r["relocation_type"] in ("R_X86_64_GLOB_DAT","R_X86_64_64","R_X86_64_TPOFF64") for r in d["four_original_gnu_source_relocation_metadata"])
          assert all(r["separately_native_writer_proven"] is False for r in d["four_original_gnu_source_relocation_metadata"])
          assert d["new_native_hardware_writer_target_attestations_from_source_scan"]==0
          assert d["all_147_same_guest_native_execution_proven"] is False
          assert d["Android_Bionic_Wine_Proton_games_proven"] is False
          assert all(Path(f"dist/original-gnu-dtrela{i}-source-only.gdb").is_file() for i in range(81,85))
          print("KERNIX_G0_FOUR_SOURCE_ONLY_GNU_GLOBDAT_TARGETS81_84_AFTER_CERTIFIED_103_NO_HARDWARE_CLAIMS")
          PY
      - name: Archive exact source-only four symbol tuples and separate GDB watchpoint plans
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-GNU-DTRELA81-84-Four-Source-Tuples-After141-NO-Native-Proof
          path: |
            dist/KERNIX-G0-Original-GNU-DTRELA81-84-Source-Batch-Only-No-Native-Proof.json
            dist/original-gnu-dtrela*-source-only.gdb
          retention-days: 30
          if-no-files-found: error
