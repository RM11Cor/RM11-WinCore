name: Publish FH5 Native Port P3.8 - Real Local PE Import Export Dry Run
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - .github/workflows/fh5-port-p38-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact signed P3.8 from verified CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 43202729389 --repo "$GITHUB_REPOSITORY" \
            --name FH5-Native-Port-P3.8-PERMANENT-SIGNED-arm64 --dir dist
          test -s dist/app-release.apk
          printf '%s  %s\n' '3c2cae748debfedd83f0762cbd03066c30be4eaabf127c33b7396f8bdcfe1914' 'dist/app-release.apk' | sha256sum -c -
          mv dist/app-release.apk dist/FH5-Native-Port-P3.8-Permanent-Signed.apk
      - name: Publish P3.8 read-only DLL import export match
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='fh5-native-port-p3-8-import-export-dryrun-2026-11-12'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'P3.8 already exists'; exit 0
          fi
          cat > notes.md <<'EOF'
          # FH5 Native Port P3.8 — Actual Local DLL Exports vs Original EXE Imports

          **Experimental read-only Android diagnostic, NOT a playable Forza Horizon 5 port.**
          No Windows process starts; no game x64 code or DLL is executed.

          ## Verified real phone findings from P3.7
          - Static original EXE PE64 import analysis: **47 DLLs**, **944 named**
            plus **73 ordinal** imports, **1,017 total**; scan completed.
          - 25 names required truncated display samples; zero exceeded
            the 1024-byte scan budget.
          - Six DLL files exist next to extracted original EXE on the phone;
            all six have valid PE32+ AMD64 DLL headers.
          - Those six DLLs account for **95** static imports of Forza:
            `amd_ags_x64.dll` 2, `bink2w64.dll` 23, `partywin.dll` 39,
            `partyxboxlive.dll` 15, `steam_api64.dll` 13,
            `webview2loader.dll` 3.

          ## New P3.8 actual-game read-only diagnostic
          - New button: `مطابقة 95 استيراداً مع Export ملفات DLL الست (بدون تشغيل)`.
          - Reads actual PE export directory, exported function table, name
            pointers, ordinal base, and ordinal indexes from each local DLL
            that the EXE imports, using the user's persisted Android SAF
            read permission.
          - Matches full PE import symbols and ordinal IDs to the local DLL's
            real export table. Separates direct matches, forwarded exports
            and missing symbols; records up to eight short missing examples
            per DLL (no raw executable/DLL bytes or private paths).
          - Safety bounds: 16 local files, max 8,192 exports per DLL, 4,096
            exported names, 1,024 bytes per name, max 512 imported thunks
            per DLL and 8,192 import thunks total.
          - Host JVM tests cover real synthetic PE64 export names,
            ordinal bases, missing functions, forwarded exports,
            invalid headers and export-count limits.
          - **No IAT writes, DLL mapping, relocation, API Set resolution,
            x86_64->ARM64 execution or Steam DRM handling.**
          - An export table match **does not prove ABI compatibility,
            permissions, service availability or successful game launch**.
          - Report: `FH5_PORT_P3_8_REPORT.json`.

          ## Installation and phone test
          - Package `com.fh5.port`, versionCode **21** (P3.7 was 20).
          - Permanent signing certificate SHA256 retained:
            `4c5fb057ca8775bede11e95ab53b748b46f823d6ba1f89b7dd174a2a6f7f1bf6`.
          - APK SHA256: `3c2cae748debfedd83f0762cbd03066c30be4eaabf127c33b7396f8bdcfe1914`.
          - Install directly over P3.7 without uninstalling.
          - Open app and press `مطابقة 95 استيراداً مع Export ملفات DLL الست (بدون تشغيل)`.
          - After completion export `FH5_PORT_P3_8_REPORT.json` and upload only
            that JSON report, not original game files.

          Native tests, Android JVM tests, APK, ABI, package version, and
          stable signing verified in GitHub Actions:
          https://github.com/RM11Cor/RM11-WinCore/actions/runs/43202729389
          EOF
          gh release create "$tag" dist/FH5-Native-Port-P3.8-Permanent-Signed.apk \
            --target fh5-android-auto-tests \
            --title 'FH5 Native Port P3.8 - Local DLL Export vs Original Import Dry Run' \
            --notes-file notes.md --prerelease
