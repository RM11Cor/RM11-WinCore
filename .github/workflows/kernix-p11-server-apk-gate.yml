name: KERNIX Patched WineServer APK Gate
on:
  push:
    branches: [rm11-controller-wine-hid-rebuild]
    paths:
      - 'tools/build_kernix_proton_fex_bundle.py'
      - 'tools/test_kernix_p11_server_attestation.py'
      - '.github/workflows/kernix-p11-server-apk-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native server build receipt and ELF rejection rules
        run: python3 -m unittest -v tools/test_kernix_p11_server_attestation.py
      - name: Validate the actual pinned native WineServer artifact before APK build completes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SRC=41330962355
          test "$(gh api "repos/RM11Cor/RM11-WinCore/actions/runs/$SRC" --jq '.conclusion')" = success
          test "$(gh api "repos/RM11Cor/RM11-WinCore/actions/runs/$SRC" --jq '.head_sha')" = f4e767c8f88f029459d91d5a6da9d0c6f0d1537f
          mkdir -p "$RUNNER_TEMP/server"
          gh run download "$SRC" --repo RM11Cor/RM11-WinCore \
            --name KERNIX-P11-PATCHED-SERVER-ARM64-NOT-DEVICE-QUALIFIED \
            --dir "$RUNNER_TEMP/server"
          python3 - "$RUNNER_TEMP/server" <<'PY'
          import sys,pathlib
          from tools.build_kernix_proton_fex_bundle import verify_server_artifact
          file,sha=verify_server_artifact(pathlib.Path(sys.argv[1]))
          print("KERNIX_REAL_PATCHED_NATIVE_WINESERVER_RECEIPT_PASS",sha,file.stat().st_size)
          PY
      - name: Confirm KERNIX installer requires signed patched WineServer
        run: |
          set -euo pipefail
          grep -F 'patchedServerMatched(ctx,m)' app/src/main/java/com/rm11/autocore/runtime/KernixProtonFexInstallerV49121.java
          grep -F 'signed_native' tools/build_kernix_proton_fex_bundle.py
          grep -F 'original_proton_runtime_zip_unchanged' tools/build_kernix_proton_fex_bundle.py
          echo KERNIX_P11_NATIVE_SERVER_APK_GATE_PYTHON_PASS
