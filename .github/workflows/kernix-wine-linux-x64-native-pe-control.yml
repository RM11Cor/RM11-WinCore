name: KERNIX isolate Wine kernel32 native Linux x86_64 control
on:
  workflow_dispatch:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-wine-linux-x64-native-pe-control.yml'
permissions:
  contents: read
  actions: read
jobs:
  wine-original-x86_64-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Wine Linux x86_64 dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 file binutils libx11-6 libxext6 libxrender1 libfreetype6 \
            libfontconfig1 libvulkan1 libgnutls30t64
      - name: Download exact same upstream Wine Linux x64 artifact tested under FEX
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-Wine-11-real-Linux-x64-runtime-NOT-Android
          run-id: 41568610374
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/wine
      - name: Audit exact same Wine bytes and install at compiled prefix
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('inputs/wine')
          tar=root/'wine-11.0-upstream-x86_64-linux-glibc-runtime.tar.gz'
          expected=(root/'wine-linux-x64-stage.tar.gz.sha256').read_text().split()[0]
          assert len(expected)==64
          actual=hashlib.file_digest(tar.open('rb'),'sha256').hexdigest()
          assert actual==expected, 'Wine tar checksum mismatch'
          manifest=json.loads((root/'wine-stage-files-sha256.json').read_text())
          assert manifest['upstream_commit']=='db11d0fe6a169c457e23d007e20404643d067aa8'
          assert manifest['android_bionic_compatible'] is False
          (Path('dist')/'source-identity.json').write_text(json.dumps({
            'schema':'kernix.wine-native-linux-x64-control.v1',
            'wine_source':'wine-mirror/wine','wine_commit':manifest['upstream_commit'],
            'wine_tar_sha256':actual,'native_host':'ubuntu-24.04-x86_64',
            'android_compatible':False},indent=2)+'\n')
          PY
          python3 tools/kernix_wine_stage_archive_gate.py \
            --archive inputs/wine/wine-11.0-upstream-x86_64-linux-glibc-runtime.tar.gz \
            --manifest inputs/wine/wine-stage-files-sha256.json \
            > dist/wine-archive-audit.json
          sudo tar -xzf inputs/wine/wine-11.0-upstream-x86_64-linux-glibc-runtime.tar.gz -C /
          test -x /opt/kernix-wine-linux-x64/bin/wine
          find /opt/kernix-wine-linux-x64/lib/wine -type f \
            \( -name 'kernel32.dll' -o -name 'kernelbase.dll' -o -name 'cmd.exe' \) \
            -print | tee dist/wine-core-windows-pe-files.txt
          file /opt/kernix-wine-linux-x64/bin/wine | tee dist/native-wine-file.txt
          ldd /opt/kernix-wine-linux-x64/bin/wine | tee dist/native-wine-ldd.txt
      - name: Compare native source-built Wine --version and Windows cmd.exe
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p dist
          export WINEPREFIX="$HOME/.kernix-wine-native-x64-control-prefix"
          export WINEDEBUG=+seh,+module
          wine=/opt/kernix-wine-linux-x64/bin/wine
          set +e
          timeout 30s "$wine" --version > dist/native-wine-version.log 2>&1
          version_rc=$?
          timeout 120s "$wine" cmd /c echo KERNIX_NATIVE_X64_WINDOWS_CMD_EXE_PROOF \
            > dist/native-windows-cmd.log 2>&1
          cmd_rc=$?
          set -e
          tail -n 80 dist/native-windows-cmd.log || :
          cat dist/native-wine-version.log || :
          export KERNIX_VERSION_RC="$version_rc" KERNIX_CMD_RC="$cmd_rc"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          v=Path('dist/native-wine-version.log').read_text(errors='replace')
          c=Path('dist/native-windows-cmd.log').read_text(errors='replace')
          result={'schema':'kernix.wine-native-x86_64-windows-pe-control.v1',
            'wine_version_exit':int(os.environ['KERNIX_VERSION_RC']),
            'wine_version_verified':int(os.environ['KERNIX_VERSION_RC'])==0 and 'wine-11.0' in v,
            'windows_cmd_exe_exit':int(os.environ['KERNIX_CMD_RC']),
            'windows_cmd_exe_executed':int(os.environ['KERNIX_CMD_RC'])==0 and 'KERNIX_NATIVE_X64_WINDOWS_CMD_EXE_PROOF' in c,
            'fex_involved':False,'android_bionic_compatible':False}
          Path('dist/native-control-evidence.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          test "$version_rc" -eq 0
          test "$cmd_rc" -eq 0
          grep -F 'KERNIX_NATIVE_X64_WINDOWS_CMD_EXE_PROOF' dist/native-windows-cmd.log
      - name: Differential diagnosis on native x64 with distro Wine and headless display
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          # GitHub's bash shell starts with -e; disable it for expected
          # nonzero application tests so all logs and result JSON survive.
          set +e
          mkdir -p dist
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wine wine64 xvfb xauth > dist/distro-wine-install.log 2>&1
          apt_rc=$?
          export KERNIX_APT_RC="$apt_rc"
          wine=/opt/kernix-wine-linux-x64/bin/wine
          if test "$apt_rc" -eq 0; then
            export WINEPREFIX="$HOME/.kernix-distro-wine-positive-control"
            WINEDEBUG=-all timeout 120s xvfb-run -a /usr/bin/wine cmd /c echo KERNIX_DISTRO_WINE_CMD_CONTROL \
              > dist/distro-wine-cmd.log 2>&1
            distro_rc=$?
          else
            distro_rc=127
            echo "Distribution Wine unavailable; apt log attached." > dist/distro-wine-cmd.log
          fi
          export WINEPREFIX="$HOME/.kernix-custom-wine-xvfb-control"
          WINEDEBUG=+seh,+module timeout 120s xvfb-run -a "$wine" cmd /c echo KERNIX_CUSTOM_WINE_XVFB_CONTROL \
            > dist/custom-wine-xvfb.log 2>&1
          xvfb_rc=$?
          export WINEPREFIX="$HOME/.kernix-custom-wine-wininet-disabled-control"
          WINEDEBUG=+seh,+module WINEDLLOVERRIDES='wininet=d' timeout 120s "$wine" cmd /c echo KERNIX_CUSTOM_WINE_NO_WININET_CONTROL \
            > dist/custom-wine-no-wininet.log 2>&1
          noin_rc=$?
          unset WINEPREFIX
          echo "Distribution Wine:"; tail -n 20 dist/distro-wine-cmd.log || :
          echo "Source-built Wine Xvfb:"; tail -n 30 dist/custom-wine-xvfb.log || :
          echo "Source-built Wine wininet disabled:"; tail -n 30 dist/custom-wine-no-wininet.log || :
          export KERNIX_DISTRO_RC="$distro_rc" KERNIX_XVFB_RC="$xvfb_rc" KERNIX_NOIN_RC="$noin_rc"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          variants=[
              ('distribution_wine', 'KERNIX_DISTRO_RC','distro-wine-cmd.log','KERNIX_DISTRO_WINE_CMD_CONTROL'),
              ('source_built_xvfb', 'KERNIX_XVFB_RC','custom-wine-xvfb.log','KERNIX_CUSTOM_WINE_XVFB_CONTROL'),
              ('source_built_wininet_disabled','KERNIX_NOIN_RC','custom-wine-no-wininet.log','KERNIX_CUSTOM_WINE_NO_WININET_CONTROL')]
          tests={}
          for name,env,p,marker in variants:
              text=(Path('dist')/p).read_text(errors='replace')
              rc=int(os.environ[env])
              tests[name]={'exit_code':rc,'windows_cmd_executed':rc==0 and marker in text,
                           'wininet_loader_failure':'wininet.dll" failed to initialize' in text or 'wininet.dll" failed' in text,
                           'kernel32_failure':'could not load kernel32.dll' in text}
          data={'schema':'kernix.wine11-native-x64-pe-differential-diagnosis.v1',
                'wine11_upstream_source':'wine-mirror/wine',
                'baseline_source_built_pe_executed':False,
                'native_distro_wine_version_not_pinned':True,
                'fex_involved':False,'android_tested':False,'tests':tests}
          Path('dist/native-differential-evidence.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data,indent=2))
          PY
      - name: Upload native x86_64 control logs for both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-Wine-native-x86_64-kernel32-control-evidence-NOT-Android
          path: dist/
          if-no-files-found: warn
          retention-days: 30
      - name: Require actual Windows EXE proof on native Linux x86_64
        if: always()
        run: |
          set -euo pipefail
          test -f dist/native-control-evidence.json
          python3 - <<'PY'
          import json
          r=json.load(open('dist/native-control-evidence.json'))
          assert r['wine_version_verified'] is True
          assert r['windows_cmd_exe_executed'] is True
          print('KERNIX_NATIVE_LINUX_X64_WINE_WINDOWS_PE_EXECUTION_PASS')
          PY
