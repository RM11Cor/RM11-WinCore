name: FH5 Standalone APK P2.1 - Stable Signed Release
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - fh5-port/**
      - .github/workflows/fh5-port-p0-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-p2-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install platform, NDK, and CMake for arm64-v8a
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native PE64 decoder unit tests on build host
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I fh5-port/app/src/main/cpp \
            fh5-port/app/src/main/cpp/pe64_micro_core.c \
            fh5-port/app/src/test/native/test_pe64_core.c \
            -o /tmp/fh5_pe64_host_tests
          /tmp/fh5_pe64_host_tests
      - name: Load existing permanent signing key from protected GitHub secrets
        shell: bash
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RM11_RELEASE_KEYSTORE_B64" || { echo "Stable signing keystore secret missing"; exit 1; }
          test -n "$RM11_RELEASE_PASSWORD" || { echo "Stable signing password missing"; exit 1; }
          printf %s "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fh5-stable-signing.p12"
          chmod 600 "$RUNNER_TEMP/fh5-stable-signing.p12"
          keytool -list -keystore "$RUNNER_TEMP/fh5-stable-signing.p12" \
            -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" -alias rm11-autocore >/dev/null
          echo "FH5_STABLE_KEYSTORE=$RUNNER_TEMP/fh5-stable-signing.p12" >> "$GITHUB_ENV"
      - name: Build independent stable-signed ARM64 APK
        working-directory: fh5-port
        env:
          FH5_STABLE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature, package identity, version, and native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="fh5-port/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          cert="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf "%s\n" "$cert"
          grep -Fqi 'Signer #1 certificate SHA-256 digest: d398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' <<< "$cert"
          pkg="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk")"
          printf "%s\n" "$pkg" | head -n 8
          grep -Fq "package: name='com.fh5.port' versionCode='4' versionName='P2.1-stable-signed'" <<< "$pkg"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path("fh5-port/app/build/outputs/apk/release/app-release.apk")
          assert p.is_file() and p.stat().st_size>10000
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert "classes.dex" in names
              assert "lib/arm64-v8a/libfh5_renderer.so" in names
              assert "lib/arm64-v8a/libfh5_x64_micro.so" in names
              assert not any(x.lower().endswith((".exe",".modelbin",".carbin",".rpf")) for x in names)
              assert not any(x.startswith("lib/x86") for x in names)
          print("Verified permanent signed APK size:",p.stat().st_size)
          PY
      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FH5-Native-Port-P2.1-PERMANENT-SIGNED-arm64
          path: fh5-port/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
