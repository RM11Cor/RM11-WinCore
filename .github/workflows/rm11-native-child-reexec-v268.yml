name: RM11 v2.6.8 - Native Wine Child Reexec Signed APK

on:
  push:
    branches: [rm11-v268-native-child-reexec]
    paths: ['.github/workflows/rm11-native-child-reexec-v268.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  directbridge-apk:
    if: github.repository == 'RM11Cor/RM11-WinCore'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Verify branch and diagnostic-only changes
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.rm11.autocore'" app/build.gradle
          grep -Fq 'versionCode 31' app/build.gradle
          test -s app/src/main/java/com/rm11/autocore/bridge/DirectBridgeDiagnostics.java
          test -s app/src/main/java/com/rm11/autocore/bridge/DirectBridgeFailure.java
          test -s app/src/test/java/com/rm11/autocore/bridge/DirectBridgeFailureTest.java
          grep -Fq 'DirectBridgeDiagnostics.recordSmoke' app/src/main/java/com/rm11/autocore/MainActivity.java
          grep -Fq 'LOG MIDDLE OMITTED' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          test -s app/src/main/java/com/rm11/autocore/runtime/WinePePathProbe.java
          test -s app/src/main/java/com/rm11/autocore/runtime/WineFexAliasBridge.java
          test -s app/src/test/java/com/rm11/autocore/runtime/WineFexAliasBridgeTest.java
          test -s app/src/main/cpp/fex_bionic_shm_compat.cpp
          test -s app/src/main/cpp/fex_bionic_shm_compat.h
          test -s app/src/main/java/com/rm11/autocore/runtime/WineUnixLibProbe.java
          test -s app/src/test/java/com/rm11/autocore/runtime/WineUnixLibProbeTest.java
          test -s app/src/main/java/com/rm11/autocore/runtime/FexAssertionAnalyzer.java
          test -s app/src/test/java/com/rm11/autocore/runtime/FexAssertionAnalyzerTest.java
          test -s app/src/main/cpp/rm11_arm64_cpu_probe.c
          test -s app/src/main/java/com/rm11/autocore/runtime/WineCpuRegistryBootstrap.java
          test -s app/src/main/java/com/rm11/autocore/runtime/WinebootAliasBridge.java
          test -s app/src/test/java/com/rm11/autocore/runtime/WineCpuRegistryBootstrapTest.java
          test -s app/src/main/java/com/rm11/autocore/runtime/WineBuiltinAliasBridge.java
          test -s app/src/test/java/com/rm11/autocore/runtime/WineBuiltinAliasBridgeTest.java
          grep -Fq 'RM11_CHILD_LOADER_REEXEC_ACTIVE' app/src/main/cpp/wine_data_redirect.c
          grep -Fq 'runChildReexecDiagnostic(this)' app/src/main/java/com/rm11/autocore/MainActivity.java
          grep -Fq 'forBundledSmokeExeWithChildBridge' app/src/main/java/com/rm11/autocore/runtime/WineExecutionPlan.java
          grep -Fq 'RM11_CHILD_LOADER_BRIDGE' app/src/main/java/com/rm11/autocore/runtime/WineExecutionPlan.java
          grep -Fq 'WineBuiltinAliasBridge.prepare(layout)' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'Kernel32 module load failed:' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'prefixKernel32Dll' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          grep -Fq 'SYMLINK_TARGET_NOT_HASHED' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          grep -Fq 'CPU_PROBE_MEASUREMENTS_REJECTED_' app/src/main/java/com/rm11/autocore/runtime/WineCpuRegistryBootstrap.java
          grep -Fq 'parsesExactPreparedWinePrefixSystemRegistryHeader' app/src/test/java/com/rm11/autocore/runtime/WineCpuRegistryBootstrapTest.java
          grep -Fq 'refusesSingleBackslashRegistryInsteadOfGuessing' app/src/test/java/com/rm11/autocore/runtime/WineCpuRegistryBootstrapTest.java
          test -s app/src/test/java/com/rm11/autocore/runtime/WinebootAliasBridgeTest.java
          grep -Fq 'WineCpuRegistryBootstrap.prepare(layout)' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'WinebootAliasBridge.prepare(layout)' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq '+seh' app/src/main/java/com/rm11/autocore/runtime/WineExecutionPlan.java
          grep -Fq 'FexAssertionAnalyzer.inspect(wineLog)' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'FEXCORE_FORCED_ASSERT_TRAP' app/src/main/java/com/rm11/autocore/bridge/DirectBridgeFailure.java
          grep -Fq 'WineUnixLibProbe.describe(layout)' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'WineFexAliasBridge.prepare(layout)' app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          grep -Fq 'fexArm64EcSystem32' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          grep -Fq 'BLOCKED_EXISTING_SYSTEM32_ENTRY' app/src/main/java/com/rm11/autocore/runtime/WineFexAliasBridge.java
          grep -Fq 'RM11_WINE_PE_DIR' app/src/main/java/com/rm11/autocore/runtime/BionicLaunchEnvironment.java
          grep -Fq 'RM11_PE_DLL_REDIRECT_ACTIVE' app/src/main/cpp/wine_data_redirect.c
          grep -Fq 'ssize_t written' app/src/main/cpp/wine_data_redirect.c
          grep -Fq 'APP_PRIVATE_SYMLINK_ROOT_RESOLVED' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          test -s app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticJournal.java
          ! grep -rq 'Files.readString' app/src/main/java/com/rm11/autocore/diagnostics
          grep -Fq 'Files.readAllBytes' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          test -s app/src/main/java/com/rm11/autocore/diagnostics/DiagnosticSanitizer.java
          test -s app/src/test/java/com/rm11/autocore/diagnostics/DiagnosticSanitizerTest.java
          grep -Fq 'SAVE_OFFLINE_DIAGNOSTICS' app/src/main/java/com/rm11/autocore/MainActivity.java
          grep -Fq 'OfflineDiagnosticArchive.export' app/src/main/java/com/rm11/autocore/MainActivity.java
          ! grep -Fq 'DirectBridgeTransport.uploadLast(this)' app/src/main/java/com/rm11/autocore/MainActivity.java
          test -s app/src/main/java/com/rm11/autocore/bridge/DirectBridgeTransport.java
          grep -Fq 'DirectBridgeTransport.pairingFingerprint' app/src/main/java/com/rm11/autocore/MainActivity.java
          grep -Fq 'DirectBridgeTransport.uploadLast' app/src/main/java/com/rm11/autocore/MainActivity.java
      - name: Download existing signed v2.5.6 Wine payload
        uses: actions/download-artifact@v4
        with:
          name: RM11-v2.5.6-Wine-NLS-Redirect-SIGNED-APK
          run-id: 39833178767
          repository: RM11Cor/RM11-WinCore
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior-apk
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36, NDK and shaders
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools unzip
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify prior APK and restore pinned Wine runtime
        run: |
          set -euo pipefail
          PREVIOUS_APK="$(find prior-apk -name '*.apk' -type f -print -quit)"
          test -s "$PREVIOUS_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$PREVIOUS_APK" > prior-certs.txt
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' prior-certs.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PREVIOUS_APK" | grep -Fq "versionCode='31' versionName='2.5.6-nls-redirect'"
          python3 - "$PREVIOUS_APK" <<'PY'
          import hashlib,sys
          from pathlib import Path
          from zipfile import ZipFile
          expected=[
            'assets/runtime/rm11-wine-stack.zip',
            'assets/runtime/rm11-prefix-prepared.zip',
            'assets/rm11-win32-smoke-v2420.exe',
            'lib/arm64-v8a/libwineprobe.so',
            'lib/arm64-v8a/libwine_ntdll.so',
            'lib/arm64-v8a/libwineserverrm11.so',
          ]
          with ZipFile(sys.argv[1]) as archive:
            for entry in expected:
              assert archive.getinfo(entry).file_size>1000,entry
              dst=(Path('app/src/main/assets')/entry.removeprefix('assets/')) if entry.startswith('assets/') else (Path('app/src/main/jniLibs')/entry.removeprefix('lib/'))
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(archive.read(entry))
            assert archive.getinfo('lib/arm64-v8a/librm11_wine_data_redirect.so').file_size>1000
          assert hashlib.sha256(Path('app/src/main/assets/rm11-win32-smoke-v2420.exe').read_bytes()).hexdigest()=='3bbe50165aa735bc54b5e647861cf192ed603468fea89024f563de9be6547fe9'
          print('PASS: pinned signed runtime restored')
          PY
      - name: Validate actual shipped system.reg uses escaped Wine key hierarchy
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_APK="$(find prior-apk -name '*.apk' -type f -print -quit)"
          python3 - "$PREVIOUS_APK" <<'PY'
          import io,sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as apk:
            prefix=apk.read('assets/runtime/rm11-prefix-prepared.zip')
          with ZipFile(io.BytesIO(prefix)) as prefixzip:
            actual=prefixzip.read('system.reg')
          assert actual.startswith(b'WINE REGISTRY Version 2\n')
          assert b';; All keys relative to REGISTRY\\\\Machine' in actual[:120]
          assert b'[Software\\\\' in actual[:1024]
          assert b'[Hardware\\\\Description\\\\System\\\\CentralProcessor\\\\0]' not in actual
          print('PASS: genuine bundled system.reg stores two backslashes per key separator')
          PY
      - name: Verify read-only PE DLL redirect on Linux (CI preflight)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rm11-native" "$RUNNER_TEMP/rm11-pe"
          printf 'RM11_TEST_PE_DLL_CONTENT' > "$RUNNER_TEMP/rm11-pe/ntdll.dll"
          cc -shared -fPIC -O2 -Wall -Wextra -Werror \
            app/src/main/cpp/wine_data_redirect.c -o "$RUNNER_TEMP/librm11_wine_data_redirect_ci.so"
          cat > "$RUNNER_TEMP/check-pe.c" <<'CTEST'
          #include <fcntl.h>
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <string.h>
          int main(int argc,char **argv) {
            if(argc!=2) return 9;
            struct stat info;
            if(access(argv[1],R_OK)!=0 || stat(argv[1],&info)!=0 || info.st_size!=24) return 10;
            int fd=open(argv[1],O_RDONLY);
            if(fd<0) return 11;
            char b[64]={0}; int n=read(fd,b,sizeof b); close(fd);
            if(n!=24 || memcmp(b,"RM11_TEST_PE_DLL_CONTENT",24)) return 12;
            puts("RM11_PE_DLL_READ_ONLY_REDIRECT_TEST_PASS");
            return 0;
          }
          CTEST
          cc -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/check-pe.c" -o "$RUNNER_TEMP/check-pe"
          RM11_APK_NATIVE_LIB_DIR="$RUNNER_TEMP/rm11-native" \
          RM11_WINE_PE_DIR="$RUNNER_TEMP/rm11-pe" \
          LD_PRELOAD="$RUNNER_TEMP/librm11_wine_data_redirect_ci.so" \
          "$RUNNER_TEMP/check-pe" "$RUNNER_TEMP/rm11-native/aarch64-windows/ntdll.dll"
          test ! -e "$RUNNER_TEMP/rm11-native/aarch64-windows/ntdll.dll"
          test "$(cat "$RUNNER_TEMP/rm11-pe/ntdll.dll")" = 'RM11_TEST_PE_DLL_CONTENT'
      - name: Test opt-in exact Wine child execv redirect and isolation on Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rm11-child-native" "$RUNNER_TEMP/rm11-unrelated"
          cc -shared -fPIC -O2 -Wall -Wextra -Werror \
            app/src/main/cpp/wine_data_redirect.c \
            -o "$RUNNER_TEMP/librm11-child-preload-test.so"
          cat > "$RUNNER_TEMP/native-entry.c" <<'CENTRY'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          int main(int argc, char **argv) {
            if(argc!=2 || strcmp(argv[1],"--child-test")) return 43;
            const char* flag=getenv("WINELOADERNOEXEC");
            if(!flag || strcmp(flag,"1")) return 44;
            puts("RM11_CHILD_NATIVE_ENTRY_EXECUTED");
            return 42;
          }
          CENTRY
          cc -fPIE -pie -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/native-entry.c" \
            -o "$RUNNER_TEMP/rm11-child-native/libwineprobe.so"
          chmod 755 "$RUNNER_TEMP/rm11-child-native/libwineprobe.so"
          cat > "$RUNNER_TEMP/child-check.c" <<'CTEST'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <unistd.h>
          int main(int argc, char **argv) {
            if (argc!=4) return 51;
            pid_t pid=fork();
            if(pid<0) return 52;
            if(!pid) {
              char* args[]={argv[2],argv[3],NULL};
              execv(argv[2],args);
              _exit(errno==ENOENT?77:78);
            }
            int status=0;
            if(waitpid(pid,&status,0)!=pid || !WIFEXITED(status))return 53;
            int got=WEXITSTATUS(status);
            int expected=atoi(argv[1]);
            if(got!=expected) {
              fprintf(stderr,"RM11_CHILD_TEST_FAILED expected=%d actual=%d\n",expected,got);
              return 54;
            }
            return 0;
          }
          CTEST
          cc -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/child-check.c" -o "$RUNNER_TEMP/child-check"
          export RM11_APK_NATIVE_LIB_DIR="$RUNNER_TEMP/rm11-child-native"
          export LD_PRELOAD="$RUNNER_TEMP/librm11-child-preload-test.so"
          export RM11_CHILD_LOADER_BRIDGE=1
          "$RUNNER_TEMP/child-check" 42 "$RUNNER_TEMP/rm11-child-native/wine" --child-test \
            > "$RUNNER_TEMP/child-positive.log" 2>&1
          grep -Fq 'RM11_CHILD_LOADER_REEXEC_ACTIVE' "$RUNNER_TEMP/child-positive.log"
          grep -Fq 'RM11_CHILD_NATIVE_ENTRY_EXECUTED' "$RUNNER_TEMP/child-positive.log"
          "$RUNNER_TEMP/child-check" 77 "$RUNNER_TEMP/rm11-unrelated/wine" --child-test
          "$RUNNER_TEMP/child-check" 77 "$RUNNER_TEMP/rm11-child-native/other-program" --child-test
          "$RUNNER_TEMP/child-check" 0 /bin/true --child-test
          unset RM11_CHILD_LOADER_BRIDGE
          "$RUNNER_TEMP/child-check" 77 "$RUNNER_TEMP/rm11-child-native/wine" --child-test
          echo 'PASS: opt-in Wine-only child execv redirection, denied unexpected paths, and baseline unchanged'
      - name: Build FEX-2609 Bionic native UnixLib companions
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "RM11_UNIXLIB_BUILD_FAILED line=$LINENO code=$?"' ERR
          echo 'RM11: fetch pinned FEX-2609 source'
          FEX_SHA='395b132f346b1a45def246d10c52245edba1ef02'
          git clone --depth 1 --branch FEX-2609 https://github.com/FEX-Emu/FEX.git "$RUNNER_TEMP/fex-2609"
          echo "RM11: source checked out at $(git -C "$RUNNER_TEMP/fex-2609" rev-parse HEAD)"
          test "$(git -C "$RUNNER_TEMP/fex-2609" rev-parse HEAD)" = "$FEX_SHA"
          SRC="$RUNNER_TEMP/fex-2609/Source/Windows/UnixLib"
          test -s "$SRC/FEXUnixLib.cpp"
          test -s "$SRC/FEXUnixLib.h"
          echo "RM11: upstream FEX UnixLib source verified"
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$BIN/aarch64-linux-android29-clang++"
          READELF="$BIN/llvm-readelf"
          test -x "$CXX"
          test -x "$READELF"
          echo "RM11: NDK CXX and READELF executables verified"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/runtime
          echo "RM11: starting native ARM64 Bionic UnixLib compilation"
          for kind in arm64ec wow64; do
            echo "RM11: build $kind UnixLib"
            OUT="app/src/main/jniLibs/arm64-v8a/lib$kind""fex.so"
            "$CXX" -shared -fPIC -O2 -std=c++20 -fno-exceptions -fno-rtti \
              -D_GNU_SOURCE -Dshm_open=rm11_fex_shm_open -Dshm_unlink=rm11_fex_shm_unlink \
              -include "$PWD/app/src/main/cpp/fex_bionic_shm_compat.h" \
              -static-libstdc++ -Wl,--no-undefined -Wl,-z,relro -Wl,-z,now \
              -Wl,-z,max-page-size=16384 \
              "$SRC/FEXUnixLib.cpp" app/src/main/cpp/fex_bionic_shm_compat.cpp -o "$OUT"
            test "$(stat -c %s "$OUT")" -gt 6000
            "$READELF" -h "$OUT" | grep -Eq 'Machine:.*AArch64'
            # Avoid grep -q SIGPIPE (llvm-readelf may exit 74 if reader closes early).
            "$READELF" --dyn-syms "$OUT" > "$RUNNER_TEMP/$kind-symbols.txt"
            grep -Fq '__wine_unix_call_funcs' "$RUNNER_TEMP/$kind-symbols.txt"
            echo "RM11: validated Wine unix-call export in $kind"
            "$READELF" -d "$OUT" | grep NEEDED > "$RUNNER_TEMP/$kind-needed.txt"
            cat "$RUNNER_TEMP/$kind-needed.txt"
            ! grep -E 'libc.so.6|libstdc\+\+.so.6' "$RUNNER_TEMP/$kind-needed.txt"
            sha256sum "$OUT"
          done
          printf 'FEX upstream FEX-2609 SHA %s\nBuilt with Android NDK 27.2.12479018 Bionic ARM64 API29\nProcess-local memfd compatibility for optional FEX stats only\nBoth UnixLib shared objects live in signed APK native library directory\n' "$FEX_SHA" > app/src/main/assets/runtime/rm11-fex-unixlib-provenance.txt
      - name: Compile isolated measured ARM64 CPU registry probe for signed APK
        shell: bash
        run: |
          set -euo pipefail
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$BIN/aarch64-linux-android29-clang"
          READELF="$BIN/llvm-readelf"
          test -x "$CC"
          test -x "$READELF"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$CC" -O2 -std=c11 -fPIE -pie -Wall -Wextra -Werror \
            -Wl,-z,max-page-size=16384 -Wl,-z,relro -Wl,-z,now \
            app/src/main/cpp/rm11_arm64_cpu_probe.c \
            -o app/src/main/jniLibs/arm64-v8a/librm11cpuprobe.so
          "$READELF" -h app/src/main/jniLibs/arm64-v8a/librm11cpuprobe.so \
            > "$RUNNER_TEMP/rm11-cpu-probe-elf-header.txt"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/rm11-cpu-probe-elf-header.txt"
          grep -Eq 'Type:.*DYN' "$RUNNER_TEMP/rm11-cpu-probe-elf-header.txt"
          test "$(stat -c %s app/src/main/jniLibs/arm64-v8a/librm11cpuprobe.so)" -gt 5000
          echo 'PASS: HWCAP-gated kernel-sanitized ARM64 ID register probe packed as app native executable'
      - name: Set versionCode 43 and run tests
        run: |
          set -euo pipefail
          python3 tools/compile_shaders.py
          python3 scripts-check.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          assert s.count('versionCode 31')==1
          assert s.count("versionName '2.5.6-nls-redirect'")==1
          p.write_text(s.replace('versionCode 31','versionCode 43',1).replace("versionName '2.5.6-nls-redirect'","versionName '2.6.8-native-child-reexec'",1))
          PY
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build APK using existing release signing identity
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RM11_RELEASE_KEYSTORE_B64"
          test -n "$RM11_RELEASE_PASSWORD"
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" -alias rm11-autocore >/dev/null
          export RM11_RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK signature and preserve Wine libraries
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > new-certs.txt
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' new-certs.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='com.rm11.autocore' versionCode='43' versionName='2.6.8-native-child-reexec'"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          files={
            'assets/runtime/rm11-wine-stack.zip':'app/src/main/assets/runtime/rm11-wine-stack.zip',
            'assets/runtime/rm11-prefix-prepared.zip':'app/src/main/assets/runtime/rm11-prefix-prepared.zip',
            'lib/arm64-v8a/libwineprobe.so':'app/src/main/jniLibs/arm64-v8a/libwineprobe.so',
            'lib/arm64-v8a/libwine_ntdll.so':'app/src/main/jniLibs/arm64-v8a/libwine_ntdll.so',
            'lib/arm64-v8a/libwineserverrm11.so':'app/src/main/jniLibs/arm64-v8a/libwineserverrm11.so',
          }
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as a:
            assert a.getinfo('classes.dex').file_size>1000
            assert a.getinfo('lib/arm64-v8a/librm11_wine_data_redirect.so').file_size>1000
            assert a.getinfo('lib/arm64-v8a/librm11cpuprobe.so').file_size>5000
            for companion in ('libarm64ecfex.so','libwow64fex.so'):
              archive_path='lib/arm64-v8a/'+companion
              assert a.getinfo(archive_path).file_size>6000,archive_path
              assert a.read(archive_path)[:4]==bytes((127,69,76,70)),archive_path
            assert a.getinfo('assets/runtime/rm11-fex-unixlib-provenance.txt').file_size>70
            for entry,src in files.items():
              assert hashlib.sha256(a.read(entry)).digest()==hashlib.sha256(Path(src).read_bytes()).digest(),entry
          print('PASS: signed diagnostic APK, Wine assets preserved')
          PY
