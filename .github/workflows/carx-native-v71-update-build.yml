name: CarX Native v7.1 SAME KEY Update Proof Build (NOT GAME)
on:
  push:
    branches:
      - carx-native-v7-updates
    paths:
      - '.github/workflows/carx-native-v71-update-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated proof branch
        uses: actions/checkout@v4
      - name: Extract native app source, without any full game binaries
        run: |
          set -euo pipefail
          tar -tzf CarX_v6_CI_source_without_reference.tar.gz | head -40
          tar -xzf CarX_v6_CI_source_without_reference.tar.gz
          test -e app/src/main/cpp/carx_prefix_a.S
          test -e app/src/main/cpp/vulkan_gpu_probe.c
          test -e app/src/main/cpp/vulkan_surface_frame.c
          test -e app/src/main/cpp/unityfs_directory.c
          test -e tests/test_unityfs_native.py
          grep -q 'nativeRenderVulkanSurface' app/src/main/java/com/carx/nativefoundation/MainActivity.java
          grep -q 'nativeInspectBundleFd' app/src/main/java/com/carx/nativefoundation/MainActivity.java
      - name: Set persistent update-track application ID and versionCode
        run: |
          set -euo pipefail
          sed -i "s/applicationId 'com.carx.nativefoundation.test'/applicationId 'com.carx.nativefoundation.test.updates'/" app/build.gradle
          sed -i "s/versionCode 6/versionCode 701/" app/build.gradle
          sed -i "s/versionName '0.6-unityfs-directory-gate'/versionName '0.7.1-update-proof'/" app/build.gradle
          sed -i "s/CarX Native Foundation v6 TEST/CarX Native Foundation v7.1 UPDATE TEST/" app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.carx.nativefoundation.test.updates'" app/build.gradle
          grep -q "versionCode 701" app/build.gradle
          grep -q "versionName '0.7.1-update-proof'" app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Discover or provision official Android SDK commandline tools
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_HOME/cmdline-tools"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No preinstalled sdkmanager; installing official Android command line tools"
            mkdir -p /tmp/carx-android-cmdtools
            curl -fLsS --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o /tmp/carx-android-commandlinetools.zip
            unzip -q /tmp/carx-android-commandlinetools.zip -d /tmp/carx-android-cmdtools
            mv /tmp/carx-android-cmdtools/cmdline-tools "$SDK_HOME/cmdline-tools/carx-tools"
            SDKMANAGER="$SDK_HOME/cmdline-tools/carx-tools/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate native x86 reference from original CarX instruction prefixes
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          clang -O1 -std=c11 -Wall -Wextra -Werror -fPIE -pie \
            tests/source_fixture/generate_reference_x86.c \
            tests/source_fixture/original_prefixes_x86.S \
            -o /tmp/carx-x86-source-reference
          /tmp/carx-x86-source-reference > app/src/main/assets/x86_reference_v2100.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('app/src/main/assets/x86_reference_v2100.txt').read_bytes()
          assert len(b.splitlines())==1025
          sha=hashlib.sha256(b).hexdigest()
          p=Path('app/src/main/java/com/carx/nativefoundation/MainActivity.java')
          old='7d4eb4eb338d4fe3d7d5a29146b4dd248bb893b42a33b4a7461f9fdf0b6125ad'
          assert old in p.read_text()
          p.write_text(p.read_text().replace(old,sha))
          Path('REFERENCE_SHA256').write_text(sha+'\n')
          PY
          export CARX_REFERENCE_SHA="$(cat REFERENCE_SHA256)"
          bash run_host.sh
      - name: Assemble native Android proof APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK ARM64 library and absence of emulator/runtime files
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | tee /tmp/carx-apk-list.txt
          grep -q 'lib/arm64-v8a/libcarx_native.so' /tmp/carx-apk-list.txt
          ! grep -Eiq 'UnityPlayer.dll|GameAssembly.dll|wine|fexcore|qemu' /tmp/carx-apk-list.txt
          unzip -p "$apk" lib/arm64-v8a/libcarx_native.so > /tmp/carx-v5-libcarx-native.so
          file /tmp/carx-v5-libcarx-native.so
          readelf -h /tmp/carx-v5-libcarx-native.so | grep -q 'AArch64'
          readelf -Ws /tmp/carx-v5-libcarx-native.so | grep -q 'vkQueuePresentKHR'
          readelf -Ws /tmp/carx-v5-libcarx-native.so | grep -q 'vkCreateAndroidSurfaceKHR'
          readelf -Ws /tmp/carx-v5-libcarx-native.so | grep -q 'Java_com_carx_nativefoundation_MainActivity_nativeInspectBundleFd'
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/carx-v7-badging.txt
          grep -q "name='com.carx.nativefoundation.test.updates' versionCode='700'" /tmp/carx-v7-badging.txt
          sha256sum "$apk" > app-debug.apk.sha256
      - name: Upload DEBUG-signed build for PRIVATE re-signing (DO NOT DISTRIBUTE)
        uses: actions/upload-artifact@v4
        with:
          name: CarX-NativeFoundation-v71-REQUIRES-PRIVATE-RESIGN
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            REFERENCE_SHA256
          if-no-files-found: error
