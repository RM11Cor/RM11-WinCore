name: Build CarX MeshDoctor v16.4 APK
on:
  push:
    branches:
      - carx-native-apk-v16-4
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated CarX branch
        uses: actions/checkout@v4
      - name: Reconstruct verified v16.3 base and v16.4 delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/carx_android
          cat carx/v16-3.part{1,2,3,4}.b64 | base64 -d > /tmp/carx-v163.tar.xz
          tar -xJf /tmp/carx-v163.tar.xz -C /tmp/carx_android
          cat carx/v16-4.part{1,2,3}.b64 | base64 -d > /tmp/carx-v164-delta.tar.xz
          echo "0a895adc211b3e1c2172c40295aaf61f9a2668b48b7dba3c0858566516a1eed7  /tmp/carx-v164-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carx-v164-delta.tar.xz -C /tmp/carx_android
          test -s /tmp/carx_android/app/src/main/cpp/unityfs_header.cpp
      - name: Test UnityFS parser with address sanitizer
        working-directory: /tmp/carx_android/app/src/main/cpp
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer unityfs_header.cpp unityfs_header_host_test.cpp -o /tmp/unityfs-header-tests
          /tmp/unityfs-header-tests
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile Android ARM64 diagnostic APK
        working-directory: /tmp/carx_android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check manifest and ARM64 native library
        shell: bash
        run: |
          APK=/tmp/carx_android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcarx_meshdoctor_jni.so"
          sha256sum "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarX-MeshDoctor-v16.4-ARM64-APK
          path: /tmp/carx_android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
