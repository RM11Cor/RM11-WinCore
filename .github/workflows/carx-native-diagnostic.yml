name: Build CarX MeshDoctor v16.3 APK
on:
  push:
    branches:
      - carx-native-apk-v16-3
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated CarX branch
        uses: actions/checkout@v4
      - name: Reconstruct source archive and verify checksum
        shell: bash
        run: |
          mkdir -p /tmp/carx_android
          cat carx/v16-3.part1.b64 carx/v16-3.part2.b64 carx/v16-3.part3.b64 carx/v16-3.part4.b64 | base64 -d > /tmp/carx-source.tar.xz
          sha256sum /tmp/carx-source.tar.xz
          tar -xJf /tmp/carx-source.tar.xz -C /tmp/carx_android
          test -s /tmp/carx_android/app/src/main/cpp/meshdoctor.cpp
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile signed ARM64 diagnostic APK
        working-directory: /tmp/carx_android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect APK
        shell: bash
        run: |
          APK=/tmp/carx_android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcarx_meshdoctor_jni.so"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarX-MeshDoctor-v16.3-ARM64-APK
          path: /tmp/carx_android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
