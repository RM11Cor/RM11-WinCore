name: KERNIX G0 SHA-locked GNU DT_RELA30 source symbol discovery after independently certified 92
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_dt_rela30_source_type_and_writer_plan_after_92.py'
      - '.github/workflows/kernix-g0-original-dt-rela30-source-discovery-after-ledger92.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-only-original-gnu-rela30-after-92-certified:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require completed independently certified 92 original GNU targets from genuine hardware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43045395446 --jq .status)" = completed
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43045395446 --jq .conclusion)" = success
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43042294578 --jq .conclusion)" = success
          echo KERNIX_G0_SOURCE30_PRIOR92_REAL_NATIVE_INDEPENDENT_RECEIPTS_READY
      - name: Download immutable original x86 GNU ELF libc/ldso triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download exact 147 GNU source ledger after 92 independently certified FEX native writers
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43045395446
          name: KERNIX-G0-Original-147-Source-Cohorts-92-Prior-Native-Writers-55-Pending
          github-token: ${{ github.token }}
          path: inputs/prior92
      - name: Discover exact original source DT_RELA30 symbol type, original target and optional GDB plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_dt_rela30_source_type_and_writer_plan_after_92.py
          python3 native-engine/tools/kernix_g0_original_dt_rela30_source_type_and_writer_plan_after_92.py \
            inputs/triad/original-guest \
            inputs/prior92/original-libc-147-source-batch-native-proof-ledger92-NO-NEW-HW-RUN.json \
            . dist
          python3 - <<'PY'
          import json
          from pathlib import Path
          stem="original-libc-DT-RELA30-exact-source-type-symbol-writer-plan-NO-NATIVE-PROOF"
          d=json.loads((Path('dist')/(stem+'.json')).read_text())
          gdb=(Path('dist')/(stem+'.gdb')).read_text()
          assert d['schema']=='kernix.g0.original-gnu-dt-rela30-source-and-symbol-after-certified92.v1'
          assert d['original_source_index']==30
          assert d['original_table']=='DT_RELA' and d['original_table_ordinal']==30
          assert d['original_relocation_type'] in ('R_X86_64_GLOB_DAT','R_X86_64_TPOFF64','R_X86_64_64')
          assert d['original_source_signed_addend']==0 and d['original_source_initial_qword']=='0x0'
          assert d['original_symbol']['symbol_index']>0 and d['original_symbol']['symbol_name']
          assert d['original_symbol']['runtime_symbol_lookup_or_versioned_preemption_proven'] is False
          assert d['prior_independently_certified_native_writer_target_count']==92
          assert d['remaining_requires_native_hardware_proof']==55
          assert d['source_only_not_in_prior_certified_target_list'] is True
          assert d['new_native_writer_target_evidence_from_this_source_discovery']==0
          assert d['source_only_no_native_writer_proven'] is True
          assert d['full_dynamic_symbol_preemption_and_versioning_proven'] is False
          assert d['all_147_same_guest_native_execution_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          assert gdb.count('watch -location *(unsigned long long *)'+d['original_guest_target'])==1
          assert gdb.count('KERNIX_G0_ORIGINAL_RELA30_SOURCE_ARM')==1
          assert gdb.count('KERNIX_G0_ORIGINAL_RELA30_RAW_HIT')==1
          print('KERNIX_G0_SOURCE30_ORIGINAL_TYPE_SYMBOL_DECODED_AFTER_CERTIFIED_92_NO_NATIVE_ATTESTATIONS')
          PY
      - name: Archive SHA-pinned original GNU DT_RELA30 dynamic symbol source proof and non-native GDB watch plan
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-DTRELA30-GNU-Source-Type-And-Symbol-Plan-Prior92-NO-Native-Proof
          path: |
            dist/original-libc-DT-RELA30-exact-source-type-symbol-writer-plan-NO-NATIVE-PROOF.json
            dist/original-libc-DT-RELA30-exact-source-type-symbol-writer-plan-NO-NATIVE-PROOF.gdb
          retention-days: 30
          if-no-files-found: error
