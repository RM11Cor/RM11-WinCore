name: Publish FH5 Native Port P3.9 - Forwarded AMD AGS Export Targets
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - .github/workflows/fh5-port-p39-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify permanent signed P3.9 Android APK from tested CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 43205109998 --repo "$GITHUB_REPOSITORY" \
            --name FH5-Native-Port-P3.9-PERMANENT-SIGNED-arm64 --dir dist
          test -s dist/app-release.apk
          printf '%s  %s\n' '37a9653c683c6059bb0169bfdae6ddfc98d903be6b06f623bdf00f94dc5a08ce' 'dist/app-release.apk' | sha256sum -c -
          mv dist/app-release.apk dist/FH5-Native-Port-P3.9-Permanent-Signed.apk
      - name: Publish P3.9 read-only forwarder metadata diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='fh5-native-port-p3-9-amd-ags-forwarders-2026-11-12'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'P3.9 already published'; exit 0
          fi
          cat > notes.md <<'EOF'
          # FH5 Native Port P3.9 — Offline AMD AGS Forwarded Export Targets

          **Experimental Android ARM64 read-only diagnostic APK — NOT playable Forza Horizon 5.**

          ## Verified P3.8 real-device result
          - Original extracted `ForzaHorizon5.exe`: 47 statically imported DLLs
            and six immediate sibling DLLs, with **95 import requests**.
          - **93 direct export matches, 2 forwarded export matches, 0 missing**.
          - Both forwarded matches originate from `amd_ags_x64.dll`, which
            has 38 forwarded exports in its 39-function Export Address Table.
          - P3.8 confirmed export-table references only. Neither Windows
            process startup nor x64 game code has been executed.

          ## New P3.9 test
          - Button `تحديد وجهة تحويلات AMD AGS من ملفات DLL`.
          - Determines exactly which imports are marked as forwarded,
            reads corresponding forwarder strings from the actual local DLL
            export table, and parses the target module plus function/ordinal.
          - Reports whether an *identically named target DLL file* is present
            next to the EXE, using the user's read-only Android SAF tree grant.
          - Handles malformed/unavailable forwarder strings explicitly,
            keeps export-directory boundaries and a 512-byte string limit,
            and scans at most 16 requested forwarders.
          - Native-source PE parser/JVM tests check name and ordinal
            forwarders, malformed syntax, unsafe paths, no NUL termination
            and resource budgets.
          - No target DLL loaded, no forwarded chain followed or executed,
            no IAT modified, no Windows API availability implied.
          - Report: `FH5_PORT_P3_9_REPORT.json`.

          ## Install and inspect
          - App ID `com.fh5.port`, versionCode **22** (P3.8 was 21).
          - Permanent signing certificate SHA256 remains:
            `4c5fb057ca8775bede11e95ab53b748b46f823d6ba1f89b7dd174a2a6f7f1bf6`.
          - APK SHA256: `37a9653c683c6059bb0169bfdae6ddfc98d903be6b06f623bdf00f94dc5a08ce`.
          - Install directly over P3.8, without uninstalling.
          - Press `تحديد وجهة تحويلات AMD AGS من ملفات DLL`, then
            export `FH5_PORT_P3_9_REPORT.json` and upload the JSON only.

          Build, Java unit tests, native tests, ABI, signature, version
          and original game file exclusion verified:
          https://github.com/RM11Cor/RM11-WinCore/actions/runs/43205109998
          EOF
          gh release create "$tag" dist/FH5-Native-Port-P3.9-Permanent-Signed.apk \
            --target fh5-android-auto-tests \
            --title 'FH5 Native Port P3.9 - AMD AGS Forwarder Targets (Experimental)' \
            --notes-file notes.md --prerelease
