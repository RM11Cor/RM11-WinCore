          # watchpoint. Compute a load-bias-independent symbol offset.
          mapped=re.search(
              r'KERNIX_G0_REAL_ORIGINAL_GNU_LDSO_LIBC_MMAP9_LARGE_PRIVATE_RO_SOURCE_'
              r'\d+_REQUEST_0x[0-9a-f]+_FD100_OFFSET0_WX_SAFE_EOF_GUARD_PASS '
              r'guest_base=([0-9a-fA-F]+)',log)
          assert mapped is not None,'Original guest libc mapping not attested'
          libc_base=int(mapped.group(1),16)
          assert libc_base==0x804000000 and libc_base<live
          actual_offset=live-libc_base
          assert 0<actual_offset<len(libc_bytes)
          # Independently decode the *source* main relocation's required
          # version and libc's exported DEFAULT version with binutils,
          # rather than trusting a name-only GOT pointer.
          main_reloc=subprocess.run(
              ['readelf','-W','-r',str(main)],capture_output=True,
              text=True,check=True,timeout=12).stdout
          reloc_lines=[row for row in main_reloc.splitlines()
                       if 'R_X86_64_GLOB_DAT' in row
                       and '__libc_start_main@' in row]
          assert len(reloc_lines)==1,reloc_lines
          fields=reloc_lines[0].split()
          assert int(fields[0],16)==0x3fd8
