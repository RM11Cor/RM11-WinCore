              original_libc_export_symbol='__libc_start_main@@GLIBC_2.34',
              original_libc_export_st_value=hex(sym_va),
              original_guest_libc_source_load_bias=hex(libc_base),
              witnessed_symbol_pointer_offset=hex(actual_offset),
              original_libc_source_rx_file_offset=hex(executable[0]),
              original_libc_source_instruction_8bytes=code_bytes.hex(),
              strong_GLOB_DAT_symbol_version_and_pointer_source_verified=verified,
              exact_original_guest_writer_RIP_proven=False,
              original_main_all_relocations_proven=False,
              original_main_RELRO_sealed=False)
          Path('dist/original-main-globdat-libc-symbol-proof.json').write_text(
              json.dumps(result,indent=2)+'\n')
