          set output-radix 16
          handle SIGBUS nostop noprint pass
          break native-engine/android-host/tests/kernix_g0_original_fex_full_ptload_source_executable_range_arm64.cpp:5151
          commands
          silent
          printf "KERNIX_G0_STRONG_GLOB_WATCH_ARMED_BEFORE_FEX target={target} source_old=0x0 symbol={chosen['name']}\\n"
          x/gx {target}
          watch -location *(unsigned long long *){target}
          continue
          end
          run
          printf "KERNIX_G0_STRONG_GLOB_NATIVE_WATCH_HIT_DIAGNOSTIC_ONLY_NOT_RESOLVED_SYMBOL\\n"
          info registers pc x4 x13 x7 x10 x28
          x/12i $pc-32
          # Read-only active FEX JIT block source witness: no debugger
          # memory writes, no guest-code execution and no guest RIP claim.
          set $jit_h = *(unsigned long long *)$x28
          if $jit_h != 0
            set $jit_off = *(unsigned int *)$jit_h
            set $jit_t = $jit_h + $jit_off
            set $jit_len = *(unsigned long long *)$jit_t
            set $jit_guest = *(unsigned long long *)($jit_t + 8)
            set $jit_guest_len = *(unsigned long long *)($jit_t + 16)
            set $jit_rip_count = *(unsigned int *)($jit_t + 24)
