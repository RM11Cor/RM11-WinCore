                +' pointer='+hex(live)+' symbol_va='+hex(sym_va)
                +' version=GLIBC_2.34')
          print('KERNIX_G0_ORIGINAL_MAIN_STRONG_GLOB_DAT_SOURCE_VERSION_FIVE_NEGATIVES_PASS')
          print('KERNIX_G0_MAIN_RELRO_CLOSURE_REMAINS_UNPROVEN_NO_GUEST_RIP')
