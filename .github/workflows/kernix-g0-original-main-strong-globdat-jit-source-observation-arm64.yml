          assert imports==['__libc_start_main@GLIBC_2.34'],imports
          libc_sym=subprocess.run(
              ['readelf','-W','--dyn-syms',str(libc)],capture_output=True,
              text=True,check=True,timeout=12).stdout
          export_pattern=re.compile(
              r'(?m)^\s*\d+:\s+([0-9a-fA-F]+)\s+(\d+)\s+'
              r'FUNC\s+GLOBAL\s+DEFAULT\s+(\S+)\s+'
              r'__libc_start_main@@GLIBC_2\.34\s*$')
          exports=list(export_pattern.finditer(libc_sym))
          assert len(exports)==1,'Expected single default GLIBC_2.34 export'
          sym_va=int(exports[0].group(1),16)
          sym_size=int(exports[0].group(2))
          assert exports[0].group(3)!='UND' and sym_size>0
          # Only accept a genuine original executable PT_LOAD range
          # containing the exported source address and source bytes.
          assert libc_bytes[:6]==bytes.fromhex('7f454c460201')
          assert struct.unpack_from('<H',libc_bytes,18)[0]==62
          phoff=struct.unpack_from('<Q',libc_bytes,32)[0]
          entsize,num=struct.unpack_from('<HH',libc_bytes,54)
          assert entsize==56 and 0<num<=64
          assert phoff+entsize*num<=len(libc_bytes)
          executable=[]
          for i in range(num):
              typ,flags,offset,va,_,file_size,mem_size,_=struct.unpack_from(
                  '<IIQQQQQQ',libc_bytes,phoff+i*entsize)
              if (typ==1 and flags&5==5 and flags&2==0
                  and va<=sym_va and sym_va-va+8<=file_size
                  and offset<=len(libc_bytes) and file_size<=len(libc_bytes)-offset):
                  executable.append(offset+sym_va-va)
          assert len(executable)==1,'Original libc symbol must belong to one RX PT_LOAD'
          code_bytes=libc_bytes[executable[0]:executable[0]+8]
          assert code_bytes!=bytes(8)
          def accepted(source_offset,observed_offset,symbol,version,source_rx):
              return (source_offset==observed_offset
                  and symbol=='__libc_start_main'
                  and version=='GLIBC_2.34'
                  and bool(source_rx))
          verified=accepted(sym_va,actual_offset,selection['symbol'],
                            imports[0].split('@',1)[1],executable)
          assert verified,'Live guest pointer != original versioned libc symbol'
          for fake in (
              (sym_va+1,actual_offset,selection['symbol'],'GLIBC_2.34',executable),
              (sym_va,actual_offset+8,selection['symbol'],'GLIBC_2.34',executable),
              (sym_va,actual_offset,'__libc_start_main_fake','GLIBC_2.34',executable),
              (sym_va,actual_offset,selection['symbol'],'GLIBC_2.2.5',executable),
              (sym_va,actual_offset,selection['symbol'],'GLIBC_2.34',[])):
