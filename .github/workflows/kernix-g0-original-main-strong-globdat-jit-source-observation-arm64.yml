              end=names.find(b'\0',st_name)
              assert end>st_name and end-st_name<=96
              name=names[st_name:end].decode('ascii')
              assert re.fullmatch(r'[A-Za-z_][A-Za-z0-9_@.]*',name)
              source_off=offset_for(r_offset,8)
              assert source_off is not None
              source_old=struct.unpack_from('<Q',b,source_off)[0]
              rows.append(dict(index=i,offset=r_offset,sym_index=sym_index,
                               binding=st_info>>4,type=st_info&15,
                               name=name,source_old=source_old))
          assert len(rows)==5 and sum(z['binding']==1 for z in rows)==1
          assert sum(z['binding']==2 for z in rows)==4
          chosen=[z for z in rows if z['binding']==1][0]
          assert 0x3000<=chosen['offset']<=0x3ff8
          assert chosen['source_old']==0
          assert chosen['offset']!=0x3db8 and chosen['offset']!=0x3dc0
          selected=dict(
              schema='kernix.g0.main-strong-globdat-source-target-only.v1',
              original_main_sha256=hashlib.sha256(b).hexdigest(),
              original_main_DT_RELA_globdat_count=5,
              weak_globdat_count=4,strong_globdat_count=1,
              original_main_rela_index=chosen['index'],
              symbol=chosen['name'],symbol_index=chosen['sym_index'],
              target='0x'+format(0x800000000+chosen['offset'],'x'),
              source_initial='0x0',original_elf_offset=hex(chosen['offset']),
              original_guest_writer_RIP_proven=False,
              original_symbol_resolution_correct_proven=False,
              original_main_RELRO_sealed=False)
          Path('dist/original-strong-main-globdat-selection.json').write_text(
              json.dumps(selected,indent=2)+'\n')
          # Create GDB instructions from SHA-attested source, no untrusted
          # external target parameter. $pc and ARM64 registers remain literal.
          target=selected['target']
          gdb=f"""set pagination off
