          from pathlib import Path
          main=Path('dist/original-source-pinned-root/bin/kernix-g2e-dynamic-guest')
          b=main.read_bytes()
          assert len(b)==15976
          assert hashlib.sha256(b).hexdigest()=='9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'
          assert b[:6]==bytes.fromhex('7f454c460201')
          assert struct.unpack_from('<H',b,18)[0]==62
          phoff=struct.unpack_from('<Q',b,32)[0]
          entsize,num=struct.unpack_from('<HH',b,54)
          assert entsize==56 and 0<num<=64 and phoff+num*entsize<=len(b)
          ph=[struct.unpack_from('<IIQQQQQQ',b,phoff+i*entsize) for i in range(num)]
          loads=[p for p in ph if p[0]==1]
          def offset_for(va,span):
              if va<0 or span<1:return None
              spans=[p[2]+va-p[3] for p in loads
                 if va>=p[3] and va-p[3]<=p[5] and span<=p[5]-(va-p[3])
                 and p[2]<=len(b) and p[5]<=len(b)-p[2]]
              return spans[0] if len(spans)==1 else None
          dyn=[p for p in ph if p[0]==2]
          assert len(dyn)==1 and dyn[0][2]+dyn[0][5]<=len(b)
          assert dyn[0][5]%16==0
          tags={}
          terminated=False
          for off in range(dyn[0][2],dyn[0][2]+dyn[0][5],16):
              tag,val=struct.unpack_from('<qQ',b,off)
              if tag==0:
                  terminated=True
                  break
              if tag in (5,6,7,8,9,10,11):
                  assert tag not in tags
                  tags[tag]=val
          assert terminated and all(k in tags for k in (5,6,7,8,9,10,11))
          assert tags[8]==192 and tags[9]==24 and tags[11]==24
          assert 0<tags[10]<=8192
          syms=tags[6];strings=tags[5];strsz=tags[10]
          stroff=offset_for(strings,strsz)
          relaoff=offset_for(tags[7],tags[8])
          assert stroff is not None and relaoff is not None
          names=b[stroff:stroff+strsz]
          rows=[]
          for i in range(tags[8]//24):
              r_offset,r_info,r_addend=struct.unpack_from('<QQq',b,relaoff+i*24)
              if (r_info&0xffffffff)!=6:continue  # R_X86_64_GLOB_DAT
              sym_index=r_info>>32
