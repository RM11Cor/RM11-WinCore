          gh release create "$TAG" KERNIX-v4.90.87.apk --target "$GITHUB_SHA" --prerelease --title "KERNIX v4.90.87 — Independent Wine Launcher Exit Reaping" --notes "v4.90.87: Device diagnostic shows native launcher PID Z at 12.8 seconds while Wine descendants remain. Reap launcher exit on a dedicated daemon waiter, independent of stdout EOF; preserve Wine child logs and emit separate launcher-exit and stream-EOF evidence. No game files or runtime binaries changed. This is a lifecycle fix, not proof of rendered game frames. v4.90.86: Witcher 3 DX12 diagnostic review found the native Wine launcher PID in zombie state (Z) and no game-owned X11 window proof, even while wineserver and some Wine clients persisted. Add sticky explicit zombie state to per-game runtime evidence (never claim Process.isAlive implies gameplay), do not kill healthy child processes, and export all live recorded session snapshots to game/kernix-live-sessions.json even while a game remains open. No changes to original game files, hardware drivers, Wine/FEX runtime or controller routing. v4.90.85 adds a session-token-protected read-only runtime evidence system, correlating original game EXE to Wine process lifecycle, X11 endpoint and root-window inventory, Vulkan error signs and exit codes. A root X11 child is not claimed to be the selected game or a visible Android frame; no game data, Wine prefix or signed binary changes. v4.90.84 adds private per-original-EXE launch-attempt status and source-specific failure reasons, distinguishes Android Activity handoff from actual game/GPU success, avoids misleading last-played UI claims, records the original library EXE identity even when compatibility chooses an alternate executable. Existing game files, Wine/FEX/X11/DXVK/VKD3D binaries and app ID remain unchanged. v4.90.83 corrects a false-positive CI gate for the game-readiness JSON bridge: other pre-existing methods correctly return escaped JSON string constants. RC51 compiled and passed core Java unit tests; only an overbroad textual assertion caused the run to fail. The new CI check is scoped to the gameReadiness method. No engine/game/controller/source modifications. v4.90.82 fixes a verified Java syntax error in the v4.90.81 game-readiness WebView bridge by using the typed serializer for absent/invalid game selections. The v4.90.81 source-folder and known asset checks stay non-destructive. No changes to game files, GPU route, Wine, controller, or APK package identity. v4.90.81 adds a read-only source-file and known adjacent asset health probe used consistently by game cards, details, prelaunch and diagnostics. Unity missing _Data and Witcher DX12 missing content show non-blocking warnings; only missing/unreadable executable or source folder prevents launching. No game files are copied, deleted or modified. The interface does not claim rendering success or actual Vulkan compatibility. Builds on KERNIX v4.90.80: forces the single new KERNIX home on upgraded devices even when legacy six-skin preferences were saved; adds a per-game Download ZIP diagnostic button directly in the selected game section, with validated library index, source-directory readability probe and no modification to game files. Keeps all native Wine/FEX/X11 and user data intact. v4.90.79: rebuilds the whole home experience under a new KERNIX identity, Android vector icon and functional offline native-backed game library UI; removes 400KB+ of bundled fake-game demo image and eliminates demonstration game entries. Provides real library only, selectable game cards, per-game actual launch, dedicated component manager preserving version availability safeguards, read-only engine inventory and general/game diagnostics. Preserves APK applicationId/signature, existing game library and profiles and actual Wine/FEX/X11/Winebus/DXVK/VKD3D binaries. Fixes v4.90.78 Download Java unit-test failure without changing the Android user Download path. Does not imply Vulkan game compatibility. v4.90.78 adds a general offline diagnostics entry under the main R4 settings menu, available without opening Wine, preserving the same per-game diagnostics action. On Android 10+ both exports now save unique ZIPs directly to the shared Download directory via pending MediaStore.Downloads, then open the device Downloads screen. This avoids the Android DocumentsUI recently-used game directory, does not touch game files and does not claim DX12/Vulkan game success. On legacy Android a SAF picker remains with a requested Downloads initial location. v4.90.77 moves the single Add Game EXE control from the active game card into the top options menu, keeping the game detail section dedicated to Play, Details, Components and Remove. Closes options menu when opening EXE picker. Enlarges panel for phone portrait. Retains the v4.90.76 primary-storage-root native file chooser, original game files and graphics paths unchanged. v4.90.76 replaces the remembered-last-directory Android game picker with one in-app EXE browser that starts at primary internal storage ROOT on EVERY tap when the user grants Android all-files access. Browse real directories and add EXEs to the library without copying game files. Explicit permission dialog and an Android DocumentsUI fallback only when access denied or browser unavailable. Shared canonical path is kept and read-only source-folder metadata is recorded. Does not claim the picker alone resolves Vulkan or DX12 and does not change Witcher v4.90.75 relative-layout fix or Silksong render paths. v4.90.75 corrects a concrete DX12 game path layout bug: the prior flat private VKD3D sidecar changed the Witcher 3 executable location and broke ../../content, ../../dlc and bin/config relative paths. The new per-game private sidecar mirrors root/bin/x64_dx12, links unchanged original assets, preserves the EXE hierarchy and sets the private EXE working directory. Fails closed for non-Witcher EXEs and logs zombie process state instead of treating wrapper alive as game proof. No original game files or Hollow Knight route modified. Rendering remains on-device UNVERIFIED. v4.90.74: captures real VKD3D-Proton/Wine/Win32 Vulkan device create/destroy errors, D3D12 DLL loads and first and latest critical logs from the game Wine process; includes independently persisted snapshots and runtime graphics configuration inside offline diagnostic ZIP even after journal events rotate or game launcher stalls. Recognizes VKD3D/Vulkan startup instead of reporting no Vulkan signal. No graphics behavior changes. Real DX12 game frames are not proven. v4.90.73 packages authentic SHA-256-pinned VKD3D-Proton 3.0.1 Win64 d3d12.dll and d3d12core.dll from upstream, plus original LGPL COPYING/LICENSE, verifies PE architecture and signed APK manifest, and provides a per-game app-private EXE+DXGI+VKD3D sidecar with software X11 WSI only if all DLLs and WSI files verify. Witcher 3 DX12 can be attempted by the automatic plan when bundled; original game files and Hollow Knight paths stay untouched. Real hardware Turnip Vulkan and actual DX12 frames remain UNVERIFIED, so game may still fail on device. No false claim of universal DX12. v4.90.72: one clear EXE import button in the home screen; removed the duplicate file explorer/import entries from home. Android Files chooser adds EXE directly to game library with visible toast feedback. Automatically resolves a discovered existing Witcher3 bin/x64 DX11 executable instead of a launcher or DX12 file, without altering game assets; clearly blocks DX12-only Remastered from falsely claiming VKD3D support. For classic Witcher DX11, automatic plan prefers bundled DXVK only when available, actual GPU rendering still unverified. Silksong unaffected. v4.90.71 introduces a real automatic per-game graphics planner for clear Direct3D 11 imports or Unity titles, opting into only the SHA-bundled DXVK and X11 software WSI when present; leaves DX12 titles without false VKD3D claims and explicitly reports unverified GPU. Fixes WineD3D renderer=vulkan inheritance that could contradict explicit per-game selection, preserves manual overrides, safely falls back to builtin WineD3D if automatic DXVK staging fails, but never silently overrides explicitly selected DXVK. No claim that real games render until on-device evidence. v4.90.70: fullscreen real per-game component settings panel with seven clearly visible buttons, expandable per-component version lists, explicit installed/uninstalled states and native allowlisted per-game persistence. Replaces tiny hidden Android popup workflow; no new Wine/VKD3D/Turnip versions were bundled. v4.90.69 adds manual per-game Wine/FEX/DXVK/VKD3D/Turnip/X11/EXE component and version selections with actual installed vs unavailable indicators. Removes CarX-only locks, forced DX11 flags, and game-name-specific graphics route from active launch. DXVK requires explicitly selecting X11 software WSI; unavailable selected versions and DXVK staging failures now fail closed instead of silently falling back. Historical/new versions not bundled yet appear disabled; no fake selectable binaries. No game data or Wine prefix changes. Hardware rendering remains unverified. v4.90.68: generic original EXE launch by default; optional app-private XInput sidecar per game; separate graphics modes and a read-only component inventory distinguishing packaged from tested. CarX original route is preserved. Original game files and Wine prefix untouched. VKD3D-Proton, hardware Turnip/Vulkan and on-device rendering are still unverified. Fixes v4.90.66: changing WineD3D or DXVK now merges D3D11/DXGI directives into existing WINEDLLOVERRIDES instead of replacing native XInput, DirectInput and other DLL settings. Adds Java regression tests and source gate. Maintains per-game profile options and CarX route. Adds per-EXE saved graphics profile settings from the live cinematic launcher: Auto, WineD3D, experimental DXVK, and a visible but blocked VKD3D-Proton option. The existing bundled Wine/FEX/X11 and Winebus HID remain shared. A separately SHA-attested bundled DXVK provider can be activated ONLY on explicit user opt-in for a non-CarX EXE, with a private per-game EXE+DLL sidecar and original assets symlinked read-only. Uses the existing signed X11 software WSI route; hardware Vulkan and actual rendering remain unverified, and may fail. A refused configuration safely falls back to the existing process. CarX graphics and controller route are preserved. No engine update or unsigned external binary download, no Wine prefix edits, no changes to users' game folders. VKD3D-Proton and hardware Turnip are not falsely presented as working until source-pinned installation and device evidence."
