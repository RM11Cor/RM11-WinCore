name: KERNIX G0 immutable GNU libc fstat5 guest RX opcode 0f05 SHA and 6 mutant rejection (source only)
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-original-libc-fstat5-stdout-x86-source-opcode-only.yml'
      - 'native-engine/ci/kernix_g0_original_libc_fstat5_source_rx_opcode_only.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pinned-original-x86-libc-fstat5-source-only-no-native-syscall:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: input/source
      - name: Authenticate exact source GNU libc fstat5 x86 syscall 0f05 under original RX PTLOAD no guest execution claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t libc < <(find input/source -type f -name libc.so.6)
          test "${#libc[@]}" -eq 1
          script=native-engine/ci/kernix_g0_original_libc_fstat5_source_rx_opcode_only.py
          python3 -m py_compile "$script"
          python3 "$script" selftest "${libc[0]}" >dist/real-original-libc-source-fstat5-x86-opcode.log
          grep -Fq KERNIX_G0_LIBC_FSTAT5_SOURCE_FORGED_06_REJECTED dist/real-original-libc-source-fstat5-x86-opcode.log
          grep -Fq KERNIX_G0_ORIGINAL_LIBC_FSTAT5_SOURCE_RX_SYSCALL_0F05_SHA_PINNED_ONLY_GUEST_RESULT_UNPROVEN dist/real-original-libc-source-fstat5-x86-opcode.log
          python3 - "${libc[0]}" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'native-engine/ci')
          from kernix_g0_original_libc_fstat5_source_rx_opcode_only import classify
          r=classify(Path(sys.argv[1]).read_bytes())
          assert r['original_guest_fstat5_source_RIP']=='0x804117249'
          assert r['original_x86_syscall_opcode']=='0f05'
          assert r['required_guest_Linux_x86_stat_struct_bytes']==144
          assert r['FEX_guest_fstat_completed_proven'] is False
          assert r['guest_owned_stack_stat144_write_proven'] is False
          assert r['android_16K_bionic_wine_proton_games_proven'] is False
          r['adversarial_libc_source_mutants_rejected']=6
          Path('dist/source-libc-fstat5-exact-rx-opcode.json').write_text(json.dumps(r,indent=2)+'\n')
          print('KERNIX_G0_ORIGINAL_LIBC_FSTAT5_GUEST_SOURCE_ONLY_PASSED_WAIT_REAL_FEX_NATIVE_RESULT')
          PY
          tail -n 55 dist/real-original-libc-source-fstat5-x86-opcode.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G0-Original-Libc-Fstat5-Source-RX-Only
          path: dist/
          retention-days: 30
          if-no-files-found: warn
