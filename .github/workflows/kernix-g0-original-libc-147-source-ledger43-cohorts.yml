name: KERNIX G0 original GNU 147 source relocation cohorts after independently certified 43 native writers
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_libc_147_batch_source_coverage_gate.py'
      - 'native-engine/tools/kernix_g0_original_libc_147_ledger43_after_four_native_batch.py'
      - '.github/workflows/kernix-g0-original-libc-147-source-ledger43-cohorts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-147-source-cohorts-with-independent-43-native-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download original immutable SHA256 Linux GNU x86 guest triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download independently closed original IFUNC124 one FEX guest CALL C3 RET native stack READ GNU writer
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42827886594
          name: KERNIX-G0-Original-IFUNC124-Dynamic-C3-RET-One-Guest-Native-HW-Read-GNU-Writer-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/prior124
      - name: Download independent four native FEX ARM64 GNU IFUNC125-128 target writer receipts
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42832626066
          name: KERNIX-G0-IFUNC125-128-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/four-native
      - name: Reclassify all original 147 source rows only using verified 39 plus four genuine distinct FEX hardware writers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_libc_147_batch_source_coverage_gate.py
          python3 -m py_compile native-engine/tools/kernix_g0_original_libc_147_ledger43_after_four_native_batch.py
          python3 native-engine/tools/kernix_g0_original_libc_147_ledger43_after_four_native_batch.py \
            inputs/triad/original-guest \
            inputs/prior124/original-libc-IFUNC124-original-one-FEX-CALL-C3-RET-native-stack-read-GNU-writer-INDEPENDENT-PROOF.json \
            inputs/four-native/original-libc-IFUNC125-128-four-independent-native-hardware-writer-batch-PROOF.json \
            dist/original-libc-147-source-batch-native-proof-ledger43-NO-NEW-HW-RUN.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/original-libc-147-source-batch-native-proof-ledger43-NO-NEW-HW-RUN.json')
          d=json.loads(p.read_text())
          assert d['original_relocations_total']==147
          assert d['previously_independently_attested_native_writer_target_count']==43
          assert d['remaining_requires_separate_native_hardware_evidence']==104
          assert len(d['previously_attested_original_source_indices'])==43
          assert len(d['remaining_non_IFUNC_DT_RELA_indices'])==85
          assert len(d['remaining_IFUNC_indices'])==19
          assert d['native_batch125_128_proven_in_four_separate_FEX_guest_processes'] is True
          assert d['new_native_hardware_attestations_in_this_source_inventory']==0
          assert d['new_GNU_CALL_RET_stack_READ_attestations_from_this_batch']==0
          assert d['all_147_same_guest_native_execution_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          assert len(d['adversarial_source_mutations_rejected'])==12
          print('KERNIX_G0_147_SOURCE_TYPES_IN_BATCH_43_PREVIOUSLY_GENUINE_NATIVE_WRITERS_104_STILL_NEED_NEW_HARDWARE_EVIDENCE')
          PY
      - name: Preserve original source-only batch inventory and truthfully bounded prior hardware ledger
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-147-Source-Cohorts-43-Prior-Native-Writers-104-Pending
          path: dist/original-libc-147-source-batch-native-proof-ledger43-NO-NEW-HW-RUN.json
          retention-days: 30
