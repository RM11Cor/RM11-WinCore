name: KERNIX independent Android host preview APK
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/android-app/**'
      - 'native-engine/android-host/**'
      - 'tools/kernix_g2c_apk_guest_release_firewall.py'
      - 'tools/kernix_g2c_fixture_gate.py'
      - '.github/workflows/kernix-android-host-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-kernix-android-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout independent KERNIX sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require persistent private Android update keystore (never ephemeral debug)
        shell: bash
        env:
          KERNIX_SIGNING_KEYSTORE_BASE64: ${{ secrets.KERNIX_SIGNING_KEYSTORE_BASE64 }}
          KERNIX_APK_SIGNING_PASSWORD: ${{ secrets.KERNIX_APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # Check only whether secrets are present; NEVER print their values.
          missing=0
          if [ -z "${KERNIX_SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Required repository Actions secret KERNIX_SIGNING_KEYSTORE_BASE64 is missing or empty."
            missing=1
          fi
          if [ -z "${KERNIX_APK_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Required repository Actions secret KERNIX_APK_SIGNING_PASSWORD is missing or empty."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Check repository RM11Cor/RM11-WinCore (not a different repository or Environment); unsigned/random-key APK is forbidden."
            exit 1
          fi
          # The original KERNIX password TXT has a trailing newline.
          # Strip whitespace introduced by Android copy/paste; never print.
          KERNIX_APK_SIGNING_PASSWORD="$(printf '%s' "$KERNIX_APK_SIGNING_PASSWORD" | tr -d '[:space:]')"
          if [ "${#KERNIX_APK_SIGNING_PASSWORD}" -ne 48 ]; then
            echo "::error::KERNIX_APK_SIGNING_PASSWORD is not the expected 48-character original password. Paste the contents of KERNIX_SIGNING_PASSWORD.txt."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/kernix-signing"
          KEYSTORE="$RUNNER_TEMP/kernix-signing/update.p12"
          # Permit harmless mobile-editor whitespace but reject any invalid
          # base64 characters and never log or echo the private key.
          if ! printf '%s' "$KERNIX_SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE" 2>/dev/null; then
            rm -f "$KEYSTORE"
            echo "::error::KERNIX_SIGNING_KEYSTORE_BASE64 is not valid Base64. Paste the ENTIRE CONTENTS of KERNIX_APK_KEYSTORE_BASE64.txt (not the filename, ZIP, or old secret name)."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          test "$(sha256sum "$KEYSTORE" | cut -d' ' -f1)" = \
            'fc4fcce82a85df0cb87d6f1cf3f9fce57555353ce9f2d05d7940c645e86e16e6' || {
              echo "::error::KERNIX update keystore does not match pinned identity; cannot publish in-place update."
              exit 1
            }
          keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -alias kernix-update -storepass "$KERNIX_APK_SIGNING_PASSWORD" \
            > "$RUNNER_TEMP/kernix-cert-evidence.txt"
          grep -Fq 'SHA256: A7:47:35:BC:30:B5:3E:59:05:89:D8:FF:5C:23:3F:72:DC:0E:4D:DF:6E:31:29:39:D6:68:AE:30:C4:6B:6F:8E' \
            "$RUNNER_TEMP/kernix-cert-evidence.txt"
          echo "KERNIX_APK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo KERNIX_SIGNING_IDENTITY_FIXED_AND_PRIVATE
      - name: Validate KERNIX read-only PE scanner on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernix-pe-tests
          javac -d /tmp/kernix-pe-tests \
            native-engine/android-app/src/main/java/org/kernix/host/GameInspector.java \
            native-engine/android-app/tests/org/kernix/host/GameInspectorTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/RuntimeLayout.java \
            native-engine/android-app/tests/org/kernix/host/RuntimeLayoutTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/NativeProcessProbe.java \
            native-engine/android-app/tests/org/kernix/host/NativeProcessProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/G2HostBoundaryProbe.java \
            native-engine/android-app/tests/org/kernix/host/G2HostBoundaryProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FexCoreLoadProbe.java \
            native-engine/android-app/tests/org/kernix/host/FexCoreLoadProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86GuestProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86GuestProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86SyscallProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86SyscallProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86WriteProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86WriteProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86ElfProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86ElfProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86ElfRwProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86ElfRwProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86HeapProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86HeapProbeTest.java
          java -cp /tmp/kernix-pe-tests org.kernix.host.GameInspectorTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.RuntimeLayoutTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.NativeProcessProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.G2HostBoundaryProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FexCoreLoadProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86GuestProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86SyscallProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86WriteProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86ElfProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86ElfRwProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86HeapProbeTest
      - name: Require Android NDK and platform
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          if [ ! -x "$SDK/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'ndk;27.2.12479018'
          fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "KERNIX_NDK=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Fetch SHA-locked post-G1 original FEXCore Android binaries
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-upstream-FEXCore-Android-NDK-compile-evidence-NOT-Wine
          repository: RM11Cor/RM11-WinCore
          run-id: 41699829425
          github-token: ${{ github.token }}
          path: inputs/g1-android
      - name: Attest one matching original FEXCore and six corrected x86 probes
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/41699829425 --jq '[.status,.conclusion,.head_sha]|join(" ")')" = \
            'completed success 81966dd8449fc96dbcbe32fa18a274f3799a6c3e'
          mkdir -p dist native-engine/android-app/app/src/main/jniLibs/arm64-v8a
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from tools.kernix_native_artifact_gate import attest_arm64_elf
          root=Path('inputs/g1-android')
          meta=json.loads((root/'compile-result.json').read_text())
          assert meta['source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert meta['build_rc']==0 and meta['configure_rc']==0 and meta['bionic_library_built'] is True
          assert meta['syscall_register_source_patched'] is False
          assert meta['guest64_mode_set_after_config_reload_in_android_host'] is True
          assert not meta['device_loaded'] and not meta['guest_instruction_execution']
          assert not meta['wine_connected'] and not meta['windows_game_tested'] and not meta['admitted_to_component_registry']
          patch=(root/'audit-only-cmake-diff.patch').read_text()
          assert 'KERNIX v0.16 Android-only fix' not in patch and 'KERNIX_SyscallStateSlots' not in patch
          assert 'OpcodeDispatcher.cpp' not in patch and 'BranchOps.cpp' not in patch
          core=root/'libFEXCore-android-build-only.so'
          digest=hashlib.sha256(core.read_bytes()).hexdigest()
          assert digest==meta['elf']['sha256']=='f71397bf1bbedd03305c7127e442d674227fa54d15217cc7effb22dbaa9f4b1d'
          assert core.stat().st_size==meta['elf']['bytes']==4273624
          assert set(meta['elf']['needed'])=={'libdl.so','libm.so','libc.so'}
          lst=[
              ('libFEXCore.so','libFEXCore-android-build-only.so',None,None),
              ('libkernix_fexcore_x86_64_alu_probe.so',None,'x86-guest-harness.sha256','x86-guest-harness-elf.txt'),
              ('libkernix_fexcore_x86_64_getpid_probe.so',None,'x86-syscall-bridge.sha256','x86-syscall-bridge-elf.txt'),
              ('libkernix_fexcore_x86_64_write_bridge_probe.so',None,'x86-write-bridge.sha256','x86-write-bridge-elf.txt'),
              ('libkernix_fexcore_elf64_exec_probe.so',None,'x86-elf64-native-probe.sha256','x86-elf64-native-probe-readelf.txt'),
              ('libkernix_fexcore_elf64_rw_exec_probe.so',None,'x86-elf64-rw-native-probe.sha256','x86-elf64-rw-native-readelf.txt'),
              ('libkernix_fexcore_elf64_heap_syscalls_probe.so',None,'x86-elf64-heap-native-probe.sha256','x86-elf64-heap-native-readelf.txt')]
          out=Path('native-engine/android-app/app/src/main/jniLibs/arm64-v8a')
          manifest=[]
          for name,filename,sha_file,elf_file in lst:
              p=root/(filename or name)
              assert p.is_file() and p.stat().st_size>1024,name
              hashval=hashlib.sha256(p.read_bytes()).hexdigest()
              assert attest_arm64_elf(p,hashval)['elf_header_and_load_bounds_verified'],name
              if sha_file:
                  assert hashval==(root/sha_file).read_text().split()[0],name
                  elf=(root/elf_file).read_text()
                  for required in ['/system/bin/linker64','Shared library: [libFEXCore.so]','Shared library: [libc.so]']:
                      assert required in elf,(name,required)
                  assert 'Shared library: [libc++_shared.so]' not in elf,name
              shutil.copyfile(p,out/name)
              manifest.append(f'{hashval}  {name}')
          Path('dist/G1-ANDROID-NATIVE-SHA256.txt').write_text('\n'.join(manifest)+'\n')
          Path('dist/FEXCORE-COMPILE-PROVENANCE.json').write_text(json.dumps({
              'source_sha':meta['source_sha'],'source_run':41699829425,
              'source_commit':'81966dd8449fc96dbcbe32fa18a274f3799a6c3e',
              'linux_arm64_g1_pass_run':41698161432,'artifact_sha256':digest,
              'mode_after_meta_reload':True,'syscall_register_source_patched':False,
              'device_loaded':False,'wine_connected':False,'games_tested':False},indent=2)+'\n')
          license=root/'FEX-UPSTREAM-LICENSE.txt'
          assert license.stat().st_size>100
          shutil.copyfile(license,'dist/FEX-UPSTREAM-LICENSE.txt')
          print('KERNIX_ORIGINAL_G1_FEXCORE_AND_ALL_SIX_ANDROID_RUNNERS_PINNED_AND_VERIFIED')
          PY
          for spec in \
            'kernix-x86-elf64-guest.sha256:kernix-x86-elf64-guest.elf' \
            'kernix-elf64-rw-guest.sha256:kernix-x86-elf64-rw-guest.elf' \
            'kernix-x86-elf64-heap-guest.sha256:kernix-x86-elf64-heap-guest.elf'; do
            sidecar="${spec%%:*}"
            elf="${spec#*:}"
            test -s "inputs/g1-android/$elf"
            test "$(awk 'NR==1 {print $1}' "inputs/g1-android/$sidecar")" = \
                 "$(sha256sum "inputs/g1-android/$elf" | awk '{print $1}')"
          done
          python3 tools/kernix_elf64_fixture_check.py inputs/g1-android/kernix-x86-elf64-guest.elf
          python3 tools/kernix_elf64_rw_fixture_check.py inputs/g1-android/kernix-x86-elf64-rw-guest.elf
          python3 tools/kernix_elf64_heap_fixture_check.py inputs/g1-android/kernix-x86-elf64-heap-guest.elf
          echo KERNIX_G1_ANDROID_ALL_GENUINE_GUEST_ELF_FIXTURES_VERIFIED
      - name: Compile real native KERNIX shared libraries
        shell: bash
        run: |
          set -euo pipefail
          CC="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          OUTPUT="native-engine/android-app/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUTPUT"
          "$CC" -std=c11 -O2 -DVK_USE_PLATFORM_ANDROID_KHR -fPIC -shared -fvisibility=hidden -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-soname,libkernix_host.so \
            native-engine/android-host/kernix_host.c native-engine/android-host/kernix_gpu_probe.c \
            native-engine/android-host/kernix_android_surface.c \
            native-engine/android-host/kernix_swapchain.c -ldl -landroid -lvulkan -o "$OUTPUT/libkernix_host.so"
          "$CC" -std=c11 -O2 -fPIC -shared -fvisibility=hidden -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-soname,libkernix_host_jni.so \
            -I"$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            native-engine/android-host/kernix_host_jni.c \
            -L"$OUTPUT" -lkernix_host -landroid -o "$OUTPUT/libkernix_host_jni.so"
          # Fixed PIE built against Android Bionic; this is NOT glibc FEX or Wine.
          # Native library directory is the read-only executable APK location;
          # never execve() writable app files or copied Linux ARM64 binaries.
          "$CC" -std=c11 -O2 -fPIE -pie -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            native-engine/android-host/kernix_android_exec_probe.c \
            -o "$OUTPUT/libkernix_android_exec_probe.so"
          "$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h -l -d "$OUTPUT/libkernix_android_exec_probe.so" > dist-android-exec-elf.txt
          grep -Fq '/system/bin/linker64' dist-android-exec-elf.txt
          grep -Fq 'Shared library: [libc.so]' dist-android-exec-elf.txt
          echo KERNIX_BIONIC_NATIVE_PIE_ELF_LINKAGE_VERIFIED
          "$CC" -std=c11 -O2 -fPIE -pie -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            native-engine/android-host/kernix_fexcore_load_probe.c \
            -ldl -o "$OUTPUT/libkernix_fexcore_load_probe.so"
          echo KERNIX_NATIVE_FEXCORE_LOADER_PROCESS_BUILT
          # G2: real Android/Bionic child process loading original FEXCore.
          "$CC" -std=c11 -O2 -fPIE -pie -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            native-engine/android-host/kernix_android_g2_host_boundary.c -ldl \
            -o "$OUTPUT/libkernix_android_g2_host_boundary.so"
          "$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h -l -d "$OUTPUT/libkernix_android_g2_host_boundary.so" \
            > dist/G2-ANDROID-HOST-ELF-ABIS.txt
          grep -Fq '/system/bin/linker64' dist/G2-ANDROID-HOST-ELF-ABIS.txt
          grep -Fq 'Shared library: [libc.so]' dist/G2-ANDROID-HOST-ELF-ABIS.txt
          ! grep -Fq 'Shared library: [libc.so.6]' dist/G2-ANDROID-HOST-ELF-ABIS.txt
          sha256sum "$OUTPUT/libkernix_android_g2_host_boundary.so" > dist/G2-ANDROID-HOST.sha256
          echo KERNIX_G2_ANDROID_BIONIC_CHILD_CROSSCOMPILED_NOT_DEVICE_VERIFIED
          # G2-C: exact same snapshot/ELF/AUXV source used by the previous
          # separately linked evidence, now shipped as signed APK PIE.
          # Without the four guest files it ONLY runs --android-host-page-
          # preflight: 4K/16K, PROT_NONE and PROT_READ, NEVER PROT_EXEC/FEX.
          CXX="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          "$CXX" -std=c++20 -O2 -fPIE -pie -static-libstdc++ \
            -Wall -Wextra -Wpedantic -Werror -Wl,--no-undefined \
            -Wl,-z,max-page-size=16384 \
            -Inative-engine/android-host \
            native-engine/android-host/kernix_g2c_bionic_data_only_child.cpp \
            -o "$OUTPUT/libkernix_g2c_data_only_child.so"
          READELF="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h -l -d "$OUTPUT/libkernix_g2c_data_only_child.so" \
            >dist/G2C-APK-CHILD-ELF-ABIS.txt
          grep -Fq 'Machine:                           AArch64' dist/G2C-APK-CHILD-ELF-ABIS.txt
          grep -Fq '/system/bin/linker64' dist/G2C-APK-CHILD-ELF-ABIS.txt
          grep -Fq 'Shared library: [libc.so]' dist/G2C-APK-CHILD-ELF-ABIS.txt
          ! grep -Eq 'Shared library: \[(libc.so.6|libc\+\+_shared.so)\]' \
            dist/G2C-APK-CHILD-ELF-ABIS.txt
          sha256sum "$OUTPUT/libkernix_g2c_data_only_child.so" \
            >dist/G2C-APK-CHILD-ELF.sha256
          echo KERNIX_G2C_REAL_BIONIC_PAGE_GUARD_CHILD_PACKAGING_ELIGIBLE_NOT_DEVICE_PASS
          for so in "$OUTPUT"/*.so; do
            digest="$(sha256sum "$so" | cut -d' ' -f1)"
            python3 tools/kernix_native_artifact_gate.py elf "$so" --sha256 "$digest"
          done
          echo KERNIX_ANDROID_NATIVE_LIBRARIES_VALIDATED
      - name: Cross-link G2-B scoped x86 ELF dependency verifier for genuine Android Bionic ARM64 (build-only)
        shell: bash
        run: |
          set -euo pipefail
          CXX="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          READELF="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$CXX" && test -x "$READELF"
          mkdir -p dist
          "$CXX" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fPIC -shared -fvisibility=hidden -static-libstdc++ \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -Wl,-soname,libkernix_g2b_elf_closure_build_only.so \
            -I native-engine/android-host \
            native-engine/android-host/kernix_g2b_android_elf_closure_entry.cpp \
            -o dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-BUILD-ONLY.so
          "$READELF" -h -d -W \
            dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-BUILD-ONLY.so \
            > dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-readelf.txt
          grep -Fq 'Machine:                           AArch64' \
            dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-readelf.txt
          grep -Fq 'Shared library: [libc.so]' \
            dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-readelf.txt
          ! grep -Fq 'Shared library: [libc.so.6]' \
            dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-readelf.txt
          ! grep -Fq 'Shared library: [libc++_shared.so]' \
            dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-readelf.txt
          sha256sum dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC-BUILD-ONLY.so \
            > dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-BIONIC.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("dist/KERNIX-G2B-ANDROID-ELF-CLOSURE-PROVENANCE.json").write_text(
              json.dumps({
                  "schema":"kernix.g2b.android-readonly-elf-closure-build-only.v1",
                  "target":"aarch64-linux-android26-bionic",
                  "module":"kernix_g2b_android_elf_closure_entry.cpp",
                  "guest_elf_dependency_closure_compiled":True,
                  "app_apk_bundled":False,
                  "android_device_executed":False,
                  "glibc_loader_executed":False,
                  "wine_pe_executed":False,
                  "games_executed":False
              },indent=2)+"\n")
          PY
          echo KERNIX_G2B_BIONIC_ARM64_ELF_DEPENDENCY_AUDIT_CROSS_LINK_PASS_NO_GUEST_EXECUTION

      - name: Cross-link read-only real x86 ELF PT_LOAD staging for Android Bionic ARM64 (build-only)
        shell: bash
        run: |
          set -euo pipefail
          CXX="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          READELF="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$CXX" && test -x "$READELF"
          "$CXX" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fPIC -shared -fvisibility=hidden -static-libstdc++ \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -Wl,-soname,libkernix_g2b_readonly_image_build_only.so \
            -I native-engine/android-host \
            native-engine/android-host/kernix_g2b_android_readonly_elf_image_entry.cpp \
            -o dist/KERNIX-G2B-ANDROID-READONLY-ELF-IMAGE-BUILD-ONLY.so
          "$READELF" -h -d -W \
            dist/KERNIX-G2B-ANDROID-READONLY-ELF-IMAGE-BUILD-ONLY.so \
            > dist/KERNIX-G2B-ANDROID-READONLY-ELF-IMAGE-readelf.txt
          grep -Fq 'Machine:                           AArch64' \
