name: KERNIX independent Android host preview APK
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/android-app/**'
      - 'native-engine/android-host/**'
      - '.github/workflows/kernix-android-host-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-kernix-android-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout independent KERNIX sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require persistent private Android update keystore (never ephemeral debug)
        shell: bash
        env:
          KERNIX_SIGNING_KEYSTORE_BASE64: ${{ secrets.KERNIX_SIGNING_KEYSTORE_BASE64 }}
          KERNIX_APK_SIGNING_PASSWORD: ${{ secrets.KERNIX_APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # Check only whether secrets are present; NEVER print their values.
          missing=0
          if [ -z "${KERNIX_SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Required repository Actions secret KERNIX_SIGNING_KEYSTORE_BASE64 is missing or empty."
            missing=1
          fi
          if [ -z "${KERNIX_APK_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Required repository Actions secret KERNIX_APK_SIGNING_PASSWORD is missing or empty."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Check repository RM11Cor/RM11-WinCore (not a different repository or Environment); unsigned/random-key APK is forbidden."
            exit 1
          fi
          # The original KERNIX password TXT has a trailing newline.
          # Strip whitespace introduced by Android copy/paste; never print.
          KERNIX_APK_SIGNING_PASSWORD="$(printf '%s' "$KERNIX_APK_SIGNING_PASSWORD" | tr -d '[:space:]')"
          if [ "${#KERNIX_APK_SIGNING_PASSWORD}" -ne 48 ]; then
            echo "::error::KERNIX_APK_SIGNING_PASSWORD is not the expected 48-character original password. Paste the contents of KERNIX_SIGNING_PASSWORD.txt."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/kernix-signing"
          KEYSTORE="$RUNNER_TEMP/kernix-signing/update.p12"
          # Permit harmless mobile-editor whitespace but reject any invalid
          # base64 characters and never log or echo the private key.
          if ! printf '%s' "$KERNIX_SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE" 2>/dev/null; then
            rm -f "$KEYSTORE"
            echo "::error::KERNIX_SIGNING_KEYSTORE_BASE64 is not valid Base64. Paste the ENTIRE CONTENTS of KERNIX_APK_KEYSTORE_BASE64.txt (not the filename, ZIP, or old secret name)."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          test "$(sha256sum "$KEYSTORE" | cut -d' ' -f1)" = \
            'fc4fcce82a85df0cb87d6f1cf3f9fce57555353ce9f2d05d7940c645e86e16e6' || {
              echo "::error::KERNIX update keystore does not match pinned identity; cannot publish in-place update."
              exit 1
            }
          keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -alias kernix-update -storepass "$KERNIX_APK_SIGNING_PASSWORD" \
            > "$RUNNER_TEMP/kernix-cert-evidence.txt"
          grep -Fq 'SHA256: A7:47:35:BC:30:B5:3E:59:05:89:D8:FF:5C:23:3F:72:DC:0E:4D:DF:6E:31:29:39:D6:68:AE:30:C4:6B:6F:8E' \
            "$RUNNER_TEMP/kernix-cert-evidence.txt"
          echo "KERNIX_APK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo KERNIX_SIGNING_IDENTITY_FIXED_AND_PRIVATE
      - name: Validate KERNIX read-only PE scanner on JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernix-pe-tests
          javac -d /tmp/kernix-pe-tests \
            native-engine/android-app/src/main/java/org/kernix/host/GameInspector.java \
            native-engine/android-app/tests/org/kernix/host/GameInspectorTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/RuntimeLayout.java \
            native-engine/android-app/tests/org/kernix/host/RuntimeLayoutTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/NativeProcessProbe.java \
            native-engine/android-app/tests/org/kernix/host/NativeProcessProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FexCoreLoadProbe.java \
            native-engine/android-app/tests/org/kernix/host/FexCoreLoadProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86GuestProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86GuestProbeTest.java \
            native-engine/android-app/src/main/java/org/kernix/host/FixedX86SyscallProbe.java \
            native-engine/android-app/tests/org/kernix/host/FixedX86SyscallProbeTest.java
          java -cp /tmp/kernix-pe-tests org.kernix.host.GameInspectorTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.RuntimeLayoutTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.NativeProcessProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FexCoreLoadProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86GuestProbeTest
          java -cp /tmp/kernix-pe-tests org.kernix.host.FixedX86SyscallProbeTest
      - name: Require Android NDK and platform
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          if [ ! -x "$SDK/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'ndk;27.2.12479018'
          fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "KERNIX_NDK=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Fetch genuine SHA-locked upstream FEXCore Android ELF proof
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-upstream-FEXCore-Android-NDK-compile-evidence-NOT-Wine
          repository: RM11Cor/RM11-WinCore
          run-id: 41604414475
          github-token: ${{ github.token }}
          path: inputs/fexcore
      - name: Attest upstream FEXCore Android ABI, ELF digest, license and linker symbols
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/41604414475 --jq '[.status,.conclusion,.head_sha]|join(" ")')" = \
            'completed success f4740c9313ffcf81c810efe409dfd69c409decb4'
          test -s inputs/fexcore/compile-result.json
          test -s inputs/fexcore/libFEXCore-android-build-only.so
          test -s inputs/fexcore/FEX-UPSTREAM-LICENSE.txt
          mkdir -p dist
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from tools.kernix_native_artifact_gate import attest_arm64_elf
          meta=json.loads(Path('inputs/fexcore/compile-result.json').read_text())
          assert meta['source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert meta['configure_rc']==0 and meta['build_rc']==0 and meta['bionic_library_built']
          assert not meta['device_loaded'] and not meta['wine_connected'] and not meta['windows_game_tested']
          src=Path('inputs/fexcore/libFEXCore-android-build-only.so')
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          assert actual=='f71397bf1bbedd03305c7127e442d674227fa54d15217cc7effb22dbaa9f4b1d'
          assert actual==meta['elf']['sha256']
          assert src.stat().st_size==meta['elf']['bytes']==4273624
          assert set(meta['elf']['needed']) <= {'libdl.so','libm.so','libc.so'}
          assert {'libdl.so','libm.so','libc.so'} <= set(meta['elf']['needed'])
          att=attest_arm64_elf(src,actual)
          assert att['elf_header_and_load_bounds_verified']
          out=Path('native-engine/android-app/app/src/main/jniLibs/arm64-v8a/libFEXCore.so')
          out.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(src,out)
          shutil.copyfile('inputs/fexcore/FEX-UPSTREAM-LICENSE.txt',
                          'dist/FEX-UPSTREAM-LICENSE.txt')
          Path('dist/FEXCORE-COMPILE-PROVENANCE.json').write_text(json.dumps({
            'source_sha':meta['source_sha'],'artifact_sha256':actual,
            'build_run':41604414475,'android_elf_crossbuilt':True,
            'device_loaded':False,'wine_connected':False,
            'games_tested':False},indent=2)+'\n')
          print('KERNIX_REAL_ANDROID_FEXCORE_BINARY_SHA256_AND_ELF_VERIFIED')
          PY
          llvm_nm="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ ! -x "$llvm_nm" ]; then
            "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
              -D --defined-only native-engine/android-app/app/src/main/jniLibs/arm64-v8a/libFEXCore.so \
              > dist/fexcore-exported-symbols.txt
          else
            "$llvm_nm" -D --defined-only \
              native-engine/android-app/app/src/main/jniLibs/arm64-v8a/libFEXCore.so \
              > dist/fexcore-exported-symbols.txt
          fi
          grep -Fq '_ZN7FEXCore6Config10InitializeEv' dist/fexcore-exported-symbols.txt
          echo KERNIX_UPSTREAM_FEXCORE_INITIALIZE_SYMBOL_PRESENT_NOT_INVOKED
      - name: Download pinned genuine FEXCore x86 execution ELF proof
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-upstream-FEXCore-Android-NDK-compile-evidence-NOT-Wine
          repository: RM11Cor/RM11-WinCore
          run-id: 41611049021
          github-token: ${{ github.token }}
          path: inputs/x86-alu
      - name: Require authentic Android FEXCore x86 guest runner and source build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/41611049021 --jq '[.status,.conclusion,.head_sha]|join(" ")')" = \
            'completed success c05a8c5a09ab370453aca230a4933df1d74e5835'
          test -s inputs/x86-alu/libkernix_fexcore_x86_64_alu_probe.so
          test -s inputs/x86-alu/x86-guest-harness.sha256
          test -s inputs/x86-alu/x86-guest-harness-elf.txt
          test -s inputs/x86-alu/compile-result.json
          runner=inputs/x86-alu/libkernix_fexcore_x86_64_alu_probe.so
          test "$(sha256sum "$runner" | cut -d' ' -f1)" = \
            '9aa7ca7cc264e8a012444d9525cde41bb3a903cdaa5308bcf0446aec230f795f'
          grep -Fq 'Shared library: [libFEXCore.so]' inputs/x86-alu/x86-guest-harness-elf.txt
          grep -Fq '/system/bin/linker64' inputs/x86-alu/x86-guest-harness-elf.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('inputs/x86-alu/libkernix_fexcore_x86_64_alu_probe.so')
          pinned=Path('inputs/x86-alu/libFEXCore-android-build-only.so')
          meta=json.loads(Path('inputs/x86-alu/compile-result.json').read_text())
          assert meta['source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert meta['build_rc']==0 and meta['bionic_library_built'] is True
          assert meta['guest_instruction_execution'] is False
          assert hashlib.sha256(src.read_bytes()).hexdigest()==\
              '9aa7ca7cc264e8a012444d9525cde41bb3a903cdaa5308bcf0446aec230f795f'
          assert hashlib.sha256(pinned.read_bytes()).hexdigest()==\
              'f71397bf1bbedd03305c7127e442d674227fa54d15217cc7effb22dbaa9f4b1d'
          PY
          NDK_READ="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$NDK_READ" -d "$runner" > dist/x86-guest-android-dependencies.txt
          if grep -Fq 'Shared library: [libc++_shared.so]' dist/x86-guest-android-dependencies.txt; then
            echo "::error::C++ runtime needed for x86 guest runner; must explicitly bundle runtime and license" >&2
            exit 1
          fi
          mkdir -p native-engine/android-app/app/src/main/jniLibs/arm64-v8a
          cp "$runner" native-engine/android-app/app/src/main/jniLibs/arm64-v8a/libkernix_fexcore_x86_64_alu_probe.so
          cp inputs/x86-alu/x86-guest-harness.sha256 dist/REAL-X86-GUEST-RUNNER.sha256
          echo KERNIX_REAL_FEXCORE_FIXED_GUEST_CPU_PROBE_PACKAGED_WITH_SOURCE_HASH
      - name: Download independently compiled Android x86-64 getpid syscall bridge runner
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-upstream-FEXCore-Android-NDK-compile-evidence-NOT-Wine
          repository: RM11Cor/RM11-WinCore
          run-id: 41614859514
          github-token: ${{ github.token }}
          path: inputs/x86-getpid
      - name: Attest actual FEXCore Android syscall guest probe before APK packaging
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/41614859514 --jq '[.status,.conclusion,.head_sha]|join(" ")')" = \
            'completed success c4632111244e098d50af79f4a42f29fc7714991d'
          test -s inputs/x86-getpid/libkernix_fexcore_x86_64_getpid_probe.so
          test -s inputs/x86-getpid/x86-syscall-bridge.sha256
          test -s inputs/x86-getpid/x86-syscall-bridge-elf.txt
          test -s inputs/x86-getpid/compile-result.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from tools.kernix_native_artifact_gate import attest_arm64_elf
          base=Path('inputs/x86-getpid')
          data=json.loads((base/'compile-result.json').read_text())
          assert data['source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert data['build_rc']==0 and data['bionic_library_built'] is True
          assert data['guest_instruction_execution'] is False
          path=base/'libkernix_fexcore_x86_64_getpid_probe.so'
          sha=hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha=='5400a9135681f90bb46ce68a475192007420104640fe9253a0bd1999d8da23df'
          assert path.stat().st_size==15544
          assert sha in (base/'x86-syscall-bridge.sha256').read_text()
          att=attest_arm64_elf(path,sha)
          assert att['elf_header_and_load_bounds_verified']
          core=base/'libFEXCore-android-build-only.so'
          assert hashlib.sha256(core.read_bytes()).hexdigest()==\
                 'f71397bf1bbedd03305c7127e442d674227fa54d15217cc7effb22dbaa9f4b1d'
          PY
          grep -Fq '/system/bin/linker64' inputs/x86-getpid/x86-syscall-bridge-elf.txt
          grep -Fq 'Shared library: [libFEXCore.so]' inputs/x86-getpid/x86-syscall-bridge-elf.txt
          if grep -Fq 'Shared library: [libc++_shared.so]' inputs/x86-getpid/x86-syscall-bridge-elf.txt; then
            echo "::error::Unbundled libc++ runtime for x86 syscall bridge" >&2
            exit 1
          fi
          cp inputs/x86-getpid/libkernix_fexcore_x86_64_getpid_probe.so \
            native-engine/android-app/app/src/main/jniLibs/arm64-v8a/libkernix_fexcore_x86_64_getpid_probe.so
          cp inputs/x86-getpid/x86-syscall-bridge.sha256 dist/REAL-X86-GETPID-SYSCALL-BRIDGE.sha256
          echo KERNIX_PINNED_ANDROID_X86_SYSCALL_BRIDGE_BINARY_VERIFIED_NOT_DEVICE_RUN
      - name: Compile real native KERNIX shared libraries
        shell: bash
        run: |
          set -euo pipefail
          CC="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          OUTPUT="native-engine/android-app/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUTPUT"
          "$CC" -std=c11 -O2 -DVK_USE_PLATFORM_ANDROID_KHR -fPIC -shared -fvisibility=hidden -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-soname,libkernix_host.so \
            native-engine/android-host/kernix_host.c native-engine/android-host/kernix_gpu_probe.c \
            native-engine/android-host/kernix_android_surface.c \
            native-engine/android-host/kernix_swapchain.c -ldl -landroid -lvulkan -o "$OUTPUT/libkernix_host.so"
          "$CC" -std=c11 -O2 -fPIC -shared -fvisibility=hidden -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-soname,libkernix_host_jni.so \
            -I"$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            native-engine/android-host/kernix_host_jni.c \
            -L"$OUTPUT" -lkernix_host -landroid -o "$OUTPUT/libkernix_host_jni.so"
          # Fixed PIE built against Android Bionic; this is NOT glibc FEX or Wine.
          # Native library directory is the read-only executable APK location;
          # never execve() writable app files or copied Linux ARM64 binaries.
          "$CC" -std=c11 -O2 -fPIE -pie -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            native-engine/android-host/kernix_android_exec_probe.c \
            -o "$OUTPUT/libkernix_android_exec_probe.so"
          "$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h -l -d "$OUTPUT/libkernix_android_exec_probe.so" > dist-android-exec-elf.txt
          grep -Fq '/system/bin/linker64' dist-android-exec-elf.txt
          grep -Fq 'Shared library: [libc.so]' dist-android-exec-elf.txt
          echo KERNIX_BIONIC_NATIVE_PIE_ELF_LINKAGE_VERIFIED
          "$CC" -std=c11 -O2 -fPIE -pie -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            native-engine/android-host/kernix_fexcore_load_probe.c \
            -ldl -o "$OUTPUT/libkernix_fexcore_load_probe.so"
          echo KERNIX_NATIVE_FEXCORE_LOADER_PROCESS_BUILT
          for so in "$OUTPUT"/*.so; do
            digest="$(sha256sum "$so" | cut -d' ' -f1)"
            python3 tools/kernix_native_artifact_gate.py elf "$so" --sha256 "$digest"
          done
          echo KERNIX_ANDROID_NATIVE_LIBRARIES_VALIDATED
      - name: Bundle original FEXCore and statically linked upstream library license notices
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-license-source
          git -C /tmp/kernix-fex-license-source checkout --quiet --detach 02e24ca5c01ed0c864466ed573db347336f70170
          git -C /tmp/kernix-fex-license-source submodule update --init --depth=1 \
            External/fmt External/xxhash External/rpmalloc \
            External/range-v3 External/unordered_dense
          test "$(git -C /tmp/kernix-fex-license-source rev-parse HEAD)" = \
            '02e24ca5c01ed0c864466ed573db347336f70170'
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/kernix-fex-license-source')
          dst=Path('native-engine/android-app/app/src/main/assets/third-party-notices')
          dst.mkdir(parents=True,exist_ok=True)
          mods=[
            ('FEXCore','LICENSE'),
            ('cephes','External/cephes/LICENSE'),
            ('tiny-json','External/tiny-json/LICENSE'),
          ]
          for name,source in mods:
              text=(root/source).read_text()
              assert len(text)>150,(name,source)
              (dst/(name+'.txt')).write_text(text)
          for mod in ('fmt','xxhash','rpmalloc','range-v3','unordered_dense'):
              directory=root/'External'/mod
              matches=sorted(p for p in directory.iterdir() if p.is_file() and
                             (p.name.lower().startswith('license') or p.name.lower().startswith('copying')))
              assert matches,'Missing official pinned license: '+mod
              selected=matches[0]
              content=selected.read_text(errors='replace')
              assert len(content)>150,(mod,selected)
              (dst/(mod+'.txt')).write_text(content)
          # SoftFloat 3e carries its canonical BSD redistribution terms in
          # the pinned original source header, not necessarily a LICENSE file.
          softfloat=(root/'External/SoftFloat-3e/src/extF80_add.c').read_text()
          header=softfloat.split('*/',1)[0]+'*/\n'
          assert 'Redistribution and use' in header and 'Copyright' in header
          (dst/'SoftFloat-3e.txt').write_text(header)
          inventory=sorted(p.name for p in dst.iterdir())
          assert len(inventory)==9,inventory
          (dst/'PROVENANCE.txt').write_text(
              'Pinned FEX source: FEX-Emu/FEX@02e24ca5c01ed0c864466ed573db347336f70170\n'
              'Bundled binary: original Android ARM64 Bionic FEXCore, not validated on phone.\n'
              'Notices sourced from pinned original upstream and exact submodule revisions.\n'
              'No Wine, DXVK, VKD3D or guest binaries are distributed in this preview.\n')
          print('KERNIX_FEXCORE_ALL_NINE_UPSTREAM_LICENSE_NOTICES_BUNDLED',inventory)
          PY
      - name: Assemble KERNIX independent host APK
        shell: bash
        env:
          KERNIX_APK_SIGNING_PASSWORD: ${{ secrets.KERNIX_APK_SIGNING_PASSWORD }}
        working-directory: native-engine/android-app
        run: |
          set -euo pipefail
          KERNIX_APK_SIGNING_PASSWORD="$(printf '%s' "$KERNIX_APK_SIGNING_PASSWORD" | tr -d '[:space:]')"
          if [ "${#KERNIX_APK_SIGNING_PASSWORD}" -ne 48 ]; then
            echo "::error::KERNIX_APK_SIGNING_PASSWORD mismatch in signed assembleRelease step"
            exit 1
          fi
          export KERNIX_APK_SIGNING_PASSWORD
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_host.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_host_jni.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_android_exec_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libFEXCore.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_x86_64_alu_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_x86_64_getpid_probe.so' apk-contents.txt
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_x86_64_getpid_probe.so \
            > packaged-x86-getpid-bridge.so
          test "$(sha256sum packaged-x86-getpid-bridge.so | awk '{print $1}')" = \
            '5400a9135681f90bb46ce68a475192007420104640fe9253a0bd1999d8da23df'
          echo KERNIX_X86_GETPID_SYSCALL_BRIDGE_PACKAGED_BYTE_IDENTICAL

          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_x86_64_alu_probe.so > packaged-fixed-x86-alu-runner.so
          test "$(sha256sum packaged-fixed-x86-alu-runner.so | awk '{print $1}')" = \
            '9aa7ca7cc264e8a012444d9525cde41bb3a903cdaa5308bcf0446aec230f795f'
          echo KERNIX_APK_FIXED_REAL_FEXCORE_X86_GUEST_RUNNER_SHA_VERIFIED
          for notice in FEXCore fmt xxhash rpmalloc range-v3 unordered_dense cephes tiny-json SoftFloat-3e PROVENANCE; do
            unzip -l "$APK" | grep -Fq "assets/third-party-notices/$notice.txt" || {
              echo "::error::Missing legally required bundled source notice: $notice"
              exit 1
            }
          done
          echo KERNIX_FEXCORE_BINARY_AND_UPSTREAM_LICENSE_ASSETS_BUNDLED

          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_load_probe.so' apk-contents.txt
          unzip -p "$APK" lib/arm64-v8a/libFEXCore.so > packaged-real-fexcore.so
          test "$(sha256sum packaged-real-fexcore.so | awk '{print $1}')" = \
            'f71397bf1bbedd03305c7127e442d674227fa54d15217cc7effb22dbaa9f4b1d'
          echo KERNIX_SIGNED_APK_CONTAINS_BYTE_IDENTICAL_PINNED_FEXCORE

          unzip -p "$APK" lib/arm64-v8a/libkernix_android_exec_probe.so > packaged-exec-probe.so
          probe_digest="$(sha256sum packaged-exec-probe.so | awk '{print $1}')"
          python3 ../../tools/kernix_native_artifact_gate.py elf packaged-exec-probe.so --sha256 "$probe_digest"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest-evidence.txt
          grep -Fq 'extractNativeLibs' manifest-evidence.txt
          echo KERNIX_SIGNED_APK_PACKAGED_BIONIC_EXECUTABLE_AND_EXTRACTION_FLAG
          # Ensure Android can actually launch the Java Activity declared in manifest.
          # Previously its Java sources were outside Gradle's default sourceSets.
          unzip -p "$APK" 'classes*.dex' > class-evidence.dex
          grep -aFq 'Lorg/kernix/host/MainActivity;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/RuntimeLayout;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/NativeProcessProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FexCoreLoadProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86GuestProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86SyscallProbe;' class-evidence.dex
          echo KERNIX_MAIN_ACTIVITY_AND_PRIVATE_RUNTIME_CODE_PACKAGED
          # Release signing is immutable: verify the exact public
          # certificate fingerprint instead of accepting any valid APK key.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signer-evidence.txt
          grep -iq 'V2 Signer: certificate SHA-256 digest: a74735bc30b53e590589d8ff5c233f72dc0e4ddf6e312939d668ae30c46b6f8e' signer-evidence.txt
          "$AAPT" dump badging "$APK" > package-evidence.txt
          grep -Fq "package: name='org.kernix.host' versionCode='8' versionName='0.8-stable-update-signing'" package-evidence.txt
          echo KERNIX_FIXED_UPDATE_CERT_PACKAGE_AND_MONOTONIC_VERSION_VERIFIED
          sha256sum "$APK" | tee KERNIX-HOST-PREVIEW.sha256
          mkdir -p ../../dist
          cp "$APK" ../../dist/KERNIX-Host-Preview.apk
          cp KERNIX-HOST-PREVIEW.sha256 ../../dist/
          cp ../android-host/LICENSE ../../dist/HOST-LICENSE.txt
          cp packaged-exec-probe.so ../../dist/KERNIX-BIONIC-PIE-IN-APK.so
          cp manifest-evidence.txt ../../dist/manifest-evidence.txt
          cp signer-evidence.txt ../../dist/stable-apk-signer-evidence.txt
          cp package-evidence.txt ../../dist/stable-apk-package-evidence.txt
          cp packaged-real-fexcore.so ../../dist/FEXCore-Android-ELF-sha256-verified.so
          cp packaged-fixed-x86-alu-runner.so ../../dist/REAL-FEXCORE-X86-GUEST-RUNNER-BUILD-ONLY.so
          cp packaged-x86-getpid-bridge.so ../../dist/REAL-FEXCORE-X86-GETPID-SYSCALL-BRIDGE-BUILD-ONLY.so
          echo KERNIX_INDEPENDENT_ANDROID_HOST_PREVIEW_APK_BUILT
      - name: Publish actual independently-built host preview APK
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-Host-Preview-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
