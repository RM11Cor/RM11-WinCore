          cp packaged-fixed-x86-alu-runner.so ../../dist/REAL-FEXCORE-X86-GUEST-RUNNER-BUILD-ONLY.so
          cp packaged-x86-getpid-bridge.so ../../dist/REAL-FEXCORE-X86-GETPID-SYSCALL-BRIDGE-BUILD-ONLY.so
          cp packaged-x86-memory-write-bridge.so ../../dist/REAL-FEXCORE-X86-WRITE-GETPID-MEMORY-BRIDGE-BUILD-ONLY.so
          cp packaged-elf64-guest-runner.so ../../dist/REAL-FEXCORE-ELF64-X86-GUEST-EXEC-BUILD-ONLY.so
          cp packaged-elf64-rw-guest-runner.so ../../dist/REAL-FEXCORE-ELF64-RW-GUEST-EXEC-BUILD-ONLY.so
          cp packaged-elf64-heap-syscalls-runner.so ../../dist/REAL-FEXCORE-ELF64-HEAP-FOUR-SYSCALL-BUILD-ONLY.so
