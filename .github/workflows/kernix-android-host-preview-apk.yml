      - name: Bundle original FEXCore and statically linked upstream library license notices
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-license-source
          git -C /tmp/kernix-fex-license-source checkout --quiet --detach 02e24ca5c01ed0c864466ed573db347336f70170
          git -C /tmp/kernix-fex-license-source submodule update --init --depth=1 \
            External/fmt External/xxhash External/rpmalloc \
            External/range-v3 External/unordered_dense
          test "$(git -C /tmp/kernix-fex-license-source rev-parse HEAD)" = \
            '02e24ca5c01ed0c864466ed573db347336f70170'
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/kernix-fex-license-source')
          dst=Path('native-engine/android-app/app/src/main/assets/third-party-notices')
          dst.mkdir(parents=True,exist_ok=True)
          mods=[
            ('FEXCore','LICENSE'),
            ('cephes','External/cephes/LICENSE'),
            ('tiny-json','External/tiny-json/LICENSE'),
          ]
          for name,source in mods:
              text=(root/source).read_text()
              assert len(text)>150,(name,source)
              (dst/(name+'.txt')).write_text(text)
          for mod in ('fmt','xxhash','rpmalloc','range-v3','unordered_dense'):
              directory=root/'External'/mod
              matches=sorted(p for p in directory.iterdir() if p.is_file() and
                             (p.name.lower().startswith('license') or p.name.lower().startswith('copying')))
              assert matches,'Missing official pinned license: '+mod
              selected=matches[0]
              content=selected.read_text(errors='replace')
              assert len(content)>150,(mod,selected)
              (dst/(mod+'.txt')).write_text(content)
          # SoftFloat 3e carries its canonical BSD redistribution terms in
          # the pinned original source header, not necessarily a LICENSE file.
          softfloat=(root/'External/SoftFloat-3e/src/extF80_add.c').read_text()
          header=softfloat.split('*/',1)[0]+'*/\n'
          assert 'Redistribution and use' in header and 'Copyright' in header
          (dst/'SoftFloat-3e.txt').write_text(header)
          inventory=sorted(p.name for p in dst.iterdir())
          assert len(inventory)==9,inventory
          (dst/'PROVENANCE.txt').write_text(
              'Pinned FEX source: FEX-Emu/FEX@02e24ca5c01ed0c864466ed573db347336f70170\n'
              'Bundled binary: original Android ARM64 Bionic FEXCore, not validated on phone.\n'
              'Notices sourced from pinned original upstream and exact submodule revisions.\n'
              'No Wine, DXVK, VKD3D or guest binaries are distributed in this preview.\n')
          print('KERNIX_FEXCORE_ALL_NINE_UPSTREAM_LICENSE_NOTICES_BUNDLED',inventory)
          PY
      - name: Assemble KERNIX independent host APK
        shell: bash
        env:
          KERNIX_APK_SIGNING_PASSWORD: ${{ secrets.KERNIX_APK_SIGNING_PASSWORD }}
        working-directory: native-engine/android-app
        run: |
          set -euo pipefail
          KERNIX_APK_SIGNING_PASSWORD="$(printf '%s' "$KERNIX_APK_SIGNING_PASSWORD" | tr -d '[:space:]')"
          if [ "${#KERNIX_APK_SIGNING_PASSWORD}" -ne 48 ]; then
            echo "::error::KERNIX_APK_SIGNING_PASSWORD mismatch in signed assembleRelease step"
            exit 1
          fi
          export KERNIX_APK_SIGNING_PASSWORD
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_host.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_host_jni.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_android_exec_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_android_g2_host_boundary.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_g2c_data_only_child.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libFEXCore.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_x86_64_alu_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_x86_64_getpid_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_x86_64_write_bridge_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_elf64_exec_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_elf64_rw_exec_probe.so' apk-contents.txt
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_elf64_heap_syscalls_probe.so' apk-contents.txt
          while read -r expected filename; do
            test -n "$expected" && test -n "$filename"
            actual="$(unzip -p "$APK" "lib/arm64-v8a/$filename" | sha256sum | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::G1 corrected Android library mismatch: $filename"
              exit 1
            fi
          done < ../../dist/G1-ANDROID-NATIVE-SHA256.txt
          echo KERNIX_G1_SEVEN_SINGLE_SOURCE_NATIVE_BINARIES_IN_SIGNED_APK
          unzip -p "$APK" lib/arm64-v8a/libFEXCore.so > packaged-real-fexcore.so
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_x86_64_alu_probe.so > packaged-fixed-x86-alu-runner.so
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_x86_64_getpid_probe.so > packaged-x86-getpid-bridge.so
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_x86_64_write_bridge_probe.so > packaged-x86-memory-write-bridge.so
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_elf64_exec_probe.so > packaged-elf64-guest-runner.so
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_elf64_rw_exec_probe.so > packaged-elf64-rw-guest-runner.so
          unzip -p "$APK" lib/arm64-v8a/libkernix_fexcore_elf64_heap_syscalls_probe.so > packaged-elf64-heap-syscalls-runner.so
          for notice in FEXCore fmt xxhash rpmalloc range-v3 unordered_dense cephes tiny-json SoftFloat-3e PROVENANCE; do
            unzip -l "$APK" | grep -Fq "assets/third-party-notices/$notice.txt" || {
              echo "::error::Missing required FEX source notice: $notice"
              exit 1
            }
          done
          grep -Fq 'lib/arm64-v8a/libkernix_fexcore_load_probe.so' apk-contents.txt
          echo KERNIX_ORIGINAL_FEXCORE_AND_LICENSE_NOTICES_PACKAGED
          unzip -p "$APK" lib/arm64-v8a/libkernix_android_g2_host_boundary.so > packaged-g2-boundary.so
          actual_g2="$(sha256sum packaged-g2-boundary.so | awk '{print $1}')"
          expected_g2="$(awk '{print $1}' ../../dist/G2-ANDROID-HOST.sha256)"
          test "$actual_g2" = "$expected_g2"
          python3 ../../tools/kernix_native_artifact_gate.py elf packaged-g2-boundary.so --sha256 "$actual_g2"
          echo KERNIX_G2_BIONIC_CHILD_PACKAGED_SAME_BYTES_NOT_DEVICE_EXECUTED
          unzip -p "$APK" lib/arm64-v8a/libkernix_g2c_data_only_child.so > packaged-g2c-page-child.so
          actual_g2c="$(sha256sum packaged-g2c-page-child.so | awk '{print $1}')"
          expected_g2c="$(awk '{print $1}' ../../dist/G2C-APK-CHILD-ELF.sha256)"
          test "$actual_g2c" = "$expected_g2c"
          python3 ../../tools/kernix_native_artifact_gate.py elf packaged-g2c-page-child.so --sha256 "$actual_g2c"
          echo KERNIX_G2C_SIGNED_APK_DATA_ONLY_PAGE_CHILD_SAME_BYTES_NOT_DEVICE_EXECUTED
          # Never quietly ship the glibc rootfs while legal/device gates remain shut.
          ! unzip -Z1 "$APK" | grep -E '(kernix-dynamic-app|libc\.so\.6|ld-linux-x86-64\.so\.2)' 
          echo KERNIX_G2C_NO_GUEST_GLIBC_OR_X86_BUNDLE_IN_PREVIEW_APK
          # Audit the actual ZIP member CONTENTS, not merely filenames:
          # reject renamed x86 ELF/glibc, wrong-ABI libs and hidden JIT runners.
          python3 ../../tools/kernix_g2c_apk_guest_release_firewall.py \
            "$APK" ../../dist/G2C-SIGNED-APK-GUEST-NO-SHIP-FIREWALL.json
          echo KERNIX_G2C_SIGNED_PREVIEW_APK_FULL_MEMBER_FIREWALL_PASSED_NO_DEVICE
          unzip -p "$APK" lib/arm64-v8a/libkernix_android_exec_probe.so > packaged-exec-probe.so
          probe_digest="$(sha256sum packaged-exec-probe.so | awk '{print $1}')"
          python3 ../../tools/kernix_native_artifact_gate.py elf packaged-exec-probe.so --sha256 "$probe_digest"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest-evidence.txt
          grep -Fq 'extractNativeLibs' manifest-evidence.txt
          echo KERNIX_SIGNED_APK_PACKAGED_BIONIC_EXECUTABLE_AND_EXTRACTION_FLAG
          # Ensure Android can actually launch the Java Activity declared in manifest.
          # Previously its Java sources were outside Gradle's default sourceSets.
          unzip -p "$APK" 'classes*.dex' > class-evidence.dex
          grep -aFq 'Lorg/kernix/host/MainActivity;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/RuntimeLayout;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/NativeProcessProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/G2HostBoundaryProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/G2CAndroidPageProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/G2CAndroidChildSupervisor;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FexCoreLoadProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86GuestProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86SyscallProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86WriteProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86ElfProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86ElfRwProbe;' class-evidence.dex
          grep -aFq 'Lorg/kernix/host/FixedX86HeapProbe;' class-evidence.dex
          echo KERNIX_MAIN_ACTIVITY_AND_PRIVATE_RUNTIME_CODE_PACKAGED
          # Release signing is immutable: verify the exact public
          # certificate fingerprint instead of accepting any valid APK key.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signer-evidence.txt
          grep -iq 'V2 Signer: certificate SHA-256 digest: a74735bc30b53e590589d8ff5c233f72dc0e4ddf6e312939d668ae30c46b6f8e' signer-evidence.txt
          "$AAPT" dump badging "$APK" > package-evidence.txt
          grep -Fq "package: name='org.kernix.host' versionCode='21' versionName='0.21-g2c-android-page-child'" package-evidence.txt
          echo KERNIX_FIXED_UPDATE_CERT_PACKAGE_AND_MONOTONIC_VERSION_VERIFIED
          sha256sum "$APK" | tee KERNIX-HOST-PREVIEW.sha256
          mkdir -p ../../dist
          cp "$APK" ../../dist/KERNIX-Host-Preview.apk
          cp KERNIX-HOST-PREVIEW.sha256 ../../dist/
          cp ../android-host/LICENSE ../../dist/HOST-LICENSE.txt
          cp packaged-exec-probe.so ../../dist/KERNIX-BIONIC-PIE-IN-APK.so
          cp packaged-g2-boundary.so ../../dist/KERNIX-G2-BIONIC-FEX-HOST-BUILD-ONLY.so
          cp manifest-evidence.txt ../../dist/manifest-evidence.txt
