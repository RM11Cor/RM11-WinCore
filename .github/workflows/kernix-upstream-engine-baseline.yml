name: KERNIX pinned Bannerlator 3.1.7 source foundation audit
on:
  push:
    branches: [kernix-next-clean-engine]
    paths:
      - '.gitmodules'
      - 'engines/backend-source-lock.json'
      - 'engines/bannerlator_3_1_7'
      - 'engines/README.md'
      - 'tools/verify_kernix_upstream_stack.py'
      - 'tools/verify_clean_engine_tree.py'
      - 'tools/audit_android_identity.py'
      - 'tools/kernix_game_preflight.py'
      - 'tools/test_kernix_game_preflight.py'
      - 'tools/kernix_pe_imports.py'
      - 'tools/test_kernix_pe_imports.py'
      - 'tools/kernix_component_registry.py'
      - 'tools/test_kernix_component_registry.py'
      - 'tools/kernix_game_profiles.py'
      - 'tools/test_kernix_game_profiles.py'
      - 'tools/kernix_profile_store.py'
      - 'tools/test_kernix_profile_store.py'
      - 'tools/kernix_integrated_game_report.py'
      - 'tools/test_kernix_integrated_game_report.py'
      - 'tools/kernix_benchmark_evidence.py'
      - 'tools/test_kernix_benchmark_evidence.py'
      - 'tools/kernix_frame_log_import.py'
      - 'tools/test_kernix_frame_log_import.py'
      - 'tools/kernix_performance_evidence_bundle.py'
      - 'tools/test_kernix_performance_evidence_bundle.py'
      - 'tools/kernix_display_session_summary.py'
      - 'tools/test_kernix_display_session_summary.py'
      - 'tools/patch_kernix_android_diagnostics.py'
      - 'android-bridge/KernixDiagnosticsActivity.java'
      - 'android-bridge/KernixDisplaySessionObserver.java'
      - 'components/registry.json'
      - '.github/workflows/kernix-build-isolated-identity.yml'
      - 'README.md'
      - '.github/workflows/kernix-upstream-engine-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Require exact upstream engine commit and complete checkout
        run: |
          set -euo pipefail
          test "$(git -C engines/bannerlator_3_1_7 rev-parse HEAD)" = 146158413f25e28f9ad04d921d0b7b806f86cc53
          test "$(git -C engines/bannerlator_3_1_7 status --porcelain | wc -l)" = 0
          python3 tools/verify_clean_engine_tree.py
          python3 tools/verify_kernix_upstream_stack.py
          python3 tools/audit_android_identity.py
          python3 tools/patch_kernix_android_diagnostics.py --upstream engines/bannerlator_3_1_7 --dry-run
          python3 -m unittest discover -s tools -p 'test_kernix_*.py' -v
          python3 - <<'PY'
          import json
          from tools.kernix_component_registry import validate
          validate(json.load(open('components/registry.json')))
          print('KERNIX_COMPONENT_REGISTRY_FAIL_CLOSED_PASS')
          PY
          python3 - <<'PY'
          import json
          r=json.load(open("engine-source-audit.json"))
          assert r["source_present"] is True
          assert r["built_in_kernix_apk"] is False
          assert r["device_qualified"] is False
          assert r["component_groups"] >= 7
          print("KERNIX_UPSTREAM_ENGINE_SOURCE_ONLY_NO_DEVICE_TEST")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KERNIX-BANNERLATOR-317-SOURCE-PROVENANCE-ONLY
          path: |
            engine-source-audit.json
            identity-source-audit.json
          if-no-files-found: error
          retention-days: 14
