      - name: Verify signing and release APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          apk=sys.argv[1]
          required=['libwineprobe.so','libwineserverrm11.so','libwine_ntdll.so','libwine_winex11.so']
          with zipfile.ZipFile(apk) as f:
              for lib in required:
                  key='lib/arm64-v8a/'+lib
                  assert key in f.namelist(), 'RM11_FATAL_MISSING_NATIVE_WINE_LIBRARY:'+lib
                  assert f.getinfo(key).file_size>4096, 'RM11_FATAL_TRUNCATED_NATIVE_WINE_LIBRARY:'+lib
          print('RM11_SIGNED_APK_NATIVE_WINE_LIBRARIES_PRESENT')
          PY
          REPORT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$REPORT"
          grep -Fq 'Signer #1 certificate SHA-256 digest: d398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' <<< "$REPORT"
          python3 - "$APK" <<'PY'
          import sys, zipfile, json, hashlib
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as a:
              base="assets/x11/"
              names=["xkb-data-manifest.json","xkb-data.zip","xkb-data-copyright.txt"]
              for name in names:
                  assert base+name in a.namelist(), "MISSING_XORG_XKB_APK_ASSET:"+name
              manifest=json.loads(a.read(base+names[0]))
              assert manifest["schema"]=="rm11.v403.xkb-android-bundle.v1"
              assert manifest["sha256"]==hashlib.sha256(a.read(base+names[1])).hexdigest()
          print("RM11_SIGNED_APK_XORG_XKB_BUNDLE_VERIFIED")
          PY
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.rm11.autocore' versionCode='49038' versionName='4.90.38-game-library-xinput'"
      - name: Verify all nine source-pinned graphics files inside signed APK; activation OFF
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 tools/stage_engine_graphics_apk.py audit app/build/outputs/apk/release/app-release.apk --out audit/v49038-signed-nine-components.json
          python3 tools/audit_signed_graphics_closure_v49013.py app/build/outputs/apk/release/app-release.apk --out audit/v49038-signed-graphics-closure.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audit/v49038-signed-nine-components.json').read_text())
          assert d['component_count']==9 and d['all_apk_content_hashes_match']
          assert d['wine_child_hook_active'] is False
          assert d['hardware_frame_proof']=='UNVERIFIED'
          assert d['safe_to_release'] is False
          print('RM11_NINE_GRAPHICS_PACKAGED_DISABLED_SIGNED_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RM11-v49038-SIGNED-GRAPHICS-CLOSURE-REPORT
          path: |
            audit/v49038-signed-nine-components.json
            audit/v49038-signed-graphics-closure.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RM11-v49029-D3D11-900-FRAMES-WIN64-EXE
          path: windows-probe/RM11-D3D11-FRAMES.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RM11-v49030-PRESENT-TRACE-WIN64-EXE
          path: windows-probe/RM11-D3D11-PRESENT-TRACE.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RM11-v4.90.38-game-library-xinput-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
