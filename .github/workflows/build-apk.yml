name: Build RM11 WinCore Test APK

on:
  workflow_dispatch:
  push:
    branches: [main, rm11-test-v238]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate project
        run: python3 scripts-check.py

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify native modules
        run: python3 tools/verify_native_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signing
        run: python3 tools/check_debug_signing.py app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RM11-WinCore-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
