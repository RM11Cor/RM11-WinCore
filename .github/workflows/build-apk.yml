name: Build RM11 Device Probe APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -name 'RM11-WinCore-v*-source.zip' -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$ARCHIVE"
          echo "Using $ARCHIVE"
          unzip -oq "$ARCHIVE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Load permanent signing key from encrypted repository secrets
        shell: bash
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RM11_RELEASE_KEYSTORE_B64" || -z "$RM11_RELEASE_PASSWORD" ]]; then
            echo '::error::Set RM11_RELEASE_KEYSTORE_B64 and RM11_RELEASE_PASSWORD in Settings > Secrets and variables > Actions before building.'
            exit 1
          fi
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rm11-autocore-release.p12"
          chmod 600 "$RUNNER_TEMP/rm11-autocore-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/rm11-autocore-release.p12" -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" -alias rm11-autocore >/dev/null
          echo "RM11_RELEASE_KEYSTORE=$RUNNER_TEMP/rm11-autocore-release.p12" >> "$GITHUB_ENV"
      - name: Check project files
        working-directory: RM11-WinCore
        run: python3 scripts-check.py
      - name: Build stable-signed release APK
        working-directory: RM11-WinCore
        env:
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=RM11-WinCore/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: RM11-AutoCore-STABLE-SIGNED-v2.4.3
          path: RM11-WinCore/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
