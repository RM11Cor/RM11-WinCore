name: KERNIX G0 original ld-linux first source MOV after real x86 heap signed Android standalone trial
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-original-ldso-after-heap-signed-android-apk.yml'
      - 'native-engine/android-g0-ldso-handoff-device-app/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kernix-g0-ldso-after-x86-heap-android-signed-release
  cancel-in-progress: false
jobs:
  signed-real-elf-bionic-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify exact original source-pinned Android FEXCore success
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42095095984" > /tmp/kernix-g0-source.json
            stage="$(python3 - <<'PY'
          import json
          o=json.load(open('/tmp/kernix-g0-source.json'))
          print(o['conclusion'] if o['status']=='completed' else 'pending')
          PY
            )"
            if [ "$stage" = success ]; then passed=1;break; fi
            if [ "$stage" != pending ]; then
              echo "::error::Exact original FEX source-attested Android native compile failed: $stage";exit 1
            fi
            sleep 10
          done
          test "$passed" -eq 1 || { echo "::error::Android original FEX source candidate did not pass";exit 1; }
          python3 - <<'PY'
          import json
          o=json.load(open('/tmp/kernix-g0-source.json'))
          assert o['status']=='completed' and o['conclusion']=='success'
          assert o['head_branch']=='kernix-native-engine-v1'
          assert o['head_sha']=='653ec36d43d8ffd970d6cc9aee77afe983c087a8'
          assert o['name']=='KERNIX original FEXCore Android ARM64 NDK compile audit'
          import subprocess,os
          original=json.loads(subprocess.check_output(
            ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/42094456275"]))
          assert original['status']=='completed' and original['conclusion']=='success'
          assert original['head_branch']=='kernix-native-engine-v1'
          assert original['head_sha']=='71e292a67dceb4f667d481d2478596898382ac2e'
          assert original['name']=='KERNIX G0 original ld-linux first x86 MOV after same FEX heap and ELF AUXV ARM64'
          assert o['conclusion']=='success' and o['status']=='completed'
          print('G0_ORIGINAL_LDSO_AFTER_X86_HEAP_BIONIC_SOURCE_ACCEPTED')
          PY
          # checkout defaults to depth=1; source commit 4efd7c5 is
          # deliberately earlier than the APK commit. Fetch ONLY that
          # immutable source commit and compare exact owned files.
          git fetch --quiet --no-tags --depth=1 origin 653ec36d43d8ffd970d6cc9aee77afe983c087a8
          git cat-file -e 653ec36d43d8ffd970d6cc9aee77afe983c087a8^{commit}
          for SOURCE in \
            native-engine/android-host/tests/kernix_g0_original_elf_heap_to_ldso_entry_handoff_arm64.cpp \
            native-engine/android-guest/kernix_g0_original_elf_heap_to_ldso_entry_handoff.S \
            native-engine/android-host/kernix_g0_guest_owned_anonymous_vm_kernel.h; do
            git show "653ec36d43d8ffd970d6cc9aee77afe983c087a8:$SOURCE" >/tmp/kernix-g0-original-input
            cmp -s "$SOURCE" /tmp/kernix-g0-original-input || {
              echo "::error::Signed ELF/FEX source drift: $SOURCE";exit 1;
            }
          done
      - uses: actions/download-artifact@v4
        with:
          name: KERNIX-upstream-FEXCore-Android-NDK-compile-evidence-NOT-Wine
          repository: RM11Cor/RM11-WinCore
          run-id: 42095095984
          github-token: ${{ github.token }}
          path: inputs/original
      - uses: actions/download-artifact@v4
        with:
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          github-token: ${{ github.token }}
          path: inputs/guest
      - uses: actions/download-artifact@v4
        with:
          name: KERNIX-G2E-B-Private-Root-Fix-Signed-v0.27-APK
          repository: RM11Cor/RM11-WinCore
          run-id: 41851255385
          github-token: ${{ github.token }}
          path: inputs/previous-license
      - name: SHA256-attest genuine original ld-linux entry after x86 mmap and original ELF triad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          as --64 native-engine/android-guest/kernix_g0_original_elf_heap_to_ldso_entry_handoff.S \
            -o dist/g0-integrated-original-x86-guest.o
          objcopy -O binary -j .text dist/g0-integrated-original-x86-guest.o \
            dist/g0-integrated-original-x86-guest.bin
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          base=Path('inputs/original')
          meta=json.loads((base/'compile-result.json').read_text())
          signed=Path('native-engine/android-g0-ldso-handoff-device-app/app/src/main')
          libs=signed/'jniLibs/arm64-v8a'
          assets=signed/'assets'
          libs.mkdir(parents=True,exist_ok=True)
          assets.mkdir(parents=True,exist_ok=True)
          assert meta['source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert meta['configure_rc']==0 and meta['build_rc']==0
          assert meta['bionic_library_built'] is True and meta['device_loaded'] is False
          candidate=base/'g0-one-process-ldso-entry-after-heap-android-candidate'
          witness=json.loads((candidate/'candidate.json').read_text())
          assert witness['schema']=='kernix.g0.original-source-ldso-first-instruction-after-single-real-FEX-heap-Bionic-unsigned.v1'
          assert witness['repo_sha']=='653ec36d43d8ffd970d6cc9aee77afe983c087a8'
          assert witness['upstream_FEX_sha']==meta['source_sha']
          assert witness['Android_device_executed'] is False
          code=Path('dist/g0-integrated-original-x86-guest.bin').read_bytes()
          assert len(code)==70 and code[:8]==bytes.fromhex('4d8b65004c8b3424')
          assert code[-3:]==bytes.fromhex('ffe5f4')
          assert sum(code[i:i+2]==bytes.fromhex('0f05') for i in range(len(code)-1))==2
          assert witness['original_GNU_x86_handoff_guest_sha256']==hashlib.sha256(code).hexdigest()
          assert witness['source_linux_arm64_original_FEX_handoff_ci_run']==42094456275
          assert witness['Android_Bionic_crosslinked'] is True
          assert witness['complete_dynamic_linker_glibc_executed'] is False
          assert witness['Android_device_executed'] is False
          assert witness['original_ldso_one_source_MOV_entered_on_Android_device'] is False
          runner='libkernix_g0_original_ldso_after_heap.so'
          assert witness['native_binary_filename']==runner
          pairs=[
           (base/'libFEXCore-android-build-only.so','libFEXCore.so','original-fexcore.sha256',meta['elf']['sha256']),
           (candidate/runner,runner,'original-ldso-after-heap-runner.sha256',witness['native_binary_sha256'])
          ]
          for path,name,digestAsset,digest in pairs:
              contents=path.read_bytes()
              assert len(contents)>4096 and hashlib.sha256(contents).hexdigest()==digest
              (libs/name).write_bytes(contents)
              (assets/digestAsset).write_text(digest+'\n')
          assert (candidate/'candidate.sha256').read_text().split()[0]==witness['native_binary_sha256']
          original=Path('inputs/guest/original-guest')
          manifest=json.loads(Path('inputs/guest/proven-guest-triad.json').read_text())
          assert manifest['original_real_FEX_linux_arm64_execution_run']==41842294261
          specs={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(x.relative_to(original)) for x in original.rglob('*') if x.is_file()}==set(specs)
          for rel,(size,digest) in specs.items():
              source=original/rel
              raw=source.read_bytes()
              assert not source.is_symlink() and len(raw)==size
              assert hashlib.sha256(raw).hexdigest()==digest
              assert manifest['files'][rel]['sha256']==digest
              dst=assets/'original'/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(raw)
          lic=list(Path('inputs/previous-license').rglob('KERNIX-G2E-B-Private-Root-Fix-v0.27.apk'))
          assert len(lic)==1
          notice=assets/'third-party-notices'
          notice.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(lic[0]) as z:
              for name in ('GLIBC-LGPL-2.1.txt','GLIBC-Ubuntu-Cross-Copyright.txt','GLIBC-SOURCE-AND-PROVENANCE.txt'):
                  raw=z.read('assets/third-party-notices/'+name)
                  assert len(raw)>500
                  (notice/name).write_bytes(raw)
          assert all(digest in (notice/'GLIBC-SOURCE-AND-PROVENANCE.txt').read_text() for size,digest in specs.values())
          fexLicense=(base/'FEX-UPSTREAM-LICENSE.txt').read_bytes()
          assert len(fexLicense)>100
          (notice/'FEX-UPSTREAM-LICENSE.txt').write_bytes(fexLicense)
          print('KERNIX_G0_ORIGINAL_ELF_AUXV_FEX_HEAP_SHA256_LGPL_PASS')
          PY
          SDK="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)"
          READELF="$(find "$SDK/ndk" -name llvm-readelf | grep linux-x86_64 | sort -V | tail -1)"
          test -x "$READELF" || { echo "::error::Android NDK llvm-readelf missing"; exit 1; }
          echo "G0_READ_ELF=$READELF"
          APP=native-engine/android-g0-ldso-handoff-device-app/app/src/main/jniLibs/arm64-v8a
          "$READELF" -h -l -d "$APP/libkernix_g0_original_ldso_after_heap.so" >dist/runner-elf.txt
          "$READELF" -h -l -d "$APP/libFEXCore.so" >dist/fex-elf.txt
          grep -Fq 'Machine:                           AArch64' dist/runner-elf.txt
          grep -Fq 'Machine:                           AArch64' dist/fex-elf.txt
          grep -Fq '/system/bin/linker64' dist/runner-elf.txt
          grep -Fq 'Shared library: [libFEXCore.so]' dist/runner-elf.txt
          grep -Fq 'Shared library: [libc.so]' dist/runner-elf.txt
          grep -aFq 'KERNIX_G0_SAME_FEX_ORIGINAL_LDSO_SOURCE_MOV_RSP_RDI_EXECUTED_AFTER_HEAP' "$APP/libkernix_g0_original_ldso_after_heap.so"
          grep -aFq 'KERNIX_G0_SAME_FEX_ORIGINAL_LDSO_SOURCE_BYTES_RESTORED_WX_SAFE' "$APP/libkernix_g0_original_ldso_after_heap.so"
          grep -aFq 'KERNIX_G0_ELF_AUXV_FEX_HEAP_AND_ORIGINAL_LDSO_FIRST_MOV_ANDROID_NATIVE_PASS_BOUNDED_NO_FULL_LDSO' "$APP/libkernix_g0_original_ldso_after_heap.so"
          ! grep -E 'Shared library: \[(libc.so.6|libc\+\+_shared.so)\]' dist/runner-elf.txt
          echo G0_ORIGINAL_LDSO_AFTER_HEAP_BIONIC_ABI_NOT_PHONE_EXECUTED
      - name: Restore verified original private KERNIX signing key
        shell: bash
        env:
          KERNIX_SIGNING_KEYSTORE_BASE64: ${{ secrets.KERNIX_SIGNING_KEYSTORE_BASE64 }}
          KERNIX_APK_SIGNING_PASSWORD: ${{ secrets.KERNIX_APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KERNIX_SIGNING_KEYSTORE_BASE64"
          test -n "$KERNIX_APK_SIGNING_PASSWORD"
          PASSWORD="$(printf '%s' "$KERNIX_APK_SIGNING_PASSWORD" | tr -d '[:space:]')"
          test "$(printf '%s' "$PASSWORD" | wc -c)" -eq 48
          install -d -m 700 "$RUNNER_TEMP/g0-sign"
          STORE="$RUNNER_TEMP/g0-sign/kernix.p12"
          printf '%s' "$KERNIX_SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode >"$STORE"
          chmod 600 "$STORE"
          test "$(sha256sum "$STORE" | awk '{print $1}')" = 'fc4fcce82a85df0cb87d6f1cf3f9fce57555353ce9f2d05d7940c645e86e16e6'
          keytool -list -v -keystore "$STORE" -storetype PKCS12 \
            -alias kernix-update -storepass "$PASSWORD" >dist/key-identity.txt
          grep -Fq 'SHA256: A7:47:35:BC:30:B5:3E:59:05:89:D8:FF:5C:23:3F:72:DC:0E:4D:DF:6E:31:29:39:D6:68:AE:30:C4:6B:6F:8E' dist/key-identity.txt
          echo "KERNIX_APK_KEYSTORE_PATH=$STORE" >>"$GITHUB_ENV"
          echo "KERNIX_APK_SIGNING_PASSWORD=$PASSWORD" >>"$GITHUB_ENV"
      - name: Build and verify independent original-signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p native-engine/android-g0-ldso-handoff-device-app --no-daemon --stacktrace :app:assembleRelease
          APK=native-engine/android-g0-ldso-handoff-device-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" >dist/signature-verified.txt
          grep -Fiq 'a74735bc30b53e590589d8ff5c233f72dc0e4ddf6e312939d668ae30c46b6f8e' dist/signature-verified.txt
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='org.kernix.g0ldsohandoffdevice'"
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          p=Path('native-engine/android-g0-ldso-handoff-device-app/app/build/outputs/apk/release/app-release.apk')
          src=Path('native-engine/android-g0-ldso-handoff-device-app/app/src/main')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None and 'classes.dex' in z.namelist()
              for n in ('libFEXCore.so','libkernix_g0_original_ldso_after_heap.so'):
                  a=z.read('lib/arm64-v8a/'+n)
                  b=(src/'jniLibs/arm64-v8a'/n).read_bytes()
                  assert hashlib.sha256(a).digest()==hashlib.sha256(b).digest()
              for rel in ('bin/kernix-g2e-dynamic-guest','lib64/ld-linux-x86-64.so.2','lib/x86_64-linux-gnu/libc.so.6'):
                  assert hashlib.sha256(z.read('assets/original/'+rel)).digest()==hashlib.sha256((src/'assets/original'/rel).read_bytes()).digest()
              for notice in ('FEX-UPSTREAM-LICENSE.txt','GLIBC-LGPL-2.1.txt','GLIBC-Ubuntu-Cross-Copyright.txt','GLIBC-SOURCE-AND-PROVENANCE.txt'):
                  assert len(z.read('assets/third-party-notices/'+notice))>100
              for name,digest in (
                  ('libkernix_g0_original_ldso_after_heap.so','original-ldso-after-heap-runner.sha256'),
                  ('libFEXCore.so','original-fexcore.sha256')):
                  raw=z.read('lib/arm64-v8a/'+name)
                  recorded=z.read('assets/'+digest).strip().decode('ascii')
                  assert recorded==hashlib.sha256(raw).hexdigest()
              print('KERNIX_G0_SIGNED_NATIVE_AND_ASSET_DIGESTS_EXACT_MATCH')
          print('G0_ORIGINAL_LDSO_AFTER_HEAP_SIGNED_ANDROID_APK_PASS_PHONE_PENDING')
          PY
          cp "$APK" dist/KERNIX-G0-Original-LDSO-After-FEX-Heap-Android-Signed.apk
          (cd dist && sha256sum KERNIX-G0-Original-LDSO-After-FEX-Heap-Android-Signed.apk >APK-SHA256.txt)
          printf '%s\n' 'ANDROID_DEVICE_EXECUTED=0' 'ORIGINAL_LDSO_FIRST_MOV_AFTER_FEX_HEAP_ANDROID=UNTESTED' \
             'COMPLETE_ORIGINAL_LDSO_GLIBC_STARTUP=0' 'WINE_PROTON_GAME_EXECUTED=0' \
             'INSTALLS_SEPARATE_FROM_STABLE_V027=1' >dist/RELEASE_SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-LDSO-After-Heap-Android-Signed-PHONE-PENDING
          path: |
            dist/KERNIX-G0-Original-LDSO-After-FEX-Heap-Android-Signed.apk
            dist/APK-SHA256.txt
            dist/RELEASE_SCOPE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish source-pinned immutable Android APK prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          TAG="kernix-g0-original-ldso-after-heap-$SHORT"
          gh release create "$TAG" \
            dist/KERNIX-G0-Original-LDSO-After-FEX-Heap-Android-Signed.apk \
            dist/APK-SHA256.txt dist/RELEASE_SCOPE.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "KERNIX G0 source-original ld-linux first MOV after live FEX ELF heap syscalls (phone pending)" \
            --notes "Independent app signed with original KERNIX certificate. SHA-pinned original FEXCore and fixed GNU x86 ELF native child are built for Bionic ARM64. This APK still REQUIRES on-phone evidence. Tests actual original source-verified ld-linux first MOV following live FEX original SHA ELF/AUXV and x86 mmap/store/load/munmap in the SAME process, then bounded HLT and source byte restoration; does not complete full ld-linux/glibc, Wine, Proton, Windows PE or games; does not modify KERNIX stable v0.27."
