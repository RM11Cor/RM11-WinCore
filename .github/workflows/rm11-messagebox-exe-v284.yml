name: RM11 v2.8.4 - Alternate Standard Windows MessageBox EXE

on:
  push:
    branches: [rm11-v284-standard-messagebox-test]
    paths:
      - ".github/workflows/rm11-messagebox-exe-v284.yml"
      - "tools/rm11_messagebox_v284.c"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-alternate-win64-gui-exe:
    if: github.repository == 'RM11Cor/RM11-WinCore'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Initialize preinstalled Windows 64-bit compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build CRT-free 64-bit GUI test with standard USER32 MessageBoxW
        run: |
          New-Item -ItemType Directory -Path external-test -Force | Out-Null
          cl.exe /nologo /O1 /W4 /WX /GS- /TC tools/rm11_messagebox_v284.c /Fe:external-test/rm11-messagebox-v284.exe /link /NODEFAULTLIB /ENTRY:mainCRTStartup /SUBSYSTEM:WINDOWS kernel32.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw "MSVC PE64 GUI compilation failed" }
          @'
          from pathlib import Path
          import struct,hashlib
          p=Path('external-test/rm11-messagebox-v284.exe')
          d=p.read_bytes()
          assert 1024 < len(d) < 16*1024*1024,len(d)
          assert d[:2]==b'MZ'
          pe=struct.unpack_from('<I',d,0x3c)[0]
          assert d[pe:pe+4]==b'PE\0\0'
          assert struct.unpack_from('<H',d,pe+4)[0]==0x8664, 'not AMD64'
          assert struct.unpack_from('<H',d,pe+24)[0]==0x20b, 'not PE32+'
          assert struct.unpack_from('<H',d,pe+24+0x44)[0]==2, 'not GUI subsystem'
          for marker in (b'MessageBoxW',b'FindWindowW',b'RM11_V284_MESSAGEBOXW_CALL_BEGIN',
                         b'RM11_V284_STANDARD_WIN32_DIALOG_HANDLE_FOUND',
                         b'RM11_V284_MESSAGEBOXW_RETURNED'):
            assert marker in d,marker
          print('RM11_ALTERNATE_GUI_EXE_PE64_WINDOWS_GUI_SUBSYSTEM_VERIFIED')
          print('BYTES',len(d))
          print('SHA256',hashlib.sha256(d).hexdigest())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Alternate PE64 GUI audit failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: RM11-v284-MessageBoxW-Alternate-Win64-GUI
          path: external-test/rm11-messagebox-v284.exe
          if-no-files-found: error
      - name: Publish direct alternate Win64 EXE for the installed RM11 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = 'v2.8.4-standard-messagebox-test'
          $asset = 'external-test/rm11-messagebox-v284.exe'
          gh release view $tag --repo RM11Cor/RM11-WinCore 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo RM11Cor/RM11-WinCore --clobber
          } else {
            gh release create $tag $asset --repo RM11Cor/RM11-WinCore --target $env:GITHUB_SHA --title 'RM11 alternate Windows standard MessageBox EXE' --notes 'Standalone PE64 x64 GUI test EXE only, not an APK. Different from v2.7.8 custom WM_PAINT test: calls standard USER32 MessageBoxW, creates a real modal Windows dialog, and closes automatically after roughly 18 seconds. Select it in the existing RM11 v2.8.3 embedded X11 test Activity, no external XSDL and no split-screen. This test does not bypass licensing or modify Wine/FEX. A successful Win32 API return alone is not proof of visible Windows graphics.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed" }
