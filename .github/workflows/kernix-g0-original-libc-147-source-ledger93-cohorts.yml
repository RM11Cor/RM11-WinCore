name: KERNIX G0 original GNU 147 source ledger93 only after independently proven RELA30 loc2
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_libc_147_ledger93_after_rela30_globdat.py'
      - '.github/workflows/kernix-g0-original-libc-147-source-ledger93-cohorts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-gnu-distinct-93-certified-fex-hardware-writer-targets-or-block:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless actual source30 two-FEX native writer independent verification completed successfully
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 43045395446 43045933191; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .status)" = completed
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .conclusion)" = success
          done
          for i in $(seq 1 200); do
            status="$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43047431274 --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43047431274 --jq .conclusion)" = success
              echo KERNIX_G0_SOURCE30_LOC2_REAL_NATIVE_ARM64_FEX_INDEPENDENT_WRITE_PROOF_READY
              exit 0
            fi
            sleep 12
          done
          echo KERNIX_G0_LEDGER93_BLOCKED_UNCERTIFIED_SOURCE30_NATIVE_HARDWARE
          exit 1
      - name: Download immutable GNU x86 libc and ldso source triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download exactly 92 independently certified GNU libc original native target ledger
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43045395446
          name: KERNIX-G0-Original-147-Source-Cohorts-92-Prior-Native-Writers-55-Pending
          github-token: ${{ github.token }}
          path: inputs/prior92
      - name: Download independently verified two true Linux ARM64 FEX GNU DT_RELA30 GLOB_DAT loc2 original hardware writes
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43047431274
          name: KERNIX-G0-Original-DTRELA30-GLOBDAT-Sym1584-Two-FEX-ARM64-Independent-Writer-Proof
          github-token: ${{ github.token }}
          path: inputs/new93
      - name: Combine exact original SHA source records with certified 93rd distinct native writer, no new run from ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_libc_147_ledger93_after_rela30_globdat.py
          python3 native-engine/tools/kernix_g0_original_libc_147_ledger93_after_rela30_globdat.py \
            inputs/triad/original-guest \
            inputs/prior92/original-libc-147-source-batch-native-proof-ledger92-NO-NEW-HW-RUN.json \
            inputs/new93/original-libc-DT-RELA30-GLOBDAT-Sym1584-One-Original-FEX-ARM64-Independent-Writer-PROOF.json \
            dist/original-libc-147-source-batch-native-proof-ledger93-NO-NEW-HW-RUN.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dist/original-libc-147-source-batch-native-proof-ledger93-NO-NEW-HW-RUN.json").read_text())
          assert d["schema"]=="kernix.g0.original-gnu-libc-147-relocation-cohort-native-writer-ledger93.v1"
          assert d["original_relocations_total"]==147
          assert d["previously_independently_attested_native_writer_target_count"]==93
          assert len(set(d["previously_attested_original_source_indices"]))==93
          assert d["remaining_requires_separate_native_hardware_evidence"]==54
          assert d["remaining_non_IFUNC_DT_RELA_indices"]==list(range(31,85))
          assert d["remaining_IFUNC_indices"]==[]
          assert d["native_GNU_DT_RELA30_GLOBDAT_sym1584_loc2_REAL_FEX_ARM64_STORE_independently_proven"] is True
          assert d["new_native_hardware_attestations_in_this_source_inventory"]==0
          assert d["new_hardware_writer_attestations_from_this_batch"]==0
          assert d["new_GNU_CALL_RET_stack_READ_attestations_from_this_batch"]==0
          assert d["full_GLOB_DAT_dynamic_symbol_scope_preemption_and_versioning_proven"] is False
          assert d["all_147_same_guest_native_execution_proven"] is False
          assert d["Android_Bionic_Wine_Proton_games_proven"] is False
          print("KERNIX_G0_ORIGINAL_GNU_147_SOURCE_LEDGER93_54_PENDING_NO_ANDROID")
          PY
      - name: Archive source-locked GNU all-147 cohort ledger with 93 independently attested writer targets
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-147-Source-Cohorts-93-Prior-Native-Writers-54-Pending
          path: dist/original-libc-147-source-batch-native-proof-ledger93-NO-NEW-HW-RUN.json
          retention-days: 30
          if-no-files-found: error
