name: KERNIX G0 original IFUNC145-146 two separate real ARM64 FEX hardware writer independent replay
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_ifunc145_146_batch_source_only_native_writer_plans.py'
      - 'native-engine/tools/kernix_g0_ifunc145_146_native_fex_writer_batch.sh'
      - 'native-engine/tools/kernix_g0_original_ifunc145_146_two_writer_batch_independent_gate.py'
      - '.github/workflows/kernix-g0-original-ifunc145-146-two-writer-batch-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-original-gnu-two-native-arm64-writers:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Require completed genuine original GNU IFUNC145-146 FEX ARM64 hardware batch before any certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            status="$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/42854306040 --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/42854306040 --jq .conclusion)" = success
              echo KERNIX_G0_ORIGINAL_IFUNC145_146_FULL_GENUINE_FEX_ARM64_NATIVE_BATCH_COMPLETED
              exit 0
            fi
            sleep 12
          done
          echo KERNIX_G0_ORIGINAL_IFUNC145_146_NATIVE_BATCH_NOT_YET_VERIFIED_FAIL_CLOSED
          exit 1
      - name: Download immutable original GNU libc ldso x86 dynamic guest triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download original IFUNC145-146 two source-only SHA-locked GDB writer watch plans
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42853284818
          name: KERNIX-G0-IFUNC145-146-Source-Only-2-Distinct-Watches-NO-Native-Hardware-Proof
          github-token: ${{ github.token }}
          path: inputs/source
      - name: Download two real FEX ARM64 GNU IFUNC145-146 hardware writer raw logs and source plans
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42854306040
          name: KERNIX-G0-Original-GNU-Ldso-IRELATIVE-After-Real-FEX-Main-Seal-ARM64-ONLY
          github-token: ${{ github.token }}
          path: inputs/native
      - name: Download prior IFUNC141-144 genuine four individually independently certified FEX hardware writer receipts
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42848697286
          name: KERNIX-G0-IFUNC141-144-Four-Real-ARM64-FEX-Native-Writers-Independent-Proof
          github-token: ${{ github.token }}
          path: inputs/previous
      - name: Independently verify original ELF SHA and both real FEX hardware writes and reject 20 native forgeries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_ifunc145_146_two_writer_batch_independent_gate.py
          python3 native-engine/tools/kernix_g0_original_ifunc145_146_two_writer_batch_independent_gate.py \
            inputs/triad/original-guest \
            inputs/source \
            inputs/native \
            inputs/previous \
            dist/original-libc-IFUNC145-146-two-independent-native-hardware-writer-batch-PROOF.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('dist/original-libc-IFUNC145-146-two-independent-native-hardware-writer-batch-PROOF.json')
          x=json.loads(p.read_text())
          assert x['original_source_indices']==[145,146]
          assert x['prior_independently_certified_native_hardware_target_count']==59
          assert x['new_distinct_original_GNU_native_hardware_writer_targets']==2
          assert x['unique_original_libc_native_hardware_writer_target_count']==61
          assert len(x['two_independent_native_hardware_writer_receipts'])==2
          assert len({r['original_guest_target'] for r in x['two_independent_native_hardware_writer_receipts']})==2
          assert x['two_separate_FEX_guest_processes_share_one_FEX_build'] is True
          assert x['one_single_FEX_guest_process_for_both_writes_proven'] is False
          assert sum(len(v) for v in x['twenty_native_hardware_tamper_cases_rejected'].values())==20
          assert x['all_147_original_libc_RELA_JMPREL_writers_same_process_proven'] is False
          assert x['original_IFUNC145_146_CALL_C3_RET_native_stack_HW_READ_proven'] is False
          assert x['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_ORIGINAL_GNU_IFUNC145_146_NATIVE_TWO_WRITER_INDEPENDENT_ATTESTATION_61_147_NO_ANDROID_OR_CALL_RET')
          PY
      - name: Upload strict independent original GNU IFUNC145-146 two real FEX ARM64 native writer receipts
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-IFUNC145-146-Two-Real-ARM64-FEX-Native-Writers-Independent-Proof
          path: dist/original-libc-IFUNC145-146-two-independent-native-hardware-writer-batch-PROOF.json
          retention-days: 30
