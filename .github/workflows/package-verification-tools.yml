name: Prepare APK Validation Tools
on:
  push:
    branches: [alquflshamil-app-android16]
    paths:
      - '.github/workflows/package-verification-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original upstream tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verifier
          curl -fL --retry 3 --connect-timeout 15 -o verifier/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fL --retry 3 --connect-timeout 15 -o verifier/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          test "$(stat -c%s verifier/apktool.jar)" -gt 1000000
          test "$(stat -c%s verifier/uber-apk-signer.jar)" -gt 100000
          sha256sum verifier/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apk-validation-tools
          path: verifier/*.jar
