name: KERNIX G0 original GNU 147-source ledger92 only after independent DT_RELA29 __curbrk writer
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_original_libc_147_ledger92_after_rela29_globdat.py'
      - '.github/workflows/kernix-g0-original-libc-147-source-ledger92-cohorts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-gnu-92-distinct-native-writers-proven-or-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Require completed independently certified original GNU DT_RELA29 native writer before any 92 ledger claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43027705989 --jq .status)" = completed
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43027705989 --jq .conclusion)" = success
          for i in $(seq 1 280); do
            status="$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43042294578 --jq .status)"
            if [ "$status" = completed ]; then
              test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43042294578 --jq .conclusion)" = success
              echo KERNIX_G0_ORIGINAL_RELA29_TWO_REAL_ARM64_FEX_GUEST_INDEPENDENT_WRITERS_PROVEN
              exit 0
            fi
            sleep 10
          done
          echo KERNIX_G0_LEDGER92_BLOCKED_NO_INDEPENDENT_GLOB_DAT29_NATIVE_PROOF
          exit 1
      - name: Download unchanged SHA-locked source original GNU Linux triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download independently certified unique 91 source writers
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43027705989
          name: KERNIX-G0-Original-147-Source-Cohorts-91-Prior-Native-Writers-56-Pending
          github-token: ${{ github.token }}
          path: inputs/ledger91
      - name: Download new original __curbrk native FEX ARM64 independent proof with 16 forgery rejects
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43042294578
          name: KERNIX-G0-Original-DTRELA29-GLOBDAT-Sym655-Two-FEX-ARM64-Independent-Writer-Proof
          github-token: ${{ github.token }}
          path: inputs/new92
      - name: Reconcile unique 147 authentic source records after exact 92 independent native target receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_original_libc_147_ledger92_after_rela29_globdat.py
          python3 native-engine/tools/kernix_g0_original_libc_147_ledger92_after_rela29_globdat.py \
            inputs/triad/original-guest \
            inputs/ledger91/original-libc-147-source-batch-native-proof-ledger91-NO-NEW-HW-RUN.json \
            inputs/new92/original-libc-DT-RELA29-GLOBDAT-Sym655-One-Original-FEX-ARM64-Independent-Writer-PROOF.json \
            dist/original-libc-147-source-batch-native-proof-ledger92-NO-NEW-HW-RUN.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/original-libc-147-source-batch-native-proof-ledger92-NO-NEW-HW-RUN.json')
          d=json.loads(p.read_text())
          assert d['original_relocations_total']==147
          assert d['schema']=='kernix.g0.original-gnu-libc-147-relocation-cohort-native-writer-ledger92.v1'
          assert d['previously_independently_attested_native_writer_target_count']==92
          assert len(set(d['previously_attested_original_source_indices']))==92
          assert d['remaining_requires_separate_native_hardware_evidence']==55
          assert d['remaining_non_IFUNC_DT_RELA_indices']==list(range(30,85))
          assert d['remaining_IFUNC_indices']==[]
          assert d['native_GNU_DT_RELA29_GLOBDAT_sym655___curbrk_REAL_FEX_ARM64_STORE_independently_proven'] is True
          assert d['new_native_hardware_attestations_in_this_source_inventory']==0
          assert d['new_GNU_CALL_RET_stack_READ_attestations_from_this_batch']==0
          assert d['full_GLOB_DAT_dynamic_symbol_scope_preemption_and_versioning_proven'] is False
          assert d['all_147_same_guest_native_execution_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_ORIGINAL_SOURCE_92_INDEPENDENT_NATIVE_WRITERS_55_PENDING_ONLY_AFTER_PROOF')
          PY
      - name: Archive immutable SHA source ledger 92 independent target receipts, no new runtime proof from ledger
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Original-147-Source-Cohorts-92-Prior-Native-Writers-55-Pending
          path: dist/original-libc-147-source-batch-native-proof-ledger92-NO-NEW-HW-RUN.json
          retention-days: 30
          if-no-files-found: error
