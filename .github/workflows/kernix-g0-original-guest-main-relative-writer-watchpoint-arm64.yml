                      'type_id':kind,'symbol_index':info>>32,
                      'addend':addend,
                      'source_computable_value_rva':hex(addend)
                          if kind==8 else None,
                      'inside_main_gnu_relro':(
                          relro[0][3]<=off<relro[0][3]+relro[0][6])}
