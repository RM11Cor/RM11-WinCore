                  encoded=bytes.fromhex(dump.group(2))
                  count_from_dump=int(dump.group(1))
                  if count_from_dump!=count or count_from_dump>8:
                      raise ValueError('count mismatch')
                  cursor=0
                  host_cursor=header
                  guest_cursor=entry
                  for _ in range(count_from_dump):
