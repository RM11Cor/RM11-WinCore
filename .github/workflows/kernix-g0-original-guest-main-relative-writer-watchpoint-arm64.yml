          # This is not runtime writer attribution, a RELRO seal, or an
          # assertion that the loader has completed relocation closure.
          # Keep DT_RELA distinct from the PLT DT_JMPREL table.
          def file_from_vaddr(va,size):
              if size<=0 or size>24*256 or va+size>1<<64:
                  raise ValueError('invalid table bounds')
              owners=[p for p in ph if p[0]==1 and
                      p[3]<=va and va+size<=p[3]+p[5] and
                      p[2]+(va-p[3])+size<=len(b)]
              if len(owners)!=1:
                  raise ValueError('relocation source not uniquely file backed')
              p=owners[0]
              begin=p[2]+va-p[3]
              return b[begin:begin+size]
          def target_is_loaded(va):
              return va>=0 and va<1<<64 and sum(
                  p[0]==1 and p[3]<=va<p[3]+p[6] for p in ph)==1
          def require_source_targets(rela,plt):
              for off,info,addend in rela+plt:
                  if not target_is_loaded(off):
                      raise ValueError('relocation target not in one PT_LOAD')
                  if (info&0xffffffff)==8 and (info>>32)!=0:
                      raise ValueError('RELATIVE relocation has nonzero symbol')
