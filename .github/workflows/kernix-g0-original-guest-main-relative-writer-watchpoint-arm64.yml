              return matches[0] if len(matches)==1 else None
          def writer(section,row):
              old=one(r'^Old value =\s*(0x[0-9a-fA-F]+|[0-9]+)',section)
              new=one(r'^New value =\s*(0x[0-9a-fA-F]+|[0-9]+)',section)
              pc=one(r'^pc\s+(0x[0-9a-fA-F]+)',section)
