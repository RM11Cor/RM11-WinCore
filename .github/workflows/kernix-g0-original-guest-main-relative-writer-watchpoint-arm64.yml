              'schema':'kernix.g0.original-main-source-relocations.v1',
              'original_main_sha256':hashlib.sha256(b).hexdigest(),
              'DT_RELA_count':len(entries),
              'DT_JMPREL_count':len(plt),
              'main_relocations':(
