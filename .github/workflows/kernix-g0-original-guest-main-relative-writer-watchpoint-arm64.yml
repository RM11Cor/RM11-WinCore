              new=one(r'^New value =\s*(0x[0-9a-fA-F]+|[0-9]+)',section)
              pc=one(r'^pc\s+(0x[0-9a-fA-F]+)',section)
              stores=list(re.finditer(
                  r'^\s*(0x[0-9a-fA-F]+):\s+stlr\s+x(\d+),\s*\[x(\d+)\]\s*$',
                  section,re.M))
              regs={}
              for m in re.finditer(r'^x(\d+)\s+(0x[0-9a-fA-F]+)\s+',section,re.M):
