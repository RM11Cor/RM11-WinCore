                  return (((b&15)+1)*4,((b>>4)&7)+1,1)
              if b<0xc0:
                  if pos+2>len(data):raise ValueError('truncated vl16')
                  rip=(b&63);rip-=64 if rip>=32 else 0
                  arm=data[pos+1];arm-=256 if arm>=128 else 0
                  return (arm*4,rip,2)
              if b==0xc0:
                  if pos+9>len(data):raise ValueError('truncated vl32')
                  return (int.from_bytes(data[pos+1:pos+5],'little',signed=True),
                          int.from_bytes(data[pos+5:pos+9],'little',signed=True),9)
              if b==0xe0:
                  if pos+17>len(data):raise ValueError('truncated vl64')
                  return (int.from_bytes(data[pos+1:pos+9],'little',signed=True),
