          if have_plt:
              assert all(tag in tags for tag in (2,20,23))
              assert tags[20]==7, 'only ELF64 RELA PLT accepted'
              assert 0<tags[2]<=24*256 and tags[2]%24==0
              jmp_raw=file_from_vaddr(tags[23],tags[2])
              plt=[struct.unpack_from('<QQq',jmp_raw,i)
                   for i in range(0,len(jmp_raw),24)]
              # The relocation tables must refer to independent entries.
              assert (table+tags[8]<=tags[23] or
                      tags[23]+tags[2]<=table)
          else:
              plt=[]
          require_source_targets(entries,plt)
          assert all((info>>32)==0 for off,info,addend in entries
                     if (info&0xffffffff)==8)
          # Strict source-only negative controls: wrong symbol semantics,
          # unowned target, and corrupted table alignment must be rejected.
          def valid_source_targets(rela,pltrela):
              try:
                  require_source_targets(rela,pltrela)
                  return True
              except ValueError:
                  return False
          assert valid_source_targets(entries,plt)
          forged=list(entries)
