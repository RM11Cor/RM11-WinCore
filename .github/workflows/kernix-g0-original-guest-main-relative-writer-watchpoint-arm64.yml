              # other disassembled stores, if any, are not accepted.
              nativepc=int(pc.group(1),16)
              stlr=[m for m in stores if int(m.group(1),16)==nativepc-4]
              if len(stlr)!=1:return False
              store=stlr[0]
              value_reg=int(store.group(2))
              address_reg=int(store.group(3))
              if value_reg==address_reg or value_reg>30 or address_reg>30:
                  return False
              t=bytes.fromhex(table.group(1))
              return bool(len(t)>=4 and t[:4]==bytes.fromhex('80018002') and
                  all(b==0 for b in t[4:]) and
