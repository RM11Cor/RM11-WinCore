              hits[3].start()<capture[2]<hits[4].start()<capture[3]<
              hits[5].start()<capture[4]<resumed<main_relro<syscall)
          def one(pattern,section):
              m=list(re.finditer(pattern,section,re.M))
              return m[0] if len(m)==1 else None
          def original_guest_writer(section,item):
              # FEX's real native JIT selects physical AArch64 registers
              # dynamically: symbolic stores use e.g. stlr x13,[x4],
              # while RELATIVE used stlr x7,[x10].  Never assume x7/x10
              # and never silently accept a source/destination mismatch.
