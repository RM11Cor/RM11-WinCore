                 if (e[1]&0xffffffff)==8)
          forged[i]=(forged[i][0],forged[i][1]+(1<<32),forged[i][2])
          assert not valid_source_targets(forged,plt)
          forged=list(entries)
          forged[i]=((1<<64)-1,forged[i][1],forged[i][2])
          assert not valid_source_targets(forged,plt)
          assert tags[8]%24==0 and not ((tags[8]+1)%24==0)
          relro=[p for p in ph if p[0]==0x6474e552]
          assert len(relro)==1
          def record(source,index,item):
              off,info,addend=item
              kind=info&0xffffffff
