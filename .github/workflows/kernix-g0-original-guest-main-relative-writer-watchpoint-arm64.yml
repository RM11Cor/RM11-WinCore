              table=one(r'^KERNIX_G0_FEX_SOURCE_JIT_VL64PAIR_BYTES_READONLY count=2 data=([0-9a-f]+)$',section)
              opcode=one(r'^0x([0-9a-fA-F]+):\s+0x([0-9a-fA-F]{2})\s+0x([0-9a-fA-F]{2})\s+0x([0-9a-fA-F]{2})$',section)
              regs={}
