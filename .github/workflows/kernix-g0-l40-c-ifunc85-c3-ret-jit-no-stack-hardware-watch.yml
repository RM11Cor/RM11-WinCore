name: KERNIX G0 C original GNU IFUNC85 C3 RET real ARM64 FEX JIT header no stack watch 12 forged
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_l40_c_ifunc85_c3_ret_jit_header_no_stack_watch_plan.py'
      - 'native-engine/tools/kernix_g0_l40_c_ifunc85_c3_ret_jit_header_independent_gate.py'
      - '.github/workflows/kernix-g0-l40-c-ifunc85-c3-ret-jit-no-stack-hardware-watch.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-original-gnu-ifunc85-c3-ret-jit-header-no-stack-watch-one-FEX-PID:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require previous genuine GNU IFUNC85 entry caller and native zero store successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 41846530666 43068123299 43161732148; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$id --jq .conclusion)" = success
          done
      - name: Original source GNU ELF libc/ldso SHA-pinned triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Original 147 individually audited GNU source relocation targets
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43068123299
          name: KERNIX-G0-Original-147-Distinct-Source-Writer-Native-Receipts-147-Of-147-No-Loader-Closure
          github-token: ${{ github.token }}
          path: inputs/ledger147
      - name: Original pinned Linux ARM64 FEX native engine runtime
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43078736764
          name: KERNIX-G0-Parallel20-Shared-True-ARM64-FEX-Original-GNU-Runtime
          github-token: ${{ github.token }}
          path: inputs/FEX
      - name: Derive authentic IFUNC85 C3 RET source and JIT-header native GDB script without stack hardware watch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            native-engine/tools/kernix_g0_l40_c_ifunc85_c3_ret_jit_header_no_stack_watch_plan.py \
            native-engine/tools/kernix_g0_l40_c_ifunc85_c3_ret_jit_header_independent_gate.py
          python3 native-engine/tools/kernix_g0_l40_c_ifunc85_c3_ret_jit_header_no_stack_watch_plan.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . dist/C-ret-header-source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('dist/C-ret-header-source')
          d=json.loads((root/'KERNIX-G0-C-IFUNC85-C3-RET-JIT-Header-No-Stack-Hardware-Watch-SOURCE-ONLY.json').read_text())
          script=(root/'kernix-g0-c-original-ifunc85-c3-ret-jit-entry-no-stack-rwatch.gdb').read_bytes()
          assert d['native_GDB_script_sha256']==hashlib.sha256(script).hexdigest()
          assert d['original_source85_C3_RET_guest_RIP']=='0x8040c860d'
          assert d['guest_stack_hardware_watch_armed_in_this_test'] is False
          assert d['exact_original_guest_RET_hardware_stack_read_proven_by_plan'] is False
          print('KERNIX_G0_C_ORIGINAL_IFUNC85_RET_JIT_SOURCE_PLAN_ONLY_NO_GUEST_STACK_WATCH')
          PY
          B=inputs/FEX/kernix-parallel20-authentic-original-FEX-package.tar.gz
          test "$(sha256sum "$B" | cut -d ' ' -f1)" = "$(cat inputs/FEX/parallel20-package.sha256)"
          tar -C dist -xzf "$B"
          test -s dist/parallel20-package/FEXCore-lib/libFEXCore.so
          test -s dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64
      - name: Install genuine AArch64 GDB
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash native-engine/tools/kernix_ci_arm64_apt_mirror_failover.sh gdb
      - name: Execute FEX real source C3 RET JIT-header trace without hardware stack watch
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/dist/parallel20-package/FEXCore-lib"
          mkdir -p dist/C-ret-header-native
          set +e
          timeout -k 5s 180s gdb -q -nx -batch \
            -x dist/C-ret-header-source/kernix-g0-c-original-ifunc85-c3-ret-jit-entry-no-stack-rwatch.gdb \
            --args dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64 \
            dist/parallel20-package/original-source-pinned-root \
            >dist/C-ret-header-native/original-gnu-ifunc85-c3-ret-jit-header-without-stack-watch.gdb.log 2>&1
          rc=$?
          set -e
          echo "$rc" > dist/C-ret-header-native/gdb.exit
          grep -E '^KERNIX_G0_L40_C_IFUNC85_(C3_RET|RESOLVER|CALLER|TRUE|SAME)' \
            dist/C-ret-header-native/original-gnu-ifunc85-c3-ret-jit-header-without-stack-watch.gdb.log || true
          echo KERNIX_G0_C_ORIGINAL_C3_RET_JIT_HEADER_REAL_FEX_PROCESS_EXIT "$rc"
          test "$rc" = 0
      - name: Independently verify original GNU source RET JIT header and twelve forged source controls, not stack read
        shell: bash
        run: |
          set -euo pipefail
          python3 native-engine/tools/kernix_g0_l40_c_ifunc85_c3_ret_jit_header_independent_gate.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . dist/C-ret-header-native dist/C-ret-header-independent
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('dist/C-ret-header-independent/KERNIX-G0-C-IFUNC85-Original-C3-RET-JIT-Header-Real-Native-FEX-No-Stack-HW-Read.json')
          d=json.loads(p.read_text())
          assert d['original_GNU_IFUNC85_C3_guest_JIT_header_reached'] is True
          assert d['original_GNU_IFUNC85_C3_guest_RIP']=='0x8040c860d'
          assert len(d['twelve_forged_C3_JIT_guest_header_events_rejected'])==12
          assert d['actual_original_C3_RET_stack_hardware_read_proven'] is False
          assert d['full_original_dynamic_relocation_closure_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_C_ORIGINAL_IFUNC85_NATIVE_C3_JIT_HEADER_SOURCE_PROVEN_NOT_HW_RET_READ')
          PY
      - name: Preserve true GNU FEX JIT trace and diagnostic failure, no RET read certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-C-IFUNC85-Original-C3-RET-FEX-JIT-Header-No-Stack-HW-Watch-Independent
          path: |
            dist/C-ret-header-native/original-gnu-ifunc85-c3-ret-jit-header-without-stack-watch.gdb.log
            dist/C-ret-header-native/gdb.exit
            dist/C-ret-header-independent/KERNIX-G0-C-IFUNC85-Original-C3-RET-JIT-Header-Real-Native-FEX-No-Stack-HW-Read.json
          retention-days: 30
          if-no-files-found: warn
