          archive = ZipFile(BytesIO(base64.b64decode(b64)))
          assert archive.testzip() is None, 'Foundation archive CRC mismatch'
          paths = archive.namelist()
          assert len(paths)==7, paths
          for name in paths:
              if name.startswith('src/com/rm11/autocore/runtime/') and name.endswith('.java'):
                  target = Path('app/src/main/java')/name.removeprefix('src/')
              elif name.startswith('test/com/rm11/autocore/runtime/') and name.endswith('.java'):
                  target = Path('app/src/test/java')/name.removeprefix('test/')
              elif name=='ARCHITECTURE.md':
                  target = Path('docs/BIONIC-ARM64EC-FOUNDATION.md')
              else:
                  raise RuntimeError('Unexpected source archive path: '+name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(name))
              print('Installed',target)

          app = Path('app/build.gradle')
          s = app.read_text()
          assert s.count('versionCode 24')==1, 'Expected v2.4.24 source, refusing an accidental downgrade'
          assert s.count("versionName '2.4.24-alpha'")==1
          s=s.replace('versionCode 24','versionCode 25',1)
          s=s.replace("versionName '2.4.24-alpha'","versionName '2.5.0-foundation'",1)
          app.write_text(s)

          check = Path('scripts-check.py')
          s=check.read_text()
          assert "'versionCode 24'" in s and "versionName '2.4.24-alpha'" in s
          s=s.replace("'versionCode 24'","'versionCode 25'")
          s=s.replace("versionName '2.4.24-alpha'","versionName '2.5.0-foundation'")
          check.write_text(s)

          main=Path('app/src/main/java/com/rm11/autocore/MainActivity.java')
          s=main.read_text()
          needle='        Button auditButtonV2417 = action('
          assert s.count(needle)==1, 'MainActivity UI location changed; cannot safely insert foundation status control'
          widget=r"""        // Read-only foundation readiness UI. NOT a claim that Win32 programs run.
                  Button foundationButton = action("RM11 v2.5.0: فحص بنية Bionic ARM64EC الجديدة");
                  TextView foundationView = label("الفحص يوضح الجاهزية البنيوية فقط؛ لا يشغل ألعاب Windows.", 14, 0xFFD1E0F5, false);
                  foundationView.setTextIsSelectable(true);
                  foundationButton.setOnClickListener(v -> {
                      foundationButton.setEnabled(false);
                      scanExecutor.execute(() -> {
                          String report;
                          try {
                              com.rm11.autocore.runtime.RuntimeLayout layout = new com.rm11.autocore.runtime.RuntimeLayout(
                                  getFilesDir().toPath(), java.nio.file.Paths.get(getApplicationInfo().nativeLibraryDir));
                              com.rm11.autocore.runtime.RuntimeAssessment assessment =
                                  com.rm11.autocore.runtime.RuntimeAssessment.inspect(layout);
                              report = "Foundation: " + assessment.state() + "\n" +
                                  String.join("\n", assessment.blockers()) + "\n" +
                                  "ImageFs الجديد لم يُجهَّز من الحزمة القديمة تلقائياً.\n" +
                                  "فحص بنيوي فقط: IPC وWin32 وFEX الفعلي والرسوميات غير مثبتة.";
                          } catch (Exception ex) {
                              report = "FOUNDATION CHECK ERROR: " + ex.getClass().getSimpleName() + ": " + ex.getMessage();
                          }
                          final String result = report;
                          runOnUiThread(() -> {
                              foundationView.setText(result);
                              foundationButton.setEnabled(true);
                          });
                      });
                  });
                  body.addView(foundationButton, margins(0, 0, 0, 8));
                  body.addView(foundationView, margins(0, 0, 0, 12));

          """
          assert 'RM11 v2.5.0: فحص بنية Bionic ARM64EC الجديدة' not in s
          s=s.replace(needle, widget+needle,1)
          main.write_text(s)
          print('Staged v2.5.0 foundation; no production Wine/FEX launch integration is claimed')
          PYFOUNDATION

          # Host-only tests. The Win32 runtime remains intentionally NOT verified.
          mkdir -p "$RUNNER_TEMP/foundation-host"
          javac --release 17 -encoding UTF-8 -d "$RUNNER_TEMP/foundation-host"   app/src/main/java/com/rm11/autocore/runtime/*.java   app/src/test/java/com/rm11/autocore/runtime/FoundationSelfTest.java
          java -cp "$RUNNER_TEMP/foundation-host" com.rm11.autocore.runtime.FoundationSelfTest
          python3 tools/compile_shaders.py
          python3 scripts-check.py
          gradle --no-daemon :app:testDebugUnitTest
      - name: Build and sign foundation APK with existing stable certificate
        shell: bash
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |-
          set -euo pipefail
          test -n "${RM11_RELEASE_KEYSTORE_B64:-}" && test -n "${RM11_RELEASE_PASSWORD:-}"
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rm11-release.p12"
          chmod 600 "$RUNNER_TEMP/rm11-release.p12"
          export RM11_RELEASE_KEYSTORE="$RUNNER_TEMP/rm11-release.p12"
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/certs.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "versionCode='25' versionName='2.5.0-foundation'"
          python3 - <<'PYAPK'
          from zipfile import ZipFile
          apk='app/build/outputs/apk/release/app-release.apk'
          with ZipFile(apk) as a:
              for f in ('assets/runtime/rm11-wine-stack.zip','assets/rm11-win32-smoke-v2420.exe',
                        'lib/arm64-v8a/libwineprobe.so','lib/arm64-v8a/libwine_ntdll.so',
                        'lib/arm64-v8a/libwineserverrm11.so','classes.dex'):
                  assert f in a.namelist() and a.getinfo(f).file_size>1000,f
          print('Signed foundation APK verified; Windows EXE support NOT validated')
          PYAPK
      - name: Publish signed, installable foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: RM11-v2.5.0-Bionic-Foundation-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit foundation source changes; do not check in runtime or secrets
        shell: bash
        run: |-
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle scripts-check.py app/src/main/java/com/rm11/autocore/MainActivity.java     app/src/main/java/com/rm11/autocore/runtime/     app/src/test/java/com/rm11/autocore/runtime/FoundationSelfTest.java     docs/BIONIC-ARM64EC-FOUNDATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'foundation: add fail-closed Bionic ARM64EC runtime layout and readiness UI'
            if ! git push origin HEAD:main; then
              echo '::warning::APK was built, but main rejected the tracked source update; source files remain only in this workflow job.'
            fi
          fi
