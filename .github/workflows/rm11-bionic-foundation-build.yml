name: RM11 v2.5.0 - Bionic ARM64EC foundation signed APK
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rm11-bionic-foundation-build.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout current tracked RM11 sources
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Reuse v2.4.24 signed Wine and FEX assets; no source rebuild
        uses: actions/download-artifact@v4
        with:
          name: RM11-v2.4.24-wineserver-NLS-fixed-SIGNED
          run-id: 39646117373
          repository: RM11Cor/RM11-WinCore
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup
        uses: android-actions/setup-android@v4
      - name: Android SDK, NDK and shader tools
        shell: bash
        run: |-
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools unzip binutils
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Restore previous verified runtime payload unchanged
        shell: bash
        run: |-
          set -euo pipefail
          python3 - <<'PYRESTORE'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          apks=list(Path('previous').glob('*.apk'))
          assert len(apks)==1, f'Expected one proven v2.4.24 APK: {apks}'
          assets=Path('app/src/main/assets')
          native=Path('app/src/main/jniLibs/arm64-v8a')
          (assets/'runtime').mkdir(parents=True,exist_ok=True)
          native.mkdir(parents=True,exist_ok=True)
          with ZipFile(apks[0]) as a:
              for src in ('assets/runtime/rm11-wine-stack.zip', 'assets/rm11-win32-smoke-v2420.exe'):
                  assert src in a.namelist(), src
                  dst=Path('app/src/main')/src
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  with a.open(src) as reader, dst.open('wb') as writer:
                      shutil.copyfileobj(reader,writer)
              restored=set()
              for path in a.namelist():
                  if path.startswith('lib/arm64-v8a/') and path.endswith('.so'):
                      filename=Path(path).name
                      if filename.startswith('librm11_'):
                          continue  # compile these native app libraries from current source
                      with a.open(path) as inp,(native/filename).open('wb') as out:
                          shutil.copyfileobj(inp,out)
                      restored.add(filename)
              required={'libwineprobe.so','libwine_ntdll.so','libwineserverrm11.so'}
              assert required<=restored, f'Native components missing: {required-restored}'
          with ZipFile(assets/'runtime/rm11-wine-stack.zip') as runtime:
              assert runtime.testzip() is None, 'Corrupted bundled Wine runtime'
              for name in ('bin/wine','bin/wineserver','share/wine/nls/l_intl.nls','lib/wine/aarch64-unix/ntdll.so','lib/wine/aarch64-windows/libwow64fex.dll'):
                  assert runtime.getinfo(name).file_size>1000,name
          print('Verified archived Wine and FEX payload; existing runtime unchanged')
          PYRESTORE
