name: CarX R3C23 Original Wine x64 Linux Process ABI and Initial Stack Source Proof
on:
  push:
    branches: [carx-pc-runtime-r3c23-wine-x86-process-launch-contract]
    paths:
      - 'carxpc/r3c23/**'
      - '.github/workflows/carx-pc-r3c23-authentic-wine-linux-x86-launch-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-wine-x86-guest-launch-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Fetch exact Ubuntu Noble Wine x86_64 source SHA-pinned 517MB rootfs
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C16-Ubuntu-Wine64-x64-Guest-Kernel32-Positive-Control
          repository: RM11Cor/RM11-WinCore
          run-id: 43598239873
          github-token: ${{ github.token }}
          path: /tmp/carx-r3c23-original
      - name: Validate original guest source provenance, no Android test claimed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('/tmp/carx-r3c23-original')
          f=root/'kernix-ubuntu-noble-wine-linux-x64-rootfs.tar.gz'
          provenance=json.loads((root/'guest-provenance.json').read_text())
          with f.open('rb') as fp: sha=hashlib.file_digest(fp,'sha256').hexdigest()
          assert sha==provenance['tar_sha256']=='86fafa2f5072aa2c47b7025ca591d945007584ecda37ae92eee208a95283f4b0'
          assert f.stat().st_size==517361543
          print('CARX_R3C23_EXACT_GUEST_WINE_SOURCE_SHA256_517MB_VERIFIED',sha)
          PY
      - name: Compile portable Java x86-64 Wine process virtual layout + real initial stack
        run: |
          set -euo pipefail
          mkdir -p /tmp/carx-r3c23-class /tmp/carx-r3c23-app-files
          javac -encoding UTF-8 -d /tmp/carx-r3c23-class \
            carxpc/r3c18/android/GuestRootfsInstaller.java \
            carxpc/r3c19/android/WineGuestElfPreflight.java \
            carxpc/r3c23/android/WineLinuxProcessLaunchContract.java \
            carxpc/r3c23/tests/WineLinuxProcessLaunchContractTests.java
      - name: Run authentic Wine64, ld-linux, kernel32 ELF/PE pinned x86 Linux stack and auxv on guest 4k and host 16k models
        run: |
          set -euo pipefail
          timeout 480s java -Xmx1024m -cp /tmp/carx-r3c23-class \
            com.r4.carxpc.WineLinuxProcessLaunchContractTests \
            /tmp/carx-r3c23-original/kernix-ubuntu-noble-wine-linux-x64-rootfs.tar.gz \
            /tmp/carx-r3c23-app-files | tee r3c23-authentic-guest-abi-evidence.log
          grep -Fq 'CARX_R3C23_REAL_ORIGINAL_WINE_X86_LINUX_PROCESS_ABI_STACK_AUXV_PASS host_page=4096' r3c23-authentic-guest-abi-evidence.log
          grep -Fq 'CARX_R3C23_REAL_ORIGINAL_WINE_X86_LINUX_PROCESS_ABI_STACK_AUXV_PASS host_page=16384' r3c23-authentic-guest-abi-evidence.log
          grep -Fq 'CARX_R3C23_REAL_WINE_BINARY_MUTATION_DENIED_AND_RESTORED' r3c23-authentic-guest-abi-evidence.log
          grep -Fq 'NOT_ANDROID_FEX_WINE_EXEC' r3c23-authentic-guest-abi-evidence.log
      - name: Verify launch plan fail-closed no fake Android native Wine execution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('carxpc/r3c23/android/WineLinuxProcessLaunchContract.java').read_text()
          for required in [
              'WineGuestElfPreflight.inspect(appFilesDir)',
              'AT_PHDR','AT_PHNUM','AT_PHENT','AT_BASE','AT_ENTRY','AT_RANDOM','AT_EXECFN',
              'STACK_BYTES=65536','new SecureRandom().nextBytes(random)',
              'guestHostMemoryReserved=false','guestWineCodeTranslated=false',
              'wineProcessExecuted=false','wineserverSpawned=false',
              'guestSyscallBridgeComplete=false','requires16kNativeSubpageProtection']:
              assert required in s,required
          for forbidden in ['Runtime.getRuntime().exec','ProcessBuilder','System.loadLibrary','native void','/system/bin/linker64']:
              assert forbidden not in s,forbidden
          print('CARX_R3C23_SOURCE_LOCKED_WINE_GUEST_ABI_PLAN_NO_EXEC_SPOOF_STATIC_AUDIT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CarX-R3C23-SourceAuthOriginalWine64-GNUldso-ActualX86LinuxABI_4k16k-SourceOnly
          path: r3c23-authentic-guest-abi-evidence.log
          retention-days: 14
