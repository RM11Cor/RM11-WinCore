name: RM11 Engine Rebuild - Audit Existing APK (No APK Published)

on:
  push:
    branches: [rm11-engine-rebuild]
    paths:
      - '.github/workflows/rm11-engine-rebuild-closure.yml'
      - 'tools/engine_closure_audit.py'
      - 'tools/engine_graphics_provider_audit.py'
      - 'tests/test_engine_graphics_provider_audit.py'
      - 'tools/engine_abi_audit.py'
      - 'tools/engine_native_session_supervisor.c'
      - 'tools/verify_android_native_supervisor.py'
      - 'tests/test_android_native_supervisor.py'
      - 'tests/test_engine_native_subreaper.py'
      - 'tests/test_engine_closure_audit.py'
      - 'tests/test_engine_abi_audit.py'
      - 'docs/ENGINE-REBUILD-ROADMAP.md'
      - 'app/src/main/java/com/rm11/autocore/engine/**'
      - 'tests/engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-legacy-runtime:
    name: Legacy closure gap audit - host only, NO game claims
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Exercise legacy Wine, Wine-builtin and complete-pinned-bundle cases
        run: |
          python3 -m unittest discover -s tests -p 'test_engine_closure_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_abi_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_engine_graphics_provider_audit.py' -v

      - name: Verify atomic new-engine data staging preserves Wine prefix
        run: |
          set -euo pipefail
          mkdir -p /tmp/rm11-engine-host-tests
          javac --release 17 -encoding UTF-8 -d /tmp/rm11-engine-host-tests \
            app/src/main/java/com/rm11/autocore/engine/*.java \
            tests/engine/EngineDataStagerSelfTest.java
          java -cp /tmp/rm11-engine-host-tests engine.EngineDataStagerSelfTest
          javac --release 17 -encoding UTF-8 -cp /tmp/rm11-engine-host-tests \
            -d /tmp/rm11-engine-host-tests \
            tests/engine/EngineHardwareWsiPolicySelfTest.java
          java -cp /tmp/rm11-engine-host-tests \
            engine.EngineHardwareWsiPolicySelfTest
          javac --release 17 -encoding UTF-8 -cp /tmp/rm11-engine-host-tests \
            -d /tmp/rm11-engine-host-tests \
            tests/engine/EngineOwnedProcessSessionSelfTest.java
          java -cp /tmp/rm11-engine-host-tests \
            com.rm11.autocore.engine.EngineOwnedProcessSessionSelfTest

      - name: Compile and host-test isolated native Wine subprocess subreaper
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -o /tmp/rm11-engine-subprocess-test-supervisor \
            tools/engine_native_session_supervisor.c
          python3 -m unittest discover -s tests \
            -p 'test_engine_native_subreaper.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_android_native_supervisor.py' -v
          javac --release 17 -encoding UTF-8 -cp /tmp/rm11-engine-host-tests \
            -d /tmp/rm11-engine-host-tests \
            tests/engine/EngineAndroidSupervisorBridgeSelfTest.java
          java -cp /tmp/rm11-engine-host-tests \
            com.rm11.autocore.engine.EngineAndroidSupervisorBridgeSelfTest \
            /tmp/rm11-engine-subprocess-test-supervisor

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Cross-compile native session supervisor for Android AArch64 API 29
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android29-clang"
          mkdir -p audit
          "$BIN/aarch64-linux-android29-clang" \
            -std=c11 -Wall -Wextra -Werror -O2 -fPIE -pie \
            -Wl,--build-id=sha1 -Wl,-z,max-page-size=16384 \
            -o audit/librm11_engine_supervisor.so \
            tools/engine_native_session_supervisor.c
          "$BIN/llvm-readelf" -h audit/librm11_engine_supervisor.so | tee audit/android-native-supervisor-elf-header.txt
          "$BIN/llvm-readelf" -l audit/librm11_engine_supervisor.so | tee audit/android-native-supervisor-elf-programs.txt
          "$BIN/llvm-readelf" -d audit/librm11_engine_supervisor.so | tee audit/android-native-supervisor-elf-dynamic.txt
          python3 tools/verify_android_native_supervisor.py \
            audit/librm11_engine_supervisor.so \
            --out audit/android-native-supervisor-abi.json

      - name: Download exact signed v4.0.89 baseline from its existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline audit
          gh release download v4.0.89-native-wine-activity \
            --repo RM11Cor/RM11-WinCore --pattern app-release.apk --dir baseline
          test -s baseline/app-release.apk
          echo '1f6c511e6949080e9ec41b6b08ae724cccc49d5c10491db16db9bb32371e34e8  baseline/app-release.apk' | sha256sum -c -

      - name: Audit installed-era Wine/FEX/X11/DXVK/Turnip binary closure
        run: |
          set -euo pipefail
          python3 tools/engine_closure_audit.py \
            baseline/app-release.apk --out audit/legacy-v489-engine-closure.json
          python3 tools/engine_abi_audit.py \
            baseline/app-release.apk --out audit/legacy-v489-engine-abi.json
          python3 tools/engine_graphics_provider_audit.py \
            baseline/app-release.apk --out audit/legacy-v489-graphics-provider-gap.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("audit/legacy-v489-engine-closure.json").read_text())
          assert a["apk_sha256"]=="1f6c511e6949080e9ec41b6b08ae724cccc49d5c10491db16db9bb32371e34e8"
          assert a["release_gate"]=="WAIT_FOR_REAL_ENGINE_INTEGRATION"
          assert a["would_publish_apk"] is False
          assert a["game_rendering_claim"]=="UNVERIFIED"
          abi=json.loads(Path("audit/legacy-v489-engine-abi.json").read_text())
          assert abi["apk_sha256"]==a["apk_sha256"]
          # A final ARM64EC DLL carries AMD64 machine + CHPE metadata.
          # The verified current APK must keep its byte-compatible native
          # launcher and its FEX hybrid metadata, not substitute x64 alone.
          assert abi["native_abi_closure"]=="STRUCTURALLY_COMPATIBLE"
          assert abi["guest_translation_abi"]=="STRUCTURALLY_COMPATIBLE"
          assert abi["guest_fex_pe"]["arm64ec_module"]["chpe_metadata"]=="PRESENT"
          assert abi["guest_fex_pe"]["arm64ec_module"]["chpe_version"] in (1,2)
          assert abi["game_rendering_claim"]=="UNVERIFIED"
          assert abi["would_publish_apk"] is False
          graphics=json.loads(Path("audit/legacy-v489-graphics-provider-gap.json").read_text())
          assert graphics["static_provider_gate"].startswith("BLOCKED")
          assert graphics["release_eligible"] is False
          assert "DXVK_LOADED" in graphics.get("unverified_runtime", []) or (
              "FEX_TRANSLATES_WIN64_DIRECT3D_CALLS" in graphics.get("unverified_runtime", [])
          )
          print("PASS: real APK ELF/PE graphics provider closure remains blocked; no false frame claim")
          PY

      - name: Publish closure GAP REPORT ONLY, never publish APK
        uses: actions/upload-artifact@v4
        with:
          name: RM11-engine-rebuild-baseline-closure-report-NO-APK
          path: |
            audit/legacy-v489-engine-closure.json
            audit/legacy-v489-engine-abi.json
            audit/legacy-v489-graphics-provider-gap.json
            audit/android-native-supervisor-abi.json
            audit/android-native-supervisor-elf-header.txt
            audit/android-native-supervisor-elf-programs.txt
            audit/android-native-supervisor-elf-dynamic.txt
            audit/librm11_engine_supervisor.so
          retention-days: 30
          if-no-files-found: error
