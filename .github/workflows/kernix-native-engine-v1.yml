name: KERNIX native engine v1 - independent integration checks
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'tools/kernix_native_planner.py'
      - 'tools/test_kernix_native_planner.py'
      - 'tools/kernix_runtime_resolver.py'
      - 'tools/test_kernix_runtime_resolver.py'
      - 'tools/kernix_native_artifact_gate.py'
      - 'tools/test_kernix_native_artifact_gate.py'
      - 'tools/kernix_component_payload_gate.py'
      - 'tools/test_kernix_component_payload_gate.py'
      - 'tools/kernix_wine_stage_archive_gate.py'
      - 'tools/test_kernix_wine_stage_archive_gate.py'
      - 'tools/kernix_wine_linux_deps.py'
      - 'tools/test_kernix_wine_linux_deps.py'
      - 'tools/kernix_wine_rootfs_plan.py'
      - 'tools/test_kernix_wine_rootfs_plan.py'
      - 'tools/kernix_x86_write_guest_gate.py'
      - 'tools/test_kernix_x86_write_guest_gate.py'
      - 'tools/kernix_elf64_fixture_check.py'
      - 'tools/test_kernix_elf64_fixture_check.py'
      - 'tools/kernix_elf64_rw_fixture_check.py'
      - 'tools/test_kernix_elf64_rw_fixture_check.py'
      - 'tools/kernix_elf64_heap_fixture_check.py'
      - 'tools/test_kernix_elf64_heap_fixture_check.py'
      - 'tools/kernix_component_registry.py'
      - 'tools/kernix_pe_imports.py'
      - 'tools/kernix_game_preflight.py'
      - 'components/**'
      - 'native-engine/**'
      - '.github/workflows/kernix-native-engine-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-engine-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KERNIX (do not build Bannerlator or change original)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PE parser, component registry and KERNIX native planner
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_kernix_pe_imports.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_game_preflight.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_component_registry.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_native_planner.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_runtime_resolver.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_native_artifact_gate.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_component_payload_gate.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_wine_stage_archive_gate.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_wine_linux_deps.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_wine_rootfs_plan.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_x86_write_guest_gate.py' -v
          python3 tools/kernix_x86_write_guest_gate.py
          python3 -m unittest discover -s tools -p 'test_kernix_elf64_fixture_check.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_elf64_rw_fixture_check.py' -v
          python3 -m unittest discover -s tools -p 'test_kernix_elf64_heap_fixture_check.py' -v
          python3 tools/kernix_native_artifact_gate.py sources components/upstream-source-lock.json
      - name: Validate G2 Android Java output contract (not device execution)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernix-g2-java-tests
          javac -d /tmp/kernix-g2-java-tests \
            native-engine/android-app/src/main/java/org/kernix/host/G2HostBoundaryProbe.java \
            native-engine/android-app/tests/org/kernix/host/G2HostBoundaryProbeTest.java
          java -cp /tmp/kernix-g2-java-tests org.kernix.host.G2HostBoundaryProbeTest
      - name: G2-B fail-closed app-private guest rootfs read-only path mapper test
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_guest_rootfs_readonly_test.cpp \
            -o /tmp/kernix-g2b-guest-rootfs-test
          /tmp/kernix-g2b-guest-rootfs-test
          echo KERNIX_G2B_ROOTFS_GUEST_PATH_BOUNDARY_UNIT_TEST_PASS_NOT_WINE

      - name: G2-B Linux guest rootfs scoped symlink resolution and over-root rejection
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_guest_rootfs_symlinks_test.cpp \
            -o /tmp/kernix-g2b-rootfs-scoped-symlink-test
          /tmp/kernix-g2b-rootfs-scoped-symlink-test
          echo KERNIX_G2B_READONLY_ROOTFS_SCOPED_SYMLINKS_CI_PASS_NO_WINE_EXECUTION

      - name: G2-B inspect real x86-64 ELF PT_INTERP and direct shared libraries in private rootfs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cat > /tmp/kernix-g2b-actual-dynamic-elf.c <<'C'
          #include <stdio.h>
          int main(void) {
            puts("This x86_64 ELF is a real linked fixture; G2-B must never execute it.");
            return 0;
          }
          C
          cc -O2 -fPIE -pie -Wl,--no-as-needed \
            /tmp/kernix-g2b-actual-dynamic-elf.c \
            -o /tmp/kernix-g2b-actual-dynamic-elf
          readelf -h /tmp/kernix-g2b-actual-dynamic-elf \
            | grep -Fq 'Advanced Micro Devices X86-64'
          readelf -l /tmp/kernix-g2b-actual-dynamic-elf \
            | grep -Fq '/lib64/ld-linux-x86-64.so.2'
          readelf -d /tmp/kernix-g2b-actual-dynamic-elf \
            | grep -Fq 'Shared library: [libc.so.6]'
          test -f /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          test -f /lib/x86_64-linux-gnu/libc.so.6
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_guest_elf64_dynamic_audit_test.cpp \
            -o /tmp/kernix-g2b-dynamic-audit-test
          /tmp/kernix-g2b-dynamic-audit-test \
            /tmp/kernix-g2b-actual-dynamic-elf \
            /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 \
            /lib/x86_64-linux-gnu/libc.so.6
          echo KERNIX_G2B_REAL_PT_INTERP_AND_DIRECT_ELF_DT_NEEDED_AUDIT_CI_PASS_NOT_ANDROID_WINE

      - name: G2-B enumerate actual transitive x86-64 ELF library chain without executing guest code
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p /tmp/kernix-g2b-real-libs
          cat > /tmp/kernix-g2b-real-libs/leaf.c <<'C'
          int kernix_leaf(void) { return 41; }
          C
          cat > /tmp/kernix-g2b-real-libs/mid.c <<'C'
          int kernix_leaf(void);
          int kernix_mid(void) { return kernix_leaf() + 1; }
          C
          cat > /tmp/kernix-g2b-real-libs/app.c <<'C'
          #include <stdio.h>
          int kernix_mid(void);
          int main(void) {
            puts("KERNIX_CI_GUEST_FIXTURE_MUST_NEVER_BE_EXECUTED");
            return kernix_mid() == 42 ? 0 : 1;
          }
          C
          cc -O2 -fPIC -shared -Wl,-soname,libkernix_leaf.so \
            /tmp/kernix-g2b-real-libs/leaf.c \
            -o /tmp/kernix-g2b-real-libs/libkernix_leaf.so
          cc -O2 -fPIC -shared -Wl,-soname,libkernix_mid.so \
            /tmp/kernix-g2b-real-libs/mid.c \
            -L/tmp/kernix-g2b-real-libs -Wl,--no-as-needed -lkernix_leaf \
            -o /tmp/kernix-g2b-real-libs/libkernix_mid.so
          cc -O2 -fPIE -pie -Wl,--no-as-needed \
            /tmp/kernix-g2b-real-libs/app.c \
            -L/tmp/kernix-g2b-real-libs -lkernix_mid \
            -Wl,-rpath-link,/tmp/kernix-g2b-real-libs \
            -o /tmp/kernix-g2b-real-libs/kernix-dynamic-app
          readelf -h /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            | grep -Fq 'Advanced Micro Devices X86-64'
          readelf -l /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            | grep -Fq '/lib64/ld-linux-x86-64.so.2'
          readelf -d /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            | grep -Fq 'Shared library: [libkernix_mid.so]'
          readelf -d /tmp/kernix-g2b-real-libs/libkernix_mid.so \
            | grep -Fq 'Shared library: [libkernix_leaf.so]'
          readelf -d /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            | grep -Fq 'Shared library: [libc.so.6]'
          test -f /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          test -f /lib/x86_64-linux-gnu/libc.so.6
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_guest_elf64_dependency_closure_test.cpp \
            -o /tmp/kernix-g2b-real-closure-test
          /tmp/kernix-g2b-real-closure-test \
            /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 \
            /lib/x86_64-linux-gnu/libc.so.6 \
            /tmp/kernix-g2b-real-libs/libkernix_mid.so \
            /tmp/kernix-g2b-real-libs/libkernix_leaf.so
          echo KERNIX_G2B_REAL_ELF_TRANSITIVE_CLOSURE_PASS_READ_ONLY_NO_WINE_NO_GUEST_EXEC

      - name: G2-B stage actual ELF64 PT_LOAD into anonymous read-only non-executable host memory
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -s /tmp/kernix-g2b-real-libs/kernix-dynamic-app
          test -s /lib/x86_64-linux-gnu/libc.so.6
          test -s /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_guest_elf64_readonly_image_test.cpp \
            -o /tmp/kernix-g2b-ro-ptload-test
          /tmp/kernix-g2b-ro-ptload-test \
            /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            /lib/x86_64-linux-gnu/libc.so.6 \
            /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          echo KERNIX_G2B_REAL_PTLOAD_HOST_WX_ISOLATION_AND_BSS_PASS_NO_GUEST_EXECUTION

      - name: G2-B actual x86-64 Linux initial stack argc argv envp AUXV ABI unit proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -s /tmp/kernix-g2b-real-libs/kernix-dynamic-app
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_guest_linux_x86_initial_stack_test.cpp \
            -o /tmp/kernix-g2b-linux-x86-stack-test
          /tmp/kernix-g2b-linux-x86-stack-test \
            /tmp/kernix-g2b-real-libs/kernix-dynamic-app
          echo KERNIX_G2B_REAL_X86_LINUX_STACK_ABI_HOST_UNIT_TEST_ONLY_NOT_GUEST_EXECUTION

      - name: G2-B integrate real dynamic ELF interpreter, PT_LOAD guest addresses and AUXV with collision checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          for f in /tmp/kernix-g2b-real-libs/{kernix-dynamic-app,libkernix_mid.so,libkernix_leaf.so}; do
            test -s "$f"
          done
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_g2b_guest_launch_plan_test.cpp \
            -o /tmp/kernix-g2b-guest-launch-plan-test
          /tmp/kernix-g2b-guest-launch-plan-test \
            /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 \
            /lib/x86_64-linux-gnu/libc.so.6 \
            /tmp/kernix-g2b-real-libs/libkernix_mid.so \
            /tmp/kernix-g2b-real-libs/libkernix_leaf.so
          echo KERNIX_G2B_REAL_ELF_LOADER_STACK_GUEST_VA_INTEGRATION_CI_PASS_NO_FEX_EXECUTION

      - name: G2-B copy real ELF and stack into kernel-selected host windows then enforce RO without FEX execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          for f in /tmp/kernix-g2b-real-libs/{kernix-dynamic-app,libkernix_mid.so,libkernix_leaf.so}; do
            test -s "$f"
          done
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I native-engine/android-host \
            native-engine/android-host/tests/kernix_g2b_guest_host_reservations_test.cpp \
            -o /tmp/kernix-g2b-host-no-access-test
          /tmp/kernix-g2b-host-no-access-test \
            /tmp/kernix-g2b-real-libs/kernix-dynamic-app \
            /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 \
            /lib/x86_64-linux-gnu/libc.so.6 \
            /tmp/kernix-g2b-real-libs/libkernix_mid.so \
            /tmp/kernix-g2b-real-libs/libkernix_leaf.so
          echo KERNIX_G2B_HOST_READONLY_PTLOAD_AND_STACK_MMAP_CI_PASS_NO_FEX_EXECUTION

      - name: Require independent source and fail-closed component policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from tools.kernix_component_registry import validate
          r=json.load(open("components/registry.json"))
          components=validate(r)
          assert not components, "No tested third-party binaries have yet been admitted"
          print("KERNIX_INDEPENDENT_SOURCE_FOUNDATION_PASS")
          PY
