name: KERNIX G0 C true GNU GLOB DAT80-83 native ARM64 FEX one pid four hardware writer traps RAW
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_l40_c_original_globdat80_83_real_fex_four_writers_plan.py'
      - '.github/workflows/kernix-g0-l40-c-first-four-true-original-globdat-one-fex-native-arm64.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-native-FEX-pid-four-original-GNU-hardware-writer-traps:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Require pinned original 147 individually audited source targets and independent pre-RELRO mixed40 snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 43068123299 43092287024 43093873518 43094785120; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$id --jq .conclusion)" = success
          done
      - name: Download immutable original GNU x86 ELF libc and ldso guest triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download independently attested original 147 writer source ledger
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43068123299
          name: KERNIX-G0-Original-147-Distinct-Source-Writer-Native-Receipts-147-Of-147-No-Loader-Closure
          github-token: ${{ github.token }}
          path: inputs/ledger147
      - name: Reuse original pinned FEXCore ARM64 compiled runtime
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43078736764
          name: KERNIX-G0-Parallel20-Shared-True-ARM64-FEX-Original-GNU-Runtime
          github-token: ${{ github.token }}
          path: inputs/FEX
      - name: Re-derive original source first four GLOB DAT and authenticate genuine GNU native watch script, no runtime claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_l40_c_original_globdat80_83_real_fex_four_writers_plan.py
          python3 native-engine/tools/kernix_g0_l40_c_original_globdat80_83_real_fex_four_writers_plan.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . dist/C-first4
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('dist/C-first4')
          doc=json.loads((root/'KERNIX-G0-L40-C-GNU-GLOB-DAT80-83-Four-Original-Writers-One-FEX-PID-SOURCE-ONLY.json').read_text())
          script=(root/'kernix-g0-l40-c-original-globdat80-83-one-real-fex-pid.gdb').read_text()
          assert doc['schema']=='kernix.g0.l40c.original-gnu-80-83-first-four-authentic-globdat-one-real-fex-pid-native-plan.v1'
          assert doc['source_indices']==[80,81,82,83]
          assert doc['real_native_hardware_writer_observations_proven_by_source']==0
          assert doc['stage_C_40_original_writers_one_process_proven'] is False
          assert doc['Android_Bionic_Wine_Proton_games_proven'] is False
          assert hashlib.sha256(script.encode()).hexdigest()==doc['original_fex_native_watchpoint_script_sha256']
          assert script.count('wp_class=gdb.WP_WRITE')==1
          print('KERNIX_G0_C_FIRST_FOUR_ORIGINAL_GNU_FEX_SHA_NATIVE_WATCHPOINT_SOURCE_READY_NO_RUNTIME_PROOF')
          PY
          B=inputs/FEX/kernix-parallel20-authentic-original-FEX-package.tar.gz
          test "$(sha256sum "$B" | cut -d ' ' -f1)" = "$(cat inputs/FEX/parallel20-package.sha256)"
          tar -C dist -xzf "$B"
          test -s dist/parallel20-package/FEXCore-lib/libFEXCore.so
          test -s dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64
      - name: Install genuine Linux ARM64 GDB hardware controller
        shell: bash
        run: |
          set -euo pipefail
          bash native-engine/tools/kernix_ci_arm64_apt_mirror_failover.sh gdb
          test "$(uname -m)" = aarch64
          command -v gdb
      - name: Run true four original GNU source 80-83 native writer watches in exactly one real FEX inferior PID
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/dist/parallel20-package/FEXCore-lib"
          mkdir -p dist/C-4-real-native
          set +e
          timeout -k 5s 180s gdb -q -nx -batch \
            -x dist/C-first4/kernix-g0-l40-c-original-globdat80-83-one-real-fex-pid.gdb \
            --args dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64 \
            dist/parallel20-package/original-source-pinned-root \
            >dist/C-4-real-native/original80-83-one-FEX-pid.gdb.log 2>&1
          rc=$?
          set -e
          echo "$rc" > dist/C-4-real-native/gdb.exit
          python3 - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          root=Path('dist/C-4-real-native')
          txt=(root/'original80-83-one-FEX-pid.gdb.log').read_text(errors='replace')
          rc=int((root/'gdb.exit').read_text().strip())
          plan=json.loads(Path('dist/C-first4/KERNIX-G0-L40-C-GNU-GLOB-DAT80-83-Four-Original-Writers-One-FEX-PID-SOURCE-ONLY.json').read_text())
          labels=('BEFORE','FOUR_HARDWARE_WRITERS_ARMED_ONE_PID',
                 'LIVE_HARDWARE_WRITER','FOUR_REAL_ORIGINAL_GLOB_DAT_80_83_WRITERS_SAME_ARM64_FEX_PID')
          ev={k:[json.loads(x) for x in re.findall(r'^KERNIX_G0_L40_C_'+k+r' (\{.*\})$',txt,re.M)] for k in labels}
          hits=ev['LIVE_HARDWARE_WRITER'];armed=ev['FOUR_HARDWARE_WRITERS_ARMED_ONE_PID']
          final=ev['FOUR_REAL_ORIGINAL_GLOB_DAT_80_83_WRITERS_SAME_ARM64_FEX_PID']
          rows=plan['four_genuine_original_ELF_GLOB_DAT_source_tuples']
          passed=(rc==0 and len(hits)==len(ev['BEFORE'])==4 and len(armed)==len(final)==1
              and [x['index'] for x in hits]==[80,81,82,83]
              and [x['index'] for x in ev['BEFORE']]==[80,81,82,83]
              and 'KERNIX_G0_L40_C_REJECT_' not in txt)
          if passed:
            pid=armed[0]['pid']
            passed=(pid>0 and final[0]['pid']==pid
              and all(x['pid']==pid and x['target']==rows[i]['target']
                 and x['value']==rows[i]['candidate']
                 and x['x4']==x['target'] and x['x13']==x['value']
                 and x['source_x86_3bytes']=='4c8908'
                 and x['FEX_guest_entry']=='0x80100fb8b'
                 and x['FEX_guest_size']==3 and x['FEX_native_ops']==2
                 and re.search(r'\bstlr\s+x13,\s*\[x4\]',x['instruction']) for i,x in enumerate(hits)))
          data={
            'schema':'kernix.g0.l40c.gnu-globdat80-83-four-real-native-writers-one-FEX-pid-raw.v1',
            'source_indices':[80,81,82,83],
            'four_original_source_hardware_store_witnesses_one_real_FEX_pid_raw':bool(passed),
            'same_real_arm64_FEX_inferior_pid':armed[0]['pid'] if armed else None,
            'source_before_events':ev['BEFORE'],
            'source_native_writer_events':hits,
            'native_original_gdb_trace_sha256':hashlib.sha256(txt.encode()).hexdigest(),
            'gdb_exit_code':rc,
            'independently_attested_same_process_writer_count':0,
            'stage_C_all_40_native_writers_one_pid_proven':False,
            'IRELATIVE85_resolver_or_zero_write_proven':False,
            'JUMP_SLOT_eager_or_lazy_symbol_binding_proven':False,
            'full_original_dynamic_loader_proven':False,
            'Android_Bionic_Wine_Proton_games_proven':False}
          (root/'source80-83-one-FEX-RAW-ONLY.json').write_text(json.dumps(data,indent=2)+'\n')
          for x in txt.splitlines():
            if x.startswith('KERNIX_G0_L40_C_'):print(x[:450])
          print('KERNIX_G0_C_FOUR_AUTHENTIC_NATIVE_WRITERS_SAME_REAL_FEX_PID_RAW',passed,'RC',rc,'HITS',len(hits))
          assert passed,'actual original 80..83 source ARM64 hardware writes NOT all proven in one inferior, no release claim'
          PY
      - name: Preserve native hardware traps and per-source failure evidence even on failed GDB process
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-C-Original-GNU-GLOBDAT80-83-Four-Native-Writers-One-FEX-PID-RAW-ONLY
          path: |
            dist/C-4-real-native/original80-83-one-FEX-pid.gdb.log
            dist/C-4-real-native/gdb.exit
            dist/C-4-real-native/source80-83-one-FEX-RAW-ONLY.json
          retention-days: 30
          if-no-files-found: warn
