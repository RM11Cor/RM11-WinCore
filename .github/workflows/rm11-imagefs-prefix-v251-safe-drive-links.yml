    - name: Build signed v2.5.1 APK and validate included Wine prefix asset
      shell: bash
      env:
        RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
        RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
      run: |-
        set -euo pipefail
        test -n "${RM11_RELEASE_KEYSTORE_B64:-}" && test -n "${RM11_RELEASE_PASSWORD:-}"
        printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rm11-release.p12"
        chmod 600 "$RUNNER_TEMP/rm11-release.p12"
        export RM11_RELEASE_KEYSTORE="$RUNNER_TEMP/rm11-release.p12"
        gradle --no-daemon :app:assembleRelease
        APK=app/build/outputs/apk/release/app-release.apk
        test -s "$APK"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
        grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/certs.txt"
        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "versionCode='26' versionName='2.5.1-imagefs-prefix'"
        python3 - <<'PYAPK'
        from zipfile import ZipFile
        apk='app/build/outputs/apk/release/app-release.apk'
        with ZipFile(apk) as a:
            for f in ('assets/runtime/rm11-wine-stack.zip','assets/rm11-win32-smoke-v2420.exe',
                      'lib/arm64-v8a/libwineprobe.so','lib/arm64-v8a/libwine_ntdll.so',
                      'lib/arm64-v8a/libwineserverrm11.so','assets/runtime/rm11-prefix-prepared.zip','classes.dex'):
                assert f in a.namelist() and a.getinfo(f).file_size>1000,f
        from io import BytesIO
        with ZipFile(apk) as a:
            with ZipFile(BytesIO(a.read('assets/runtime/rm11-prefix-prepared.zip'))) as prefix:
                assert prefix.testzip() is None
                for n in ('system.reg','user.reg','_rm11_symlinks.tsv'):
                    assert n in prefix.namelist(), n
        print('Signed v2.5.1 APK contains prepared prefix. Win32/IPC/FEX execution NOT verified')
        PYAPK
    - name: Upload v2.5.1 signed, installable foundation APK
      uses: actions/upload-artifact@v4
      with:
        name: RM11-v2.5.1-ImageFs-Prefix-Provisioned-SIGNED
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30
    - name: Commit migration source (never commit APK runtime or user data)
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add app/build.gradle scripts-check.py app/src/main/java/com/rm11/autocore/MainActivity.java \
          app/src/main/java/com/rm11/autocore/runtime/BionicLaunchEnvironment.java \
          app/src/main/java/com/rm11/autocore/runtime/ImageFsProvisioner.java \
          app/src/test/java/com/rm11/autocore/runtime/ImageFsProvisionerTest.java
        if ! git diff --cached --quiet; then
          git commit -m 'feat: v2.5.1 transactional ImageFs Wine prefix provisioning'
          if ! git push origin HEAD:main; then
            echo '::warning::Source push refused; signed APK is still preserved in Actions artifacts.'
          fi
        fi
