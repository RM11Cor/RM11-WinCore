name: CarX R3C16 Wine Native-Initialized Prefix FEX ARM64 Differential
on:
  push:
    branches: [carx-pc-runtime-r3c16-windows-bridge]
    paths:
      - '.github/workflows/carx-pc-r3c16-wine-prefix-differential.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-x64-create-positive-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install original distro Wine x64 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine wine64 xvfb xauth python3 file
          mkdir -p dist
          dpkg-query -W wine wine64 libwine >dist/native-distro-wine-packages.txt
      - name: Download exact R3C16 real Win64 API PE64 fixture
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C16-RealWin64-PE-And-Wine-Source-Boundary-NOT-Android-Execution
          repository: RM11Cor/RM11-WinCore
          run-id: 43596982241
          github-token: ${{ github.token }}
          path: inputs/pe
      - name: Execute full Win64 PE and save verified native Wine prefix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('inputs/pe/CarX_R3C16_Win64_VMem_TLS_Console_Smoke.exe')
          d=json.loads(Path('inputs/pe/win64-pe-source-audit.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==d['sha256']=='7a3b6d182d892d3ac4f3af4f5c5b56789e64beb2868fcf40993a752ab84306bf'
          PY
          export WINEARCH=win64
          export WINEDEBUG=-all
          export WINEPREFIX="$HOME/.carx-r3c16-known-working-native-prefix"
          export CARX_RUNROOT="$PWD"
          # One persistent Xvfb session for wineboot, real Win64 PE and the
          # server flush. Wine64 PE stdout alone does not prove a durable
          # prefix registry was written and fsynced.
          xvfb-run -a bash -euo pipefail -c '
            timeout 60s /usr/bin/wineboot -u >"$CARX_RUNROOT/dist/native-wineboot.log" 2>&1
            timeout 90s /usr/bin/wine "$CARX_RUNROOT/inputs/pe/CarX_R3C16_Win64_VMem_TLS_Console_Smoke.exe" >"$CARX_RUNROOT/dist/native-known-working-win64-pe.log" 2>&1
            timeout 35s /usr/bin/wineserver -w >"$CARX_RUNROOT/dist/native-wineserver-flush.log" 2>&1 || :
          '
          grep -Fq 'CARX_R3C16_REAL_WIN64_PE_WINAPI_VMEM_TLS_STDOUT_PASS' dist/native-known-working-win64-pe.log
          if ! test -f "$WINEPREFIX/system.reg"; then
            echo "::error::Win64 PE executed but Wine prefix registry absent after wineboot/server flush"
            find "$HOME" -maxdepth 3 -name system.reg -print | tee dist/prefix-registry-paths.txt
            cat dist/native-wineboot.log || :
            ls -la "$WINEPREFIX" || :
            exit 1
          fi
          test -d "$WINEPREFIX/drive_c/windows/system32"
          if [[ -e "$WINEPREFIX/drive_c/windows/system32/kernel32.dll" || -L "$WINEPREFIX/drive_c/windows/system32/kernel32.dll" ]]; then
            find "$WINEPREFIX/drive_c/windows/system32" -maxdepth 1 -iname "kernel32*" -ls >dist/native-prefix-kernel32-location.txt || :
          test -s dist/native-prefix-kernel32-location.txt || echo "Wine prefix system32 has no kernel32 link: package DLL search path is authoritative" >dist/native-prefix-kernel32-location.txt
          else
            echo "Native Wine PE passed; kernel32 provided by Wine builtin runtime, no materialized system32 DLL required" >dist/native-prefix-kernel32-location.txt
          fi
          /usr/bin/wine --version >dist/native-wine-version.txt
          tar -C "$HOME" -czf dist/verified-native-wine-prefix.tar.gz .carx-r3c16-known-working-native-prefix
          sha256sum dist/verified-native-wine-prefix.tar.gz >dist/prefix.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          d={'schema':'r4.carx.r3c16.native-positive-wine-prefix.v1',
             'exact_real_win64_PE_executed':True,
             'run_environment':'Ubuntu x86_64 native Wine',
             'wine_version':Path('dist/native-wine-version.txt').read_text().strip(),
             'prefix_verified_kernel32_location':Path('dist/native-prefix-kernel32-location.txt').read_text().strip(),
             'prefix_tar_sha256':Path('dist/prefix.sha256').read_text().split()[0],
             'android_bionic_executed':False}
          Path('dist/native-prefix-source-provenance.json').write_text(json.dumps(d,indent=2)+'\n')
          print('CARX_R3C16_NATIVE_WINE_FULL_PREFIX_WIN64_PE_POSITIVE_PASS',d['prefix_tar_sha256'])
          PY
      - name: Publish only verified native Wine prefix and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CarX-R3C16-NativeX64-Verified-WinePrefix-RealWin64API
          path: dist/
          retention-days: 14
          if-no-files-found: error

  compare-on-linux-arm64-fex:
    needs: [native-x64-create-positive-prefix]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Install ARM64 FEX native host requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 binutils libfmt9 libssl3t64 libxxhash0 libcap2 libdrm2 libepoxy0 libasound2t64 libsdl2-2.0-0
          mkdir -p dist
      - name: Retrieve pinned source-built FEX ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-FEX-real-ARM64-linux-ELF-not-Android
          repository: RM11Cor/RM11-WinCore
          run-id: 41505334933
          github-token: ${{ github.token }}
          path: inputs/fex
      - name: Retrieve verified Ubuntu Wine distro rootfs
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C16-Ubuntu-Wine64-x64-Guest-Kernel32-Positive-Control
          repository: RM11Cor/RM11-WinCore
          run-id: 43598239873
          github-token: ${{ github.token }}
          path: inputs/rootfs
      - name: Retrieve successful native Wine prefix from previous job
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C16-NativeX64-Verified-WinePrefix-RealWin64API
          path: inputs/prefix
      - name: Restore and source-verify native-verified Wine guest and FEX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('inputs/prefix')
          r=json.loads((p/'native-prefix-source-provenance.json').read_text())
          f=p/'verified-native-wine-prefix.tar.gz'
          assert hashlib.file_digest(f.open('rb'),'sha256').hexdigest()==r['prefix_tar_sha256']
          a=Path('inputs/rootfs')
          m=json.loads((a/'guest-provenance.json').read_text())
          assert hashlib.file_digest((a/'kernix-ubuntu-noble-wine-linux-x64-rootfs.tar.gz').open('rb'),'sha256').hexdigest()==m['tar_sha256']
          c=Path('inputs/fex/fex-elf-dependency-audit.json')
          d=json.loads(c.read_text())
          assert d['source_commit']=='02e24ca5c01ed0c864466ed573db347336f70170'
          print('CARX_R3C16_NATIVE_WINE_PREFIX_AND_FEX_SOURCE_INPUT_SHA256_PASS')
          PY
          sudo mkdir -p /tmp/carx-native-prefix-distro-rootfs
          sudo tar -xzf inputs/rootfs/kernix-ubuntu-noble-wine-linux-x64-rootfs.tar.gz -C /tmp/carx-native-prefix-distro-rootfs
          tar -xzf inputs/prefix/verified-native-wine-prefix.tar.gz -C "$HOME"
          test -f "$HOME/.carx-r3c16-known-working-native-prefix/system.reg"
          test -f /tmp/carx-native-prefix-distro-rootfs/usr/lib/x86_64-linux-gnu/wine/x86_64-windows/kernel32.dll
          test -f /tmp/carx-native-prefix-distro-rootfs/tmp/kernix-real-win32-smoke.exe
          cat inputs/prefix/native-wine-version.txt >dist/native-wine-version.txt
          cat inputs/rootfs/wine-guest-distro-package-manifest.txt | grep -E '^wine|^libwine' >dist/guest-distro-wine-packages.txt
          cat dist/guest-distro-wine-packages.txt
          sudo install -Dm755 inputs/fex/fex-linux-elf/Bin/FEX /usr/local/bin/FEX
          sudo install -Dm755 inputs/fex/fex-linux-elf/Bin/FEXServer /usr/local/bin/FEXServer
          for p in inputs/fex/fex-linux-elf/Bin/*; do test -f "$p" && chmod 755 "$p" || :; done
          mkdir -p "$HOME/.fex-emu"
          printf '%s\n' '{"Config":{"RootFS":"/tmp/carx-native-prefix-distro-rootfs"}}' >"$HOME/.fex-emu/Config.json"
      - name: Execute same PE under FEX with native-verified prefix versus fresh prefix
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/inputs/fex/fex-linux-elf/FEXCore/Source:$PWD/inputs/fex/fex-linux-elf/Source/Tools/FEXInterpreter"
          export FEX_ROOTFS=/tmp/carx-native-prefix-distro-rootfs
          export WINEARCH=win64
          export WINEDLLPATH=/usr/lib/x86_64-linux-gnu/wine
          export WINEDEBUG=+module,+err
          fex="$PWD/inputs/fex/fex-linux-elf/Bin/FEX"
          export WINEPREFIX="$HOME/.carx-r3c16-known-working-native-prefix"
          set +e
          timeout 100s "$fex" /usr/lib/wine/wine64 /tmp/kernix-real-win32-smoke.exe >dist/fex-native-positive-prefix.log 2>&1
          a=$?
          export WINEPREFIX="$HOME/.carx-r3c16-fex-fresh-prefix"
          timeout 100s "$fex" /usr/lib/wine/wine64 /tmp/kernix-real-win32-smoke.exe >dist/fex-fresh-prefix.log 2>&1
          b=$?
          set -e
          export A="$a" B="$b"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          marker="CARX_R3C16_REAL_WIN64_PE_WINAPI_VMEM_TLS_STDOUT_PASS"
          d={'schema':'r4.carx.r3c16.native-preinitialized-prefix-versus-fex-fresh.v1',
             'android_bionic_executed':False,'wine_native_x64_PE_success_precondition':True}
          for suffix,key,env in [('native-positive-prefix','preinitialized','A'),('fresh-prefix','fresh','B')]:
              l=Path('dist/fex-'+suffix+'.log').read_text(errors='replace')
              n=int(os.environ[env])
              d[key]={'exit_code':n,'real_Win64_PE_executed_on_FEX':n==0 and marker in l,
                  'kernel32_missing':'could not load kernel32.dll' in l,
                  'error_lines':[x[:400] for x in l.splitlines() if 'err:' in x or 'kernel32' in x][-16:]}
          Path('dist/wine-prefix-FEX-differential.json').write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps(d,indent=2))
          PY
      - name: Upload actual prefix differential evidence regardless of failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarX-R3C16-FEX-Prefix-Differential-Actual-PE-Logs
          path: dist/
          retention-days: 14
          if-no-files-found: warn
      - name: Require real PE on FEX only if demonstrated, never infer from native
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('dist/wine-prefix-FEX-differential.json'))
          assert d['wine_native_x64_PE_success_precondition'] is True
          if d['preinitialized']['real_Win64_PE_executed_on_FEX']:
              print('CARX_R3C16_FEX_WIN64_PE_WITH_NATIVE_INITIALIZED_PREFIX_REAL_PASS')
          elif d['fresh']['real_Win64_PE_executed_on_FEX']:
              print('CARX_R3C16_FEX_WIN64_PE_WITH_FRESH_PREFIX_REAL_PASS')
          else:
              raise AssertionError('REAL_WIN64_PE_UNDER_FEX_STILL_UNPROVEN_AFTER_PREFIX_CONTROL')
          PY
