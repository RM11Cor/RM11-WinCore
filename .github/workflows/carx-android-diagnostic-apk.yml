name: CarX PortLab v1.1 - actual GameAssembly Win64 UNWIND_INFO and chain export for AOT
on:
  push:
    branches: [carx-street-pc-port-v1]
    paths:
      - '.github/workflows/carx-android-diagnostic-apk.yml'
      - 'app/**'
      - 'tests/UnityFormatProbeTest.java'
      - 'tests/UnitySerializedProbeTest.java'
      - 'tests/PeImportProbeTest.java'
      - 'tests/BundleCatalogReconcilerTest.java'
      - 'tests/Win64UnwindRecordFormatTest.java'
      - 'carx-signing/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit-and-permanent-arm64-vulkan-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java exact UnityFS IL2CPP and Unity SerializedFile adversarial source tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/header-unit-tests
          javac -d build/header-unit-tests \
            app/src/main/java/com/rm11cor/carxstreet/portlab/UnityFormatProbe.java \
            tests/UnityFormatProbeTest.java \
            app/src/main/java/com/rm11cor/carxstreet/portlab/UnitySerializedProbe.java \
            tests/UnitySerializedProbeTest.java
          java -cp build/header-unit-tests UnityFormatProbeTest
          java -cp build/header-unit-tests UnitySerializedProbeTest
          javac -d build/header-unit-tests app/src/main/java/com/rm11cor/carxstreet/portlab/PeImportProbe.java tests/PeImportProbeTest.java
          java -cp build/header-unit-tests PeImportProbeTest
          javac -d build/header-unit-tests app/src/main/java/com/rm11cor/carxstreet/portlab/BundleCatalogReconciler.java tests/BundleCatalogReconcilerTest.java
          java -cp build/header-unit-tests BundleCatalogReconcilerTest
          javac -d build/header-unit-tests app/src/main/java/com/rm11cor/carxstreet/portlab/Win64UnwindRecordFormat.java tests/Win64UnwindRecordFormatTest.java
          java -cp build/header-unit-tests Win64UnwindRecordFormatTest
          echo CARX_V110_WIN64_PDATA_XDATA_UNWIND_ORIGINAL_SOURCE_BOUNDARY_TESTS_PASS
          echo CARX_V090_SAF_BUNDLE_RECONCILIATION_DIAGNOSTIC_CLASSIFICATION_TESTS_COMPLETED
      - name: Restore only the original dedicated immutable CarX signing identity
        shell: bash
        env:
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RM11_RELEASE_PASSWORD" || { echo 'No permanent signing secret: fail closed'; exit 1; }
          test -s carx-signing/carx-release.p12.enc.b64
          umask 077
          base64 -d carx-signing/carx-release.p12.enc.b64 >"$RUNNER_TEMP/carx-signer.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/carx-signer.enc" \
            -out "$RUNNER_TEMP/carx-release.p12" \
            -pass env:RM11_RELEASE_PASSWORD
          chmod 600 "$RUNNER_TEMP/carx-release.p12"
          keytool -list -v -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/carx-release.p12" -alias carx-release \
            -storepass "$RM11_RELEASE_PASSWORD" |
            grep -F 'SHA256: 73:75:9B:89:05:48:A1:CC:52:CC:51:3C:E8:59:01:3E:0E:2C:08:84:25:8F:66:EE:19:DA:45:E5:9B:30:E2:BC'
          echo "CARX_STABLE_KEYSTORE=$RUNNER_TEMP/carx-release.p12" >>"$GITHUB_ENV"
      - name: Android SDK 35 NDK and CMake for genuine Vulkan C++ ARM64 ELF
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          if ! test -d "$ANDROID_HOME/ndk" || ! find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            "$SDKMANAGER" --install "ndk;27.2.12479018"
          fi
          if ! test -d "$ANDROID_HOME/cmake" || ! find "$ANDROID_HOME/cmake" -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            "$SDKMANAGER" --install "cmake;3.22.1"
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -print
          find "$ANDROID_HOME/cmake" -mindepth 1 -maxdepth 1 -type d -print
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ORIGINAL independent ARM64 C++ Vulkan JNI and permanent-signed Android release
        shell: bash
        env:
          CARX_STABLE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CARX_STABLE_PASSWORD"
          test -s "$CARX_STABLE_KEYSTORE"
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            dist/CarXStreet_PC_PortLab_v1.1.0_Permanent_Signed.apk
          sha256sum dist/CarXStreet_PC_PortLab_v1.1.0_Permanent_Signed.apk >dist/SHA256.txt
      - name: Independently verify permanent CarX certificate app versionCode 7 and native ELF
        shell: bash
        run: |
          set -euo pipefail
          apk=dist/CarXStreet_PC_PortLab_v1.1.0_Permanent_Signed.apk
          signature=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signature"
          grep -Fqi 'Signer #1 certificate SHA-256 digest: 73759b890548a1cc52cc513ce859013e0e2c0884258f66ee19da45e59b30e2bc' <<<"$signature"
          if ! grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$signature" &&
             ! grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<<"$signature"; then
            echo 'No verified Android APK v2/v3 signature'; exit 1
          fi
          info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -Fq "package: name='com.rm11cor.carxstreet.portlab' versionCode='11' versionName='1.1.0-carx-unwind-xdata-chain-export'" <<<"$info"
          unzip -Z1 "$apk" | grep -Fxq 'lib/arm64-v8a/libcarx_native_probe.so'
          count=$(unzip -Z1 "$apk" | grep '^lib/' | grep -c '\.so$')
          test "$count" -eq 1
          unzip -p "$apk" lib/arm64-v8a/libcarx_native_probe.so >"$RUNNER_TEMP/libcarx_native_probe.so"
          readelf -h "$RUNNER_TEMP/libcarx_native_probe.so" | grep -Fq 'AArch64'
          echo CARX_V110_ORIGINAL_WIN64_UNWIND_XDATA_EXPORT_CERT_VCODE11_READY_FOR_PHONE_TEST
      - name: Preserve correct scope for actual device-side JNI Vulkan verification
        shell: bash
        run: |
          set -euo pipefail
          cat >dist/RELEASE_SCOPE.txt <<'EOF'
          CarX Street PortLab v1.0.0 adds bounded original GameAssembly x86-64 code sample export for AOT translation; this is NOT a playable port.
          This app includes original independent JNI C++ ARM64 native code.
          It calls Android Vulkan system API to enumerate GPU, extensions and memory.
          No native CarX game engine or original Windows executable is executed.
          Previously successful native Vulkan GPU clear/readback is preserved.
          NEW: original GameAssembly.dll and UnityPlayer.dll bounded PE import scans
          using user-approved Android SAF tree permissions, no Termux path access.
          NEW: compare distinct physical Windows64 bundle filenames with
          catalog-referenced bundle names, never infer file missing from counts.
          Android word occurrence is not an Android-target asset proof.
          New v1.1: each owner-selected GameAssembly PE function sample
          additionally includes Win64 .xdata UNWIND_INFO actual bytes,
          a bounded source-verified CHAININFO link traversal and SHA256.
          This validates source function boundaries, not executable CarX
          game behavior or any gameplay frame.
          New v1.0: user-initiated extraction of small original Windows
          x64 GameAssembly RUNTIME_FUNCTION code slices via SAF, total
          <= 256 samples * 320 bytes, into owner-selected offline ZIP.
          This is the first REAL original game-code input for static AOT.
          The original 142MB DLL and all game assets remain untouched.
          v0.8 detected 1 unaccepted physical bundle name plus 1 ambiguous
          Windows64 catalog reference. They are source-name classification
          gaps, not evidence of missing assets or source count exhaustion.
          None of the 22GB original game contents are copied or distributed.
          The user report must verify actual source read success.
          No game Vulkan surface, swapchain or first gameplay frame is rendered.
          User selected PC game files remain read-only and offline.
          Android appID com.rm11cor.carxstreet.portlab, versionCode 11.
          Same protected permanent CarX signing certificate SHA256:
          73759b890548a1cc52cc513ce859013e0e2c0884258f66ee19da45e59b30e2bc
          Installs IN-PLACE over stable signed v0.3-v1.0; device test still pending.
          EOF
      - name: Upload permanent-signed actual ARM64 Vulkan native test APK and SHA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarXStreet-v1.1.0-Original-Win64-Unwind-Xdata-Chain-Permanent-Signed
          path: |
            dist/CarXStreet_PC_PortLab_v1.1.0_Permanent_Signed.apk
            dist/SHA256.txt
            dist/RELEASE_SCOPE.txt
          retention-days: 30
