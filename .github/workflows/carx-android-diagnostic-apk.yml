name: CarX Street PC Port Lab - real Android APK source inspector
on:
  push:
    branches: [carx-street-pc-port-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out isolated CarX Street port branch
        uses: actions/checkout@v4
      - name: JDK 17 for Android Gradle plugin 8.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install platform 35 directly
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable diagnostic APK, not a game runtime
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK for phone-side PC files scan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarXStreet-PC-PortLab-v0.1.0-File-Inspector-Only-ARM64-Gate-Open
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
