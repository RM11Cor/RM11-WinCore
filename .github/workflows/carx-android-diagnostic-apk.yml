name: CarX Street PC Port Lab - real Android APK source inspector
on:
  push:
    branches: [carx-street-pc-port-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out isolated CarX Street port branch
        uses: actions/checkout@v4
      - name: JDK 17 for Android Gradle plugin 8.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 35
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable diagnostic APK, not a game runtime
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK for phone-side PC files scan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarXStreet-PC-PortLab-v0.1.0-File-Inspector-Only-ARM64-Gate-Open
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
