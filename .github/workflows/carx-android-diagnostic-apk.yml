name: CarX Street PC PortLab v0.4 - Unity SerializedFile and IL2CPP header evidence
on:
  push:
    branches: [carx-street-pc-port-v1]
    paths:
      - '.github/workflows/carx-android-diagnostic-apk.yml'
      - 'app/**'
      - 'tests/UnityFormatProbeTest.java'
      - 'tests/UnitySerializedProbeTest.java'
      - 'carx-signing/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  permanent-signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check original UnityFS and IL2CPP header parser
        run: |
          set -euo pipefail
          mkdir -p build/header-test
          javac -d build/header-test \
            app/src/main/java/com/rm11cor/carxstreet/portlab/UnityFormatProbe.java \
            tests/UnityFormatProbeTest.java \
            app/src/main/java/com/rm11cor/carxstreet/portlab/UnitySerializedProbe.java \
            tests/UnitySerializedProbeTest.java
          java -cp build/header-test UnityFormatProbeTest
          java -cp build/header-test UnitySerializedProbeTest
      - name: Verify and decrypt permanent CARX signing key from protected secret
        shell: bash
        env:
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RM11_RELEASE_PASSWORD" || { echo 'Missing signing secret. Debug fallback forbidden.'; exit 1; }
          test -s carx-signing/carx-release.p12.enc.b64
          umask 077
          base64 -d carx-signing/carx-release.p12.enc.b64 >"$RUNNER_TEMP/carx-signing.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/carx-signing.enc" \
            -out "$RUNNER_TEMP/carx-release.p12" \
            -pass env:RM11_RELEASE_PASSWORD
          chmod 600 "$RUNNER_TEMP/carx-release.p12"
          keytool -list -v -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/carx-release.p12" \
            -storepass "$RM11_RELEASE_PASSWORD" -alias carx-release |
            grep -F 'SHA256: 73:75:9B:89:05:48:A1:CC:52:CC:51:3C:E8:59:01:3E:0E:2C:08:84:25:8F:66:EE:19:DA:45:E5:9B:30:E2:BC'
          echo "CARX_STABLE_KEYSTORE=$RUNNER_TEMP/carx-release.p12" >>"$GITHUB_ENV"
      - name: Android SDK 35
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >>"$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build permanently signed release, never debug APK
        env:
          CARX_STABLE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CARX_STABLE_PASSWORD"
          test -s "$CARX_STABLE_KEYSTORE"
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CarXStreet_PC_PortLab_v0.4.0_Permanent_Signed.apk
          sha256sum dist/CarXStreet_PC_PortLab_v0.3.0_Permanent_Signed.apk >dist/SHA256.txt
      - name: Verify identical pinned CarX certificate package ID and higher versionCode
        shell: bash
        run: |
          set -euo pipefail
          apk=dist/CarXStreet_PC_PortLab_v0.3.0_Permanent_Signed.apk
          signature=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signature"
          grep -Fqi 'Signer #1 certificate SHA-256 digest: 73759b890548a1cc52cc513ce859013e0e2c0884258f66ee19da45e59b30e2bc' <<<"$signature"
          if ! grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$signature" &&
             ! grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<<"$signature"; then
            echo 'APK must be signed with a verified v2 or v3 certificate'; exit 1
          fi
          details=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$details" | head -n 5
          grep -Fq "package: name='com.rm11cor.carxstreet.portlab' versionCode='4' versionName='0.4.0-unity-serialized-probe'" <<<"$details"
          echo CARX_PERMANENT_CERT_AND_UPDATE_IDENTITY_VERIFIED_NO_DEBUG_SIGNATURE
      - name: Write accurate migration instructions
        shell: bash
        run: |
          set -euo pipefail
          cat >dist/RELEASE_SCOPE.txt <<'EOF'
          CarX Street PC PortLab v0.4.0 - read-only inspector, NOT a playable game.
          Permanent CarX-specific signing SHA256:
          73759b890548a1cc52cc513ce859013e0e2c0884258f66ee19da45e59b30e2bc
          Package ID com.rm11cor.carxstreet.portlab ; versionCode 4.
          The old v0.1/v0.2 debug APKs cannot be updated in place to v0.4.
          Export report then install the permanent-signed v0.3 first if migrating.
          v0.4 can update v0.3 IN PLACE with the same stable CarX certificate,
          same package identifier and strictly higher versionCode4.
          EOF
          cat >dist/release-notes.md <<'EOF'
          ## CarX Street PC PortLab v0.4.0 — serialized Unity version diagnostics

          **File inspector only — NOT a playable CarX Street Android game port.**

          Dedicated password-protected CarX permanent signing identity REUSED without rotation.
          Package: com.rm11cor.carxstreet.portlab, versionCode 4.
          Signer SHA256: 73759b890548a1cc52cc513ce859013e0e2c0884258f66ee19da45e59b30e2bc.

          **No uninstall required from v0.3:** Same dedicated CarX certificate
          and same application ID, incremented versionCode from 3 to 4.
          This v0.4 reads the first 256 bytes of original globalgamemanagers
          and resources.assets to seek a strict Unity editor version candidate.
          It reports the first 16 original global-metadata.dat bytes as HEX and
          scans only the first 4096 bytes for standard IL2CPP magic.
          No encryption conclusion, no extraction, no Android ARM64 runtime.
          If still on v0.1/v0.2, export report and uninstall old debug-signed
          inspector ONCE before entering this permanent signing channel.

          Same offline original Unity/IL2CPP header inspector plus bounded serialized headers.
          No original PC game binary is executed or converted by this APK.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: CarXStreet-v0.4.0-PERMANENT-SIGNED-Unity-Serialized-Header-Inspector
          path: |
            dist/CarXStreet_PC_PortLab_v0.3.0_Permanent_Signed.apk
            dist/SHA256.txt
            dist/RELEASE_SCOPE.txt
          retention-days: 30
