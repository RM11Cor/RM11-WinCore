        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43067719901
          name: KERNIX-G0-Original-DTRELA44-Two-Independent-FEX-ARM64-AWatch-Writers-32-Forgery-Controls
          github-token: ${{ github.token }}
          path: inputs/source44
