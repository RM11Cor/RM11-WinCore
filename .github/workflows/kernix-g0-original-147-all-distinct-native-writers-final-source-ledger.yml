          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43058296364 --jq .head_sha)" = e697eed96db9aa49cfdadf5a1e18b7911501f920
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/43062041734 --jq .conclusion)" = success
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/artifacts/13872068529 --jq .expired)" = false
          test "$(gh api repos/RM11Cor/RM11-WinCore/actions/artifacts/13873374524 --jq .expired)" = false
          echo KERNIX_G0_TRUE_NATIVE_GNU_147_SOURCE_WRITER_PROVENANCE_READY_NO_SINGLE_PROCESS_CLAIM
      - name: Download SHA-pinned original GNU libc and loader ELF triad
        uses: actions/download-artifact@v4
