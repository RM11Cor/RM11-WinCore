          assert d['independently_audited_original_DTRELA44_two_separate_AWATCH_native_guest_processes'] is True
          assert d['original_DTRELA44_raw_watch_only_run_known_fail_closed'] is True
          assert d['original_DTRELA44_native_hardware_proof_two_archived_run_ids']==[43058296364,43062041734]
          assert d['original_DTRELA44_native_hardware_proof_two_archived_artifact_ids']==[13872068529,13873374524]
          assert d['original_DTRELA44_awatch_adversarial_trace_rejections']==32
