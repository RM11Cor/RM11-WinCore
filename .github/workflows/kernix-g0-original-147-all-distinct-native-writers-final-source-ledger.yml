            inputs/prior146/KERNIX-G0-Original-147-Source-Ledger-146-Native-Writers-Only-Original44-Pending.json \
            inputs/source44/KERNIX-G0-Original-DTRELA44-Two-Independent-AWatch-Native-Writer-Receipt.json \
            dist/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json').read_text())
          assert d['schema']=='kernix.g0.original-gnu-libc-147-distinct-source-writer-receipts-specialized-dtrela44-after146.v1'
