name: KERNIX G2-E C3-D8C2 pinned FEX Android eighteen original ld-linux GPR frame and SSE memory instruction DEBUG probe (device unverified)
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2e-c3d8c2-android-original-ldso-eighteen-fex-debug-apk.yml'
      - 'native-engine/android-host/kernix_g2e_c3d8a_original_loader_handoff_barrier.h'
      - 'native-engine/android-host/kernix_g2e_c3d8c2_android_original_ldso_eighteen_fex_child.cpp'
      - 'native-engine/android-c3d8c2-original-fex-ldso-eighteen-probe-app/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-isolated-optin-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Read immutable verified Linux x86 source triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/guest
      - name: Download previous LGPL notices as licensed guest data provenance
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41851255385
          name: KERNIX-G2E-B-Private-Root-Fix-Signed-v0.27-APK
          github-token: ${{ github.token }}
          path: inputs/notices
      - name: Embed source hash verified original ELF as data, with original LGPL copyright notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          inp=Path("inputs/guest/original-guest")
          attest=json.loads(Path("inputs/guest/proven-guest-triad.json").read_text())
          assert attest["original_real_FEX_linux_arm64_execution_run"]==41842294261
          expected={
            "bin/kernix-g2e-dynamic-guest":(15976,"9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412"),
            "lib64/ld-linux-x86-64.so.2":(235408,"cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae"),
            "lib/x86_64-linux-gnu/libc.so.6":(2118168,"7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906")}
          assets=Path("native-engine/android-c3d8c2-original-fex-ldso-eighteen-probe-app/app/src/main/assets")
          assert {str(p.relative_to(inp)) for p in inp.rglob("*") if p.is_file()}==set(expected)
          for rel,(size,sha) in expected.items():
              raw=(inp/rel).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha
              assert attest["files"][rel]["sha256"]==sha
              out=assets/"original"/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(raw)
          apks=list(Path("inputs/notices").rglob("KERNIX-G2E-B-Private-Root-Fix-v0.27.apk"))
          assert len(apks)==1
          notices=assets/"third-party-notices"
          notices.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apks[0]) as apk:
              for name in ["GLIBC-LGPL-2.1.txt","GLIBC-Ubuntu-Cross-Copyright.txt","GLIBC-SOURCE-AND-PROVENANCE.txt"]:
                  raw=apk.read("assets/third-party-notices/"+name)
                  assert len(raw)>500
                  (notices/name).write_bytes(raw)
          assert all(sha in (notices/"GLIBC-SOURCE-AND-PROVENANCE.txt").read_text()
                     for _,sha in expected.values())
          print("KERNIX_C3D8C2_ORIGINAL_THREE_LINUX_X86_ELF_DATA_ONLY_LICENSES_AND_HASHES_PASS")
          PY
      - name: NDK and host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build git python3 pkg-config binutils
          SDK="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          test -x "$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" || "$SDKMANAGER" 'ndk;29.0.14206865'
          echo "KERNIX_NDK=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"
          mkdir -p dist
          cat > /tmp/kernix-cxx20-atomic-ref.cpp <<'CPP'
          #include <atomic>
          #if __cplusplus < 202002L
          #error C++20 required
          #endif
          #if !defined(__cpp_lib_atomic_ref)
          #error std::atomic_ref unavailable in Android NDK libc++
          #endif
          int main() { int count=0; std::atomic_ref<int> a(count); return a.load(); }
          CPP
          "$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android26 -std=c++20 -c \
            /tmp/kernix-cxx20-atomic-ref.cpp -o /tmp/kernix-cxx20-atomic-ref.o \
            >dist/ndk29-cxx20-atomic-ref.log 2>&1 || {
              cat dist/ndk29-cxx20-atomic-ref.log
              echo "::error::FEXCore requires C++20 std::atomic_ref missing in Android NDK" >&2
              exit 1
            }
          echo KERNIX_ANDROID_NDK_CXX20_ATOMIC_REF_COMPILED
      - name: Clone exact source with upstream submodules and license
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 - <<'PY'
          import json
          c=[x for x in json.load(open('components/upstream-source-lock.json'))['components'] if x['kind']=='fex']
          assert len(c)==1 and c[0]['repository']=='FEX-Emu/FEX' and c[0]['android_binary_built'] is False
          print(c[0]['git_commit'])
          PY
          )"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-upstream
          git -C /tmp/kernix-fex-upstream checkout --quiet --detach "$sha"
          git -C /tmp/kernix-fex-upstream submodule update --init --recursive --quiet
          test "$(git -C /tmp/kernix-fex-upstream rev-parse HEAD)" = "$sha"
          echo "FEX_PIN=$sha" >> "$GITHUB_ENV"
          git -C /tmp/kernix-fex-upstream submodule status --recursive > dist/submodules.txt
          cp /tmp/kernix-fex-upstream/LICENSE dist/FEX-UPSTREAM-LICENSE.txt
      - name: Core-only Android NDK configure and compilation
        shell: bash
        run: |
          set -euo pipefail
          # A documented, minimal, throwaway upstream-root CMake adaptation.
          # Do not patch game frontend into pretending to support Android.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/kernix-fex-upstream/CMakeLists.txt')
          s=p.read_text()
          a='elseif (NOT (WIN32 OR CMAKE_SYSTEM_NAME STREQUAL "Linux"))'
          assert s.count(a)==1
          s=s.replace(a,a.replace('))',' OR ANDROID))'),1)
          a='add_subdirectory(Source/)'
          assert s.count(a)==1
          s=s.replace(a,'# Audit: do not build Linux-only executable frontend',1)
          p.write_text(s)
          # Android Bionic shared libraries require resolved dependencies
          # rather than relying on Linux ELF's permissive unresolved symbols.
          # These are genuine original FEX static libraries, not stubs.
          core=Path('/tmp/kernix-fex-upstream/FEXCore/Source/CMakeLists.txt')
          cs=core.read_text()
          assert 'AddLibrary(${PROJECT_NAME}_shared SHARED)' in cs
          assert 'target_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)' not in cs
          cs += '\n# CI-only Android fully linked original dependencies\n'
          cs += 'target_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)\n'
          core.write_text(cs)
          # Android Bionic does not declare glibc's getdents64 function.
          # Adapt the two actual Linux-kernel directory-entry calls through
          # Android's supported syscall() dispatcher; no fake return values.
          fileutils=Path('/tmp/kernix-fex-upstream/FEXCore/Source/Utils/FileUtils.cpp')
          fs=fileutils.read_text()
          anchor='#include <unistd.h>'
          assert fs.count(anchor)==1
          shim='''#include <sys/syscall.h>
          #ifdef __ANDROID__
          static inline ssize_t kernix_android_getdents64(int fd, void* buffer, size_t bytes) {
            return ::syscall(__NR_getdents64, fd, buffer, bytes);
          }
          #endif'''
          fs=fs.replace(anchor,anchor+'\n'+shim,1)
          assert fs.count('ssize_t read = getdents64(')==2
          fs=fs.replace('ssize_t read = getdents64(','ssize_t read = kernix_android_getdents64(')
          fileutils.write_text(fs)
          PY
          # G1 Linux A/B 41698161432 proved a host Config-order fault:
          # never patch genuine FEXCore SYSCALL register spilling on Android.
          # Only the pre-existing Android/Bionic build portability changes
          # are allowed in this ephemeral upstream checkout.
          git -C /tmp/kernix-fex-upstream diff -- \
            CMakeLists.txt FEXCore/Source/CMakeLists.txt FEXCore/Source/Utils/FileUtils.cpp \
            > dist/audit-only-cmake-diff.patch
          test -s dist/audit-only-cmake-diff.patch
          ! git -C /tmp/kernix-fex-upstream diff --name-only -- \
            FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp \
            FEXCore/Source/Interface/Core/JIT/BranchOps.cpp | grep .
          ! grep -Fq 'KERNIX v0.16 Android-only fix' dist/audit-only-cmake-diff.patch
          echo KERNIX_FEX_UPSTREAM_SYSCALL_UNPATCHED_AFTER_G1_HOST_MODE_FIX
          set +e
          timeout 240 cmake -S /tmp/kernix-fex-upstream -B /tmp/kernix-fex-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$KERNIX_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \
            -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_TESTING=OFF -DENABLE_FEX_ALLOCATOR=ON \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_GDB_SYMBOLS=OFF -DENABLE_WERROR=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE -DTUNE_CPU=generic \
            >dist/configure.log 2>&1
          conf=$?
          build=125
          if [ "$conf" -eq 0 ]; then
            timeout 780 cmake --build /tmp/kernix-fex-android --target FEXCore_shared \
              --parallel 2 >dist/build.log 2>&1
            build=$?
          else
            echo 'Not attempted: CMake configuration failed' >dist/build.log
          fi
          set -e
          echo "CONFIGURE_RC=$conf" >> "$GITHUB_ENV"
          echo "BUILD_RC=$build" >> "$GITHUB_ENV"
          tail -n 40 dist/configure.log
          tail -n 50 dist/build.log
      - name: Audit source-built original FEXCore and link C3-D7D actual x86 ELF plus Linux stack child for Android Bionic ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIGURE_RC" -eq 0 && test "$BUILD_RC" -eq 0
          BIN="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CORE="$(find /tmp/kernix-fex-android -type f -name libFEXCore.so | head -1)"
          test -s "$CORE"
          "$BIN/llvm-readelf" -h -d -W "$CORE" >dist/c3d8c2-original-fex-android-abi.txt
          grep -Fq 'Machine:                           AArch64' dist/c3d8c2-original-fex-android-abi.txt
          grep -Fq 'Shared library: [libc.so]' dist/c3d8c2-original-fex-android-abi.txt
          ! grep -Eq 'Shared library: \[(libc.so.6|libstdc\+\+.so.6|libpthread.so.0)\]' dist/c3d8c2-original-fex-android-abi.txt
          ROOT=native-engine/android-c3d8c2-original-fex-ldso-eighteen-probe-app/app/src/main
          mkdir -p "$ROOT/jniLibs/arm64-v8a" "$ROOT/assets/third-party-notices"
          cp "$CORE" "$ROOT/jniLibs/arm64-v8a/libFEXCore.so"
          sha256sum "$CORE" | awk '{print $1}' >"$ROOT/assets/fexcore.sha256"
          cp dist/FEX-UPSTREAM-LICENSE.txt "$ROOT/assets/third-party-notices/FEX-UPSTREAM-MIT-LICENSE.txt"
          cp dist/submodules.txt "$ROOT/assets/third-party-notices/FEX-UPSTREAM-SUBMODULES.txt"
          cp dist/audit-only-cmake-diff.patch "$ROOT/assets/third-party-notices/FEX-ANDROID-NDK-PORTABILITY-PATCH.txt"
          printf '%s\n' 'Source-pinned original FEXCore from FEX-Emu/FEX at 02e24ca5c01ed0c864466ed573db347336f70170, MIT. Android-only CI CMake, Bionic getdents64 portability patch recorded. No original x86 ELF dynamic loader or Wine execution.' >"$ROOT/assets/third-party-notices/FEX-SOURCE-PROVENANCE.txt"
          CHILD="$ROOT/jniLibs/arm64-v8a/libkernix_g2ec3d8c2_ldso_eighteen_fex_child.so"
          "$BIN/aarch64-linux-android26-clang++" \
            -std=c++20 -O2 -fPIE -pie -static-libstdc++ \
            -Wall -Wextra -Wno-unused-parameter -Wl,--no-undefined \
            -Wl,-z,max-page-size=16384 -Wl,-rpath,'$ORIGIN' \
            -Inative-engine/android-host \
            -isystem /tmp/kernix-fex-upstream/FEXCore/include \
            -isystem /tmp/kernix-fex-upstream/External/fmt/include \
            -isystem /tmp/kernix-fex-upstream/External/unordered_dense/include \
            -isystem /tmp/kernix-fex-upstream/External/xxhash \
            -isystem /tmp/kernix-fex-android/include \
            -isystem /tmp/kernix-fex-android/generated \
            native-engine/android-host/kernix_g2e_c3d8c2_android_original_ldso_eighteen_fex_child.cpp \
            -L"$(dirname "$CORE")" -Wl,--no-as-needed -lFEXCore \
            -o "$CHILD" >dist/c3d8c2-native-compile.log 2>&1 || {
              tail -n 140 dist/c3d8c2-native-compile.log; exit 1;
            }
          "$BIN/llvm-readelf" -h -l -d -W "$CHILD" >dist/c3d8c2-native-abi.txt
          grep -Fq 'Machine:                           AArch64' dist/c3d8c2-native-abi.txt
          grep -Fq '/system/bin/linker64' dist/c3d8c2-native-abi.txt
          grep -Fq 'Shared library: [libFEXCore.so]' dist/c3d8c2-native-abi.txt
          grep -Fq 'Shared library: [libc.so]' dist/c3d8c2-native-abi.txt
          ! grep -Eq 'Shared library: \[(libc.so.6|libstdc\+\+.so.6)\]' dist/c3d8c2-native-abi.txt
          grep -aFq 'KERNIX_C3D8C2_ANDROID_DEVICE_SOURCE_ORIGINAL_LDSO_EIGHTEEN_FEX_INSTRUCTIONS_PASS' "$CHILD"
          grep -aFq -- '--kernix-c3d8c2-source-original-ldso-eighteen-instructions-v1' "$CHILD"
          sha256sum "$CHILD" | awk '{print $1}' >"$ROOT/assets/runner.sha256"
          sha256sum "$CHILD" >dist/c3d8c2-native-runner.sha256
          sha256sum "$CORE" >dist/c3d8c2-native-fexcore.sha256
          echo KERNIX_G2EC3D8C2_ANDROID_BIONIC_ORIGINAL_FEXCORE_X86_ELF_AND_LINUX_STACK_RUNNER_LINKED_NOT_DEVICE
      - name: Create distinctly packaged debug-signed opt-in test APK
        working-directory: native-engine/android-c3d8c2-original-fex-ldso-eighteen-probe-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug >../../dist/c3d8c2-gradle-debug-build.txt 2>&1 || {
            tail -n 140 ../../dist/c3d8c2-gradle-debug-build.txt
            exit 1
          }
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Audit debug APK assets, immutable original x86 source, source-locked original FEXCore and native child and isolated package
        shell: bash
        run: |
          set -euo pipefail
          APK=native-engine/android-c3d8c2-original-fex-ldso-eighteen-probe-app/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" >dist/c3d8c2-debug-apk-badging.txt
          grep -Fq "package: name='org.kernix.originalfexldso18' versionCode='1'" dist/c3d8c2-debug-apk-badging.txt
          "$APKSIGNER" verify --verbose "$APK" >dist/c3d8c2-debug-apk-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          apk=Path("native-engine/android-c3d8c2-original-fex-ldso-eighteen-probe-app/app/build/outputs/apk/debug/app-debug.apk")
          original={
            "bin/kernix-g2e-dynamic-guest":"9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412",
            "lib64/ld-linux-x86-64.so.2":"cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae",
            "lib/x86_64-linux-gnu/libc.so.6":"7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906"}
          native="lib/arm64-v8a/libkernix_g2ec3d8c2_ldso_eighteen_fex_child.so"
          core="lib/arm64-v8a/libFEXCore.so"
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert {n for n in names if n.startswith("lib/") and n.endswith(".so")}=={native,core}
              assert "classes.dex" in names
              assert hashlib.sha256(z.read(native)).hexdigest()==z.read("assets/runner.sha256").decode().strip()
              assert hashlib.sha256(z.read(core)).hexdigest()==z.read("assets/fexcore.sha256").decode().strip()
              assert b'KERNIX_C3D8C2_ANDROID_DEVICE_SOURCE_ORIGINAL_LDSO_EIGHTEEN_FEX_INSTRUCTIONS_PASS' in z.read(native)
              for opcode_text in (
                  b'ORIGINAL_LDSO_FIRST_TEN_SOURCE_X86_LEA_SIMD_OPS_VERIFIED=1',
                  b'ORIGINAL_SEVEN_CALL_PUSH_STACK_SLOTS_AND_VALUES_VERIFIED=1',
                  b'ORIGINAL_SOURCE_SUB_RSP_0X88_FRAME_EXECUTED=1',
                  b'ORIGINAL_SOURCE_MOV_GUEST_LOCAL_RDI_EXECUTED=1',
                  b'ORIGINAL_SOURCE_MOVAPS_GUEST_LOCAL_XMM1_EXECUTED=1',
                  b'ORIGINAL_MOVAPS_GUEST_LOCAL_ALIGNMENT_16_VERIFIED=1',
                  b'GUEST_RSP_EQUALS_ORIGINAL_RSP_MINUS_192=1',
                  b'SOURCE_NINETEENTH_RDTSC_EXECUTED=0',
                  b'SOURCE_GUEST_192_STACK_AND_HOST_STACK_RESTORED=1'):
                  assert opcode_text in z.read(native),opcode_text
              for key,sha in original.items():
                  assert hashlib.sha256(z.read("assets/original/"+key)).hexdigest()==sha
              for notice in ["GLIBC-LGPL-2.1.txt","GLIBC-Ubuntu-Cross-Copyright.txt","GLIBC-SOURCE-AND-PROVENANCE.txt"]:
                  assert "assets/third-party-notices/"+notice in names
              assert not any("wine" in n.lower() or "dxvk" in n.lower() for n in names)
              for license_name in ("FEX-UPSTREAM-MIT-LICENSE.txt","FEX-UPSTREAM-SUBMODULES.txt",
                                   "FEX-ANDROID-NDK-PORTABILITY-PATCH.txt","FEX-SOURCE-PROVENANCE.txt"):
                  assert "assets/third-party-notices/"+license_name in names
          print("KERNIX_C3D8C2_DEBUG_SIGNED_SEPARATE_ANDROID_APK_SOURCE_AUDIT_PASS_NOT_DEVICE")
          PY
          cp "$APK" dist/KERNIX-C3D8C2-Real-FEX-Original-Ldso-Eighteen-DEBUG.apk
          sha256sum dist/KERNIX-C3D8C2-Real-FEX-Original-Ldso-Eighteen-DEBUG.apk >dist/c3d8c2-debug-apk.sha256
          printf '%s\n' 'WARNING: This is a separately packaged, transient debug-signed probe (NOT persistent original release signer). No physical Android phone execution observed by CI. The opt-in child will run only four genuine original ld-linux guest opcodes through FEX. Complete glibc startup, Wine and games are NOT run.' >dist/NOT-AN-ANDROID-DEVICE-PASS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KERNIX-C3D8C2-Android-DEBUG-Real-FEX-Original-Ldso-18-APK
          path: |
            dist/KERNIX-C3D8C2-Real-FEX-Original-Ldso-Eighteen-DEBUG.apk
            dist/c3d8c2-debug-apk.sha256
            dist/c3d8c2-debug-apk-badging.txt
            dist/c3d8c2-native-elf.txt
            dist/NOT-AN-ANDROID-DEVICE-PASS.txt
          retention-days: 14
          if-no-files-found: error
