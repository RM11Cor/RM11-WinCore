name: KERNIX G2-C Android immutable guest fixture handoff (CI only)

on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2c-android-fixed-fixture-handoff.yml'
      - 'tools/kernix_g2c_fixture_gate.py'
      - 'tools/kernix_g2c_exact_libc_package_license_audit.py'
      - 'native-engine/android-host/tests/test_g2c_libc_licensing_audit.py'
      - 'native-engine/android-app/src/main/java/org/kernix/host/G2CFixedGuestFixture.java'
      - 'native-engine/android-app/src/main/java/org/kernix/host/G2CPrivateFixtureStager.java'
      - 'native-engine/android-app/tests/org/kernix/host/G2CPrivateFixtureStagerTest.java'
      - 'native-engine/android-app/tests/org/kernix/host/G2CFixedGuestFixtureTest.java'
      - 'native-engine/android-app/src/main/java/org/kernix/host/G2CAndroidChildSupervisor.java'
      - 'native-engine/android-app/src/main/java/org/kernix/host/G2CAndroidPageProbe.java'
      - 'native-engine/android-app/tests/org/kernix/host/G2CAndroidChildSupervisorTest.java'
      - 'native-engine/android-app/tests/org/kernix/host/G2CAndroidRealDataChildContractTest.java'
      - 'native-engine/android-host/kernix_g2c_bionic_data_only_child.cpp'
      - 'native-engine/android-host/kernix_g2c_native_fixed_guest_fd_guard.h'
      - 'native-engine/android-host/kernix_g2c_android_native_fd_guard_entry.cpp'
      - 'native-engine/android-host/tests/kernix_g2c_native_fixed_guest_fd_guard_test.cpp'
      - 'native-engine/android-host/kernix_g2c_native_readonly_guest_snapshots.h'
      - 'native-engine/android-host/tests/kernix_g2c_native_readonly_guest_snapshots_test.cpp'
      - 'native-engine/android-host/kernix_g2c_snapshot_elf_source.h'
      - 'native-engine/android-host/tests/kernix_g2c_snapshot_elf_source_test.cpp'
      - 'native-engine/android-host/kernix_g2b_readonly_host_install.h'
      - 'native-engine/android-host/tests/kernix_g2c_snapshot_host_install_test.cpp'
      - 'native-engine/android-host/kernix_guest_elf64_dynamic_audit.h'
      - 'native-engine/android-host/kernix_guest_elf64_dependency_closure.h'
      - 'native-engine/android-host/kernix_g2c_snapshot_dependency_closure.h'
      - 'native-engine/android-host/tests/kernix_g2c_snapshot_dependency_closure_test.cpp'
      - 'native-engine/android-host/kernix_g2b_guest_launch_plan.h'
      - 'native-engine/android-host/tests/kernix_g2c_snapshot_launch_plan_test.cpp'
      - 'native-engine/android-host/kernix_guest_elf64_readonly_image.h'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verified-immutable-g2c-guest-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout only isolated native engine branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require completed original native ARM64 FEX JIT execution result
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/41790833179 \
            --jq '[.status,.conclusion,.head_sha]|join(" ")')"
          test "$result" = 'completed success 76b553c283c2f487d0feec324ad9b8d86344f050'
          echo KERNIX_G2C_UPSTREAM_EXECUTED_ARM64_LINUX_ARTIFACT_IDENTITY_PINNED
      - name: Obtain fixed original x86 guest data from proven FEX Linux ARM64 run
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-G2C-real-FEX-ARM64-dynamic-PIE-direct-entry-evidence
          repository: RM11Cor/RM11-WinCore
          run-id: 41790833179
          github-token: ${{ github.token }}
          path: inputs/g2c-proven
      - name: Verify exact 4 x86 ELF files, no tar links, no tampering, no device claims
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/kernix_g2c_fixture_gate.py inputs/g2c-proven dist/g2c-fixed-v1
          test -s dist/g2c-fixed-v1/PROVENANCE.json
          test -s dist/g2c-fixed-v1/manifest.json
          test "$(find dist/g2c-fixed-v1 -type f | wc -l)" -eq 6
          test "$(find dist/g2c-fixed-v1 -type l | wc -l)" -eq 0
          readelf -h dist/g2c-fixed-v1/bin/kernix-dynamic-app \
            | grep -Fq 'Advanced Micro Devices X86-64'
          readelf -l dist/g2c-fixed-v1/bin/kernix-dynamic-app \
            | grep -Fq 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2'
          readelf -d dist/g2c-fixed-v1/bin/kernix-dynamic-app \
            | grep -Fq 'Shared library: [libc.so.6]'
          echo KERNIX_G2C_ANDROID_FIXED_GUEST_X86_ROOTFS_DATA_ONLY_VERIFIED
      - name: Confirm digest mutation fails closed before any file extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('fixed', 'tools/kernix_g2c_fixture_gate.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          archive=Path('inputs/g2c-proven/g2c-android-fixed-fixture-v1.tar.gz').read_bytes()
          broken=bytearray(archive)
          broken[len(broken)//2] ^= 1
          try:
              mod.verify_tar(bytes(broken))
          except ValueError as error:
              assert str(error) == 'Archive digest mismatch'
          else:
              raise AssertionError('Tampered fixture archive accepted')
          print('KERNIX_G2C_TAMPERED_GUEST_ARCHIVE_FAIL_CLOSED_PASS')
          PY
      - name: Unit test exact x86 libc/ld-linux provenance and fail-closed copyright review
        shell: bash
        run: |
          set -euo pipefail
          python3 native-engine/android-host/tests/test_g2c_libc_licensing_audit.py \
            dist/g2c-fixed-v1
      - name: Associate EXACT pinned x86 ELF bytes with installed Ubuntu cross-package and license
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libc6-amd64-cross
          PACKAGE=libc6-amd64-cross
          SYSROOT=/usr/x86_64-linux-gnu/lib
          LICENSE=/usr/share/doc/libc6-amd64-cross/copyright
          test "$(dpkg-query -S "$SYSROOT/libc.so.6" | cut -d: -f1)" = "$PACKAGE"
          test "$(dpkg-query -S "$SYSROOT/ld-linux-x86-64.so.2" | cut -d: -f1)" = "$PACKAGE"
          test -s "$LICENSE"
          test -s /usr/share/common-licenses/LGPL-2.1
          VERSION="$(dpkg-query -W -f='${Version}' "$PACKAGE")"
          SOURCE="$(dpkg-query -W -f='${source:Package}' "$PACKAGE")"
          python3 tools/kernix_g2c_exact_libc_package_license_audit.py \
            dist/g2c-fixed-v1 "$SYSROOT" "$LICENSE" "$PACKAGE" \
            "$VERSION" "$SOURCE" dist/G2C-EXACT-LIBC-CROSS-PACKAGE-LICENSE-REVIEW.json
          cp "$LICENSE" dist/G2C-EXACT-LIBC-CROSS-PACKAGE-COPYRIGHT.txt
          cp /usr/share/common-licenses/LGPL-2.1 dist/G2C-EXACT-LIBC-LGPL-2.1.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/G2C-EXACT-LIBC-CROSS-PACKAGE-LICENSE-REVIEW.json')
          d=json.loads(p.read_text())
          assert d['installed_cross_libc_exact_hash_match']
          assert d['installed_cross_dynamic_loader_exact_hash_match']
          assert d['distribution_approved'] is False
          assert d['license_reviewed_for_distribution'] is False
          print('KERNIX_G2C_REAL_GLIBC_LOADER_PACKAGE_COPYRIGHT_IDENTIFIED_NOT_APPROVED_TO_SHIP')
          PY
      - name: Java 17 for Android-side immutable fixture verifier contract
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android Java source and adversarial JVM file checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/g2c-java-classes
          javac -source 17 -target 17 -d dist/g2c-java-classes \
            native-engine/android-app/src/main/java/org/kernix/host/G2CFixedGuestFixture.java \
            native-engine/android-app/src/main/java/org/kernix/host/G2CPrivateFixtureStager.java \
            native-engine/android-app/src/main/java/org/kernix/host/G2CAndroidChildSupervisor.java \
            native-engine/android-app/src/main/java/org/kernix/host/G2CAndroidPageProbe.java \
            native-engine/android-app/tests/org/kernix/host/G2CFixedGuestFixtureTest.java \
            native-engine/android-app/tests/org/kernix/host/G2CPrivateFixtureStagerTest.java \
            native-engine/android-app/tests/org/kernix/host/G2CAndroidChildSupervisorTest.java \
            native-engine/android-app/tests/org/kernix/host/G2CAndroidRealDataChildContractTest.java
          java -cp dist/g2c-java-classes \
            org.kernix.host.G2CFixedGuestFixtureTest dist/g2c-fixed-v1
          java -cp dist/g2c-java-classes \
            org.kernix.host.G2CPrivateFixtureStagerTest dist/g2c-fixed-v1
          echo KERNIX_G2C_REAL_APP_PRIVATE_SIX_FILE_STAGING_JAVA_HOST_PASS_NO_DEVICE
          java -cp dist/g2c-java-classes \
            org.kernix.host.G2CAndroidChildSupervisorTest dist/g2c-fixed-v1
          echo KERNIX_G2C_ANDROID_JAVA_CHILD_SUPERVISOR_CI_PASS_NOT_DEVICE
      - name: Launch one REAL separate Linux process with SHA-pinned x86 metadata; Java 8-second watchdog
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DKERNIX_G2C_LINUX_HOST_CI \
            -Inative-engine/android-host \
            native-engine/android-host/kernix_g2c_bionic_data_only_child.cpp \
            -o /tmp/kernix-g2c-data-only-host-child
          java -cp dist/g2c-java-classes \
            org.kernix.host.G2CAndroidRealDataChildContractTest \
            /tmp/kernix-g2c-data-only-host-child "$PWD/dist/g2c-fixed-v1"
          echo KERNIX_G2C_REAL_CHILD_PROCESS_SHA_ATTESTATION_JAVA_WATCHDOG_HOST_PASS_NOT_FEX_OR_DEVICE
      - name: Host C++ G2-C pinned file descriptors and SHA-256 adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_native_fixed_guest_fd_guard_test.cpp \
            -o /tmp/kernix-g2c-native-fd-test
          mkdir -p dist/g2c-test-appfiles/kernix/runtime-v1/guest-rootfs
          cp -a dist/g2c-fixed-v1 \
            dist/g2c-test-appfiles/kernix/runtime-v1/guest-rootfs/g2c-fixed-v1
          /tmp/kernix-g2c-native-fd-test "$PWD/dist/g2c-test-appfiles"
          echo KERNIX_G2C_NATIVE_PINNED_GUEST_FD_SHA256_HOST_TEST_PASS_NOT_ANDROID_EXEC
      - name: Freeze original x86 ELF files in SHA-checked anonymous read-only snapshots
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_native_readonly_guest_snapshots_test.cpp \
            -o /tmp/kernix-g2c-native-snapshot-test
          mkdir -p dist/g2c-snapshot-test-appfiles/kernix/runtime-v1/guest-rootfs
          cp -a dist/g2c-fixed-v1 \
            dist/g2c-snapshot-test-appfiles/kernix/runtime-v1/guest-rootfs/g2c-fixed-v1
          /tmp/kernix-g2c-native-snapshot-test "$PWD/dist/g2c-snapshot-test-appfiles"
          echo KERNIX_G2C_ANONYMOUS_READONLY_VERIFIED_ELF_SNAPSHOT_PASS_NOT_DEVICE
      - name: Prove actual PT_LOAD main and ld-linux bytes are staged from frozen snapshots, not disk paths
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_snapshot_elf_source_test.cpp \
            -o /tmp/kernix-g2c-snapshot-elf-test
          mkdir -p dist/g2c-pathless-test-appfiles/kernix/runtime-v1/guest-rootfs
          cp -a dist/g2c-fixed-v1 \
            dist/g2c-pathless-test-appfiles/kernix/runtime-v1/guest-rootfs/g2c-fixed-v1
          /tmp/kernix-g2c-snapshot-elf-test "$PWD/dist/g2c-pathless-test-appfiles"
          echo KERNIX_G2C_PATHLESS_ELF_PTLOAD_SOURCE_HOST_PASS_NOT_FEX_EXEC
      - name: Prove guarded x86 guest PT_LOAD memory is installed from frozen anonymous snapshots
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_snapshot_host_install_test.cpp \
            -o /tmp/kernix-g2c-guarded-guest-mem-test
          mkdir -p dist/g2c-guarded-mem-test-appfiles/kernix/runtime-v1/guest-rootfs
          cp -a dist/g2c-fixed-v1 \
            dist/g2c-guarded-mem-test-appfiles/kernix/runtime-v1/guest-rootfs/g2c-fixed-v1
          /tmp/kernix-g2c-guarded-guest-mem-test "$PWD/dist/g2c-guarded-mem-test-appfiles"
          echo KERNIX_G2C_FIXED_ANON_SNAPSHOT_INSTALLED_IN_GUARDED_HOST_VA_PASS_NO_FEX
      - name: Verify snapshot-only transitive x86 ELF closure after source libc corruption
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_snapshot_dependency_closure_test.cpp \
            -o /tmp/kernix-g2c-snapshot-closure-test
          mkdir -p dist/g2c-closure-test-appfiles/kernix/runtime-v1/guest-rootfs
          cp -a dist/g2c-fixed-v1 \
            dist/g2c-closure-test-appfiles/kernix/runtime-v1/guest-rootfs/g2c-fixed-v1
          /tmp/kernix-g2c-snapshot-closure-test "$PWD/dist/g2c-closure-test-appfiles"
          echo KERNIX_G2C_METADATA_AND_TRANSITIVE_NEEDED_ONLY_FROM_SNAPSHOT_PASS
      - name: Prove complete x86 PHDR AUXV stack equals baseline using only in-memory ELF closure
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_snapshot_launch_plan_test.cpp \
            -o /tmp/kernix-g2c-snapshot-launch-plan-test
          mkdir -p dist/g2c-launch-plan-appfiles/kernix/runtime-v1/guest-rootfs
          cp -a dist/g2c-fixed-v1 \
            dist/g2c-launch-plan-appfiles/kernix/runtime-v1/guest-rootfs/g2c-fixed-v1
          /tmp/kernix-g2c-snapshot-launch-plan-test "$PWD/dist/g2c-launch-plan-appfiles"
          echo KERNIX_G2C_PATHLESS_GUEST_PHDR_AUXV_STACK_LINUX_PASS_NOT_FEX_DEVICE
      - name: Cross-link native pinned G2-C FD guard on Android ARM64 Bionic (BUILD ONLY)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOLCHAIN="$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "$TOOLCHAIN/aarch64-linux-android26-clang++" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
            test -x "$SDKMANAGER"
            "$SDKMANAGER" 'ndk;29.0.14206865'
          fi
          CXX="$TOOLCHAIN/aarch64-linux-android26-clang++"
          "$CXX" -std=c++20 -O2 -fPIC -shared -static-libstdc++ \
            -Wall -Wextra -Wpedantic -Werror -Wl,--no-undefined \
            -Wl,-z,max-page-size=16384 \
            -Inative-engine/android-host \
            native-engine/android-host/kernix_g2c_android_native_fd_guard_entry.cpp \
            -o dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so
          "$TOOLCHAIN/llvm-readelf" -h -d \
            dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            >dist/G2C-ANDROID-PINNED-FD-ABI.txt
          grep -Fq 'Machine:                           AArch64' dist/G2C-ANDROID-PINNED-FD-ABI.txt
          grep -Fq 'Shared library: [libc.so]' dist/G2C-ANDROID-PINNED-FD-ABI.txt
          ! grep -Eq 'Shared library: \[(libc.so.6|libc\+\+_shared.so)\]' \
            dist/G2C-ANDROID-PINNED-FD-ABI.txt
          "$TOOLCHAIN/llvm-nm" -D --defined-only \
            dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            | grep -Fq 'kernix_g2c_bionic_pin_fixed_x86_files_build_only'
          "$TOOLCHAIN/llvm-nm" -D --defined-only \
            dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            | grep -Fq 'kernix_g2c_bionic_capture_fixed_x86_snapshots_build_only'
          "$TOOLCHAIN/llvm-nm" -D --defined-only \
            dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            | grep -Fq 'kernix_g2c_bionic_stage_fixed_x86_elf_from_snapshots_build_only'
          "$TOOLCHAIN/llvm-nm" -D --defined-only \
            dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            | grep -Fq 'kernix_g2c_bionic_audit_snapshot_elf_closure_build_only'
          "$TOOLCHAIN/llvm-nm" -D --defined-only \
            dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            | grep -Fq 'kernix_g2c_bionic_plan_x86_auxv_from_snapshots_build_only'
          echo KERNIX_G2C_PATHLESS_X86_AUXV_STACK_BIONIC_LINK_PASS_NOT_DEVICE
          echo KERNIX_G2C_SNAPSHOT_ONLY_CLOSURE_BIONIC_CROSSLINK_PASS_NOT_DEVICE
          echo KERNIX_G2C_PATHLESS_ELF_PTLOAD_BIONIC_CROSSLINK_PASS_NOT_DEVICE
          echo KERNIX_G2C_BIONIC_READONLY_ANONYMOUS_SNAPSHOT_LINK_PASS_NOT_DEVICE
          sha256sum dist/KERNIX-G2C-ANDROID-PINNED-GUEST-FD-GUARD-BUILD-ONLY.so \
            >dist/G2C-ANDROID-PINNED-FD-BUILD-ONLY.sha256
          echo KERNIX_G2C_NATIVE_BIONIC_PINNED_FD_GUARD_CROSSLINK_PASS_NOT_DEVICE
      - name: Cross-link Android/Bionic AArch64 independent data-only PIE subprocess entry
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOLCHAIN="$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$TOOLCHAIN/aarch64-linux-android26-clang++"
          test -x "$CXX"
          "$CXX" -std=c++20 -O2 -fPIE -pie -static-libstdc++ \
            -Wall -Wextra -Wpedantic -Werror -Wl,--no-undefined \
            -Wl,-z,max-page-size=16384 \
            -Inative-engine/android-host \
            native-engine/android-host/kernix_g2c_bionic_data_only_child.cpp \
            -o dist/KERNIX-G2C-BIONIC-DATA-ONLY-CHILD-CI-NOT-APK
          "$TOOLCHAIN/llvm-readelf" -h -l -d \
            dist/KERNIX-G2C-BIONIC-DATA-ONLY-CHILD-CI-NOT-APK \
            >dist/G2C-BIONIC-DATA-ONLY-CHILD-ABI.txt
          grep -Fq 'Machine:                           AArch64' dist/G2C-BIONIC-DATA-ONLY-CHILD-ABI.txt
          grep -Fq '/system/bin/linker64' dist/G2C-BIONIC-DATA-ONLY-CHILD-ABI.txt
          grep -Fq 'Shared library: [libc.so]' dist/G2C-BIONIC-DATA-ONLY-CHILD-ABI.txt
          ! grep -Eq 'Shared library: \[(libc.so.6|libc\+\+_shared.so)\]' \
            dist/G2C-BIONIC-DATA-ONLY-CHILD-ABI.txt
          sha256sum dist/KERNIX-G2C-BIONIC-DATA-ONLY-CHILD-CI-NOT-APK \
            >dist/G2C-BIONIC-DATA-ONLY-CHILD-CI.sha256
          echo KERNIX_G2C_REAL_BIONIC_CHILD_PIE_LINKED_NOT_DEVICE_OR_FEX_EXEC
      - name: Preserve scoped evidence only (never redistribute glibc/rootfs or APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G2C-Android-immutable-fixture-handoff-evidence-NOT-APK
          retention-days: 30
          if-no-files-found: warn
          path: |
            dist/g2c-fixed-v1/manifest.json
            dist/g2c-fixed-v1/PROVENANCE.json
            dist/G2C-EXACT-LIBC-CROSS-PACKAGE-LICENSE-REVIEW.json
            dist/G2C-EXACT-LIBC-CROSS-PACKAGE-COPYRIGHT.txt
            dist/G2C-EXACT-LIBC-LGPL-2.1.txt
            dist/G2C-BIONIC-DATA-ONLY-CHILD-ABI.txt
            dist/G2C-BIONIC-DATA-ONLY-CHILD-CI.sha256
