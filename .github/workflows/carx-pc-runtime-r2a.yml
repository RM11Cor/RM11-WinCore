name: Build CarX PC Runtime R2-A Vulkan Probe APK
on:
  push:
    branches:
      - carx-pc-runtime-r2a
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated game-specific runtime branch
        uses: actions/checkout@v4
      - name: Reconstruct verified R1 project plus R2-A native Vulkan delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/carxpc-r2a
          cat carxpc/r1.part{1,2,3}.b64 | base64 --decode > /tmp/carxpc-r1.tar.xz
          echo "cf820c3abc3bc61c9ff2b0209f65e2a39d58b52ebddb25f49f1ea92883eb6190  /tmp/carxpc-r1.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carxpc-r1.tar.xz -C /tmp/carxpc-r2a
          cat carxpc/r2a.part{1,2,3}.b64 | base64 --decode > /tmp/carxpc-r2a-delta.tar.xz
          echo "db55e37f87a073f332576161922b2f49f8eb103ef41faaf1e27e32cdad5fb5e8  /tmp/carxpc-r2a-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carxpc-r2a-delta.tar.xz -C /tmp/carxpc-r2a
          test -s /tmp/carxpc-r2a/app/src/main/cpp/native_probe.cpp
          test -s /tmp/carxpc-r2a/app/src/main/java/com/r4/carxpc/NativeRuntimeProbe.java
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Windows PE parser with ten synthetic cases
        working-directory: /tmp/carxpc-r2a
        run: |
          mkdir -p /tmp/r2host
          javac -d /tmp/r2host app/src/main/java/com/r4/carxpc/PEParser.java tests/PEParserHostTest.java
          java -cp /tmp/r2host PEParserHostTest
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile signed Android ARM64 JNI Vulkan APK
        working-directory: /tmp/carxpc-r2a
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature ARM64 Vulkan JNI and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/carxpc-r2a/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcarx_runtime_probe.so"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: CarX-PC-Runtime-R2A-Vulkan-ARM64-APK
          path: /tmp/carxpc-r2a/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
