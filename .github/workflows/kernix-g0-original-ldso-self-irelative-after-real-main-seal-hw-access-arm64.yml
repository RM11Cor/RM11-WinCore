      - name: Validate source pinned original GNU ld-linux own IRELATIVE and produce bounded AArch64 data access watchpoint
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdb
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct,json
          b=Path('dist/original-source-pinned-root/lib64/ld-linux-x86-64.so.2').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'
          assert b[:6]==bytes.fromhex('7f454c460201')
          phoff=struct.unpack_from('<Q',b,32)[0]
          phsize,n=struct.unpack_from('<HH',b,54)
          assert phsize==56 and 0<n<=64 and phoff+56*n<=len(b)
          ph=[struct.unpack_from('<IIQQQQQQ',b,phoff+i*56) for i in range(n)]
          def off(va,count):
              available=[p for p in ph if p[0]==1 and p[3]<=va and va+count<=p[3]+p[5]]
              assert len(available)==1
              p=available[0]
              assert p[2]+p[5]<=len(b)
              return p[2]+va-p[3]
          dyn=[p for p in ph if p[0]==2]
          assert len(dyn)==1
          tags={}
          for i in range(dyn[0][2],dyn[0][2]+dyn[0][5],16):
              key,val=struct.unpack_from('<QQ',b,i)
              if key==0: break
              assert key not in tags
              tags[key]=val
          assert tags[9]==24 and tags[8]%24==0
          rela=[struct.unpack_from('<QQq',b,off(tags[7]+i*24,24)) for i in range(tags[8]//24)]
          assert [t for t in rela if t[0]==0x36360 and t[1]==37 and t[2]==0x1a8e0]==[(0x36360,37,0x1a8e0)]
          assert struct.unpack_from('<Q',b,off(0x36360,8))[0]==0
          assert sum(1 for p in ph if p[0]==1 and (p[1]&5)==5
                     and p[3]<=0x1a8e0 and 0x1a8e0+16<=p[3]+p[5])==1
          source=Path('native-engine/android-host/tests/kernix_g0_original_fex_full_ptload_source_executable_range_arm64.cpp').read_text().splitlines()
          lines=[i for i,x in enumerate(source,1) if x.strip()=='ctx->ExecuteThread(thread);']
          assert len(lines)==1
          line=lines[0]
          # At exactly the original FEX guest thread dispatch site, all
          # source ELF RW/RX owner windows exist and the original source
          # GNU ldso self-target is accessible before JIT execution.
          script=f'''set pagination off
          set confirm off
          set breakpoint pending on
          set output-radix 16
          handle SIGBUS nostop noprint pass
          handle SIGCHLD nostop noprint pass
          break native-engine/android-host/tests/kernix_g0_original_fex_full_ptload_source_executable_range_arm64.cpp:{line}
          commands
          silent
          printf "KERNIX_G0_LDSO_SELF_IRELATIVE_WATCH_ARMED_BEFORE_ORIGINAL_FEX_EXECUTE target=0x801036360 source_initial_zero=1\\n"
          x/gx 0x801036360
          awatch -location *(unsigned long long *)0x801036360
          condition 2 $pc >= 0xffff00000000 && $x28 >= 0xffff00000000
          continue
          end
          run
          printf "KERNIX_G0_LDSO_SELF_IRELATIVE_NATIVE_JIT_ACCESS_WATCH_HIT_BEFORE_GNU_SELF_PROTECT\\n"
          info registers pc
          x/16i $pc-32
          x/8wx $pc-16
          info registers x0 x1 x2 x3 x4 x5 x6 x7 x8 x9 x10 x11 x12 x13 x14 x15 x16 x17 x18 x19 x20 x21 x22 x23 x24 x25 x26 x27 x28 x29 x30
          printf "KERNIX_G0_LDSO_SELF_IRELATIVE_NATIVE_GPR_RIP_PROVENANCE state=0x%lx x4=0x%lx x13=0x%lx x7=0x%lx x10=0x%lx\\n", $x28, $x4, $x13, $x7, $x10
          # Pinned upstream non-ARM64EC FEX SRA[REG_RSP=4] maps
          # the *live x86 guest RSP* to native x8. Capture it at the
          # actual original source-IRELATIVE writer hardware stop,
          # never from a possibly stale CPUState gregs snapshot.
          # This read-only marker is NOT evidence of entering/returning
          # from source IFUNC at 0x80101a8e0. No guest stack dereference.
          printf "KERNIX_G0_LDSO_SELF_IRELATIVE_WRITER_GUEST_RSP_NATIVE_GPR_ONLY guest_rsp_x8=0x%lx native_pc=0x%lx original_source_ifunc_entry_return_untraced=1 no_guest_stack_dereference=1\\n", $x8, $pc
          # Separate bounded source-owned guest stack readback candidate:
          # the previous x86 guest stack qword is the *possible* saved
          # return PC of a recently completed CALL. Its contents alone
          # never establish GNU ldso IFUNC entry or return execution.
          # This probe is GDB read-only and never passes a guest pointer
          # into a host syscall or modifies the real guest/ELF mapping.
          printf "KERNIX_G0_FEX_LDSO_IRELATIVE_WRITER_RETURN_SLOT_CANDIDATE_ONLY guest_rsp=0x%lx guest_previous_slot=0x%lx owner_not_yet_attested=1 ifunc_entry_return_not_proven=1\\n", $x8, $x8-8
          x/gx $x8-8
          # Independent native Linux kernel VMA observation in the same
          # stopped original FEX process, not the source launch plan alone.
          python
          import gdb,pathlib
          pid=gdb.selected_inferior().pid
          slot=int(gdb.parse_and_eval('$x8'))-8
          maps=pathlib.Path('/proc/%d/maps'%pid).read_text().splitlines()
          matches=[]
          for row in maps:
              fields=row.split()
              if len(fields)<5:continue
              lo,hi=(int(x,16) for x in fields[0].split('-'))
              if lo<=slot and slot+8<=hi:matches.append((lo,hi,fields[1]))
          if len(matches)!=1:
              print('KERNIX_G0_IFUNC_GUEST_STACK_HW_STOP_KERNEL_VMA_MISSING_OR_SPLIT_REJECT')
          else:
              lo,hi,rights=matches[0]
              print('KERNIX_G0_IFUNC_GUEST_STACK_HW_STOP_KERNEL_VMA_READONLY'
                    ' slot=0x%x vma_start=0x%x vma_end=0x%x rights=%s'
                    ' read_only_inspection=1 ifunc_execution_not_traced=1'
                    %(slot,lo,hi,rights))
          end
          set $jit_head = *(unsigned long long *)$x28
          if $jit_head != 0
            set $jit_offset = *(unsigned int *)$jit_head
            set $jit_tail = $jit_head + $jit_offset
            set $jit_size = *(unsigned long long *)$jit_tail
            set $jit_guest_entry = *(unsigned long long *)($jit_tail + 8)
            set $jit_guest_size = *(unsigned long long *)($jit_tail + 16)
            set $jit_count = *(unsigned int *)($jit_tail + 24)
            set $jit_entries_offset = *(unsigned int *)($jit_tail + 28)
            printf "KERNIX_G0_LDSO_SELF_IRELATIVE_JIT_NATIVE_TO_GUEST_BOUNDS guest_entry=0x%lx guest_size=0x%lx count=%u data_offset=0x%x writer_host_pc=0x%lx\\n", $jit_guest_entry, $jit_guest_size, $jit_count, $jit_entries_offset, $pc-4
            set $rip_table_size = $jit_size - $jit_offset - $jit_entries_offset
            if $jit_count > 0 && $jit_count <= 8 && $rip_table_size >= $jit_count && $rip_table_size <= 256
              printf "KERNIX_G0_LDSO_SELF_IRELATIVE_JIT_VL64PAIR_BYTES count=%u data=", $jit_count
              set $rip_cursor=0
              while $rip_cursor < $rip_table_size && $rip_cursor < 40
                printf "%02x", *(unsigned char *)($jit_tail + $jit_entries_offset + $rip_cursor)
                set $rip_cursor=$rip_cursor+1
              end
              printf "\\n"
            end
          end
          printf "KERNIX_G0_LDSO_SOURCE_RESOLVER_X86_RX_BYTES_BEGIN guest_rip=0x80101a8e0\\n"
          x/16bx 0x80101a8e0
          printf "KERNIX_G0_LDSO_SOURCE_ZERO_WRITER_X86_RX_BYTES_BEGIN guest_rip=0x80100fd60\\n"
          x/8bx 0x80100fd60
          x/gx 0x801036360
          bt 6
          quit
          '''
          Path('dist/original-ldso-self-irelative-after-main-live-hw.gdb').write_text(script)
          Path('dist/original-ldso-self-irelative-source.json').write_text(json.dumps({
             'schema':'kernix.g0.original-gnu-ldso-self-irelative-source-target-watch-preflight.v1',
