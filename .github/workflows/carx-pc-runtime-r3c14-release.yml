name: CarX PC Runtime R3-C14 - original GNU ldso guest set_tid_address
on:
  push:
    branches: [carx-pc-runtime-r3c14]
    paths:
      - '.github/workflows/carx-pc-runtime-r3c14-release.yml'
      - 'carxpc/r3c/app_delta.part*.b64'
      - 'carxpc/r3c3/**'
      - 'carxpc/r3c4/**'
      - 'carxpc/r3c5/**'
      - 'carxpc/r3c6/**'
      - 'carxpc/r3c7/**'
      - 'carxpc/r3c8/**'
      - 'carxpc/r3c9/**'
      - 'carxpc/r3c10/**'
      - 'carxpc/r3c11/**'
      - 'carxpc/r3c12/**'
      - 'carxpc/r3c13/**'
      - 'carxpc/r3c14/**'
      - 'carxpc/R3C14_ORIGINAL_LDSO_SET_TID_ADDRESS_DEVICE_GATE_AR.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified CarX source stages R1 R2A R2B and R3A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/carxpc
          cat carxpc/r1.part{1,2,3}.b64 | base64 -d > /tmp/r1.tar.xz
          echo 'cf820c3abc3bc61c9ff2b0209f65e2a39d58b52ebddb25f49f1ea92883eb6190  /tmp/r1.tar.xz' | sha256sum -c -
          tar -xJf /tmp/r1.tar.xz -C /tmp/carxpc
          cat carxpc/r2a.part{1,2,3}.b64 | base64 -d > /tmp/r2a.tar.xz
          echo 'db55e37f87a073f332576161922b2f49f8eb103ef41faaf1e27e32cdad5fb5e8  /tmp/r2a.tar.xz' | sha256sum -c -
          tar -xJf /tmp/r2a.tar.xz -C /tmp/carxpc
          cat carxpc/r2b.part{1,2,3}.b64 | base64 -d > /tmp/r2b.tar.xz
          echo 'af5acf423120fa5766f4ac8c50c4c5046553b2ceb925ef1fdef34c00d713bf33  /tmp/r2b.tar.xz' | sha256sum -c -
          tar -xJf /tmp/r2b.tar.xz -C /tmp/carxpc
          cat carxpc/r3a.part{1,2,3}.b64 | base64 -d > /tmp/r3a.tar.xz
          echo 'd759d43be422b3f57d7c91ead73c65d028fc0886ba1835b11a6680b9a65903f1  /tmp/r3a.tar.xz' | sha256sum -c -
          tar -xJf /tmp/r3a.tar.xz -C /tmp/carxpc
          test -s /tmp/carxpc/app/src/main/java/com/r4/carxpc/FexIntegrationProbe.java
          test -s /tmp/carxpc/app/src/main/cpp/native_present.cpp
          cat carxpc/r3b_patch.part{1,2}.b64 | base64 -d > /tmp/carx-r3b.patch.xz
          echo 'b2491b4157d13112e3e2487c01065fa4ea8d330757c9c3b4133f96873f664b6c  /tmp/carx-r3b.patch.xz' | sha256sum -c -
          xz -cd /tmp/carx-r3b.patch.xz >/tmp/carx-r3b.patch
          patch --batch -p1 -d /tmp/carxpc < /tmp/carx-r3b.patch
          grep -Fq 'keepDebugSymbols' /tmp/carxpc/app/build.gradle
          grep -Fq 'versionCode 6' /tmp/carxpc/app/build.gradle
          grep -Fq 'runLdsoRW' /tmp/carxpc/app/src/main/java/com/r4/carxpc/FexIntegrationProbe.java
          grep -Fq 'beginLdsoProgress' /tmp/carxpc/app/src/main/java/com/r4/carxpc/MainActivity.java
          cat carxpc/r3c/app_delta.part{1,2}.b64 | base64 -d > /tmp/carx-r3c-app.patch.xz
          echo 'e683dc78e02bc004d88da6eb1940706ea07eb7f357917cafef4a70d81e468d5c  /tmp/carx-r3c-app.patch.xz' | sha256sum -c -
          xz -cd /tmp/carx-r3c-app.patch.xz >/tmp/carx-r3c-app.patch
          patch --batch -p1 -d /tmp/carxpc < /tmp/carx-r3c-app.patch
          grep -Fq 'versionCode 7' /tmp/carxpc/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/carxpc/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'\bversionCode\s+7\b','versionCode 8',s)
          assert n==1,('versionCode_patch_not_unique',n)
          s,n=re.subn(r"\bversionName\s+'[^']+'","versionName '0.8-r3c1-cxx-loader-fix'",s)
          assert n==1,('versionName_patch_not_unique',n)
          p.write_text(s)
          PY
          grep -Fq 'versionCode 8' /tmp/carxpc/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/carxpc/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'\bversionCode\s+8\b','versionCode 9',s)
          assert n==1,('versionCode_R3C2_expected_one',n)
          s,n=re.subn(r"\bversionName\s+'[^']+'","versionName '0.9-r3c2-sigbus-signed-delta'",s)
          assert n==1
          p.write_text(s)
          PY
          grep -Fq 'versionCode 9' /tmp/carxpc/app/build.gradle
          grep -Fq 'runOriginalLdsoContinuation' /tmp/carxpc/app/src/main/java/com/r4/carxpc/FexIntegrationProbe.java
          grep -Fq 'beginOriginalLdsoContinuation' /tmp/carxpc/app/src/main/java/com/r4/carxpc/MainActivity.java
      - name: Download source-pinned original FEXCore Android ARM64 and guest components
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-upstream-FEXCore-Android-NDK-compile-evidence-NOT-Wine
          repository: RM11Cor/RM11-WinCore
          run-id: 42091689429
          github-token: ${{ github.token }}
          path: /tmp/original-fex
      - name: Download existing attested real GNU guest ELF triad
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          github-token: ${{ github.token }}
          path: /tmp/original-guest
      - name: Download glibc license/source notices from earlier KERNIX distribution
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-G2E-B-Private-Root-Fix-Signed-v0.27-APK
          repository: RM11Cor/RM11-WinCore
          run-id: 41851255385
          github-token: ${{ github.token }}
          path: /tmp/notices
      - name: Download proven original GNU ld-linux bounded RW runtime for Android Bionic
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-G0-Original-LDSO-RW-State-After-Heap-Android-Bionic-BUILDONLY
          repository: RM11Cor/RM11-WinCore
          run-id: 42166430049
          github-token: ${{ github.token }}
          path: /tmp/original-ldso-v2
      - name: Download source-locked GNU ld-linux original unpatched Android ARM64 Bionic candidate
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C-Original-GNU-ldso-Continuation-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43576462916
          github-token: ${{ github.token }}
          path: /tmp/gnu-ldso-r3c
      - name: Download upstream FEX signed SIGBUS-delta corrected GNU loader for Android Bionic
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C2-GNU-ldso-Continuation-Signed-SIGBUS-Fix-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43579716984
          github-token: ${{ github.token }}
          path: /tmp/r3c2-native
      - name: Download rebuilt GNU loader with KERNIX source-authenticated 832-byte libc read
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C3-GNU-libc-Original-Read-832-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43580576259
          github-token: ${{ github.token }}
          path: /tmp/r3c3-native
      - name: Download native R3C4 source-authentic GNU libc pread64 784 Bionic runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C4-GNU-libc-Original-Pread64-784-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43581737239
          github-token: ${{ github.token }}
          path: /tmp/r3c4-native
      - name: Download source-pinned original GNU libc virtual fstat5 stat144 ARM64 runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C5-GNU-libc-Original-Fstat5-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43582401348
          github-token: ${{ github.token }}
          path: /tmp/r3c5-native
      - name: Download source-pinned original GNU libc large readonly guest mmap9 runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C6-GNU-libc-LargeReadonly-Mmap9-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43583139524
          github-token: ${{ github.token }}
          path: /tmp/r3c6-native
      - name: Download original libc second executable RX PT_LOAD Bionic runner (source-pinned)
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C7-GNU-libc-SecondText-RX-Mmap9-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43583930975
          github-token: ${{ github.token }}
          path: /tmp/r3c7-native
      - name: Download original GNU libc third RO PT_LOAD segment Android ARM64 source-pinned runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C8-GNU-libc-ThirdData-RO-Mmap9-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43584767359
          github-token: ${{ github.token }}
          path: /tmp/r3c8-native
      - name: Download original GNU libc fourth RW PT_LOAD Android ARM64 source-verified runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C9-GNU-libc-FourthData-RW-Mmap9-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43585456840
          github-token: ${{ github.token }}
          path: /tmp/r3c9-native
      - name: Download source-pinned genuine GNU libc fifth anonymous zero BSS Android ARM64 runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C10-GNU-libc-FifthAnon-ZeroBSS-Mmap9-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43586258959
          github-token: ${{ github.token }}
          path: /tmp/r3c10-native
      - name: Download source-authentic GNU libc close3 virtual fd100 after BSS runner
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C11-GNU-libc-AfterBSS-Close3-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43587127885
          github-token: ${{ github.token }}
          path: /tmp/r3c11-native
      - name: Download source-pinned GNU ldso post-close anonymous 8KiB ARM64 candidate
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C12-GNU-ldso-PostClose-Anon8K-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43588079061
          github-token: ${{ github.token }}
          path: /tmp/r3c12-native
      - name: Download source-pinned genuine GNU ldso post-close ARCH_SET_FS guest TLS ARM64 candidate
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C13-GNU-ldso-PostClose-Guest-ArchSetFS-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43591852445
          github-token: ${{ github.token }}
          path: /tmp/r3c13-native
      - name: Download source-pinned original GNU ldso x86 guest set_tid_address ARM64 candidate
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C14-GNU-ldso-PostClose-Guest-SetTidAddress-Android-Bionic-BuildOnly
          repository: RM11Cor/RM11-WinCore
          run-id: 43592536379
          github-token: ${{ github.token }}
          path: /tmp/r3c14-native
      - name: Historical R3A native bytes check (reference only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/old-release
          gh release download carx-pc-v0004-r3a --pattern 'CarX_PC_Runtime_R3A_FEX_ARM64.apk' --dir /tmp/old-release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          p=Path('/tmp/old-release/CarX_PC_Runtime_R3A_FEX_ARM64.apk')
          with zipfile.ZipFile(p) as z:
              for name in ('libFEXCore.so','libkernix_g0_original_elf_fex_auxv_heap.so'):
                  b=z.read('lib/arm64-v8a/'+name)
                  print('OLD_R3A_APK_LIBRARY',name,'sha256',hashlib.sha256(b).hexdigest(),'bytes',len(b))
          PY
      - name: Verify and stage exact original FEX upstream binaries ELF triad and licenses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          source=Path('/tmp/original-fex')
          metadata=json.loads((source/'compile-result.json').read_text())
          assert metadata['source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert metadata['configure_rc']==0 and metadata['build_rc']==0 and metadata['bionic_library_built'] is True
          candidate=source/'g0-integrated-source-original-elf-auxv-fex-android-candidate'
          witness=json.loads((candidate/'candidate.json').read_text())
          assert witness['upstream_FEX_sha']==metadata['source_sha']
          assert witness['actual_linux_ARM64_combined_FEX_guest_run_id']==42090766519
          assert witness['Android_Bionic_crosslinked'] is True
          assert witness['physical_Android_device_executed'] is False
          so='libkernix_g0_original_elf_fex_auxv_heap.so'
          pairs=[
            (source/'libFEXCore-android-build-only.so','libFEXCore.so',metadata['elf']['sha256'],'original-fexcore.sha256'),
            (candidate/so,so,witness['native_binary_sha256'],'original-fex-elf-auxv-heap-runner.sha256')
          ]
          dest=Path('/tmp/carxpc/app/src/main')
          libs=dest/'jniLibs/arm64-v8a'
          assets=dest/'assets'
          libs.mkdir(parents=True,exist_ok=True);assets.mkdir(parents=True,exist_ok=True)
          for src,name,sha,stamp in pairs:
              raw=src.read_bytes()
              assert len(raw)>4096 and hashlib.sha256(raw).hexdigest()==sha
              (libs/name).write_bytes(raw)
              (assets/stamp).write_text(sha+'\n')
          orig=Path('/tmp/original-guest/original-guest')
          manifest=json.loads(Path('/tmp/original-guest/proven-guest-triad.json').read_text())
          expected={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')
          }
          assert {str(f.relative_to(orig)) for f in orig.rglob('*') if f.is_file()}==set(expected)
          for rel,(size,sha) in expected.items():
              b=(orig/rel).read_bytes()
              assert len(b)==size and hashlib.sha256(b).hexdigest()==sha
              assert manifest['files'][rel]['sha256']==sha
              target=assets/'original'/rel
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(b)
          raw=(source/'FEX-UPSTREAM-LICENSE.txt').read_bytes()
          assert len(raw)>100
          notices=assets/'third-party-notices'
          notices.mkdir(parents=True,exist_ok=True)
          (notices/'FEX-UPSTREAM-LICENSE.txt').write_bytes(raw)
          apks=list(Path('/tmp/notices').rglob('KERNIX-G2E-B-Private-Root-Fix-v0.27.apk'))
          assert len(apks)==1
          with zipfile.ZipFile(apks[0]) as z:
              for name in ('GLIBC-LGPL-2.1.txt','GLIBC-Ubuntu-Cross-Copyright.txt','GLIBC-SOURCE-AND-PROVENANCE.txt'):
                  doc=z.read('assets/third-party-notices/'+name)
                  assert len(doc)>500
                  (notices/name).write_bytes(doc)
          print('CARX_R3A_VERIFIED_FEX_UPSTREAM_GUEST_AND_LGPL_NOTICES_STAGED')
          PY
      - name: Stage genuine ld-linux bounded callee runner, proven ABI identical to CarX FEXCore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          base=Path('/tmp/original-ldso-v2')
          accepted=json.loads((base/'accepted-source.json').read_text())
          candidate=base/'android-candidate'
          w=json.loads((candidate/'candidate.json').read_text())
          assert accepted['real_linux_arm64_fex_execution_run']==42163385087
          assert accepted['original_upstream_fex_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert w['original_FEXCore_sha256']==accepted['android_fexcore_sha256']
          assert w['android_bionic_crosslinked'] is True
          assert not w['full_ldso_or_glibc_started'] and not w['wine_proton_windows_pe_or_games_executed']
          raw=(candidate/'libFEXCore.so').read_bytes()
          original=Path('/tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libFEXCore.so').read_bytes()
          stamp=Path('/tmp/carxpc/app/src/main/assets/original-fexcore.sha256').read_text().strip()
          assert raw==original
          assert hashlib.sha256(raw).hexdigest()==stamp==accepted['android_fexcore_sha256']
          name='libkernix_g0_original_ldso_rw_state_after_heap.so'
          runner=(candidate/name).read_bytes()
          digest=hashlib.sha256(runner).hexdigest()
          assert digest==w['native_candidate_sha256']=='eb521dd35ca1afafbc31126f8670ac792a73fd06db9e34e87c98aed68f28454c'
          assert b'KERNIX_G0_SAME_FEX_ORIGINAL_LDSO_CALLEE_GUEST_RW_AND_STACK_STATE_VERIFIED' in runner
          lib=Path('/tmp/carxpc/app/src/main/jniLibs/arm64-v8a')/name
          lib.write_bytes(runner)
          (Path('/tmp/carxpc/app/src/main/assets')/'rw-state-runner.sha256').write_text(digest+'\n')
          print('CARX_R3B_ORIGINAL_LDSO_RUNNER_EXACT_SHA256_AND_FEX_ABI_MATCH',digest)
          PY
          readelf -h /tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libkernix_g0_original_ldso_rw_state_after_heap.so | grep -E 'Machine:.*AArch64'
          readelf -d /tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libkernix_g0_original_ldso_rw_state_after_heap.so | grep -F 'Shared library: [libFEXCore.so]'
      - name: Stage genuine unpatched original GNU loader and verify exact FEXCore ABI and SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/gnu-ldso-r3c')
          meta=json.loads((p/'candidate.json').read_text())
          assert meta['fex_source_sha']=='02e24ca5c01ed0c864466ed573db347336f70170'
          assert meta['fex_sha256']=='f71397bf1bbedd03305c7127e442d674227fa54d15217cc7effb22dbaa9f4b1d'
          assert meta['runner_sha256']=='fe1eec641a5b3aca7606bf779c9c2581cba5304c5f2b6e99044343c60f6ab06b'
          assert meta['unmodified_ldso_continuation_compiled'] and not meta['android_device_executed']
          root=Path('/tmp/carxpc/app/src/main')
          fex=(root/'jniLibs/arm64-v8a/libFEXCore.so').read_bytes()
          assert hashlib.sha256(fex).hexdigest()==meta['fex_sha256']
          runner=(p/'libkernix_g0_original_ldso_continuation.so').read_bytes()
          assert len(runner)>4096 and hashlib.sha256(runner).hexdigest()==meta['runner_sha256']
          (root/'jniLibs/arm64-v8a/libkernix_g0_original_ldso_continuation.so').write_bytes(runner)
          (root/'assets/original-gnu-ldso-continuation.sha256').write_text(meta['runner_sha256']+'\n')
          print('CARX_R3C_ORIGINAL_GNU_LDSO_CONTINUATION_SOURCE_AND_FEX_CORE_SHA_PASS')
          PY
          readelf -h /tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libkernix_g0_original_ldso_continuation.so | grep -E 'Machine: *AArch64'
          readelf -d /tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libkernix_g0_original_ldso_continuation.so | grep -F 'Shared library: [libFEXCore.so]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK and NDK for R2B retained Vulkan
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Bundle pinned Android NDK C++ runtime required by original GNU ldso executable
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK"
          SOURCE=""
          for p in \
            "$NDK/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so" \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libc++_shared.so"; do
            if test -s "$p"; then SOURCE="$p"; break; fi
          done
          if [[ -z "$SOURCE" ]]; then
            SOURCE="$(find "$NDK" -type f -name libc++_shared.so | grep -E 'arm64-v8a|aarch64-linux-android' | head -1)"
          fi
          if [[ -z "$SOURCE" || ! -s "$SOURCE" ]]; then
            echo "::error::Android NDK libc++_shared.so ARM64 not found"; exit 1
          fi
          echo "CXX_SOURCE=$SOURCE"
          FILE=/tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          cp "$SOURCE" "$FILE"
          sha256sum "$SOURCE" "$FILE"
          cmp "$SOURCE" "$FILE"
          readelf -h "$FILE" | grep -E 'Machine:.*AArch64'
          readelf -d "$FILE" | grep -F 'Library soname: [libc++_shared.so]'
          RUNNER=/tmp/carxpc/app/src/main/jniLibs/arm64-v8a/libkernix_g0_original_ldso_continuation.so
          readelf -d "$RUNNER" | grep -F 'Shared library: [libc++_shared.so]'
          readelf -d "$RUNNER" | grep -F 'Shared library: [libFEXCore.so]'
          readelf -d "$RUNNER" | grep -F '$ORIGIN'
          python3 - <<'PY'
          from pathlib import Path
