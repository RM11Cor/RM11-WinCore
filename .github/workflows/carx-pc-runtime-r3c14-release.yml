          assert s.count(old)==1
          new="""signingConfigs { stable {
              storeFile file(System.getenv('CARX_R3A_STABLE_KEYSTORE'))
              storePassword System.getenv('CARX_R3A_STABLE_SIGNING_PASSWORD')
              keyAlias 'kernix-update'
              keyPassword System.getenv('CARX_R3A_STABLE_SIGNING_PASSWORD')
              storeType 'PKCS12'
          }}
          buildTypes { release { minifyEnabled false; signingConfig signingConfigs.stable } }"""
          p.write_text(s.replace(old,new))
          PY
      - name: Build signed ARM64 CarX R3A Release APK
        if: env.CARX_R3A_STABLE_SIGNING_READY == 'true'
        working-directory: /tmp/carxpc
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release APK preserves exact cryptographic hashes of original FEX binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root=Path('/tmp/carxpc/app/src/main')
          apk=Path('/tmp/carxpc/app/build/outputs/apk/release/app-release.apk')
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
              for name,stamp in [('libFEXCore.so','original-fexcore.sha256'),('libkernix_g0_original_elf_fex_auxv_heap.so','original-fex-elf-auxv-heap-runner.sha256'),('libkernix_g0_original_ldso_rw_state_after_heap.so','rw-state-runner.sha256'),('libkernix_g0_original_ldso_continuation.so','original-gnu-ldso-continuation.sha256')]:
                  expected=(root/'assets'/stamp).read_text().strip()
                  source=(root/'jniLibs/arm64-v8a'/name).read_bytes()
                  packaged=z.read('lib/arm64-v8a/'+name)
                  assert hashlib.sha256(source).hexdigest()==expected,('source_stamp_mismatch',name)
                  assert hashlib.sha256(packaged).hexdigest()==expected,('APK_STRIPPED_LIBRARY_HASH_FAILURE',name,hashlib.sha256(packaged).hexdigest(),expected)
                  assert packaged==source,('APK_MODIFIED_PREBUILT_ELF',name)
                  print('CARX_R3A1_RELEASE_ELF_EXACT_BYTES_SHA256_PASS',name,expected)
          PY
      - name: Verify release APK contains shared C++ dynamic linker dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re,subprocess
          apk=Path('/tmp/carxpc/app/build/outputs/apk/release/app-release.apk')
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
              member='lib/arm64-v8a/libc++_shared.so'
              assert member in z.namelist(), ('CXX_LIBRARY_MISSING_FROM_APK',member)
              cxx=z.read(member)
              assert cxx.startswith(b'\x7fELF') and len(cxx)>10000
              required='lib/arm64-v8a/libkernix_g0_original_ldso_continuation.so'
              assert required in z.namelist()
              runner=z.read(required)
              assert runner.startswith(b'\x7fELF')
              assert b'libc++_shared.so' in runner and b'libFEXCore.so' in runner
              print('CARX_R3C1_RELEASE_APK_DYNAMIC_CXX_DEPENDENCY_INCLUDED',len(cxx),'bytes')
          PY
      - name: Verify CarX release identity and original KERNIX certificate
        if: env.CARX_R3A_STABLE_SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/carxpc/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          SHA="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "${SHA,,}" = 'a74735bc30b53e590589d8ff5c233f72dc0e4ddf6e312939d668ae30c46b6f8e'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.r4.carxpc' versionCode='21'"
          mkdir -p /tmp/carx-release
          cp "$APK" /tmp/carx-release/CarX_PC_Runtime_R3C14_Guest_SetTid_ARM64.apk
          (cd /tmp/carx-release && sha256sum CarX_PC_Runtime_R3C14_Guest_SetTid_ARM64.apk > CarX_PC_Runtime_R3C14_Guest_SetTid_ARM64.apk.sha256)
      - name: Publish prerelease APK on GitHub Releases
        if: env.CARX_R3A_STABLE_SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG=carx-pc-v0021-r3c14
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo 'Release already exists — refuse to overwrite APK'; exit 1
          fi
          gh release create "$TAG" /tmp/carx-release/* \
            --title "CarX PC Runtime R3-C14 — authentic GNU ldso guest set_tid_address(218)" \
            --target "$GITHUB_SHA" --prerelease \
            --notes "R3C14 extends authentic unmodified GNU x86_64 ld.so via FEX after ARCH_SET_FS to x86 set_tid_address(218), source-authenticates guest TLS clear_child_tid pointer at FS+0x2d0, preserves guest memory and returns bounded guest TID=1 without any Android/Bionic set_tid_address or host TLS change. Prior source-pinned libc maps and safety invariants preserved; stops at next unsupported genuine guest x86 syscall exit117. Signed com.r4.carxpc versionCode21 updates R3C13. Run test06 and export diagnostics JSON. Full glibc, Wine, DXVK and CarX boot not proven."
      - name: Remove original signing material from temporary runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/carx-r3a-stable.p12"
