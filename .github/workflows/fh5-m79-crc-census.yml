name: FH5 M79 CRC Header Census Tests
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - fh5-auto/m79_crc_asset_census.py
      - .github/workflows/fh5-m79-crc-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M79 syntax, source privacy, CRC and corruption tests
        working-directory: fh5-auto
        run: |
          python -m py_compile m79_crc_asset_census.py
          python -m unittest -v m79_crc_asset_census.Tests
