name: KERNIX G0 two JMPREL 91 92 genuine SAME FEX ARM64 guest native hardware writers independent replay
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_libc_jmprel_two_target_live_gate.py'
      - '.github/workflows/kernix-g0-libc-jmprel-91-92-two-real-fex-arm64-writers-independent-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-attest-two-same-process-real-arm64-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download original immutable source GNU Linux x86_64 program ldso libc
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download original FEX ARM64 TWO genuine native HW writes from one source loader process
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42673444201
          name: KERNIX-G0-Original-GNU-Ldso-IRELATIVE-After-Real-FEX-Main-Seal-ARM64-ONLY
          github-token: ${{ github.token }}
          path: inputs/two-original-native
      - name: Download independently accepted prior fifth real native GNU source writer
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42671013884
          name: KERNIX-G0-Fifth-Original-Libc-JMPREL-Real-FEX-ARM64-Independent-HW-Writer
          github-token: ${{ github.token }}
          path: inputs/fifth-independent
      - name: Strictly source-pin immutable original GNU x86 ELF and first-five independent hardware receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            native-engine/tools/kernix_g0_libc_jmprel_two_target_native_batch.py \
            native-engine/tools/kernix_g0_libc_jmprel_two_target_live_gate.py
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          triad=Path('inputs/triad/original-guest')
          manifest=json.loads(Path('inputs/triad/proven-guest-triad.json').read_text())
          assert manifest['original_real_FEX_linux_arm64_execution_run']==41842294261
          source={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(p.relative_to(triad)) for p in triad.rglob('*') if p.is_file()}==set(source)
          for name,(size,digest) in source.items():
            p=triad/name
            assert p.is_file() and not p.is_symlink()
            blob=p.read_bytes()
            assert len(blob)==size and hashlib.sha256(blob).hexdigest()==digest
            assert manifest['files'][name]['sha256']==digest
            dest=Path('dist/original-source-pinned-root')/name
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(blob)
          prior=Path('inputs/two-original-native')
          evidence=(
            'original-libc-147-rela-jmprel-source-inventory.json',
            'original-fex-libc-symbolic-jmprel-first-real-native-writer-proof.json',
            'original-libc-next-symbolic-jmprel-live-fex-hw-verified.json',
            'original-libc-third-symbolic-jmprel-real-fex-hw-verified.json',
            'original-libc-fourth-symbolic-jmprel-real-fex-hw-verified.json',
            'original-libc-fifth-symbolic-jmprel-real-fex-hw-verified.json',
            'original-libc-symbolic-jmprel-91-92-same-native-guest-source-plan.json',
            'original-libc-symbolic-jmprel-91-92-same-native-guest-watch.gdb',
            'original-libc-symbolic-jmprel-91-92-same-native-guest-live-fex-hw.log')
          for name in evidence:
            p=prior/name
            assert p.is_file() and not p.is_symlink()
            assert 100<p.stat().st_size<2_000_000,(name,p.stat().st_size)
            (Path('dist')/name).write_bytes(p.read_bytes())
          certified=json.loads(Path('inputs/fifth-independent/original-libc-fifth-symbolic-jmprel-real-fex-hw-verified.json').read_text())
          actual=json.loads(Path('dist/original-libc-fifth-symbolic-jmprel-real-fex-hw-verified.json').read_text())
          assert actual==certified
          assert actual['fifth_symbolic_JMPREL_real_native_hardware_store_proven'] is True
          assert actual['individual_symbolic_JMPREL_hardware_writers_proven']==5
          assert actual['six_actual_native_log_negative_mutations_rejected'] is True
          raw=(Path('dist')/evidence[-1]).read_text()
          assert raw.count('KERNIX_G0_BATCH_REAL_GDB_HW_WRITE index=91')==1
          assert raw.count('KERNIX_G0_BATCH_REAL_GDB_HW_WRITE index=92')==1
          assert 'after=0x801001250' in raw and 'after=0x8010011f0' in raw
          print('KERNIX_G0_ORIGINAL_PINNED_ELF_AND_TWO_AUTHENTIC_SAME_PROCESS_GDB_HW_STOPS_READY_FOR_INDEPENDENT_ATTESTATION')
          PY
      - name: Independent TWO-target hardware writer proof and six tampered-log fail-closed negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 native-engine/tools/kernix_g0_libc_jmprel_two_target_live_gate.py dist
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('dist/original-libc-symbolic-jmprel-91-92-same-native-guest-verified.json')
          proof=json.loads(p.read_text())
          assert proof['two_individual_real_native_hardware_writes_in_ONE_FEX_guest_proven'] is True
          assert proof['indices']==[91,92]
          assert len(proof['writers'])==2
          assert proof['writers'][0]['after_real_hardware_write_qword']=='0x801001250'
          assert proof['writers'][1]['after_real_hardware_write_qword']=='0x8010011f0'
          assert proof['writers'][0]['original_source_result_ELF_RX']=='ld-linux'
          assert proof['writers'][1]['original_source_result_ELF_RX']=='ld-linux'
          assert proof['total_individually_real_native_attested_original_libc_JMPREL']==7
          assert proof['six_actual_same_process_hw_batch_log_mutations_rejected'] is True
          assert len(proof['negative_case_names'])==6
          assert proof['remaining_140_original_RELA_JMPREL_writers_proven'] is False
          assert proof['one_process_full_147_relocation_closure_proven'] is False
          assert proof['original_IFUNC_46_resolver_completion_proven'] is False
          assert proof['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_G0_TWO_REAL_HW_WRITES_IN_ONE_GUEST_91_92_SOURCE_INDEPENDENT_PASS_NOT_FULL_GLIBC')
          PY
      - name: Upload source-verified same-guest TWO authentic hardware write receipt only
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-Two-Libc-JMPREL-91-92-Real-FEX-ARM64-Same-Guest-Hardware-Proof
          path: dist/original-libc-symbolic-jmprel-91-92-same-native-guest-verified.json
          if-no-files-found: error
          retention-days: 30
