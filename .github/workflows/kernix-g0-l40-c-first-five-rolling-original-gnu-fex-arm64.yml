name: KERNIX G0 C real GNU GLOB DAT80-84 five rolling one ARM64 FEX PID 44 forgery controls
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_l40_c_first_five_rolling_original_fex_plan.py'
      - 'native-engine/tools/kernix_g0_l40_c_fifth_original_writer_independent_gate.py'
      - '.github/workflows/kernix-g0-l40-c-first-five-rolling-original-gnu-fex-arm64.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  five-original-GNU-GLOB-DAT-native-hardware-stores-one-real-FEX-pid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Require independently verified genuine source80-83 Linux ARM64 FEX one-PID write proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 41846530666 43068123299 43156324557; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$id --jq .conclusion)" = success
          done
      - name: Download original SHA pinned GNU x86-64 libc and ld-linux triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download original 147 individual source relocation writer ledger
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43068123299
          name: KERNIX-G0-Original-147-Distinct-Source-Writer-Native-Receipts-147-Of-147-No-Loader-Closure
          github-token: ${{ github.token }}
          path: inputs/ledger147
      - name: Reuse exact original SHA FEX native ARM64 runtime (not Android)
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43078736764
          name: KERNIX-G0-Parallel20-Shared-True-ARM64-FEX-Original-GNU-Runtime
          github-token: ${{ github.token }}
          path: inputs/FEX
      - name: Regenerate original five true GNU ELF writer sources and FEX four-then-fifth rolling script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            native-engine/tools/kernix_g0_l40_c_first_five_rolling_original_fex_plan.py \
            native-engine/tools/kernix_g0_l40_c_fifth_original_writer_independent_gate.py
          python3 native-engine/tools/kernix_g0_l40_c_first_five_rolling_original_fex_plan.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . dist/C-five-source
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('dist/C-five-source')
          d=json.loads((root/'KERNIX-G0-C-Original-GLOB_DAT80-84-Five-Rolling-One-FEX-PID-SOURCE-ONLY.json').read_text())
          script=(root/'kernix-g0-c-gnu-original-globdat80-84-five-rolling-one-FEX-pid.gdb').read_bytes()
          assert d['source_indices']==[80,81,82,83,84]
          assert d['native_gdb_rolling_script_sha256']==hashlib.sha256(script).hexdigest()
          assert d['new_fifth_native_writer_proven_by_source_only'] is False
          assert d['stage_C_all_40_native_writers_proven'] is False
          print('KERNIX_G0_C_FIVE_GLOB_DAT_GNU_ORIGINAL_SOURCE_SHA_PLAN_READY_NOT_EXECUTION')
          PY
          B=inputs/FEX/kernix-parallel20-authentic-original-FEX-package.tar.gz
          test "$(sha256sum "$B" | cut -d ' ' -f1)" = "$(cat inputs/FEX/parallel20-package.sha256)"
          tar -C dist -xzf "$B"
          test -s dist/parallel20-package/FEXCore-lib/libFEXCore.so
          test -s dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64
      - name: Install real Linux AArch64 GDB hardware watchpoint debugger
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash native-engine/tools/kernix_ci_arm64_apt_mirror_failover.sh gdb
          command -v gdb
      - name: Execute four then fifth true original GLOB_DAT stores with rolled watches in one native FEX process
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/dist/parallel20-package/FEXCore-lib"
          mkdir -p dist/C-five-real
          set +e
          timeout -k 5s 180s gdb -q -nx -batch \
            -x dist/C-five-source/kernix-g0-c-gnu-original-globdat80-84-five-rolling-one-FEX-pid.gdb \
            --args dist/parallel20-package/kernix-g0-original-fex-main-actual-mprotect10-linux-arm64 \
            dist/parallel20-package/original-source-pinned-root \
            > dist/C-five-real/gnu-original-globdat80-84-five-one-FEX-pid.gdb.log 2>&1
          rc=$?
          set -e
          echo "$rc" > dist/C-five-real/gdb.exit
          grep '^KERNIX_G0_L40_C_' dist/C-five-real/gnu-original-globdat80-84-five-one-FEX-pid.gdb.log || true
          echo KERNIX_G0_C_ORIGINAL_GNU_FIVE_NATIVE_FEX_GDB_EXIT "$rc"
          test "$rc" = 0
      - name: Independently attest real hardware writes 80-84 same PID and reject 44 source/JIT/GDB forged traces
        shell: bash
        run: |
          set -euo pipefail
          python3 native-engine/tools/kernix_g0_l40_c_fifth_original_writer_independent_gate.py \
            inputs/triad/original-guest \
            inputs/ledger147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . \
            dist/C-five-real \
            dist/C-five-independently-audited
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/C-five-independently-audited/KERNIX-G0-C-Original-GNU-GLOB_DAT80-84-Five-Real-Writers-Independent-NOT-C40.json').read_text())
          assert d['source_indices_with_genuine_native_hardware_writers_in_one_FEX_pid']==[80,81,82,83,84]
          assert d['five_source_writers_independently_verified']==5
          assert len(d['four_previous_writer_forgery_events_rejected'])==28
          assert len(d['fifth_writer_forgery_events_rejected'])==16
          assert d['source85_IFUNC_resolver_or_zero_to_zero_store_proven'] is False
          assert d['stage_C_forty_source_native_writers_one_pid_proven'] is False
          assert d['Android_Bionic_Wine_Proton_games_proven'] is False
          print('KERNIX_C_TRUE_FIVE_GNU_GLOB_DAT_NATIVE_STLR_SAME_ONE_FEX_PID_AUDIT_PASS_NOT_FULL_C40')
          PY
      - name: Always save genuine source and original native FEX GDB failure evidence or successful five writer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-C-Genuine-GNU-GLOB_DAT80-84-Five-Rolling-One-FEX-PID-44-Forged-Audit
          path: |
            dist/C-five-real/gnu-original-globdat80-84-five-one-FEX-pid.gdb.log
            dist/C-five-real/gdb.exit
            dist/C-five-independently-audited/KERNIX-G0-C-Original-GNU-GLOB_DAT80-84-Five-Real-Writers-Independent-NOT-C40.json
          retention-days: 30
          if-no-files-found: warn
