            native-engine/android-host/tests/kernix_g0_original_fex_guest_source_elf_ptload_rx_mmap_then_ldso_arm64.cpp \
            -Ldist/android-candidate -lFEXCore -o "$BIN" \
            >dist/bionic-candidate-compiler.log 2>&1 || {
              cat dist/bionic-candidate-compiler.log;exit 1;
            }
          "$NDK_BIN/llvm-readelf" -h -l -d "$BIN" >dist/bionic-candidate-readelf.txt
          grep -Fq 'Machine:                           AArch64' dist/bionic-candidate-readelf.txt
          grep -Fq '/system/bin/linker64' dist/bionic-candidate-readelf.txt
          grep -Fq 'Shared library: [libFEXCore.so]' dist/bionic-candidate-readelf.txt
          grep -Fq 'Shared library: [libc.so]' dist/bionic-candidate-readelf.txt
          ! grep -E 'Shared library: \[(libc.so.6|libstdc\+\+.so.6|libc\+\+_shared.so)\]' dist/bionic-candidate-readelf.txt
