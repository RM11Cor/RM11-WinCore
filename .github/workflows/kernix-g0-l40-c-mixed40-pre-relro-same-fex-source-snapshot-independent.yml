name: KERNIX G0 C independent 39 original ELF changed 1 zero qword same FEX PID pre-main RELRO rejection READONLY 24 forged
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_l40_c_pre_relro_mixed40_same_pid_snapshot_independent_gate.py'
      - '.github/workflows/kernix-g0-l40-c-mixed40-pre-relro-same-fex-source-snapshot-independent.yml'
