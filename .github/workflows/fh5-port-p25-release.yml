name: Publish FH5 Native Port P2.5 - Full x64 Instruction Decoder
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - .github/workflows/fh5-port-p25-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact tested P2.5 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 43173156218 --repo "$GITHUB_REPOSITORY" \
            --name FH5-Native-Port-P2.5-PERMANENT-SIGNED-arm64 --dir dist
          test -s dist/app-release.apk
          printf '%s  %s\n' '8ce2397b705aa2a975679b58f3ac5590f2ef2e31c9674cc16a1bc075fbd7c5bd' 'dist/app-release.apk' | sha256sum -c -
          mv dist/app-release.apk dist/FH5-Native-Port-P2.5-Permanent-Signed.apk
      - name: Create P2.5 development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='fh5-native-port-p2-5-capstone-decoder-2026-11-12'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'P2.5 already published'; exit 0
          fi
          cat > notes.md <<'EOF'
          # FH5 Native Port P2.5 - Capstone x86-64 disassembler (EXPERIMENTAL)

          Standalone Android ARM64 APK, not using an external Bannerlator or Winlator user interface.
          - Retains direct Vulkan GPU test, 100GB ZIP64 metadata scanning, original PE64 header mapping,
            and a synthetic bounded x64->ARM64 JIT demonstration (result 42).
          - **New:** integrates the Capstone 5.0.9 x86-64 disassembly engine (pinned commit
            `022575848782a4801fd150fdbc927effcbca0864`) into the ARM64 APK.
          - Reads the original user's Forza EXE entrypoint data inside the large ZIP64 (128-byte sample),
            then reports at most 16 linear-decoded instruction mnemonics, lengths and counts.
          - Decoder output is a *linear interpretation*, not validated game control flow.
          - Actual raw x86 game bytes and operand values are not exported in the report.
          - **Important:** a disassembler is not an x64 dynamic translator. No original Forza game code
            is executed. A complete Windows process, Steam and DirectX 12 runtime do not yet exist.
          - Capstone source, license and security history: https://github.com/capstone-engine/capstone

          ## Updating Android APK
          - App ID: `com.fh5.port`.
          - Android versionCode: **8** (P2.4 was 7).
          - Same permanently protected signing certificate as P2.1–P2.4:
            `4c5fb057ca8775bede11e95ab53b748b46f823d6ba1f89b7dd174a2a6f7f1bf6`.
          - Signed APK SHA256: `8ce2397b705aa2a975679b58f3ac5590f2ef2e31c9674cc16a1bc075fbd7c5bd`.
          - **Install directly on top of permanently-signed P2.4; do not uninstall the old app.**

          ## Phone test
          1. Install the P2.5 APK over P2.4.
          2. Open the app and select your real Forza ZIP64 archive.
          3. Tap the `تحليل تعليمات بداية فورزا بـCapstone (بدون تنفيذ)` button.
          4. Export `FH5_PORT_P2_5_REPORT.json` and share that report only.

          GitHub Actions verified build: https://github.com/RM11Cor/RM11-WinCore/actions/runs/43173156218
          EOF
          gh release create "$tag" dist/FH5-Native-Port-P2.5-Permanent-Signed.apk \
            --target fh5-android-auto-tests \
            --title 'FH5 Native Port P2.5 - Capstone x86-64 Decoder (Experimental)' \
            --notes-file notes.md --prerelease
