      - name: Publish direct APK prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v2.7.3-console-gui-imports'
          ASSET='app/build/outputs/apk/release/app-release.apk#RM11-WinCore-v2.7.3-Console-GUI-Imports.apk'
