      - name: Verify GUI-importing console-subsystem regression case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path
          binary=Path('external-test/rm11-gui-smoke-v271.exe').read_bytes()
          pe=struct.unpack_from('<I',binary,0x3c)[0]
          assert binary[pe:pe+4]==b'PE\0\0'
