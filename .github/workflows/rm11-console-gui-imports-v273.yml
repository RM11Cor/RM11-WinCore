          assert subsystem==3, f'Expected regression console-subsystem PE, got {subsystem}'
          assert b'USER32.dll' in binary or b'user32.dll' in binary
          assert b'GDI32.dll' in binary or b'gdi32.dll' in binary
          print('PASS: Windows console-subsystem PE imports GUI DLLs; launcher must not gate aliases on subsystem==2')
