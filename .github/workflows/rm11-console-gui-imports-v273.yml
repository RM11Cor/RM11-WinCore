              --title 'RM11-WinCore v2.7.2 Wine Win64 GUI Import Checks' \
              --notes 'Fixes device-proven regression: a PE64 console-subsystem EXE imports USER32 and GDI32, but v2.7.2 only linked those libraries for GUI-subsystem=2. Now the user-selected PE64 pilot prepares the same fixed, trusted, non-overwriting DLL links for both PE subsystem types. Includes a pinned console-subsystem GUI-import regression binary; visible Android GUI still unsupported.' \
              --prerelease
          fi
