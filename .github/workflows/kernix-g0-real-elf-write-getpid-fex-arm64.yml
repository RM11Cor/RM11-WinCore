name: KERNIX G0 original FEX real GNU x86 ELF write/getpid Linux ARM64
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-real-elf-write-getpid-fex-arm64.yml'
      - 'native-engine/android-host/kernix_g2e_c2_original_fex_cpu_state_adapter.h'
      - 'native-engine/android-host/kernix_g0_guest_syscall_dispatch.h'
      - 'native-engine/android-host/kernix_fexcore_elf64_exec_probe.cpp'
      - 'native-engine/android-host/kernix_elf64_loader.h'
      - 'native-engine/android-guest/kernix_elf64_guest_write_getpid.S'
      - 'tools/kernix_elf64_fixture_check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-upstream-fex-syscall-guest-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build original SHA-pinned FEXCore on real Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p dist
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build git python3 pkg-config
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/FEX-Emu/FEX.git /tmp/kernix-g2ec2-fex-upstream
          git -C /tmp/kernix-g2ec2-fex-upstream checkout --quiet --detach \
            02e24ca5c01ed0c864466ed573db347336f70170
          git -C /tmp/kernix-g2ec2-fex-upstream submodule update --init --recursive --quiet
          test "$(git -C /tmp/kernix-g2ec2-fex-upstream rev-parse HEAD)" = \
            02e24ca5c01ed0c864466ed573db347336f70170
          cp /tmp/kernix-g2ec2-fex-upstream/LICENSE dist/FEX-upstream-LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/kernix-g2ec2-fex-upstream')
          p=root/'CMakeLists.txt'
          source=p.read_text()
          needle='add_subdirectory(Source/)'
          assert source.count(needle)==1
          p.write_text(source.replace(needle,'# CI only build upstream FEXCore',1))
          p=root/'FEXCore/Source/CMakeLists.txt'
          source=p.read_text()
          assert 'AddLibrary('+chr(36)+'{PROJECT_NAME}_shared SHARED)' in source
          p.write_text(source+'\ntarget_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)\n')
          PY
          timeout -k 10s 240s cmake -S /tmp/kernix-g2ec2-fex-upstream \
            -B /tmp/kernix-g2ec2-fex-native -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DBUILD_TESTING=OFF \
            -DENABLE_FEX_ALLOCATOR=ON -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_WERROR=OFF -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
            -DTUNE_CPU=generic >dist/c2-fex-configure.log 2>&1 || {
              tail -n 100 dist/c2-fex-configure.log; exit 1;
            }
          timeout -k 15s 1000s cmake --build /tmp/kernix-g2ec2-fex-native \
            --target FEXCore_shared --parallel 3 \
            >dist/c2-fex-build.log 2>&1 || {
              tail -n 100 dist/c2-fex-build.log; exit 1;
            }
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          test -s "$CORE"
          readelf -h "$CORE" | grep -Fq 'AArch64'
          sha256sum "$CORE" >dist/original-fexcore-aarch64.sha256
          echo KERNIX_G2EC2_ORIGINAL_FEX_CORE_SOURCE_AND_ARM64_BUILD_PASS
      - name: Build exact GNU x86-64 ELF and verify guest opcode+layout
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils-x86-64-linux-gnu
          x86_64-linux-gnu-as --64 native-engine/android-guest/kernix_elf64_guest_write_getpid.S -o dist/g0-guest.o
          x86_64-linux-gnu-ld -pie -nostdlib --no-dynamic-linker --build-id=none \
            -z max-page-size=0x4000 -e _start -o dist/g0-guest.elf dist/g0-guest.o
          python3 tools/kernix_elf64_fixture_check.py dist/g0-guest.elf
          sha256sum dist/g0-guest.elf >dist/g0-guest.sha256
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist/g0-guest.elf').read_bytes()
          blob=''.join(('\\n' if i%12==0 else '')+f'0x{byte:02x},' for i,byte in enumerate(src))
          Path('dist/kernix_elf64_guest_blob.h').write_text(
           '// Genuine source-verified GNU x86_64 ELF, not synthetic bytecode.\\n'
           '#pragma once\\nstatic const unsigned char KERNIX_ELF64_BLOB[] = {'
           +blob+'\\n};\\n')
          PY
          echo G0_GNU_X86_ELF64_SOURCE_HASH_AND_LOADER_VALIDATED
      - name: Compile SAME Android FEX ELF guest runner as Linux ARM64

        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fPIE -pie -DKERNIX_G0_REAL_ELF_LINUX_ARM64_CI \
            -Inative-engine/android-host -Idist \
            -isystem /tmp/kernix-g2ec2-fex-upstream/FEXCore/include \
            -isystem /tmp/kernix-g2ec2-fex-upstream/External/fmt/include \
            -isystem /tmp/kernix-g2ec2-fex-upstream/External/unordered_dense/include \
            -isystem /tmp/kernix-g2ec2-fex-upstream/External/xxhash \
            -isystem /tmp/kernix-g2ec2-fex-native/include \
            -isystem /tmp/kernix-g2ec2-fex-native/generated \
            native-engine/android-host/kernix_fexcore_elf64_exec_probe.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" \
            -o dist/kernix-g0-real-elf-runner >dist/g0-elf-compile.log 2>&1 || {
              cat dist/g0-elf-compile.log; exit 1;
            }
          echo KERNIX_G0_FEX_CPUSTATE_SYSCALL_BRIDGE_COMPILED
      - name: Run original GNU x86 ELF through FEXCore actual two syscalls and verify stdout
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          set +e
          timeout -k 3s 22s env LD_LIBRARY_PATH="$CORE_DIR" \
            dist/kernix-g0-real-elf-runner >dist/g0.stdout 2>dist/g0.stderr
          RC=$?
          set -e
          cat dist/g0.stdout
          tail -n 60 dist/g0.stderr
          RC="$RC" python3 - <<'PY'
          import os,json
          from pathlib import Path
          rc=int(os.environ["RC"])
          output=Path("dist/g0.stdout").read_bytes()
          errors=Path("dist/g0.stderr").read_text(errors="replace")
          marker=b"KERNIX_ELF64_GUEST_RUN_PASS\\n"
          completed=b"KERNIX_G0_REAL_FEX_ARM64_ELF_WRITE_GETPID_BRIDGE_PASS_NO_GLIBC_NO_ANDROID\\n"
          written="KERNIX_G0_REAL_FEX_ELF64_GUEST_WRITE_VM_BRIDGE_PASS"
          pid="KERNIX_G0_REAL_FEX_ELF64_GUEST_GETPID_BRIDGE_PASS"
          passed=(rc==0 and output.count(marker)==1 and output.count(completed)==1 and
                  errors.count(written)==1 and errors.count(pid)==1 and
                  errors.index(written)<errors.index(pid) and
                  "KERNIX_G0_ACTUAL_FEX_CPUSTATE_GUEST_STACK_OR_ABI_REJECTED" not in errors)
          ev={"schema":"kernix.g0.real-x86-elf-original-fex-write-getpid-linux-arm64.v1",
              "upstream_fex_commit":"02e24ca5c01ed0c864466ed573db347336f70170",
              "kernix_commit":os.environ["GITHUB_SHA"],
              "real_gnu_x86_64_elf_exec_under_original_fex_linux_arm64":passed,
              "real_guest_stdout_write_bytes_verified":passed,
              "real_guest_getpid_returned_to_fex_rax":passed,
              "bounded_hlt_terminates_guest_proof":passed,
              "original_ldso_glibc_executed":False,
              "android_device_executed":False,
              "wine_games_executed":False, "host_process_exit_code":rc}
          Path("dist/g0-real-elf-evidence.json").write_text(json.dumps(ev,indent=2)+"\\n")
          if not passed:raise SystemExit("Original FEX ELF end-to-end syscall gate failed")
          print("KERNIX_G0_ORIGINAL_FEX_REAL_X86_ELF_WRITE_GETPID_LINUX_ARM64_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G0-Original-FEX-Real-ELF-Write-Getpid-Linux-ARM64-Only
          path: dist/
          retention-days: 30
          if-no-files-found: warn
