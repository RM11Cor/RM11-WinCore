name: KERNIX G2-E C3-D7O original ld-linux second CALL target opcode immutable source inspection
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2e-c3d7o-exact-original-ldso-call-target-opcode-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  attested-original-source-call-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download original x86 Linux main/ld-linux/libc immutable source artifact (previous real FEX ARM64 Linux run)
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/guest
      - name: Verify exact SHA256 real Linux guest ELF and restore owner-readonly app-style source root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          src=Path('inputs/guest/original-guest')
          provenance=json.loads(Path('inputs/guest/proven-guest-triad.json').read_text())
          assert provenance['original_real_FEX_linux_arm64_execution_run']==41842294261
          expected={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(x.relative_to(src)) for x in src.rglob('*') if x.is_file()}==set(expected)
          root=Path('dist/immutable-rootfs')
          for name,(size,sha) in expected.items():
              raw=(src/name).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha
              assert provenance['files'][name]['sha256']==sha
              assert raw[:6]==b'\x7fELF\x02\x01'
              assert struct.unpack_from('<H',raw,18)[0]==62
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
              target.chmod(0o400)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==sha
          for directory in sorted((x for x in root.rglob('*') if x.is_dir()),reverse=True):
              directory.chmod(0o700)
          root.chmod(0o700)
          Path('dist/source-real-x86-linux-triad.json').write_text(json.dumps({
            'original_FEX_linux_arm64_real_glibc_guest_run':41842294261,
            'exact_source_guest_artifact_run':41846530666,
            'all_three_source_elf_sha256_verified':True,
            'signed_Android_device_execution_this_run':False
          },indent=2)+'\n')
          print('KERNIX_G2EC3D2_PINNED_THREE_REAL_X86_LINUX_ELF_SHA256_PASS')
          PY
      - name: Inspect exact original SHA-locked ld-linux e_entry and signed relative CALL destination bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          src=Path('dist/immutable-rootfs/lib64/ld-linux-x86-64.so.2')
          raw=src.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'
          eh=struct.unpack_from('<16sHHIQQQIHHHHHH',raw,0)
          assert eh[2]==62 and eh[1]==3
          entry=eh[4];phoff=eh[5];phentsize=eh[9];phnum=eh[10]
          assert phentsize==56 and phnum>0 and phnum<=128
          def locate(va,length):
            hits=[]
            for k in range(phnum):
              p=struct.unpack_from('<IIQQQQQQ',raw,phoff+k*56)
              ptype,flags,offset,pvaddr,_,filesz,_,_=p
              if ptype==1 and flags&1 and not flags&2 and pvaddr<=va and va+length<=pvaddr+filesz:
                at=offset+va-pvaddr
                assert at+length<=len(raw)
                hits.append(at)
            assert len(hits)==1, (va,hits)
            return hits[0]
          at=locate(entry,16)
          first=raw[at:at+16]
          assert first[:4]==bytes.fromhex('48 89 e7 e8')
          rel=struct.unpack_from('<i',first,4)[0]
          target=entry+8+rel
          tat=locate(target,32)
          tb=raw[tat:tat+32]
          report={
            'schema':'kernix.g2e.c3d7o.authentic-call-target-x86-source-byte-inspection.v1',
            'source_sha256':sha,
            'original_entry_vaddr':hex(entry),
            'original_entry_first_16_hex':first.hex(' '),
            'original_call_rel32':rel,
            'source_target_vaddr':hex(target),
            'source_target_file_offset':tat,
            'source_target_first_32_hex':tb.hex(' '),
            'original_target_instruction_executed':False,
            'source_original_elf_modified':False,
            'android_device_tested':False
          }
          Path('dist/c3d7o-original-call-target-source.json').write_text(json.dumps(report,indent=2)+'\n')
          print('KERNIX_C3D7O_ORIGINAL_LDSO_ENTRY',report['original_entry_first_16_hex'])
          print('KERNIX_C3D7O_ORIGINAL_LDSO_CALL_TARGET',report['source_target_first_32_hex'])
          print('KERNIX_C3D7O_SOURCE_ATTESTED_CALL_TARGET_BYTES_PASS')
          PY
      - name: Disassemble original x86 ldso at exact source-backed CALL destination
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(python3 - <<'PY'
          import json
          print(int(json.load(open('dist/c3d7o-original-call-target-source.json'))['source_target_vaddr'],16))
          PY
          )
          STOP=$((TARGET+32))
          objdump -d -M intel \
            --start-address="$TARGET" --stop-address="$STOP" \
            dist/immutable-rootfs/lib64/ld-linux-x86-64.so.2 \
            | tee dist/c3d7o-original-ldso-target-disassembly.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-C3D7O-SourcePinned-Original-Ldso-Call-Target-Opcode-Inspection
          path: |
            dist/c3d7o*
          retention-days: 30
