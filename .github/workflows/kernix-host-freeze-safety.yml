name: KERNIX Host Freeze Safety Check
on:
  push:
    branches: [rm11-controller-wine-hid-rebuild]
    paths:
      - 'app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java'
      - 'app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezeSafetyV49151.java'
      - 'tests/standalone/KernixHostFreezeSafetySmoke.java'
      - '.github/workflows/kernix-host-freeze-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and exercise safety policy using Java 8 language level
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernix-safety"
          javac --release 8 -d "$RUNNER_TEMP/kernix-safety" \
            app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezeSafetyV49151.java \
            tests/standalone/KernixHostFreezeSafetySmoke.java
          java -cp "$RUNNER_TEMP/kernix-safety" \
            com.rm11.autocore.runtime.KernixHostFreezeSafetySmoke
          grep -F 'NATIVE_XORG_SERVICE_NOT_STARTED_BY_THIS_ACTIVITY=true' \
            app/src/main/java/com/rm11/autocore/RM11NativeWineActivity.java
