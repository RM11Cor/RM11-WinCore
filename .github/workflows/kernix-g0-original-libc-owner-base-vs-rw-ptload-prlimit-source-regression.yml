name: KERNIX G0 real original FEX libc owner image base vs RW PTLOAD prlimit64 regression 8 false proofs
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-original-libc-owner-base-vs-rw-ptload-prlimit-source-regression.yml'
      - 'native-engine/ci/kernix_g0_original_libc_image_base_vs_rw_ptload_prlimit_guard.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-source-original-libc-owner-not-RW-PTLOAD:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 42521826045
          name: KERNIX-G0-Real-Original-FEX-Source-Libc-Prlimit64-GuestStack-ONLY
          github-token: ${{ github.token }}
          path: input/real-FEX
      - name: Distinguish original GNU libc image owner 804000000 from fourth 8041ff000 RW PTLOAD with 8 false-proof mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          script=native-engine/ci/kernix_g0_original_libc_image_base_vs_rw_ptload_prlimit_guard.py
          python3 -m py_compile "$script"
          mapfile -t logs < <(find input/real-FEX -type f -name original-fex-live-source-libc-prlimit64.log)
          test "${#logs[@]}" -eq 1
          python3 "$script" selftest "${logs[0]}" \
            native-engine/android-host/tests/kernix_g0_original_fex_full_ptload_source_executable_range_arm64.cpp \
            >dist/real-original-libc-owner-vs-RW-PTLOAD-prlimit64.log
          grep -Fq KERNIX_G0_LIBC_PRLIMIT_IMAGE_BASE_RWPAGE_FORGERY_08_REJECTED \
            dist/real-original-libc-owner-vs-RW-PTLOAD-prlimit64.log
          grep -Fq KERNIX_G0_REAL_ORIGINAL_LIBC_OWNER_BASE_804000000_NOT_RW_PTLOAD_8041FF000_PRLIMIT_GUARD_REGRESSION_PASS \
            dist/real-original-libc-owner-vs-RW-PTLOAD-prlimit64.log
          tail -n 45 dist/real-original-libc-owner-vs-RW-PTLOAD-prlimit64.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G0-Real-Original-Libc-Owner-Not-RW-PTLOAD-Prlimit-Regressions
          path: dist/
          retention-days: 30
          if-no-files-found: warn
