name: KERNIX APK stable signing Gradle contract smoke (NO distributable APK)
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/android-app/app/build.gradle'
      - '.github/workflows/kernix-stable-apk-signing-smoke.yml'
      - '.github/workflows/kernix-android-host-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-stable-signing-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require stable package and first update version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native-engine/android-app/app/build.gradle').read_text()
          assert "applicationId 'org.kernix.host'" in p
          assert "versionCode 9" in p
          assert "versionName '0.9-guest-memory-write'" in p
          assert 'signingConfig signingConfigs.kernixUpdate' in p
          assert 'KERNIX_APK_SIGNING_PASSWORD' in p
          assert "keyAlias 'kernix-update'" in p
          print('KERNIX_FIXED_PACKAGE_VERSION_AND_SIGNING_DSL_PRESENT')
          PY
      - name: Ensure Android build tools available
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$TOOL"
          "$TOOL" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Confirm production assembleRelease fails without private key
        shell: bash
        working-directory: native-engine/android-app
        run: |
          set -euo pipefail
          unset KERNIX_APK_KEYSTORE_PATH KERNIX_APK_SIGNING_PASSWORD
          if gradle --no-daemon :app:assembleRelease > /tmp/kernix-unsigned-refusal.log 2>&1; then
            echo "::error::Release build wrongly succeeded without persistent signing credentials"
            exit 1
          fi
          grep -Fq 'KERNIX release blocked' /tmp/kernix-unsigned-refusal.log || {
            tail -n 50 /tmp/kernix-unsigned-refusal.log
            exit 1
          }
          echo KERNIX_RELEASE_WITHOUT_PERSISTENT_SIGNER_FAILS_CLOSED
      - name: Internally test AGP release signer with disposable smoke key ONLY
        shell: bash
        working-directory: native-engine/android-app
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/kernix-nondistributable"
          export KERNIX_APK_KEYSTORE_PATH="$RUNNER_TEMP/kernix-nondistributable/smoke.p12"
          export KERNIX_APK_SIGNING_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -alias kernix-update -keyalg RSA -keysize 2048 \
            -storetype PKCS12 -validity 2 -dname "CN=DO NOT DISTRIBUTE KERNIX SMOKE" \
            -keystore "$KERNIX_APK_KEYSTORE_PATH" \
            -storepass "$KERNIX_APK_SIGNING_PASSWORD" \
            -keypass "$KERNIX_APK_SIGNING_PASSWORD" -noprompt >/dev/null 2>&1
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/kernix-smoke-cert.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/kernix-smoke-version.txt"
          grep -Fq "package: name='org.kernix.host' versionCode='9' versionName='0.9-guest-memory-write'" \
            "$RUNNER_TEMP/kernix-smoke-version.txt"
          if grep -iq 'a74735bc30b53e590589d8ff5c233f72dc0e4ddf6e312939d668ae30c46b6f8e' \
            "$RUNNER_TEMP/kernix-smoke-cert.txt"; then
            echo "::error::Smoke signing key unexpectedly matches permanent private release key"
            exit 1
          fi
          # Second internal build simulates v0.10 with SAME keystore and
          # increased Android versionCode, without changing published branch.
          cp "$APK" "$RUNNER_TEMP/kernix-nondistributable/v9-test.apk"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          assert "versionCode 9" in s and "versionName '0.9-guest-memory-write'" in s
          s=s.replace('versionCode 9','versionCode 10',1)
          s=s.replace("'0.9-guest-memory-write'","'0.10-signer-compatibility-smoke'",1)
          p.write_text(s)
          PY
          gradle --no-daemon :app:assembleRelease
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/kernix-smoke-v9-cert.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/kernix-smoke-v9-version.txt"
          echo KERNIX_SMOKE_AFTER_SECOND_RELEASE_BUILD
          grep '^package:' "$RUNNER_TEMP/kernix-smoke-v9-version.txt" | head -1
          if ! grep -Fq "package: name='org.kernix.host' versionCode='10' versionName='0.10-signer-compatibility-smoke'" \
            "$RUNNER_TEMP/kernix-smoke-v9-version.txt"; then
              echo "::error::v0.9 package identity or versionCode missing"
              exit 1
          fi
          echo KERNIX_SMOKE_V10_VERSION_IDENTIFIED
          # Harmless disposable smoke certificate details: capture the
          # actual apksigner output format before comparing two APKs.
          echo KERNIX_SMOKE_APKSIGNER_V10_OUTPUT_FORMAT
          cat "$RUNNER_TEMP/kernix-smoke-cert.txt"
          echo KERNIX_SMOKE_APKSIGNER_V9_OUTPUT_FORMAT
          cat "$RUNNER_TEMP/kernix-smoke-v9-cert.txt"
          cert_v8="$(grep -i 'V2 Signer: certificate SHA-256 digest:' "$RUNNER_TEMP/kernix-smoke-cert.txt" | awk '{print $NF}')"
          cert_v9="$(grep -i 'V2 Signer: certificate SHA-256 digest:' "$RUNNER_TEMP/kernix-smoke-v9-cert.txt" | awk '{print $NF}')"
          if [ -z "$cert_v8" ] || [ "$cert_v8" != "$cert_v9" ]; then
             echo "::error::Signing certificate changed between v0.8 and v0.9 smoke builds"
             exit 1
          fi
          echo KERNIX_SMOKE_V9_V10_CERTIFICATE_STABLE
          if [ "$(sha256sum "$RUNNER_TEMP/kernix-nondistributable/v9-test.apk" | awk '{print $1}')" = \
               "$(sha256sum "$APK" | awk '{print $1}')" ]; then
              echo "::error::APKs did not change despite versionCode increase"
              exit 1
          fi
          echo KERNIX_SMOKE_V9_V10_DIFFERENT_APK_CONTENT
          echo KERNIX_V9_TO_V10_SAME_SIGNER_GREATER_VERSION_CODE_CONTRACT_PASS
          rm -f "$RUNNER_TEMP/kernix-nondistributable/v8-test.apk"
          rm -f "$APK" "$KERNIX_APK_KEYSTORE_PATH"
          echo KERNIX_AGP_RELEASE_SIGNING_WITH_STABLE_KEY_PATH_WORKS
          echo KERNIX_SMOKE_BINARY_DELETED_NOT_A_DISTRIBUTABLE_APK
