name: Publish FH5 Native Port P3.7 - Bounded Long Symbol Imports
on:
  push:
    branches:
      - fh5-android-auto-tests
    paths:
      - .github/workflows/fh5-port-p37-release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain tested P3.7 permanent-signed APK and verify SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 43200343080 --repo "$GITHUB_REPOSITORY" \
            --name FH5-Native-Port-P3.7-PERMANENT-SIGNED-arm64 --dir dist
          test -s dist/app-release.apk
          printf '%s  %s\n' '65833334d5f6fd700146e696a71f0853cd23f4ce03c1842b3f35a192e746e19d' 'dist/app-release.apk' | sha256sum -c -
          mv dist/app-release.apk dist/FH5-Native-Port-P3.7-Permanent-Signed.apk
      - name: Publish P3.7 experimental symbol parser repair
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='fh5-native-port-p3-7-long-import-symbols-2026-11-12'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'P3.7 already published'; exit 0
          fi
          cat > notes.md <<'EOF'
          # FH5 Native Port P3.7 — Fix Import Function Names Longer than 96 Bytes

          **Read-only experimental Android ARM64 diagnostic APK. NOT a playable Forza Horizon 5 port.**

          ## Confirmed by user's original P3.6 Android report
          - `ForzaHorizon5.exe` direct PE64 size: 182,826,496 bytes.
          - 47 distinct static imported DLLs; original Import Directory fully scanned.
          - Six present local DLL names were all verified as actual PE32+ AMD64 DLL headers:
            `steam_api64.dll`, `partyxboxlive.dll`, `partywin.dll`,
            `amd_ags_x64.dll`, `bink2w64.dll`, `webview2loader.dll`.
          - **Import function scan failed** on
            `pe_symbol_function_name_unterminated` and therefore zero counts
            were reported; these zeros were NOT actual zero function imports.

          ## P3.7 repair
          - Previous parser read a fixed short 96-byte portion of each imported
            function name. Some C++ decorated symbols can be much longer.
          - Now reads bounded 96-byte chunks up to 1024 bytes of a function name,
            preserving PE section and file bounds on every chunk.
          - Shows at most 80 characters in each example and labels truncated
            examples, without prematurely failing an otherwise valid name.
          - When the 1024-byte cap is exceeded, a name is counted but the
            parser marks import scan **incomplete** rather than pretending
            to have decoded the entire symbol.
          - Adds test fixtures with long C++ names (>200 characters),
            >1024-byte samples, original short names, ordinal imports and
            malformed file bounds. Reports per-DLL named/ordinal import counts.
          - Retains earlier six local DLL PE64 x64 header checks and
            read-only SAF extracted game file access.
          - No DLL is loaded; no import address resolution, x64 game execution,
            Windows API process, graphics bridge or DRM bypass is implemented.
          - Uploadable report: `FH5_PORT_P3_7_REPORT.json`.

          ## Safe installation
          - Package ID: `com.fh5.port`, versionCode **20** (P3.6 was 19).
          - Stable signing SHA256 certificate unchanged:
            `4c5fb057ca8775bede11e95ab53b748b46f823d6ba1f89b7dd174a2a6f7f1bf6`.
          - Signed APK SHA256: `65833334d5f6fd700146e696a71f0853cd23f4ce03c1842b3f35a192e746e19d`.
          - Install over P3.6 **without uninstalling** to retain folder permission.

          ## Phone test
          1. Install P3.7 over P3.6.
          2. Press `فحص دوال Windows وملفات DLL المحلية`.
          3. Export `FH5_PORT_P3_7_REPORT.json` after the scan finishes.
          4. Upload the JSON file; do not upload the original game files.

          Build, Java unit tests including the long-name cases, native
          tests, APK signing, version and ABI checks all passed:
          https://github.com/RM11Cor/RM11-WinCore/actions/runs/43200343080
          EOF
          gh release create "$tag" dist/FH5-Native-Port-P3.7-Permanent-Signed.apk \
            --target fh5-android-auto-tests \
            --title 'FH5 Native Port P3.7 - Long Imported Function Names (Experimental)' \
            --notes-file notes.md --prerelease
