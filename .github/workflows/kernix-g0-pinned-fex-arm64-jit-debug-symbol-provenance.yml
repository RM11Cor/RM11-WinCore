      - name: Inspect original FEX JIT guest source writer and IRELATIVE resolver coverage at native ARM64 function entry (pre-prologue ABI, diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-g0-dwarf-build -type f -name libFEXCore.so | head -1)"
          test -s "$CORE"
          export LD_LIBRARY_PATH="$(dirname "$CORE")"
          HOST="$PWD/dist/kernix-g0-original-main-relro-next-source-audit-linux-arm64"
          nm -C "$HOST" | grep -Eq ' [Tt] main$'
          cat >dist/original-ldso-irelative-jit-host-first-opcode.gdb <<'GDB'
          # GDB processes -x before --args has installed the inferior's
          # symbols on this runner. Load the actual host executable FIRST
          # so "start" cannot run without an original host main breakpoint.
          file dist/kernix-g0-original-main-relro-next-source-audit-linux-arm64
          set args dist/original-source-pinned-root
          set pagination off
          set confirm off
          set print thread-events off
          set disable-randomization off
          set startup-with-shell off
          handle SIGBUS nostop noprint pass
          # 'start' requires GDB to resolve main from the selected executable;
          # under this runner it proceeded without a main breakpoint despite
          # host nm provenance. starti always stops at the FIRST native opcode.
          starti
          # FEXCore is mapped by the host ELF dynamic loader. Stop at the
          # actual library-load event before resolving its original local
          # CompileCode text symbol and its first, pre-prologue ARM64 opcode.
          catch load libFEXCore[.]so
          continue
          python
          import gdb,os,pathlib,re,struct
          base_file=pathlib.Path('/tmp/kernix-fex-g0-dwarf-build/FEXCore/Source/libFEXCore.so').resolve()
          nmline=pathlib.Path('dist/original-ldso-irelative-debug-runtime-fex-symbol.txt').read_text().strip()
          m=re.fullmatch(r'([0-9a-fA-F]+) [tT] FEXCore::CPU::Arm64JITCore::CompileCode\(.+',nmline)
          print('KERNIX_G0_FEX_JIT_GDB_HOST_SYMBOL_NM '+nmline,flush=True)
          assert m,('expected exactly one original FEX native JIT entry local symbol',nmline)
          elf_symbol_offset=int(m.group(1),16)
          inferior=gdb.selected_inferior()
          print('KERNIX_G0_FEX_JIT_GDB_INFERIOR pid=%s'% (inferior.pid if inferior else 'none'),flush=True)
          assert inferior and inferior.pid>0
          # File-offset identity is stronger than assuming every /proc/maps
          # VMA has one shared (start - map_offset) basis. RELRO/data split
          # mappings can show differing values (64K in the prior diagnostic).
          # Derive the runtime opcode from the exact ELF RX PT_LOAD file bytes.
          source_bytes=base_file.read_bytes()
          assert source_bytes[:6]==bytes.fromhex('7f454c460201')
          assert struct.unpack_from('<H',source_bytes,18)[0]==183
          phoff=struct.unpack_from('<Q',source_bytes,32)[0]
          phsize,phcount=struct.unpack_from('<HH',source_bytes,54)
          assert phsize==56 and 0<phcount<=64 and phoff+56*phcount<=len(source_bytes)
          phdrs=[struct.unpack_from('<IIQQQQQQ',source_bytes,phoff+i*56)
                 for i in range(phcount)]
          owning=[ph for ph in phdrs if ph[0]==1 and (ph[1]&1)==1
                  and ph[3]<=elf_symbol_offset and
                  elf_symbol_offset+16<=ph[3]+ph[5] and
                  ph[2]+ph[5]<=len(source_bytes)]
          assert len(owning)==1,('CompileCode symbol not source-owned RX PT_LOAD',owning)
          file_offset=owning[0][2]+elf_symbol_offset-owning[0][3]
          source_opcode=source_bytes[file_offset:file_offset+16]
          candidates=[]
          all_mappings=[]
          for line in pathlib.Path('/proc/%s/maps'%inferior.pid).read_text().splitlines():
              parts=line.split(maxsplit=5)
              if len(parts)!=6:continue
              mapped=os.path.realpath(parts[5].replace(' (deleted)',''))
              if mapped!=str(base_file):continue
              low,high=(int(v,16) for v in parts[0].split('-'))
              file_map_offset=int(parts[2],16)
              all_mappings.append((hex(low),hex(high),parts[1],hex(file_map_offset)))
              if parts[1][2]=='x' and file_map_offset<=file_offset and \
                      file_offset+16<=file_map_offset+(high-low):
                  candidates.append(low+file_offset-file_map_offset)
          print('KERNIX_G0_FEX_JIT_GDB_ELF_RX_FILE_OFFSET source=%s symbol_elf_va=0x%x file_offset=0x%x mappings=%s candidate_native_pcs=%s'%(
              str(base_file),elf_symbol_offset,file_offset,repr(all_mappings),
              repr([hex(c) for c in candidates])),flush=True)
          assert len(candidates)==1,('host native CompileCode RX file offset unmapped/ambiguous',candidates)
          runtime=candidates[0]
          actual=bytes(inferior.read_memory(runtime,16))
          assert actual==source_opcode,('host code bytes differ from source ELF bytes',actual.hex(),source_opcode.hex())
          host_base=runtime-elf_symbol_offset
          print('KERNIX_G0_FEX_JIT_GDB_ELF_NATIVE_CODE_16_BYTES_MATCH file_off=0x%x runtime_pc=0x%x bytes=%s'%(
              file_offset,runtime,actual.hex()),flush=True)
          symbol=gdb.execute('info symbol 0x%x'%runtime,to_string=True)
          print('KERNIX_G0_FEX_JIT_GDB_INFO_SYMBOL runtime=0x%x result=%r'%(runtime,symbol),flush=True)
          assert 'Arm64JITCore::CompileCode(' in symbol,('runtime FEX host symbol mismatch',symbol)
          # Host AArch64 at the genuine first opcode, BEFORE the C++ prologue:
          # x0=this, x1=guest Entry, x2=guest byte Size (pinned upstream ABI).
          original='0x80100f91c'
          resolver='0x80101a8e0'
          zero_writer='0x80100fd60'
          conditions=[
              '$x2 > 0',
              '$x2 < 0x100000',
              '(($x1 <= %s && $x1 + $x2 > %s) || ($x1 <= %s && $x1 + $x2 > %s) || ($x1 <= %s && $x1 + $x2 > %s))'%(
                   original,original,resolver,resolver,zero_writer,zero_writer)]
          condition=' && '.join(conditions)
          installed=gdb.execute('break *0x%x if %s'%(runtime,condition),to_string=True)
          # GDB normalizes Breakpoint.location differently across versions,
          # even when it has successfully created a source-resolved native
          # first-instruction breakpoint. Use the actual GDB creation receipt
          # and verify its precise runtime PC instead of comparing strings.
          receipt=re.fullmatch(r'Breakpoint ([0-9]+) at 0x([0-9a-fA-F]+):.*',installed.strip(),flags=re.DOTALL)
          assert receipt and int(receipt.group(2),16)==runtime,('native breakpoint creation receipt invalid',installed,runtime)
          bp_number=int(receipt.group(1))
          commands=('commands %d\nsilent\n'
                    'printf "KERNIX_G0_ORIGINAL_FEX_FIRST_OPCODE_COMPILE_SPAN guest_entry=0x%%lx guest_size=0x%%lx native_pc=0x%%lx\\n", $x1,$x2,$pc\n'
                    'continue\nend'%bp_number)
          gdb.execute(commands,to_string=True)
          print('KERNIX_G0_ORIGINAL_FEX_NATIVE_COMPILECODE_FIRST_OPCODE_BREAKPOINT_SOURCE_LOCKED runtime_pc=0x%x symbol_offset=0x%x host_base=0x%x'%(runtime,elf_symbol_offset,host_base))
          end
          continue
          info breakpoints
          quit
          GDB
          set +e
          timeout -k 5s 100s gdb -q -nx -batch \
            -x dist/original-ldso-irelative-jit-host-first-opcode.gdb \
            --args "$PWD/dist/kernix-g0-original-main-relro-next-source-audit-linux-arm64" \
            "$PWD/dist/original-source-pinned-root" \
            >dist/original-ldso-irelative-jit-host-first-opcode.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" >dist/original-ldso-irelative-jit-host-first-opcode.exit
          head -n 24 dist/original-ldso-irelative-jit-host-first-opcode.log
          tail -n 95 dist/original-ldso-irelative-jit-host-first-opcode.log
          python3 - <<'PY'
