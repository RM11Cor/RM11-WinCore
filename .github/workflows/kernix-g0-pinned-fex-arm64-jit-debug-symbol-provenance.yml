name: KERNIX G0 source-pinned FEX Arm64 JIT host debug symbol provenance ONLY
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g0-pinned-fex-arm64-jit-debug-symbol-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-fex-jit-symbols:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build separately pinned FEXCore with DWARF for native symbol inspection (no guest execution)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p dist
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build git python3 pkg-config binutils binutils-x86-64-linux-gnu
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-g0-dwarf-src
          git -C /tmp/kernix-fex-g0-dwarf-src checkout --quiet --detach \
            02e24ca5c01ed0c864466ed573db347336f70170
          git -C /tmp/kernix-fex-g0-dwarf-src submodule update --init --recursive --quiet
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          root=Path('/tmp/kernix-fex-g0-dwarf-src')
          pinned='02e24ca5c01ed0c864466ed573db347336f70170'
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==pinned
          rel='FEXCore/Source/Interface/Core/JIT/JIT.cpp'
          blob=subprocess.check_output(['git','-C',str(root),'hash-object',rel],text=True).strip()
          assert blob=='2a7e575d03c78e5687f4eddd539984415b8d60ca'
          src=(root/rel).read_text()
          assert src.count('CPUBackend::CompiledCode Arm64JITCore::CompileCode(')==1
          assert src.count('this->Entry = Entry;')==1
          assert src.count('.RIP = Entry,')==1
          main=root/'CMakeLists.txt'
          original=main.read_text()
          token='add_subdirectory(Source/)'
          assert original.count(token)==1
          main.write_text(original.replace(token,'# CI diagnostic FEXCore build only',1))
          cmake=root/'FEXCore/Source/CMakeLists.txt'
          original=cmake.read_text()
          assert 'AddLibrary('+chr(36)+'{PROJECT_NAME}_shared SHARED)' in original
          assert 'LinkerGC(' in original and 'CXX_VISIBILITY_PRESET hidden' in original
          cmake.write_text(original+'\ntarget_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)\n')
          Path('dist/source-provenance.json').write_text(json.dumps({
              'schema':'kernix.g0.original-fex-jit-debug-symbol-source-lock.v1',
              'original_fex_commit':pinned,'jit_cpp_blob':blob,
              'source_compilecode_definition_attested':True,
              'source_jit_cpp_mutated':False,
              'diagnostic_cmake_adapted_same_as_stable_core':True,
              'guest_resolver_execution_proven':False,
              'Android_or_Wine_games_proven':False},indent=2)+'\n')
          PY
          timeout -k 10s 240s cmake -S /tmp/kernix-fex-g0-dwarf-src \
            -B /tmp/kernix-fex-g0-dwarf-build -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O2 -g -DNDEBUG -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O2 -g -DNDEBUG -fno-omit-frame-pointer' \
            -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \
            -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DBUILD_TESTING=OFF \
            -DENABLE_FEX_ALLOCATOR=ON -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_WERROR=OFF -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
            -DTUNE_CPU=generic >dist/fex-dwarf-configure.log 2>&1 || {
              tail -n 90 dist/fex-dwarf-configure.log; exit 1;
            }
          timeout -k 15s 1000s cmake --build /tmp/kernix-fex-g0-dwarf-build \
            --target FEXCore_shared --parallel 3 \
            >dist/fex-dwarf-build.log 2>&1 || {
              tail -n 120 dist/fex-dwarf-build.log; exit 1;
            }
      - name: Inspect source JIT object versus linked shared library ELF symbols independently (no inference from compilation)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          b=Path('/tmp/kernix-fex-g0-dwarf-build')
          so=list(b.rglob('libFEXCore.so'))
          obj=[p for p in b.rglob('JIT.cpp.o') if 'FEXCore_object.dir' in str(p)]
          assert len(so)==1 and len(obj)==1,(so,obj)
          def run(args):
              x=subprocess.run(args,capture_output=True,text=True,timeout=30)
              assert x.returncode==0,(args,x.stderr[-800:])
              return x.stdout
          def audit(path,label):
              raw=run(['nm','-C',str(path)])
              Path('dist/'+label+'-nm.txt').write_text(raw)
              found=[s for s in raw.splitlines() if 'Arm64JITCore::CompileCode(' in s]
              defs=[s for s in found if len(s.split(maxsplit=2))>=3 and
                    s.split(maxsplit=2)[1] in ('T','t','W','w')]
              return {'elf_path':str(path),
                  'size':path.stat().st_size,
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                  'compilecode_symbol_candidates':found[:10],
                  'compilecode_symbol_candidate_count':len(found),
                  'compilecode_text_definitions_count':len(defs)}
          obj_ev=audit(obj[0],'original-jit-object')
          so_ev=audit(so[0],'original-fex-debug-shared')
          sections=run(['readelf','-SW',str(so[0])])
          Path('dist/fex-debug-elf-sections.txt').write_text(sections)
          debug_section='.debug_info' in sections
          classification=(
             'original_compiler_definition_not_in_host_object'
             if obj_ev['compilecode_text_definitions_count']==0 else
             'object_defined_but_final_shared_symbol_absent'
             if so_ev['compilecode_text_definitions_count']==0 else
             'host_compilecode_symbol_available_in_diagnostic_shared')
          ev={
              'schema':'kernix.g0.pinned-fex-arm64-host-JIT-object-shared-debug-symbol.v1',
              'original_fex_sha':'02e24ca5c01ed0c864466ed573db347336f70170',
              'arm64':True,
              'build_mode':'RelWithDebInfo_O2_g_fno_omit_frame_pointer',
              'host_debug_info_section_present':debug_section,
              'jit_original_host_object':obj_ev,
              'original_fex_diagnostic_shared':so_ev,
              'classification':classification,
              'original_ldso_irelative_resolver_guest_execution_proven':False,
              'real_IRELATIVE_zero_store_proven':False,
              'original_main_RELRO_sealed':False,
              'Android_Bionic_or_Wine_game_proven':False}
          Path('dist/jit-symbol-evidence.json').write_text(json.dumps(ev,indent=2)+'\n')
          print(json.dumps(ev,indent=2))
          assert debug_section,'No DWARF in diagnostic shared binary'
          print('KERNIX_G0_SOURCE_PINNED_FEX_ARM64_JIT_DEBUG_OBJECT_SHARED_SYMBOL_EVIDENCE_PASS_NO_GUEST_EXECUTION_PROOF')
          PY
      - uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/original
      - name: Revalidate original SHA256 main / PT_INTERP ld-linux / libc and create private input root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          origin=Path('inputs/original/original-guest')
          proof=json.loads(Path('inputs/original/proven-guest-triad.json').read_text())
          assert proof['original_real_FEX_linux_arm64_execution_run']==41842294261
          accepted={
           'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
           'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
           'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(p.relative_to(origin)) for p in origin.rglob('*') if p.is_file()}==set(accepted)
          private=Path('dist/original-source-pinned-root')
          for name,(size,sha) in accepted.items():
              file=origin/name
              assert file.is_file() and not file.is_symlink()
              b=file.read_bytes()
              assert len(b)==size and hashlib.sha256(b).hexdigest()==sha
              assert proof['files'][name]['sha256']==sha
              target=private/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(b)
              target.chmod(0o400)
          for p in private.rglob('*'):
              if p.is_dir():p.chmod(0o700)
          private.chmod(0o700)
          print('G0_ORIGINAL_SHA256_THREE_REAL_X86_LINUX_ELF_PTLOAD_SOURCE_LOCKED')
          PY
      - name: Source-lock existing 15 x86 Linux guest syscalls, verify unchanged original source program RX file-offset provenance
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils-x86-64-linux-gnu
          python3 - <<'PY'
          import hashlib,struct
          from pathlib import Path
          p=Path('dist/original-source-pinned-root/lib64/ld-linux-x86-64.so.2')
          b=p.read_bytes()
          assert len(b)==235408 and hashlib.sha256(b).hexdigest()=='cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'
          assert b[:4]==b'\x7fELF' and b[4]==2 and b[5]==1
          assert struct.unpack_from('<H',b,18)[0]==62
          pOff=struct.unpack_from('<Q',b,32)[0]
          pEnt,pNum=struct.unpack_from('<HH',b,54)
          assert pEnt==56 and 0<pNum<=64 and pOff+pNum*pEnt<=len(b)
          offsets=[]
          for i in range(pNum):
              t,flags,offset,vaddr,_,fsize,msize,_=struct.unpack_from('<IIQQQQQQ',b,pOff+i*pEnt)
              if t!=1 or flags&7!=5 or fsize>msize or offset>len(b) or fsize>len(b)-offset or vaddr%4096!=offset%4096:continue
              at=(offset+4095)&~4095
              if fsize>=4096 and at>=offset and at-offset<=fsize-4096:
                  offsets.append(at)
          assert offsets, 'No exact-original GNU ld-linux full RX 4K PT_LOAD file page'
          selected=min(offsets)
          Path('dist/source-original-ELF64-PTLOAD-RX-offset.txt').write_text(str(selected)+'\n')
          print('KERNIX_G0_ORIGINAL_GNU_LDSO_PT_LOAD_PF_RX_EXACT_SHA256_FILE_OFFSET',selected)
          PY
          x86_64-linux-gnu-as --64 --defsym KERNIX_G0_SOURCE_RX_OFFSET="$(cat dist/source-original-ELF64-PTLOAD-RX-offset.txt)" \
            native-engine/android-guest/kernix_g0_fex_guest_original_source_relr_bitmap_writer_then_ldso.S \
            -o dist/original-elf-fex-process.o
          x86_64-linux-gnu-objcopy -O binary -j .text \
            dist/original-elf-fex-process.o dist/original-elf-fex-process.bin
          x86_64-linux-gnu-objdump -d dist/original-elf-fex-process.o \
            >dist/original-elf-fex-process-disassembly.txt
          python3 - <<'PY'
          from pathlib import Path
          b=Path('dist/original-elf-fex-process.bin').read_bytes()
          offset=[i for i in range(len(b)-1) if b[i:i+2]==b'\x0f\x05']
          assert len(offset)==15 and 340<=len(b)<1200, (len(b),offset)
          assert offset[0]>10 and all(offset[i+1]>offset[i]+5 for i in range(14))
          assert b'/lib64/ld-linux-x86-64.so.2\x00' in b
          assert bytes.fromhex('4883f808') in b  # compare authentic source r_info 8
          assert bytes.fromhex('64') in b      # FS prefix guest instructions
          assert b[-1]==0xf4
          assert 'jmp' in Path('dist/original-elf-fex-process-disassembly.txt').read_text()
          dis=Path('dist/original-elf-fex-process-disassembly.txt').read_text()
          for required in ('syscall','r13','r12','r14','r15','rbp','jmp','hlt'):
              assert required in dis,required
          fmt=',\n'.join(','.join(f'0x{v:02x}' for v in b[i:i+8])
                        for i in range(0,len(b),8))
          Path('dist/kernix_g0_original_elf_ldso_handoff_blob.h').write_text(
            '// Machine code assembled from source-authentic GNU x86_64 Linux fixture.\n'
            '#pragma once\n#include <cstddef>\n'
            'static constexpr unsigned char KERNIX_G0_ELF_LDSO_HANDOFF_GUEST[]={\n'
            +fmt+'\n};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_ARCH_SET_FS_OFFSET={offset[0]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_MMAP_OFFSET={offset[1]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_GETRANDOM_1_OFFSET={offset[2]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_GETRANDOM_2_OFFSET={offset[3]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_OPENAT_OFFSET={offset[4]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_PREAD64_OFFSET={offset[5]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_READ_OFFSET={offset[6]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_FILE_MMAP_OFFSET={offset[7]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_FILE_MUNMAP_OFFSET={offset[8]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_RX_MMAP_OFFSET={offset[9]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_RX_MUNMAP_OFFSET={offset[10]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_CLOSE_OFFSET={offset[11]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_FOREIGN_RELRO_MPROTECT_OFFSET={offset[12]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_MPROTECT_OFFSET={offset[13]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_HANDOFF_MUNMAP_OFFSET={offset[14]};\n'
            +f'static constexpr size_t G0_ELF_LDSO_SOURCE_RX_OFFSET={int(Path("dist/source-original-ELF64-PTLOAD-RX-offset.txt").read_text())};\n')
          print('G0_SINGLE_SOURCE_GNU_X86_ELF_AUXV_HEAP_SYSCALL_CODE_AUDITED')
          PY
      - name: Compile source-authentic GNU ldso runtime harness against pinned debug FEX (host-only diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-g0-dwarf-build -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fPIE -pie -g -fno-omit-frame-pointer \
            -DKERNIX_G0_ORIGINAL_ELF_INTEGRATED_FEX_ARM64_CI \
            -DKERNIX_G0_UNPATCHED_ORIGINAL_LDSO_CONTINUATION \
            -DKERNIX_G0_ENABLE_GUEST_BRK12 \
            -DKERNIX_G0_ENABLE_GUEST_ACCESS21 \
            -DKERNIX_G0_ENABLE_GUEST_OPENAT257_CACHE \
            -DKERNIX_G0_PROBE_ORIGINAL_LDSO_POST_LIBC_RELRO_MAIN_PROVENANCE_ONLY \
            -Inative-engine/android-host -Idist \
            -isystem /tmp/kernix-fex-g0-dwarf-src/FEXCore/include \
            -isystem /tmp/kernix-fex-g0-dwarf-src/External/fmt/include \
            -isystem /tmp/kernix-fex-g0-dwarf-src/External/unordered_dense/include \
            -isystem /tmp/kernix-fex-g0-dwarf-src/External/xxhash \
            -isystem /tmp/kernix-fex-g0-dwarf-build/include \
            -isystem /tmp/kernix-fex-g0-dwarf-build/generated \
            native-engine/android-host/tests/kernix_g0_original_fex_full_ptload_source_executable_range_arm64.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" \
            -o dist/kernix-g0-original-main-relro-next-source-audit-linux-arm64 \
            >dist/g0-original-main-relro-next-source-audit-compile.log 2>&1 || {
              cat dist/g0-original-main-relro-next-source-audit-compile.log; exit 1;
            }
      - name: Trace FEX JIT request for source-pinned original GNU ldso IRELATIVE resolver address with native GDB
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdb
          CORE="$(find /tmp/kernix-fex-g0-dwarf-build -type f -name libFEXCore.so | head -1)"
          test -s "$CORE"
          export LD_LIBRARY_PATH="$(dirname "$CORE")"
          nm -C "$CORE" | grep -F 'Arm64JITCore::CompileCode(' >dist/original-ldso-irelative-debug-runtime-fex-symbol.txt
          test "$(wc -l < dist/original-ldso-irelative-debug-runtime-fex-symbol.txt)" = 1
          cat >dist/original-ldso-irelative-debug-compile.gdb <<'GDB'
          set pagination off
          set confirm off
          set print thread-events off
          set disable-randomization off
          set startup-with-shell off
          set breakpoint pending on
          # Upstream FEX deliberately handles ARM64 unaligned TSO SIGBUS internally.
          # Don't let host GDB consume the signal before FEX's handler runs.
          handle SIGBUS nostop noprint pass
          break 'FEXCore::CPU::Arm64JITCore::CompileCode' if $x1 == 0x80101a8e0
          commands
          silent
          printf "KERNIX_G0_SOURCE_LDSO_IRELATIVE_DEBUG_FEX_JIT_COMPILE_REQUEST entry=0x%lx size=0x%lx native_pc=0x%lx\n", $x1, $x2, $pc
          continue
          end
          run
          info breakpoints
          quit
          GDB
          set +e
          timeout -k 5s 100s gdb -q -nx -batch \
            -x dist/original-ldso-irelative-debug-compile.gdb \
            --args "$PWD/dist/kernix-g0-original-main-relro-next-source-audit-linux-arm64" \
            "$PWD/dist/original-source-pinned-root" \
            >dist/original-ldso-irelative-debug-compile.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" >dist/original-ldso-irelative-debug-compile.exit
          tail -n 80 dist/original-ldso-irelative-debug-compile.log
          python3 - <<'PY'
          import json,re,copy
          from pathlib import Path
          folder=Path('dist')
          raw=(folder/'original-ldso-irelative-debug-compile.log').read_text(errors='replace')
          status=int((folder/'original-ldso-irelative-debug-compile.exit').read_text())
          # FEX is a shared library. A pending breakpoint becomes real
          # only after the loader maps the pinned DWARF-bearing libFEXCore.so.
          # GDB's post-run "info breakpoints" checks that resolution without
          # mistaking a mere pending declaration for an installed breakpoint.
          pending_declared=bool(re.search(r'(?m)^Breakpoint 1 \(.*\) pending\.',raw))
          resolved=bool(re.search(r'(?m)^1\s+breakpoint\s+keep\s+y\s+0x[0-9a-fA-F]+',raw))
          installed=[1] if resolved else []
          prefix='KERNIX_G0_SOURCE_LDSO_IRELATIVE_DEBUG_FEX_JIT_COMPILE_REQUEST '
          rows=[s for s in raw.splitlines() if s.startswith(prefix)]
          events=[]
          valid=True
          for line in rows:
              m=re.fullmatch(re.escape(prefix)+r'entry=0x([0-9a-fA-F]+) size=0x([0-9a-fA-F]+) native_pc=0x([0-9a-fA-F]+)',line)
              if not m or int(m.group(1),16)!=0x80101a8e0 or int(m.group(2),16)>=0x100000:
                  valid=False
              else:
                  events.append({'guest_block_compile_entry':hex(int(m.group(1),16)),
                                 'guest_block_size':int(m.group(2),16),
                                 'fex_native_compiler_pc':hex(int(m.group(3),16))})
          boundary='KERNIX_G0_REAL_ORIGINAL_MAIN_PT_GNU_RELRO_AFTER_LIBC_RELRO_NEXT_MPROTECT10_SOURCE_ONLY_PASS' in raw
          unsupported='KERNIX_G0_UNPATCHED_REAL_GNU_LDSO_NEXT_UNSUPPORTED_X86_SYSCALL num=10' in raw
          evidence={
            'schema':'kernix.g0.original-ldso-irelative-debug-FEX-native-CompileCode-entry-only.v1',
            'FEX_source_git_sha':'02e24ca5c01ed0c864466ed573db347336f70170',
            'FEX_host_debug_build':'RelWithDebInfo -g',
            'original_ldso_sha256':'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae',
            'irelative_source_resolver_guest_va':'0x80101a8e0',
            'FEX_debug_CompileCode_pending_before_library_load':pending_declared,
            'FEX_debug_CompileCode_resolved_after_library_load':resolved,
            'FEX_debug_CompileCode_native_breakpoint_installed':len(installed)==1,
            'exact_guest_entry_compilation_requests':events,
            'exact_guest_entry_compile_requested':bool(events),
            'reached_original_main_mprotect_boundary':boundary,
            'original_mprotect_unsupported':unsupported,
            'gdb_process_exit':status,
            'guest_original_IRELATIVE_resolver_executed_proven':False,
            'original_ldso_irelative_zero_store_proven':False,
            'all_original_relocations_closed_proven':False,
            'original_main_PT_GNU_RELRO_sealed':False,
            'Android_Bionic_or_Wine_games_proven':False
          }
          (folder/'original-ldso-irelative-debug-compile-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          assert len(installed)==1 and valid and status not in (124,137)
          assert boundary and unsupported
          for field in ('guest_original_IRELATIVE_resolver_executed_proven',
                        'original_ldso_irelative_zero_store_proven',
                        'all_original_relocations_closed_proven',
                        'original_main_PT_GNU_RELRO_sealed'):
              assert evidence[field] is False
          bad=copy.deepcopy(evidence)
          bad['guest_original_IRELATIVE_resolver_executed_proven']=True
          assert bad!=evidence
          print('KERNIX_G0_DEBUG_FEX_IRELATIVE_JIT_COMPILE_REQUEST_DIAGNOSTIC_RECORDED_NO_GUEST_EXECUTION_OR_RELRO_CLAIM')
          PY
      - name: Inspect original FEX JIT guest source writer and IRELATIVE resolver coverage at native ARM64 function entry (pre-prologue ABI, diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-g0-dwarf-build -type f -name libFEXCore.so | head -1)"
