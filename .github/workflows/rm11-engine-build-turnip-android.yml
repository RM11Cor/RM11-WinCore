name: RM11 Engine - Build Pinned Mesa Turnip Android KGSL (NO APK)

on:
  push:
    branches: [rm11-engine-rebuild]
    paths:
      - '.github/workflows/rm11-engine-build-turnip-android.yml'
      - 'tools/verify_turnip_android_elf.py'
      - 'tools/patch_mesa_android_app_namespace.py'
      - 'tools/patch_mesa_android_aimapper.py'
      - 'tests/test_mesa_aimapper_patch.py'
      - 'tests/test_mesa_android_namespace_patch.py'
      - 'tests/test_turnip_android_elf.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turnip-android-source:
    name: Cross-build source-pinned Turnip for Android AArch64 + KGSL
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install target cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-venv python3-pip python3-mako python3-yaml \
            bison flex pkg-config ninja-build libexpat1-dev \
            libelf-dev gettext curl xz-utils git glslang-tools
          python3 -m venv "$RUNNER_TEMP/mesa-tools"
          "$RUNNER_TEMP/mesa-tools/bin/pip" install --quiet \
            meson==1.9.1 mako pyyaml packaging

      - name: Set up official Android NDK R27 for AArch64 Bionic
        uses: android-actions/setup-android@v4

      - name: Provision Android 34 platform and pinned NDK
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018' 'platforms;android-34'

      - name: Test static Turnip Android ABI policy before source build
        run: |
          python3 -m unittest discover -s tests \
            -p 'test_turnip_android_elf.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_mesa_android_namespace_patch.py' -v
          python3 -m unittest discover -s tests \
            -p 'test_mesa_aimapper_patch.py' -v

      - name: Download and SHA-verify official Mesa 26.2.0 source archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mesa-source" audit
          curl -fL --retry 3 --connect-timeout 30 \
            'https://mesa.freedesktop.org/archive/mesa-26.2.0.tar.xz' \
            -o "$RUNNER_TEMP/mesa-26.2.0.tar.xz"
          printf '%s\n' \
            'efd4bb08cdb7c365a812cd4e6c9202ab55b2f22cdcd13c7d6c4f9647b799a4ef  '"$RUNNER_TEMP"'/mesa-26.2.0.tar.xz' \
            | sha256sum -c -
          tar -xf "$RUNNER_TEMP/mesa-26.2.0.tar.xz" \
            -C "$RUNNER_TEMP/mesa-source" --strip-components=1
          test -s "$RUNNER_TEMP/mesa-source/meson.build"

      - name: Make source-pinned Turnip a fail-closed app-namespace candidate
        run: |
          set -euo pipefail
          python3 tools/patch_mesa_android_app_namespace.py \
            --source "$RUNNER_TEMP/mesa-source"
          # This disables the obsolete vendor HAL API only; it does NOT
          # make IMapper5, hardware WSI, or game frames work.

      - name: Fetch exact pinned SPDX-MIT IMapper5 C implementation
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/wn-aimapper-source"
          git -C "$RUNNER_TEMP/wn-aimapper-source" remote add origin \
            https://github.com/WinNative-Emu/Drivers.git
          git -C "$RUNNER_TEMP/wn-aimapper-source" fetch --depth=1 origin \
            c71f600a2977a141f21a922c9ed2e14fb09b13d3
          git -C "$RUNNER_TEMP/wn-aimapper-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/wn-aimapper-source" rev-parse HEAD)" = \
            c71f600a2977a141f21a922c9ed2e14fb09b13d3
          test -s "$RUNNER_TEMP/wn-aimapper-source/patches/aimapper/u_gralloc_aimapper.c"
          grep -Fq 'SPDX-License-Identifier: MIT' \
            "$RUNNER_TEMP/wn-aimapper-source/patches/aimapper/u_gralloc_aimapper.c"
          cp "$RUNNER_TEMP/wn-aimapper-source/LICENSE" \
             audit/wn-aimapper-source-license.txt

      - name: Integrate source-pinned IMapper5 without fake HAL success
        run: |
          set -euo pipefail
          python3 tools/patch_mesa_android_aimapper.py \
            --source "$RUNNER_TEMP/mesa-source" \
            --implementation "$RUNNER_TEMP/wn-aimapper-source/patches/aimapper/u_gralloc_aimapper.c" \
            --out audit/aimapper5-source-provenance.json
          # No app, SPHAL, GPU or Android frame proof is available on CI.

      - name: Cross-configure Mesa freedreno Vulkan for Android KGSL
        run: |
          set -euo pipefail
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CROSS="$RUNNER_TEMP/mesa-android-aarch64.ini"
          cat > "$CROSS" <<EOF
          [binaries]
          c = '$BIN/aarch64-linux-android34-clang'
          cpp = '$BIN/aarch64-linux-android34-clang++'
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF
          "$RUNNER_TEMP/mesa-tools/bin/meson" setup \
            "$RUNNER_TEMP/mesa-aarch64-build" \
            "$RUNNER_TEMP/mesa-source" \
            --cross-file "$CROSS" \
            --buildtype release \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl

      - name: Compile Mesa Turnip source for Android AArch64 (without vendor overwrite)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mesa-tools/bin/meson" compile \
            -C "$RUNNER_TEMP/mesa-aarch64-build" -j 4
          NATIVE="$(find "$RUNNER_TEMP/mesa-aarch64-build" \
            -name libvulkan_freedreno.so -type f | head -1)"
          test -n "$NATIVE"
          test -s "$NATIVE"
          BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$BIN/llvm-readelf" -d "$NATIVE" | tee audit/turnip-android-aarch64-needed.txt
          MAPPER_OBJECT="$(find "$RUNNER_TEMP/mesa-aarch64-build" -type f \
            -name 'u_gralloc_aimapper.c.o' -print -quit)"
          test -n "$MAPPER_OBJECT"
          test -s "$MAPPER_OBJECT"
          "$BIN/llvm-nm" "$MAPPER_OBJECT" | grep -F 'u_gralloc_aimapper_create'
          "$BIN/llvm-readelf" -Ws "$NATIVE" > audit/turnip-android-aarch64-all-symbols.txt
          grep -Fq 'u_gralloc_aimapper_create' audit/turnip-android-aarch64-all-symbols.txt
          "$BIN/llvm-readelf" --dyn-syms "$NATIVE" > audit/turnip-android-aarch64-symbols.txt
          if grep -Fq 'Shared library: [libhardware.so]' audit/turnip-android-aarch64-needed.txt; then
            echo '::error::Private libhardware.so remains a DT_NEEDED dependency'
            exit 1
          fi
          if grep -Eq 'UND.*hw_get_module' audit/turnip-android-aarch64-symbols.txt; then
            echo '::error::Legacy HAL symbol remains unresolved'
            exit 1
          fi
          python3 tools/verify_turnip_android_elf.py \
            --elf "$NATIVE" \
            --readelf audit/turnip-android-aarch64-needed.txt \
            --out audit/turnip-android-source-abi.json

      - name: Retain verified native driver for gated future integration
        run: |
          set -euo pipefail
          ELF="$(find "$RUNNER_TEMP/mesa-aarch64-build" \
            -name libvulkan_freedreno.so -type f | head -1)"
          test -s "$ELF"
          mkdir -p audit/turnip
          cp "$ELF" audit/turnip/libvulkan_freedreno.so
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path("audit/turnip/libvulkan_freedreno.so")
          report=json.loads(Path("audit/turnip-android-source-abi.json").read_text())
          assert hashlib.sha256(path.read_bytes()).hexdigest()==report["elf_sha256"]
          assert report["static_elf_abi_verified"] is True
          assert "libhardware.so" not in report["dynamic_needed"]
          assert report["app_linker_namespace_gate"] == "UNVERIFIED_APP_NAMESPACE_LOADABILITY"
          assert report["app_native_dlopen_succeeded"] is False
          aimapper=json.loads(Path("audit/aimapper5-source-provenance.json").read_text())
          assert aimapper["upstream_commit"] == "c71f600a2977a141f21a922c9ed2e14fb09b13d3"
          assert aimapper["source_spdx"] == "MIT"
          assert aimapper["safe_to_publish_apk"] is False
          assert report["safe_to_publish_engine_apk"] is False
          print("RM11_TURNIP_BUILD_ARTIFACT_RETAINED_WITH_ANDROID_APP_NAMESPACE_GATE")
          PY

      - name: Upload native Turnip source build for CI use only - never user APK
        uses: actions/upload-artifact@v4
        with:
          name: RM11-Engine-Turnip-AArch64-Native-Provider-UNVERIFIED-APP-LOAD
          path: |
            audit/turnip-android-aarch64-needed.txt
            audit/turnip-android-aarch64-symbols.txt
            audit/turnip-android-aarch64-all-symbols.txt
            audit/aimapper5-source-provenance.json
            audit/wn-aimapper-source-license.txt
            audit/turnip-android-source-abi.json
            audit/turnip/libvulkan_freedreno.so
          if-no-files-found: error
          retention-days: 21
