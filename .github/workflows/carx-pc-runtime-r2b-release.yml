name: CarX PC Runtime R2-B - stable signed GitHub Release
on:
  push:
    branches: [carx-pc-runtime-r2b]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated CarX R2-B branch
        uses: actions/checkout@v4
      - name: Recreate verified R1 R2-A and R2-B sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/carxpc
          cat carxpc/r1.part{1,2,3}.b64 | base64 -d > /tmp/carxpc-r1.tar.xz
          echo "cf820c3abc3bc61c9ff2b0209f65e2a39d58b52ebddb25f49f1ea92883eb6190  /tmp/carxpc-r1.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carxpc-r1.tar.xz -C /tmp/carxpc
          cat carxpc/r2a.part{1,2,3}.b64 | base64 -d > /tmp/carxpc-r2a.tar.xz
          echo "db55e37f87a073f332576161922b2f49f8eb103ef41faaf1e27e32cdad5fb5e8  /tmp/carxpc-r2a.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carxpc-r2a.tar.xz -C /tmp/carxpc
          cat carxpc/r2b.part{1,2,3}.b64 | base64 -d > /tmp/carxpc-r2b.tar.xz
          echo "af5acf423120fa5766f4ac8c50c4c5046553b2ceb925ef1fdef34c00d713bf33  /tmp/carxpc-r2b.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carxpc-r2b.tar.xz -C /tmp/carxpc
          test -s /tmp/carxpc/app/src/main/cpp/native_present.cpp
          test -s /tmp/carxpc/app/src/main/java/com/r4/carxpc/MainActivity.java
      - name: Java JDK 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Run R1 PE parser regression suite
        working-directory: /tmp/carxpc
        run: |
          mkdir -p /tmp/carxhost
          javac -d /tmp/carxhost app/src/main/java/com/r4/carxpc/PEParser.java tests/PEParserHostTest.java
          java -cp /tmp/carxhost PEParserHostTest
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Android SDK and build tools
        uses: android-actions/setup-android@v4
        with: {packages: ''}
      - name: Install pinned Android SDK NDK CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile debug R2-B APK for JNI verification (not a stable update)
        working-directory: /tmp/carxpc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify debug APK contains ARM64 Vulkan library
        run: |
          APK=/tmp/carxpc/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libcarx_runtime_probe.so'
      - name: Upload experimental debug APK if stable signing unavailable
        uses: actions/upload-artifact@v4
        with:
          name: CarX-PC-R2B-WSI-UNSTABLE-DEBUG-APK
          path: /tmp/carxpc/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Restore repository existing secure stable signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$KEY_PASS" ]]; then
            echo "CARX_STABLE_KEY_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secret not configured. Debug verification only."
            exit 0
          fi
          umask 077
          if python3 - <<'PY'
          import os, re, base64, sys
          s=os.environ['KEY_B64'].strip()
          if s.startswith('data:') and ',' in s: s=s.split(',',1)[1]
          s=s.strip(chr(34)).strip(chr(39))
          s=re.sub(r'\\s+', '', s).replace('\\\\n','').replace('\\\\r','')
          try: data=base64.b64decode(s,validate=True)
          except Exception: sys.exit(1)
          if len(data)<200: sys.exit(2)
          open(os.environ['RUNNER_TEMP']+'/carx-pc-stable.p12','wb').write(data)
          PY
          then
            if keytool -list -keystore "$RUNNER_TEMP/carx-pc-stable.p12" -storetype PKCS12 -storepass "$KEY_PASS" -alias rm11-autocore >/dev/null 2>&1; then
              echo "CARX_STABLE_KEYSTORE=$RUNNER_TEMP/carx-pc-stable.p12" >> "$GITHUB_ENV"
              echo "CARX_STABLE_KEY_READY=true" >> "$GITHUB_ENV"
            else
              echo "CARX_STABLE_KEY_READY=false" >> "$GITHUB_ENV"
              echo "::warning::Signing secret is not a valid PKCS12 key with expected alias."
            fi
          else
            echo "CARX_STABLE_KEY_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Signing secret Base64 cannot be decoded. No public Release will be published."
          fi
      - name: Configure stable release signing without embedding secrets in source
        if: env.CARX_STABLE_KEY_READY == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/carxpc/app/build.gradle')
          s=p.read_text()
          assert "applicationId 'com.r4.carxpc'" in s
          assert 'versionCode 3' in s
          old='buildTypes { release { minifyEnabled false } }'
          assert s.count(old)==1
          replacement="""signingConfigs { stable {
              storeFile file(System.getenv('CARX_STABLE_KEYSTORE'))
              storePassword System.getenv('RM11_RELEASE_PASSWORD')
              keyAlias 'rm11-autocore'
              keyPassword System.getenv('RM11_RELEASE_PASSWORD')
          }}
          buildTypes { release { minifyEnabled false; signingConfig signingConfigs.stable } }"""
          p.write_text(s.replace(old,replacement))
          PY
      - name: Compile stable signed ARM64 APK
        if: env.CARX_STABLE_KEY_READY == 'true'
        env:
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        working-directory: /tmp/carxpc
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify version ABI signature and certificate
        if: env.CARX_STABLE_KEY_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/carxpc/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libcarx_runtime_probe.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "certificate_SHA256=$CERT"
          test "$CERT" = "d398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.r4.carxpc' versionCode='3'"
          mkdir -p /tmp/carx-published
          cp "$APK" /tmp/carx-published/CarX_PC_Runtime_R2B_ARM64.apk
          (cd /tmp/carx-published && sha256sum CarX_PC_Runtime_R2B_ARM64.apk > CarX_PC_Runtime_R2B_ARM64.apk.sha256)
      - name: Publish stable-signed test APK on GitHub Releases
        if: env.CARX_STABLE_KEY_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=carx-pc-v0003-r2b
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing release found: refusing to overwrite it' >&2; exit 1
          fi
          gh release create "$TAG" \
            /tmp/carx-published/CarX_PC_Runtime_R2B_ARM64.apk \
            /tmp/carx-published/CarX_PC_Runtime_R2B_ARM64.apk.sha256 \
            --title "CarX PC Runtime R2-B — ARM64 Vulkan WSI smoke test" \
            --notes "Diagnostic Vulkan Android Surface / Swapchain / single clear-color frame test. NOT playable CarX. Package com.r4.carxpc, versionCode 3. This is the FIRST CarX release signed with our stable certificate; upgrading from R1/R2A debug-signed builds requires a one-time uninstall after backing up their JSON reports. Future builds with this same certificate can update in place." \
            --target "$GITHUB_SHA" --prerelease
      - name: Clean temporary private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/carx-pc-stable.p12"
