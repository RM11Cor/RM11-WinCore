name: KERNIX G2-E/C3-D7F source-pinned FEX original x86 Linux ldso single instruction JIT compile no execute
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2e-c3d7f-original-ldso-one-instruction-real-fex-jit-compile-linux-arm64.yml'
      - 'native-engine/android-host/tests/kernix_g2e_c3d7f_original_ldso_real_one_instruction_source_pinned_fex_compile_arm64.cpp'
      - 'native-engine/android-host/kernix_g2e_c3d7e_original_ldso_entry_rx_ownership.h'
      - 'native-engine/android-host/kernix_g2e_c3d7b_kernel_selected_pie_guest_vas.h'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-upstream-fex-syscall-guest-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download original x86 Linux main/ld-linux/libc immutable source artifact (previous real FEX ARM64 Linux run)
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/guest
      - name: Verify exact SHA256 real Linux guest ELF and restore owner-readonly app-style source root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          src=Path('inputs/guest/original-guest')
          provenance=json.loads(Path('inputs/guest/proven-guest-triad.json').read_text())
          assert provenance['original_real_FEX_linux_arm64_execution_run']==41842294261
          expected={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(x.relative_to(src)) for x in src.rglob('*') if x.is_file()}==set(expected)
          root=Path('dist/immutable-rootfs')
          for name,(size,sha) in expected.items():
              raw=(src/name).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha
              assert provenance['files'][name]['sha256']==sha
              assert raw[:6]==b'\x7fELF\x02\x01'
              assert struct.unpack_from('<H',raw,18)[0]==62
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
              target.chmod(0o400)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==sha
          for directory in sorted((x for x in root.rglob('*') if x.is_dir()),reverse=True):
              directory.chmod(0o700)
          root.chmod(0o700)
          Path('dist/source-real-x86-linux-triad.json').write_text(json.dumps({
            'original_FEX_linux_arm64_real_glibc_guest_run':41842294261,
            'exact_source_guest_artifact_run':41846530666,
            'all_three_source_elf_sha256_verified':True,
            'signed_Android_device_execution_this_run':False
          },indent=2)+'\n')
          print('KERNIX_G2EC3D2_PINNED_THREE_REAL_X86_LINUX_ELF_SHA256_PASS')
          PY
      - name: Require the original 609-page C3-D4 native 4K read-only byte gate first
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(getconf PAGESIZE)" = 4096
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2e_c3d4_native_4k_original_elf_readonly_lease_test.cpp \
            -o dist/c3d5-prerequisite-original-609-ro
          timeout -k 3s 45s dist/c3d5-prerequisite-original-609-ro \
            "$PWD/dist/immutable-rootfs" >dist/native-4k-prerequisite.stdout 2>dist/native-4k-prerequisite.stderr || {
              cat dist/native-4k-prerequisite.stderr
              cat dist/native-4k-prerequisite.stdout
              exit 1
            }
          grep -Fxq 'KERNIX_G2EC3D4_REAL_PINNED_ORIGINAL_609_GUEST4K_NATIVE_READONLY_EXACT_VA_BYTES_PASS pages=609 native_page=4096 collision_preserved=1 atomic_reserve_and_stage_rollback=1 host_exec=0 fex=0 ldso=0 android_device=0' dist/native-4k-prerequisite.stdout
          test ! -s dist/native-4k-prerequisite.stderr
          echo KERNIX_G2EC3D5_C3D4_NATIVE_4K_GUEST_BYTE_PAGE_PREREQUISITE_PASSED
      - name: Build original SHA-pinned FEXCore on real Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p dist
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build git python3 pkg-config
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/FEX-Emu/FEX.git /tmp/kernix-g2ec2-fex-upstream
          git -C /tmp/kernix-g2ec2-fex-upstream checkout --quiet --detach \
            02e24ca5c01ed0c864466ed573db347336f70170
          git -C /tmp/kernix-g2ec2-fex-upstream submodule update --init --recursive --quiet
          test "$(git -C /tmp/kernix-g2ec2-fex-upstream rev-parse HEAD)" = \
            02e24ca5c01ed0c864466ed573db347336f70170
          cp /tmp/kernix-g2ec2-fex-upstream/LICENSE dist/FEX-upstream-LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/kernix-g2ec2-fex-upstream')
          p=root/'CMakeLists.txt'
          source=p.read_text()
          needle='add_subdirectory(Source/)'
          assert source.count(needle)==1
          p.write_text(source.replace(needle,'# CI only build upstream FEXCore',1))
          p=root/'FEXCore/Source/CMakeLists.txt'
          source=p.read_text()
          assert 'AddLibrary('+chr(36)+'{PROJECT_NAME}_shared SHARED)' in source
          p.write_text(source+'\ntarget_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)\n')
          PY
          timeout -k 10s 240s cmake -S /tmp/kernix-g2ec2-fex-upstream \
            -B /tmp/kernix-g2ec2-fex-native -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DBUILD_TESTING=OFF \
            -DENABLE_FEX_ALLOCATOR=ON -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_WERROR=OFF -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
            -DTUNE_CPU=generic >dist/c2-fex-configure.log 2>&1 || {
              tail -n 100 dist/c2-fex-configure.log; exit 1;
            }
          timeout -k 15s 1000s cmake --build /tmp/kernix-g2ec2-fex-native \
            --target FEXCore_shared --parallel 3 \
            >dist/c2-fex-build.log 2>&1 || {
              tail -n 100 dist/c2-fex-build.log; exit 1;
            }
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          test -s "$CORE"
          readelf -h "$CORE" | grep -Fq 'AArch64'
          sha256sum "$CORE" >dist/original-fexcore-aarch64.sha256
          echo KERNIX_G2EC2_ORIGINAL_FEX_CORE_SOURCE_AND_ARM64_BUILD_PASS
      - name: Require exact source-attested original ld-linux x86 entry bytes and temporary RX no-W^X baseline
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2e_c3d7e_original_x86_ldso_main_entry_native_rx_gate_test.cpp \
            -o dist/c3d7f-prerequisite-exact-entry-rx
          timeout -k 3s 40s dist/c3d7f-prerequisite-exact-entry-rx \
            "$PWD/dist/immutable-rootfs" \
            >dist/c3d7f-prerequisite.stdout 2>dist/c3d7f-prerequisite.stderr || {
              cat dist/c3d7f-prerequisite.stderr
              cat dist/c3d7f-prerequisite.stdout
              exit 1
            }
          grep -Fxq 'KERNIX_G2EC3D7E_REAL_ORIGINAL_PINNED_X86_MAIN_AND_LDSO_ENTRY_INSTRUCTION_BYTES_WX_LINUX_PASS main_entry_bytes=16 ldso_entry_bytes=16 source_sha256_locked=1 guest_RIP_rebased=1 native_guest_VA_kernel_chosen=1 native_RX_without_W=1 permission_restored_RO=1 maps_released=1 original_guest_elf_rip_executed=0 original_ldso_executed=0 fex=0 android_device=0 wine=0' dist/c3d7f-prerequisite.stdout
          test ! -s dist/c3d7f-prerequisite.stderr
      - name: Cross-compile original source-pinned FEX AArch64 JIT single genuine ld-linux guest x86 instruction compile-gate
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fPIE -pie -DKERNIX_G2EC2_ORIGINAL_FEX_LINUX_ARM64_CI \
            -Inative-engine/android-host \
            -isystem /tmp/kernix-g2ec2-fex-upstream/FEXCore/include \
            -isystem /tmp/kernix-g2ec2-fex-upstream/External/fmt/include \
            -isystem /tmp/kernix-g2ec2-fex-upstream/External/unordered_dense/include \
            -isystem /tmp/kernix-g2ec2-fex-upstream/External/xxhash \
            -isystem /tmp/kernix-g2ec2-fex-native/include \
            -isystem /tmp/kernix-g2ec2-fex-native/generated \
            native-engine/android-host/tests/kernix_g2e_c3d7f_original_ldso_real_one_instruction_source_pinned_fex_compile_arm64.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" \
            -o dist/c3d7f-original-ldso-one-original-x86-instruction-fex-compile \
            >dist/c3d7f-compile.log 2>&1 || {
              tail -n 100 dist/c3d7f-compile.log
              exit 1
            }
          echo KERNIX_C3D7F_SOURCE_PINNED_REAL_ORIGINAL_LDSO_FEX_ARM64_JIT_COMPILE_LINK_PASS
      - name: Require FEX actually translate authentic ld-linux first x86 instruction from original RIP without executing it
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          set +e
          timeout -k 3s 25s env LD_LIBRARY_PATH="$CORE_DIR" \
            dist/c3d7f-original-ldso-one-original-x86-instruction-fex-compile \
            "$PWD/dist/immutable-rootfs" \
            >dist/c3d7f.stdout 2>dist/c3d7f.stderr
          RC=$?
          set -e
          cat dist/c3d7f.stdout
          tail -n 60 dist/c3d7f.stderr
          RC="$RC" python3 - <<'PY'
          import os,json
          from pathlib import Path
          rc=int(os.environ["RC"])
          out=Path("dist/c3d7f.stdout").read_text(errors="replace")
          err=Path("dist/c3d7f.stderr").read_text(errors="replace")
          marker="KERNIX_G2EC3D7F_SOURCE_PINNED_FEX_ORIGINAL_X86_LDSO_ONE_INSTRUCTION_JIT_TRANSLATION_LINUX_ARM64_PASS original_ldso_sha256=1 original_guest_ldso_RIP_in_file_backed_rx=1 guest_RSP_original_startup_stack=1 original_entry_16_bytes_unchanged=1 fex_CompileRIPCount_one_instruction_returned=1 fex_ExecuteThread_called=0 original_ldso_entered=0 original_guest_instruction_executed=0 android_runtime=0 wine=0"
          started="KERNIX_C3D7F_ORIGINAL_LDSO_FIRST_INSTRUCTION_FEX_TRANSLATE_BEGIN"
          returned="KERNIX_C3D7F_ORIGINAL_LDSO_FIRST_INSTRUCTION_FEX_TRANSLATE_RETURNED"
          pass_gate=(rc==0 and out.count(marker)==1 and
                     err.count(started)==1 and err.count(returned)==1 and
                     "UNEXPECTED_GUEST_SYSCALL" not in err)
          evidence={
             "schema":"kernix.g2e.c3d7f.original-pinned-x86-ldso-single-instruction-fex-jit-compilation-linux-arm64.v1",
             "git_sha":os.environ["GITHUB_SHA"],
             "original_fex_commit":"02e24ca5c01ed0c864466ed573db347336f70170",
             "FEX_CompileRIPCount_with_original_ldso_guest_RIP_returned":pass_gate,
             "original_real_x86_ldso_entry_16_bytes_sha_verified":pass_gate,
             "original_Linux_startup_stack_RSP_configured":pass_gate,
             "real_x86_original_ldso_instruction_executed":False,
             "source_original_ldso_entered":False,
             "FEX_ExecuteThread_called":False,
             "android_device_tested":False,
             "wine_or_PC_game_tested":False,
             "exit_code":rc
          }
          Path("dist/c3d7f-evidence.json").write_text(json.dumps(evidence,indent=2)+"\n")
          if not pass_gate:
              raise SystemExit("C3-D7F actual source-pinned FEX original ldso one-instruction compile not proven")
          print("KERNIX_G2EC3D7F_REAL_ORIGINAL_LDSO_FIRST_INSTRUCTION_FEX_JIT_TRANSLATION_PASS_NO_GUEST_EXECUTION")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G2EC3D7F-Pinned-FEX-Original-LDSO-X86-First-Instruction-Compile-Linux-AArch64-No-Execution
          path: |
            dist/c3d7f*
            dist/original-fexcore-aarch64.sha256
          retention-days: 30
          if-no-files-found: warn
