name: Build Unreviewed Arabic Lock Test APK
on:
  push:
    branches: [alquflshamil-app-android16]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/arabic-lock-apk.yml"
  workflow_dispatch:
concurrency:
  group: alquflshamil-v1-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile and sign APK for testing
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signature and declared permissions
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          if grep -E "BIND_ACCESSIBILITY_SERVICE|READ_SMS|RECEIVE_SMS|QUERY_ALL_PACKAGES|android.permission.INTERNET" permissions.txt; then
            echo "Unexpected sensitive permission declared"
            exit 1
          fi
          grep -q "android.permission.PACKAGE_USAGE_STATS" permissions.txt
          grep -q "android.permission.SYSTEM_ALERT_WINDOW" permissions.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlQuflAlShamil-Unreviewed-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
