name: KERNIX native ARM64 real FEX syscall A-B
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-native-arm64-fex-regression.yml'
      - 'native-engine/android-host/kernix_fexcore_x86_64_high_gpr_no_memory_probe.cpp'
      - 'native-engine/android-host/kernix_fexcore_x86_64_high_gpr_stack_witness_probe.cpp'
      - 'native-engine/android-host/kernix_fexcore_x86_64_syscall_boundary_stack_probe.cpp'
      - 'tools/kernix_fexcore_syscall_early_capture_v019_patch.py'
      - 'tools/kernix_fexcore_syscall_static_gpr_v020_patch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Previous three source variants completed in run 41679136998.
        # Rebuild only the candidate that was blocked by an overly strict source gate.
        variant: [kernix-static-sra]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM64 host and x86 cross assembler
        run: |
          set -euo pipefail
          uname -m | grep -Ex 'aarch64|arm64'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang lld cmake ninja-build git python3 pkg-config binutils-x86-64-linux-gnu
          command -v x86_64-linux-gnu-as
          mkdir -p dist
      - name: Assemble exact x86 guest ELF and embed immutable code
        run: |
          set -euo pipefail
          x86_64-linux-gnu-as --64 native-engine/android-guest/kernix_elf64_heap_syscalls_guest.S -o dist/heap.o
          x86_64-linux-gnu-ld -pie -nostdlib --no-dynamic-linker --build-id=none -z max-page-size=0x4000 -z norelro -e _start -o dist/heap.elf dist/heap.o
          python3 tools/kernix_elf64_heap_fixture_check.py dist/heap.elf
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist/heap.elf').read_bytes()
          body=''.join(('\n' if i%12==0 else '')+f'0x{b:02x},' for i,b in enumerate(src))
          Path('dist/kernix_elf64_heap_guest_blob.h').write_text('#pragma once\nstatic const unsigned char KERNIX_ELF64_HEAP_BLOB[] = {'+body+'\n};\n')
          PY
      - name: Pin original FEXCore and required submodules
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-upstream
          git -C /tmp/kernix-fex-upstream checkout --quiet --detach 02e24ca5c01ed0c864466ed573db347336f70170
          git -C /tmp/kernix-fex-upstream submodule update --init --recursive --quiet
          test "$(git -C /tmp/kernix-fex-upstream rev-parse HEAD)" = 02e24ca5c01ed0c864466ed573db347336f70170
          cp /tmp/kernix-fex-upstream/LICENSE dist/FEX-LICENSE.txt
      - name: Compile Linux native ARM64 FEXCore control versus patched
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/kernix-fex-upstream')
          p=root/'CMakeLists.txt'
          s=p.read_text()
          a='add_subdirectory(Source/)'
          assert s.count(a)==1
          p.write_text(s.replace(a,'# CI-only native FEXCore library',1))
          p=root/'FEXCore/Source/CMakeLists.txt'
          s=p.read_text()
          assert 'AddLibrary(${PROJECT_NAME}_shared SHARED)' in s
          p.write_text(s+'\ntarget_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)\n')
          PY
          if [ "$VARIANT" != "upstream" ]; then
            python3 tools/kernix_fexcore_syscall_abi_v016_patch.py /tmp/kernix-fex-upstream
          fi
          if [ "$VARIANT" = "kernix-early-capture" ]; then
            python3 tools/kernix_fexcore_syscall_early_capture_v019_patch.py /tmp/kernix-fex-upstream
          fi
          if [ "$VARIANT" = "kernix-static-sra" ]; then
            python3 tools/kernix_fexcore_syscall_static_gpr_v020_patch.py /tmp/kernix-fex-upstream
          fi
          set +e
          timeout 240 cmake -S /tmp/kernix-fex-upstream -B /tmp/kernix-fex-native -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DBUILD_TESTING=OFF -DENABLE_FEX_ALLOCATOR=ON \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_GDB_SYMBOLS=OFF -DENABLE_WERROR=OFF -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
            -DTUNE_CPU=generic >dist/configure.log 2>&1
          conf=$?
          build=125
          if [ "$conf" -eq 0 ]; then
            timeout 960 cmake --build /tmp/kernix-fex-native --target FEXCore_shared --parallel 3 >dist/build.log 2>&1
            build=$?
          fi
          set -e
          tail -n 35 dist/configure.log
          if [ -f dist/build.log ]; then tail -n 35 dist/build.log; fi
          test "$conf" -eq 0 && test "$build" -eq 0
      - name: Native ARM64 high-GPR control without syscall or memory access
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -fPIE -pie \
            -DKERNIX_ARM64_CI_REGRESSION \
            -I/tmp/kernix-fex-upstream/FEXCore/include \
            -I/tmp/kernix-fex-upstream/External/fmt/include \
            -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
            -I/tmp/kernix-fex-upstream/External/xxhash \
            -I/tmp/kernix-fex-native/include -I/tmp/kernix-fex-native/generated \
            native-engine/android-host/kernix_fexcore_x86_64_high_gpr_no_memory_probe.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" -o dist/high-gpr-control \
            >dist/high-gpr-build.log 2>&1 || { cat dist/high-gpr-build.log; exit 1; }
          set +e
          timeout -k 3s 15s env LD_LIBRARY_PATH="$CORE_DIR" \
            ./dist/high-gpr-control >dist/high-gpr.stdout 2>dist/high-gpr.stderr
          rc=$?
          set -e
          cat dist/high-gpr.stdout
          cat dist/high-gpr.stderr
          RC="$rc" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rc=int(os.environ['RC'])
          stdout=Path('dist/high-gpr.stdout').read_text(errors='replace')
          stderr=Path('dist/high-gpr.stderr').read_text(errors='replace')
          obj={'variant':os.environ['VARIANT'],'runtime':'native Linux ARM64 FEX',
               'no_syscall_or_guest_memory':True,'exit_code':rc,
               'pass':rc==0 and 'KERNIX_FEXCORE_X86_HIGH_GPR_DIRECT_EXECUTION_PASS' in stdout,
               'trace':next((s for s in stderr.splitlines() if 'KERNIX_X86_HIGH_GPR_NO_MEMORY' in s),None)}
          Path('dist/high-gpr-result.json').write_text(json.dumps(obj,indent=2)+'\n')
          print('KERNIX_HIGH_GPR_NO_MEMORY_RESULT',json.dumps(obj))
          PY
          test -s dist/high-gpr-result.json
      - name: Run same x86-64 guest on real ARM64 JIT and capture ABI error or success
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-native -type f -name libFEXCore.so | head -1)"
          test -s "$CORE"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -fPIE -pie \
            -DKERNIX_ARM64_CI_REGRESSION \
            -Inative-engine/android-host -Idist \
            -I/tmp/kernix-fex-upstream/FEXCore/include \
            -I/tmp/kernix-fex-upstream/External/fmt/include \
            -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
            -I/tmp/kernix-fex-upstream/External/xxhash \
            -I/tmp/kernix-fex-native/include -I/tmp/kernix-fex-native/generated \
            native-engine/android-host/kernix_fexcore_elf64_heap_syscalls_probe.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" -o dist/kernix-real-arm64-guest \
            >dist/runner-build.log 2>&1 || { cat dist/runner-build.log; exit 1; }
          set +e
          timeout -k 3s 20s env LD_LIBRARY_PATH="$CORE_DIR" ./dist/kernix-real-arm64-guest >dist/guest.stdout 2>dist/guest.stderr
          rc=$?
          set -e
          cat dist/guest.stdout
          cat dist/guest.stderr
          RC="$rc" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rc=int(os.environ['RC'])
          stdout=Path('dist/guest.stdout').read_text(errors='replace')
          stderr=Path('dist/guest.stderr').read_text(errors='replace')
          result={'schema':'kernix.arm64-jit-ab-v1','host':'Ubuntu ARM64, NOT Android','variant':os.environ['VARIANT'],
                  'upstream_sha':'02e24ca5c01ed0c864466ed573db347336f70170',
                  'return_code':rc,'pass':rc==0 and 'KERNIX_FEXCORE_ANDROID_ELF64_GUEST_HEAP_FOUR_SYSCALL_PROOF_V1' in stdout,
                  'first_mmap_failure':next((x for x in stderr.splitlines() if 'KERNIX_MMAP_FAILURE' in x),None),
                  'stdout':stdout[:4000],'stderr':stderr[:12000],'android_verified':False}
          Path('dist/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('KERNIX_REAL_ARM64_FEX_AB',json.dumps(result))
          PY
          test -s dist/result.json
      - name: Compare true register state with FEX one instruction per JIT block
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          for kind in high-gpr heap; do
            if [ "$kind" = high-gpr ]; then
              SOURCE=native-engine/android-host/kernix_fexcore_x86_64_high_gpr_no_memory_probe.cpp
            else
              SOURCE=native-engine/android-host/kernix_fexcore_elf64_heap_syscalls_probe.cpp
            fi
            clang++ -std=c++20 -O2 -fPIE -pie \
              -DKERNIX_ARM64_CI_REGRESSION -DKERNIX_ARM64_CI_ONE_INST \
              -Inative-engine/android-host -Idist \
              -I/tmp/kernix-fex-upstream/FEXCore/include \
              -I/tmp/kernix-fex-upstream/External/fmt/include \
              -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
              -I/tmp/kernix-fex-upstream/External/xxhash \
              -I/tmp/kernix-fex-native/include -I/tmp/kernix-fex-native/generated \
              "$SOURCE" -L"$CORE_DIR" -lFEXCore \
              -Wl,-rpath,"$CORE_DIR" -o "dist/single-inst-$kind" \
              >"dist/single-inst-$kind.compile" 2>&1 || {
                cat "dist/single-inst-$kind.compile"
                exit 1
              }
            set +e
            timeout -k 3s 20s env LD_LIBRARY_PATH="$CORE_DIR" \
              "./dist/single-inst-$kind" >"dist/single-inst-$kind.stdout" \
              2>"dist/single-inst-$kind.stderr"
            rc=$?
            set -e
            echo "$rc" >"dist/single-inst-$kind.rc"
            grep -E 'KERNIX_X86_HIGH_GPR_NO_MEMORY|KERNIX_MMAP_FAILURE|KERNIX_FEXCORE_ANDROID_ELF64_GUEST_HEAP_FOUR_SYSCALL_PROOF_V1' \
              "dist/single-inst-$kind.stdout" "dist/single-inst-$kind.stderr" || true
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          def read(file):return Path('dist/'+file).read_text(errors='replace')
          data={'schema':'kernix.fex-jit-single-instruction-gpr-ab-v1',
                'host':'Ubuntu native ARM64, not Android',
                'variant':os.environ['VARIANT'],
                'maxinst':1,
                'high_gpr':{'rc':int(read('single-inst-high-gpr.rc')),
                            'stderr':read('single-inst-high-gpr.stderr')[-3000:],
                            'stdout':read('single-inst-high-gpr.stdout')[-1000:]},
                'mmap':{'rc':int(read('single-inst-heap.rc')),
                        'stderr':read('single-inst-heap.stderr')[-4500:],
                        'stdout':read('single-inst-heap.stdout')[-1000:]},
                'control':{'high_gpr':json.loads(read('high-gpr-result.json')),
                           'heap':json.loads(read('result.json'))}}
          Path('dist/single-inst-ab-result.json').write_text(json.dumps(data,indent=2)+'\n')
          print('KERNIX_SINGLE_INSTRUCTION_JIT_AB_RESULT',json.dumps(data))
          PY
          test -s dist/single-inst-ab-result.json
      - name: Inspect real guest x86 stack writes before HLT (low versus high registers)
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -fPIE -pie \
            -DKERNIX_ARM64_CI_REGRESSION \
            -I/tmp/kernix-fex-upstream/FEXCore/include \
            -I/tmp/kernix-fex-upstream/External/fmt/include \
            -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
            -I/tmp/kernix-fex-upstream/External/xxhash \
            -I/tmp/kernix-fex-native/include -I/tmp/kernix-fex-native/generated \
            native-engine/android-host/kernix_fexcore_x86_64_high_gpr_stack_witness_probe.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" \
            -o dist/high-gpr-stack-witness \
            >dist/stack-witness-build.log 2>&1 || {
              cat dist/stack-witness-build.log
              exit 1
            }
          set +e
          timeout -k 3s 20s env LD_LIBRARY_PATH="$CORE_DIR" ./dist/high-gpr-stack-witness \
            >dist/stack-witness.stdout 2>dist/stack-witness.stderr
          rc=$?
          set -e
          cat dist/stack-witness.stdout
          cat dist/stack-witness.stderr
          RC="$rc" python3 - <<'PY'
          import json,os
          from pathlib import Path
          stdout=Path('dist/stack-witness.stdout').read_text(errors='replace')
          stderr=Path('dist/stack-witness.stderr').read_text(errors='replace')
          rc=int(os.environ['RC'])
          result={'schema':'kernix.arm64-fex-before-hlt-memory-gprs-v1',
                  'variant':os.environ['VARIANT'],
                  'host':'Ubuntu ARM64, not Android',
                  'exit_code':rc,
                  'pass':rc==0 and 'KERNIX_X86_HIGH_GPR_STACK_MEMORY_PASS' in stdout,
                  'stack_trace':next((line for line in stderr.splitlines() if 'KERNIX_X86_STACK_WITNESS' in line),None),
                  'cpu_state_after_hlt':next((line for line in stderr.splitlines() if 'KERNIX_X86_HIGH_GPR_NO_MEMORY' in line),None)}
          Path('dist/stack-witness-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('KERNIX_REAL_GUEST_STACK_WITNESS_RESULT',json.dumps(result))
          PY
          test -s dist/stack-witness-result.json
      - name: Verify guest-written stack and CpuState independently at real x86 SYSCALL boundary
        run: |
          set -euo pipefail
          CORE="$(find /tmp/kernix-fex-native -type f -name libFEXCore.so | head -1)"
          CORE_DIR="$(dirname "$CORE")"
          clang++ -std=c++20 -O2 -fPIE -pie \
            -DKERNIX_ARM64_CI_REGRESSION \
            -I/tmp/kernix-fex-upstream/FEXCore/include \
            -I/tmp/kernix-fex-upstream/External/fmt/include \
            -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
            -I/tmp/kernix-fex-upstream/External/xxhash \
            -I/tmp/kernix-fex-native/include -I/tmp/kernix-fex-native/generated \
            native-engine/android-host/kernix_fexcore_x86_64_syscall_boundary_stack_probe.cpp \
            -L"$CORE_DIR" -lFEXCore -Wl,-rpath,"$CORE_DIR" \
            -o dist/syscall-boundary-stack-probe >dist/syscall-boundary.compile 2>&1 || {
              cat dist/syscall-boundary.compile
              exit 1
            }
          set +e
          timeout -k 3s 20s env LD_LIBRARY_PATH="$CORE_DIR" ./dist/syscall-boundary-stack-probe \
            >dist/syscall-boundary.stdout 2>dist/syscall-boundary.stderr
          rc=$?
          set -e
          cat dist/syscall-boundary.stdout
          cat dist/syscall-boundary.stderr
          RC="$rc" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          stdout=Path('dist/syscall-boundary.stdout').read_text(errors='replace')
          stderr=Path('dist/syscall-boundary.stderr').read_text(errors='replace')
          rc=int(os.environ['RC'])
          line=next((l for l in stderr.splitlines() if l.startswith('KERNIX_X86_SYSCALL_BOUNDARY ')),None)
          result={'schema':'kernix.arm64-x86-real-syscall-boundary-stack-v1',
             'variant':os.environ['VARIANT'],'platform':'Ubuntu native ARM64, not Android',
             'exit_code':rc,'callback_reached':line is not None,
             'pass':rc==0 and 'KERNIX_X86_SYSCALL_BOUNDARY_STACK_CPUSTATE_PASS' in stdout,
             'boundary_trace':line}
          Path('dist/syscall-boundary-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('KERNIX_SYSCALL_BOUNDARY_ACTUAL_RESULT',json.dumps(result))
          PY
          test -s dist/syscall-boundary-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-FEX-ARM64-${{ matrix.variant }}
          path: dist/
          retention-days: 14
          if-no-files-found: warn
      - name: Enforce guest x86 stack values actually passed (not just CI logging)
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path('dist/stack-witness-result.json').read_text())
          print('KERNIX_GUEST_STACK_WITNESS_ACTUAL_RESULT',json.dumps(x))
          if x['pass'] is not True:
            print('FAIL: guest register memory witness is false; captured evidence does not mean CPU correctness')
            sys.exit(1)
          print('PASS: low and high x86 registers really stored correct values in guest memory')
          PY
      - name: Enforce actual guest x86 SYSCALL bridge values (fail closed)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          evidence=json.loads(Path('dist/syscall-boundary-result.json').read_text())
          print('KERNIX_GUEST_SYSCALL_BOUNDARY_ENFORCED',json.dumps(evidence))
          if evidence['variant'] == 'kernix-static-sra':
            if evidence['boundary_trace'] is None:
              sys.exit('FAIL: native ARM physical register comparison did not reach syscall')
            # This is an investigation, not an Android release pass.
            print('DIAGNOSTIC_ONLY: inspect direct ARM SRA values versus true guest stack')
          else:
            print('REFERENCE_VARIANT_ONLY: failure expected, never claim full syscall bridge pass')
            if evidence['boundary_trace'] is None:
              sys.exit('FAIL: baseline did not reach actual SYSCALL callback')
          PY
