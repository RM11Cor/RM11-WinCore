name: KERNIX G0 L2 original GNU four writers 81 to 84 one real FEX process source plan NO runtime proof
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'native-engine/tools/kernix_g0_l2_original_four_rela81_84_one_fex_process_plan.py'
      - '.github/workflows/kernix-g0-l2-source-four-original-gnu-writers-one-process-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sha-authentic-single-native-process-four-watchpoint-plan-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Require canonical 147 independent writers and previous original ELF source plan, WITHOUT claiming same-process closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 43064217681 43065385073 43068123299; do
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .status)" = completed
            test "$(gh api repos/RM11Cor/RM11-WinCore/actions/runs/$run --jq .conclusion)" = success
          done
      - name: Download canonical immutable original GNU source ELF triad
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          github-token: ${{ github.token }}
          path: inputs/triad
      - name: Download true source81-84 from actual GNU ELF
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43065385073
          name: KERNIX-G0-Original-GNU-DTRELA81-84-Four-Source-Tuples-After141-NO-Native-Proof
          github-token: ${{ github.token }}
          path: inputs/source81
      - name: Download SHA-locked prior141 genuine source cohort ledger for original ELF re-derivation
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43064217681
          name: KERNIX-G0-Original-147-Source-Ledger-After-Independent-Batch71-80
          github-token: ${{ github.token }}
          path: inputs/prior141
      - name: Download canonical 147 independent target writer receipts which do not prove same-process
        uses: actions/download-artifact@v4
        with:
          repository: RM11Cor/RM11-WinCore
          run-id: 43068123299
          name: KERNIX-G0-Original-147-Distinct-Source-Writer-Native-Receipts-147-Of-147-No-Loader-Closure
          github-token: ${{ github.token }}
          path: inputs/prior147
      - name: Verify source SHA and generate one true Linux ARM64 FEX GDB Python four-watchpoint plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile native-engine/tools/kernix_g0_l2_original_four_rela81_84_one_fex_process_plan.py
          python3 native-engine/tools/kernix_g0_l2_original_four_rela81_84_one_fex_process_plan.py \
            inputs/triad/original-guest \
            inputs/prior141/KERNIX-G0-GNU-147-Source-Cohorts-After-10-Target-Independent-Batch71-80.json \
            inputs/source81 \
            inputs/prior147/KERNIX-G0-Original-147-Source-Writers-147-Distinct-Native-Proofs-No-Full-Loader-Claim.json \
            . dist/g0-l2-four
          python3 - <<'PY'
          import ast,json,hashlib
          from pathlib import Path
          root=Path('dist/g0-l2-four')
          rec=json.loads((root/'KERNIX-G0-L2-Original-GNU-RELA81-84-Four-Same-FEX-Process-Source-Only.json').read_text())
          assert rec['schema']=='kernix.g0.l2.original-gnu-rela81-84-four-writers-one-real-arm64-fex-process-plan.v1'
          assert rec['original_source_indices']==[81,82,83,84]
          assert len(set(r['target'] for r in rec['source_tuples']))==4
          assert rec['canonical_individual_writer_count']==147
          assert rec['four_live_same_FEX_process_writers_certified_by_source'] is False
          assert rec['all_147_same_guest_native_execution_proven'] is False
          assert rec['Android_Bionic_Wine_Proton_games_proven'] is False
          script=(root/'kernix-g0-l2-four-real-writers-one-native-process.gdb').read_text()
          assert hashlib.sha256(script.encode()).hexdigest()==rec['gdb_script_sha256']
          assert script.count('wp_class=gdb.WP_WRITE')==1
          blocks=script.split('\npython\n')[1:]
          assert len(blocks)==2
          for b in blocks:
            ast.parse(b.split('\nend\n')[0])
          assert 'gdb.selected_inferior().pid' in script
          assert 'len({x["pid"] for x in state["hits"]})==1' in script
          print('KERNIX_G0_L2_FOUR_ORIGINAL_GNU_SOURCE_TARGETS_ONE_NATIVE_PROCESS_GDB_PYTHON_STATIC_PASS_ZERO_RUNTIME_CLAIMS')
          PY
      - name: Archive original ELF SHA-verified plan only, NOT live hardware writer
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G0-L2-Original-GNU-RELA81-84-Four-Same-FEX-PID-SOURCE-PLAN-ONLY
          path: |
            dist/g0-l2-four/KERNIX-G0-L2-Original-GNU-RELA81-84-Four-Same-FEX-Process-Source-Only.json
            dist/g0-l2-four/kernix-g0-l2-four-real-writers-one-native-process.gdb
          if-no-files-found: error
          retention-days: 30
