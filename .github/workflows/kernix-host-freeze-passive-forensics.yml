name: KERNIX Passive Freeze Forensics Contract
on:
  push:
    branches: [kernix-host-freeze-passive-forensics]
    paths:
      - '.github/workflows/kernix-host-freeze-passive-forensics.yml'
      - 'app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezeExitReasonV49152.java'
      - 'app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezePassiveEvidenceV49152.java'
      - 'tests/standalone/KernixHostFreezeExitReasonSmoke.java'
      - 'app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check passive evidence classifier without Android runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernix-passive"
          javac --release 8 -d "$RUNNER_TEMP/kernix-passive" \
            app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezeExitReasonV49152.java \
            tests/standalone/KernixHostFreezeExitReasonSmoke.java
          java -cp "$RUNNER_TEMP/kernix-passive" com.rm11.autocore.runtime.KernixHostFreezeExitReasonSmoke
      - name: Ensure collection is read-only, explicit and separate from X.Org
        run: |
          set -euo pipefail
          grep -F 'allLiveMeasurementsAreAtExportOnly' app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezePassiveEvidenceV49152.java
          grep -F 'native-xorg/host-freeze-passive-snapshot.json' app/src/main/java/com/rm11/autocore/diagnostics/OfflineDiagnosticArchive.java
          ! grep -E 'startService\(|startActivity\(|ProcessBuilder|Runtime.getRuntime\(\).exec|Os.exec|Thread.sleep\(' \
            app/src/main/java/com/rm11/autocore/runtime/KernixHostFreezePassiveEvidenceV49152.java
