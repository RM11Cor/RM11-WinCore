name: KERNIX G2-C MIT-only original x86 ELF 16KiB Android host layout gate
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2c-mit-16k-safe-layout.yml'
      - 'native-engine/ci/kernix_g2c_build_mit_guest_fixture.sh'
      - 'native-engine/android-guest/kernix_g2c_dynamic_pie_direct_entry_witness.S'
      - 'native-engine/android-guest/kernix_g2c_mit_interpreter_placeholder.S'
      - 'native-engine/android-guest/kernix_g2c_mit_needed_placeholder.S'
      - 'tools/kernix_g2c_mit_16k_ptload_gate.py'
      - 'native-engine/android-host/kernix_g2c_mit_owned_guest_snapshots.h'
      - 'native-engine/android-host/tests/kernix_g2c_mit_snapshot_security_test.cpp'
      - 'native-engine/android-app/src/main/java/org/kernix/host/G2CMit16kGuestAssets.java'
      - 'native-engine/android-app/tests/org/kernix/host/G2CMit16kGuestAssetsTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-16k-host-wx-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build MIT-only three real x86 dynamic ELF64 with 16KiB PT_LOAD alignment
        shell: bash
        run: |
          set -euo pipefail
          bash native-engine/ci/kernix_g2c_build_mit_guest_fixture.sh \
            dist/g2c-mit-16k-guest-v2 --host-16k-safe
          cp dist/g2c-mit-only-three-elf-sha256.txt dist/g2c-mit-16k-v2-three-elf-sha256.txt
          cp dist/g2c-mit-only-source-and-elf-manifest.json dist/g2c-mit-16k-v2-source-and-elf-manifest.json
          cp dist/g2c-mit-only-main-elf-abi.txt dist/g2c-mit-16k-v2-main-elf-abi.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          src=Path('dist/g2c-mit-16k-guest-v2')
          manifest=json.loads(Path('dist/g2c-mit-16k-v2-source-and-elf-manifest.json').read_text())
          assert manifest['host_16k_safe_layout_requested'] is True
          assert manifest['no_glibc_or_distro_guest_libraries'] is True
          assert len(manifest['files'])==3
          for p,record in manifest['files'].items():
              data=(src/p).read_bytes()
              assert len(data)==record['size']
              assert hashlib.sha256(data).hexdigest()==record['sha256']
          print('KERNIX_G2C_16K_MANIFEST_AND_THREE_BINARY_HASHES_MATCH_V2_NOT_LEGACY')
          PY
          python3 tools/kernix_g2c_mit_16k_ptload_gate.py \
            dist/g2c-mit-16k-guest-v2/bin/kernix-mit-dynamic-app \
            dist/g2c-mit-16k-guest-v2/lib64/ld-kernix-g2c-mit-placeholder.so.1 \
            dist/g2c-mit-16k-guest-v2/lib/x86_64-linux-gnu/libkernix-g2c-mit-placeholder.so.1
          echo KERNIX_G2C_THREE_ORIGINAL_MIT_X86_GUEST_ELFS_16K_WX_PAGE_ISOLATION_PASS_NO_DEVICE
      - name: Prove old 4KiB original x86 ELF must not run as 16KiB guest
        shell: bash
        run: |
          set -euo pipefail
          bash native-engine/ci/kernix_g2c_build_mit_guest_fixture.sh \
            dist/g2c-mit-4k-legacy-v1
          python3 tools/kernix_g2c_mit_16k_ptload_gate.py \
            --expect-reject \
            dist/g2c-mit-4k-legacy-v1/bin/kernix-mit-dynamic-app \
            dist/g2c-mit-4k-legacy-v1/lib64/ld-kernix-g2c-mit-placeholder.so.1 \
            dist/g2c-mit-4k-legacy-v1/lib/x86_64-linux-gnu/libkernix-g2c-mit-placeholder.so.1
          echo KERNIX_G2C_UNSAFE_4K_LEGACY_X86_ELF_REFUSED_ON_16K_HOST_PASS
      - name: Audit frozen 16KiB MIT guest snapshots with actual SHA256 and source-tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$PWD/dist/g2c-16k-host-snapshot-test-app-files"
          mkdir -p "$APP_DIR/kernix/runtime-v1/guest-rootfs"
          cp -a dist/g2c-mit-16k-guest-v2 \
            "$APP_DIR/kernix/runtime-v1/guest-rootfs/g2c-mit16k-v1"
          find "$APP_DIR" -type f -exec chmod 0444 {} +
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2c_mit_snapshot_security_test.cpp \
            -o /tmp/kernix-g2c-16k-frozen-host-elf
          timeout -k 2s 15s /tmp/kernix-g2c-16k-frozen-host-elf \
            "$APP_DIR" --host-16k-safe
          echo KERNIX_G2C_MIT_16K_PINNED_ANON_ELF_SNAPSHOT_SOURCE_MUTATION_REJECT_PASS_NO_DEVICE
      - name: Verify Android Java 17 SHA256-only MIT asset source stage and exact 3-file private tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kernix-g2c-mit16k-jvm
          javac -source 17 -target 17 -Xlint:all -d /tmp/kernix-g2c-mit16k-jvm \
            native-engine/android-app/src/main/java/org/kernix/host/G2CMit16kGuestAssets.java \
            native-engine/android-app/tests/org/kernix/host/G2CMit16kGuestAssetsTest.java
          java -cp /tmp/kernix-g2c-mit16k-jvm \
            org.kernix.host.G2CMit16kGuestAssetsTest \
            "$PWD/dist/g2c-mit-16k-guest-v2"
          echo KERNIX_G2C_MIT16K_SIGNED_APK_ASSET_INPUT_NO_GUEST_STAGE_JVM_PASS
      - name: Preserve exact revised MIT guest binary hashes and attested ELF bytes
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G2C-16KiB-host-safe-original-MIT-guest-ELFs-NO-ANDROID
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/g2c-mit-16k-guest-v2/bin/kernix-mit-dynamic-app
            dist/g2c-mit-16k-guest-v2/lib64/ld-kernix-g2c-mit-placeholder.so.1
            dist/g2c-mit-16k-guest-v2/lib/x86_64-linux-gnu/libkernix-g2c-mit-placeholder.so.1
            dist/g2c-mit-16k-v2-three-elf-sha256.txt
            dist/g2c-mit-16k-v2-source-and-elf-manifest.json
            dist/g2c-mit-16k-v2-main-elf-abi.txt
