name: KERNIX G2-E/C3-D4 authentic 4K original guest native read-only mapping and Android build-only
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-g2e-c3d4-original-4k-native-ro-guest-page-gate.yml'
      - 'native-engine/android-host/kernix_g2e_c3d4_native_4k_original_elf_readonly_lease.h'
      - 'native-engine/android-host/tests/kernix_g2e_c3d4_native_4k_original_elf_readonly_lease_test.cpp'
      - 'native-engine/android-host/kernix_g2e_c3d4_android_bionic_native_4k_ro_buildonly.cpp'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  pinned-original-guest-native-linux-4k-pages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable original Linux x86-64 ELF main interpreter glibc triad
        uses: actions/download-artifact@v4
        with:
          name: KERNIX-G2E-ARM64-Original-Real-Linux-Guest-Triad-v1
          repository: RM11Cor/RM11-WinCore
          run-id: 41846530666
          github-token: ${{ github.token }}
          path: inputs/guest
      - name: Require source SHA and length on all three authentic x86 ELF payloads
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('inputs/guest/original-guest')
          expected={
            'bin/kernix-g2e-dynamic-guest':(15976,'9fb072db2732c7c6a1b2a53bd946d54904feaac5980e0d79b39f7ce300784412'),
            'lib64/ld-linux-x86-64.so.2':(235408,'cff2a563ca82b90beb5c43db38b84efe0c610a9a0e3394083882abcf8431fbae'),
            'lib/x86_64-linux-gnu/libc.so.6':(2118168,'7e262ac92a454f36664b9c95a8927ecc4fb0f0f007206c2613b1e9ce14e76906')}
          assert {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}==set(expected)
          manifest=json.loads(Path('inputs/guest/proven-guest-triad.json').read_text())
          assert manifest['original_real_FEX_linux_arm64_execution_run']==41842294261
          for rel,(length,sha) in expected.items():
              data=(root/rel).read_bytes()
              assert len(data)==length and hashlib.sha256(data).hexdigest()==sha
              assert manifest['files'][rel]['sha256']==sha
              assert data[:6]==b'\x7fELF\x02\x01' and struct.unpack_from('<H',data,18)[0]==62
          print('KERNIX_G2EC3D4_ALL_ORIGINAL_X86_ELFS_PINNED_SHA_PASS')
          PY
          mkdir -p dist/immutable-rootfs/bin dist/immutable-rootfs/lib64 dist/immutable-rootfs/lib/x86_64-linux-gnu
          for rel in bin/kernix-g2e-dynamic-guest lib64/ld-linux-x86-64.so.2 lib/x86_64-linux-gnu/libc.so.6; do
            cp --no-dereference "inputs/guest/original-guest/$rel" "dist/immutable-rootfs/$rel"
            chmod 0400 "dist/immutable-rootfs/$rel"
            cmp "inputs/guest/original-guest/$rel" "dist/immutable-rootfs/$rel"
          done
          find dist/immutable-rootfs -type d -exec chmod 0700 {} +
          echo KERNIX_G2EC3D4_PINNED_ORIGINAL_APP_PRIVATE_LAYOUT_READY_NO_GUEST_EXEC
      - name: Exercise original real 609 guest 4K byte pages under actual native kernel read-only VMAs
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_g2e_c3d4_native_4k_original_elf_readonly_lease_test.cpp \
            -o dist/kernix-g2ec3d4-original-native-4k-ro-test
          getconf PAGESIZE > dist/native-linux-kernel-page-bytes.txt
          timeout -k 3s 40s dist/kernix-g2ec3d4-original-native-4k-ro-test \
            "$PWD/dist/immutable-rootfs" >dist/c3d4.stdout 2>dist/c3d4.stderr || {
              cat dist/c3d4.stdout
              cat dist/c3d4.stderr
              exit 1
            }
          cat dist/c3d4.stdout
          test ! -s dist/c3d4.stderr
          grep -Fxq 'KERNIX_G2EC3D4_REAL_PINNED_ORIGINAL_609_GUEST4K_NATIVE_READONLY_EXACT_VA_BYTES_PASS pages=609 native_page=4096 collision_preserved=1 atomic_reserve_and_stage_rollback=1 host_exec=0 fex=0 ldso=0 android_device=0' dist/c3d4.stdout
          test "$(getconf PAGESIZE)" = 4096
          python3 - <<'PY'
          import json,platform
          from pathlib import Path
          evidence={
            'schema':'kernix.g2ec3d4.authentic-linux-native-4k-guest-bytes-readonly-gate.v1',
            'runner_arch':platform.machine(),
            'real_native_linux_kernel_page_bytes':4096,
            'source_original_x86_guest_files_SHA256_checked':True,
            'original_linux_x86_guest_4k_pages_staged_readonly':609,
            'all_pages_exact_MAP_FIXED_NOREPLACE':True,
            'all_pages_initial_PROT_NONE_then_transient_RW_then_final_RO':True,
            'full_4096_source_bytes_compared_each_page':True,
            'collision_preserved_and_atomic_rollback':True,
            'PROT_EXEC_granted':False,
            'original_FEX_guest_memory_attached':False,
            'Linux_x86_guest_ld_linux_executed':False,
            'Android_device_tested':False,
            'Android_signed_APK_shipped':False,
            'Wine_PE_or_games_executed':False}
          Path('dist/g2ec3d4-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KERNIX-G2EC3D4-Original-609-Guest-4K-ReadOnly-${{ matrix.arch }}-Linux-Only
          path: |
            dist/*.stdout
            dist/*.stderr
            dist/*evidence.json
            dist/native-linux-kernel-page-bytes.txt
          if-no-files-found: warn
          retention-days: 30

  android-bionic-arm64-compilation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Android 16KiB-aligned native AArch64/Bionic ABI without shipping or running
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "$NDK/aarch64-linux-android26-clang++" ]; then
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -x "$SM"
            yes | "$SM" --sdk_root="$ANDROID_HOME" 'ndk;27.2.12479018' >/dev/null || :
          fi
          test -x "$NDK/aarch64-linux-android26-clang++"
          "$NDK/aarch64-linux-android26-clang++" -std=c++20 -O2 -fPIC -shared \
            -static-libstdc++ -Wall -Wextra -Wpedantic -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -Inative-engine/android-host \
            native-engine/android-host/kernix_g2e_c3d4_android_bionic_native_4k_ro_buildonly.cpp \
            -o dist/libkernix_g2ec3d4_native_4k_RO_BUILDONLY.so
          "$NDK/llvm-readelf" -h -l -d -W \
            dist/libkernix_g2ec3d4_native_4k_RO_BUILDONLY.so >dist/android-bionic-abi.txt
          grep -Fq 'Machine:                           AArch64' dist/android-bionic-abi.txt
          grep -Fq 'Shared library: [libc.so]' dist/android-bionic-abi.txt
          ! grep -Eq 'Shared library: \[(libc.so.6|libFEXCore.so|libwine.so)\]' dist/android-bionic-abi.txt
          sha256sum dist/libkernix_g2ec3d4_native_4k_RO_BUILDONLY.so >dist/bionic-buildonly.sha256
          printf '%s\n' 'Android Bionic AArch64 build only; NO APK, NO FEX, NO original guest pages on phone.' \
            >dist/NOT-AN-ANDROID-RUNTIME.txt
          echo KERNIX_G2EC3D4_ANDROID_BIONIC_AARCH64_LINK_ONLY_NO_APK_NO_GUEST_EXEC_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: KERNIX-G2EC3D4-Bionic-ARM64-SHARED-LIB-BUILDONLY-NOT-APK
          path: |
            dist/android-bionic-abi.txt
            dist/bionic-buildonly.sha256
            dist/NOT-AN-ANDROID-RUNTIME.txt
          retention-days: 30
          if-no-files-found: error
