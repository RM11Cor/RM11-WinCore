name: KERNIX FEX native ARM64 source build baseline
on:
  workflow_dispatch:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - 'components/upstream-source-lock.json'
      - '.github/workflows/kernix-fex-arm64-baseline.yml'
permissions:
  contents: read
jobs:
  upstream-fex-linux-arm64-baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout KERNIX source locks
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native AArch64 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build nasm git pkg-config \
            python3 python3-pip libfmt-dev libssl-dev libxxhash-dev \
            libcap-dev libsdl2-dev libepoxy-dev libgl-dev \
            libdrm-dev libx11-dev libxext-dev libasound2-dev
      - name: Check out immutable original FEX source commit and submodules
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(python3 - <<'PY'
          import json
          j=json.load(open('components/upstream-source-lock.json'))
          c=[x for x in j['components'] if x['kind']=='fex']
          assert len(c)==1 and c[0]['repository']=='FEX-Emu/FEX'
          assert c[0]['android_binary_built'] is False
          print(c[0]['git_commit'])
          PY
          )"
          git clone --filter=blob:none --no-checkout https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-upstream
          git -C /tmp/kernix-fex-upstream checkout --detach "$SHA"
          git -C /tmp/kernix-fex-upstream submodule update --init --recursive
          test "$(git -C /tmp/kernix-fex-upstream rev-parse HEAD)" = "$SHA"
          echo "FEX_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Configure original ARM64 FEXCore Linux baseline
        shell: bash
        run: |
          set -euo pipefail
          # Upstream FEX explicitly rejects GCC; pin both compilers to Clang.
          clang --version
          clang++ --version
          cmake -S /tmp/kernix-fex-upstream -B /tmp/kernix-fex-build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
            -DBUILD_TESTING=OFF -DBUILD_FEX_LINUX_TESTS=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DENABLE_LTO=OFF -DTUNE_CPU=generic \
            -DENABLE_FEXCORE_PROFILER=OFF -DENABLE_WERROR=OFF
          cmake --build /tmp/kernix-fex-build --parallel 2
      - name: Collect native Linux ARM64 FEX objects with honest environment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          root=Path('/tmp/kernix-fex-build')
          files=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix not in {'.so','.a'}:
                  continue
              if p.stat().st_size > 128*1024*1024:
                  continue
              data=p.read_bytes()
              files.append({'name':p.relative_to(root).as_posix(),
                  'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert files,"No FEX native objects produced"
          result={'schema':'kernix.fex-linux-arm64-baseline.v1',
              'source':'FEX-Emu/FEX','commit':os.environ['FEX_SHA'],
              'host_platform':'ubuntu-24.04-aarch64-glibc',
              'android_bionic_compatible':False,
              'fex_runtime_device_tested':False,
              'wine_proton_connected':False,
              'rootfs_packed':False,'objects':files}
          Path('dist/fex-linux-arm64-build-audit.json').write_text(json.dumps(result,indent=2)+'\n')
          print('KERNIX_OFFICIAL_FEX_LINUX_ARM64_BASELINE_COMPILED',len(files))
          PY
      - name: Preserve real FEX ARM64 ELF binaries and inspect Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil,struct,subprocess
          from pathlib import Path
          from tools.kernix_native_artifact_gate import attest_arm64_elf
          root=Path('/tmp/kernix-fex-build')
          target=Path('dist/fex-linux-elf')
          target.mkdir(parents=True,exist_ok=True)
          entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.is_symlink() or p.stat().st_size>96*1024*1024:
                  continue
              with p.open('rb') as stream:
                  header=stream.read(64)
              if len(header)<64 or header[:4]!=b'\x7fELF' or header[4]!=2 or header[5]!=1:
                  continue
              machine=struct.unpack_from('<H',header,18)[0]
              if machine!=183:
                  continue
              elf_type=struct.unpack_from('<H',header,16)[0]
              if elf_type not in (2,3):
                  continue
              rel=p.relative_to(root)
              dest=target/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dest)
              data=dest.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              # Reuse the tested ELF gate: machine, program-header bounds,
              # PT_LOAD bounds, size and full SHA-256, not just e_machine.
              attestation=attest_arm64_elf(dest,digest)
              dyn=subprocess.run(['readelf','-d',str(dest)],capture_output=True,
                  text=True,check=True,timeout=20).stdout
              needed=[line.split('Shared library: [',1)[1].split(']',1)[0]
                      for line in dyn.splitlines() if 'Shared library: [' in line]
              interp=subprocess.run(['readelf','-l',str(dest)],capture_output=True,
                  text=True,check=True,timeout=20).stdout
              interpreter=[line.split('Requesting program interpreter:',1)[1].strip(' ]')
                  for line in interp.splitlines() if 'Requesting program interpreter:' in line]
              entries.append({'path':rel.as_posix(),'size':len(data),
                  'sha256':digest,'elf_machine':'AArch64',
                  'elf_load_bounds_verified':attestation['elf_header_and_load_bounds_verified'],
                  'binary_sha256_verified':attestation['binary_sha256_verified'],
                  'needed':needed,'interpreter':interpreter})
          assert entries, 'No AArch64 ELF runtime objects produced'
          report={'schema':'kernix.fex-linux-arm64-elf-dependency-audit.v1',
              'upstream':'FEX-Emu/FEX','source_commit':os.environ['FEX_SHA'],
              'build_host':'ubuntu-24.04-arm64-glibc',
              'android_bionic_compatible':False,
              'android_runtime_installable':False,'wine_connected':False,
              'files':entries}
          Path('dist/fex-elf-dependency-audit.json').write_text(json.dumps(report,indent=2)+'\n')
          print('KERNIX_FEX_REAL_AARCH64_ELF_ARTIFACTS_PRESERVED',len(entries))
          PY
          # Preserve the original upstream license alongside the audit.
          cp /tmp/kernix-fex-upstream/LICENSE dist/FEX-UPSTREAM-LICENSE.txt
      - name: Publish real ARM64 Linux FEX ELF binaries with dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-FEX-real-ARM64-linux-ELF-not-Android
          path: |
            dist/fex-linux-elf/
            dist/fex-elf-dependency-audit.json
            dist/FEX-UPSTREAM-LICENSE.txt
          retention-days: 30
          if-no-files-found: error
      - name: Upload ARM64 build provenance only (not Android runtime)
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-FEX-native-ARM64-linux-build-audit
          path: dist/fex-linux-arm64-build-audit.json
          if-no-files-found: error
          retention-days: 30
