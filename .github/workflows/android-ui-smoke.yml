name: Arabic Lock UI Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [alquflshamil-app-android16]
    paths:
      - ".github/workflows/android-ui-smoke.yml"
      - "scripts/android-smoke.sh"
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug application for emulator
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM acceleration if available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch app and verify onboarding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arabic-Lock-UI-Smoke
          path: smoke/
