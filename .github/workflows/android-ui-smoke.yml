name: Arabic Lock UI Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug application for emulator
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM acceleration if available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch app and verify onboarding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -e
            mkdir -p smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.moammalsaad.alquflshamil.stable/com.r4.qaflshamil.MainActivity
            sleep 6
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml smoke/window.xml || true
            adb shell screencap -p /sdcard/alq_home.png
            adb pull /sdcard/alq_home.png smoke/screenshot.png
            adb logcat -d -s AndroidRuntime:E > smoke/crash.log
            test -s smoke/screenshot.png
            if grep -q "FATAL EXCEPTION" smoke/crash.log; then
              cat smoke/crash.log
              exit 1
            fi
            test -f smoke/window.xml && grep -E "القفل الشامل|إنشاء رمز الحماية|الخصوصية" smoke/window.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arabic-Lock-UI-Smoke
          path: smoke/
