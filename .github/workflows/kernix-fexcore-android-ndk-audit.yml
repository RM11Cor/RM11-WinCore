name: KERNIX original FEXCore Android ARM64 NDK compile audit
on:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-fexcore-android-ndk-audit.yml'
      - 'native-engine/android-host/kernix_fexcore_x86_64_alu_probe.cpp'
      - 'native-engine/android-host/kernix_fexcore_x86_64_getpid_probe.cpp'
      - 'native-engine/android-host/kernix_fexcore_x86_64_write_bridge_probe.cpp'
      - 'native-engine/android-host/kernix_fexcore_elf64_exec_probe.cpp'
      - 'native-engine/android-host/tests/kernix_g0_original_fex_real_ldso_pread_arm64.cpp'
      - 'native-engine/android-host/tests/kernix_g0_original_fex_real_guest_mmap_munmap_arm64.cpp'
      - 'native-engine/android-guest/kernix_g0_original_fex_real_guest_mmap_munmap.S'
      - 'native-engine/android-host/kernix_g0_guest_owned_anonymous_vm_kernel.h'
      - 'native-engine/android-guest/kernix_g0_original_fex_real_ldso_pread.S'
      - 'native-engine/android-host/kernix_g0_original_guest_snapshot_table.h'
      - 'native-engine/android-host/kernix_g0_guest_syscall_dispatch.h'
      - 'native-engine/android-host/kernix_g2e_c1_x86_linux_syscall_boundary.h'
      - 'native-engine/android-host/kernix_g2e_c2_original_fex_cpu_state_adapter.h'
      - 'tools/test_kernix_g0_android_fex_elf_bridge_source_gate.py'
      - 'native-engine/android-host/kernix_elf64_loader.h'
      - 'native-engine/android-host/tests/kernix_elf64_loader_host_test.cpp'
      - 'native-engine/android-guest/kernix_elf64_guest_write_getpid.S'
      - 'native-engine/android-guest/kernix_elf64_rw_guest.S'
      - 'native-engine/android-host/kernix_fexcore_elf64_rw_exec_probe.cpp'
      - 'native-engine/android-host/tests/kernix_elf64_rw_loader_host_test.cpp'
      - 'tools/kernix_elf64_rw_fixture_check.py'
      - 'native-engine/android-guest/kernix_elf64_heap_syscalls_guest.S'
      - 'native-engine/android-host/kernix_guest_memory_syscalls.h'
      - 'native-engine/android-host/kernix_fexcore_elf64_heap_syscalls_probe.cpp'
      - 'native-engine/android-host/tests/kernix_guest_memory_syscalls_host_test.cpp'
      - 'native-engine/android-host/tests/kernix_elf64_heap_loader_host_test.cpp'
      - 'tools/kernix_elf64_heap_fixture_check.py'
      - 'tools/kernix_elf64_fixture_check.py'
      - 'native-engine/android-host/kernix_g2c_fex_dynamic_pie_direct_entry_probe.cpp'
      - 'native-engine/android-host/kernix_g2d_real_fex_import_probe.cpp'
      - 'native-engine/android-host/kernix_g2d_mit_import_linker.h'
      - 'native-engine/android-host/kernix_g2c_fixed_android_candidate_gate.h'
      - 'native-engine/android-host/kernix_g2c_mit_owned_guest_snapshots.h'
      - 'native-engine/android-host/tests/kernix_g2c_fixed_android_candidate_gate_test.cpp'
      - 'native-engine/android-host/kernix_g2b_readonly_host_install.h'
      - 'native-engine/android-host/kernix_g2b_guest_launch_plan.h'
      - 'native-engine/android-host/kernix_guest_linux_x86_initial_stack.h'
      - 'native-engine/android-host/kernix_guest_elf64_readonly_image.h'
      # No FEX syscall register patch; fixed guest mode is in the host probes.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fexcore-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # v0.17 rerun pinned guest ELF RW register witness after GNU ld displacement audit.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the real FEX ELF host uses the G0 guest ABI boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_kernix_g0_android_fex_elf_bridge_source_gate.py' -v
      - name: NDK and host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build git python3 pkg-config binutils
          SDK="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || echo /usr/local/lib/android/sdk)"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          test -x "$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" || "$SDKMANAGER" 'ndk;29.0.14206865'
          echo "KERNIX_NDK=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"
          mkdir -p dist
          cat > /tmp/kernix-cxx20-atomic-ref.cpp <<'CPP'
          #include <atomic>
          #if __cplusplus < 202002L
          #error C++20 required
          #endif
          #if !defined(__cpp_lib_atomic_ref)
          #error std::atomic_ref unavailable in Android NDK libc++
          #endif
          int main() { int count=0; std::atomic_ref<int> a(count); return a.load(); }
          CPP
          "$SDK/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --target=aarch64-none-linux-android26 -std=c++20 -c \
            /tmp/kernix-cxx20-atomic-ref.cpp -o /tmp/kernix-cxx20-atomic-ref.o \
            >dist/ndk29-cxx20-atomic-ref.log 2>&1 || {
              cat dist/ndk29-cxx20-atomic-ref.log
              echo "::error::FEXCore requires C++20 std::atomic_ref missing in Android NDK" >&2
              exit 1
            }
          echo KERNIX_ANDROID_NDK_CXX20_ATOMIC_REF_COMPILED
      - name: Build true GNU as/ld x86-64 ELF and verify loadable segments
        shell: bash
        run: |
          set -euo pipefail
          as --64 native-engine/android-guest/kernix_elf64_guest_write_getpid.S \
             -o dist/kernix-x86-elf64-guest.o
          ld -pie -nostdlib --no-dynamic-linker --build-id=none \
             -z max-page-size=0x4000 -e _start \
             -o dist/kernix-x86-elf64-guest.elf dist/kernix-x86-elf64-guest.o
          file dist/kernix-x86-elf64-guest.elf
          readelf -h -l -d dist/kernix-x86-elf64-guest.elf > dist/kernix-x86-elf64-readelf.txt
          python3 tools/kernix_elf64_fixture_check.py dist/kernix-x86-elf64-guest.elf
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -Inative-engine/android-host \
             native-engine/android-host/tests/kernix_elf64_loader_host_test.cpp \
             -o /tmp/kernix-elf64-loader-host-test
          /tmp/kernix-elf64-loader-host-test dist/kernix-x86-elf64-guest.elf
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist/kernix-x86-elf64-guest.elf').read_bytes()
          blob=''.join( ('\n' if i%12==0 else '')+f'0x{b:02x},' for i,b in enumerate(src))
          Path('dist/kernix_elf64_guest_blob.h').write_text(
              '// Generated from independently compiled original x86 guest ELF.\n'
              '// Immutable bytes embedded in signed Android ARM64 probe; no external executable access.\n'
              '#pragma once\nstatic const unsigned char KERNIX_ELF64_BLOB[] = {'
              +blob+'\n};\n')
          print('KERNIX_TRUE_X86_GUEST_ELF64_EMBEDDED_FOR_NDK_PROBE',len(src))
          PY
          sha256sum dist/kernix-x86-elf64-guest.elf > dist/kernix-x86-elf64-guest.sha256
          echo KERNIX_INDEPENDENT_GNU_X86_ELF64_AND_WX_LOADER_HOST_PROOF_PASS
      - name: Assemble distinct real x86-64 ELF64 writable-memory guest and host-check W^X
        shell: bash
        run: |
          set -euo pipefail
          as --64 native-engine/android-guest/kernix_elf64_rw_guest.S \
             -o dist/kernix-x86-rw-guest.o
          ld -pie -nostdlib --no-dynamic-linker --build-id=none \
             -z max-page-size=0x4000 -z norelro -e _start \
             -o dist/kernix-x86-elf64-rw-guest.elf dist/kernix-x86-rw-guest.o
          readelf -h -l -d dist/kernix-x86-elf64-rw-guest.elf > dist/kernix-elf64-rw-guest-readelf.txt
          python3 tools/kernix_elf64_rw_fixture_check.py dist/kernix-x86-elf64-rw-guest.elf
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -Inative-engine/android-host \
             native-engine/android-host/tests/kernix_elf64_rw_loader_host_test.cpp \
             -o /tmp/kernix-elf64-rw-loader-host-test
          /tmp/kernix-elf64-rw-loader-host-test dist/kernix-x86-elf64-rw-guest.elf
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist/kernix-x86-elf64-rw-guest.elf').read_bytes()
          blob=''.join(('\n' if i%12==0 else '')+f'0x{byte:02x},' for i,byte in enumerate(src))
          Path('dist/kernix_elf64_rw_guest_blob.h').write_text(
              '// KERNIX original as/ld compiled immutable x86-64 ELF64 byte fixture.\n'
              '#pragma once\nstatic const unsigned char KERNIX_ELF64_RW_BLOB[] = {'
              +blob+'\n};\n')
          print('KERNIX_RW_GUEST_REAL_ELF64_EMBEDDED_BYTES',len(src))
          PY
          sha256sum dist/kernix-x86-elf64-rw-guest.elf > dist/kernix-elf64-rw-guest.sha256
          echo KERNIX_ASSEMBLED_ELF64_RO_TO_RW_COPY_SOURCE_AND_HOST_WX_GATES_PASS
      - name: Assemble independent x86 ELF64 guest heap syscalls and verify memory invariants
        shell: bash
        run: |
          set -euo pipefail
          as --64 native-engine/android-guest/kernix_elf64_heap_syscalls_guest.S \
            -o dist/kernix-x86-elf64-heap-guest.o
          ld -pie -nostdlib --no-dynamic-linker --build-id=none \
            -z max-page-size=0x4000 -z norelro -e _start \
            -o dist/kernix-x86-elf64-heap-guest.elf dist/kernix-x86-elf64-heap-guest.o
          python3 tools/kernix_elf64_heap_fixture_check.py \
            dist/kernix-x86-elf64-heap-guest.elf
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_guest_memory_syscalls_host_test.cpp \
            -o /tmp/kernix-heap-syscall-test
          /tmp/kernix-heap-syscall-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Inative-engine/android-host \
            native-engine/android-host/tests/kernix_elf64_heap_loader_host_test.cpp \
            -o /tmp/kernix-elf64-heap-loader-test
          /tmp/kernix-elf64-heap-loader-test dist/kernix-x86-elf64-heap-guest.elf
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist/kernix-x86-elf64-heap-guest.elf').read_bytes()
          body=''.join(('\n' if i%12==0 else '')+f'0x{byte:02x},' for i,byte in enumerate(src))
          Path('dist/kernix_elf64_heap_guest_blob.h').write_text(
              '// Original KERNIX GNU-built immutable x86-64 ELF64 with 4 syscalls.\n'
              '#pragma once\nstatic const unsigned char KERNIX_ELF64_HEAP_BLOB[] = {'
              + body + '\n};\n')
          print('KERNIX_X86_ELF_HEAP_IMMUTABLE_EMBEDDED_BYTES',len(src))
          PY
          sha256sum dist/kernix-x86-elf64-heap-guest.elf \
            >dist/kernix-x86-elf64-heap-guest.sha256
          echo KERNIX_HEAP_ELF64_GUEST_AND_HOST_MEMORY_SYSCALL_GATES_PASS
      - name: Clone exact source with upstream submodules and license
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 - <<'PY'
          import json
          c=[x for x in json.load(open('components/upstream-source-lock.json'))['components'] if x['kind']=='fex']
          assert len(c)==1 and c[0]['repository']=='FEX-Emu/FEX' and c[0]['android_binary_built'] is False
          print(c[0]['git_commit'])
          PY
          )"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/FEX-Emu/FEX.git /tmp/kernix-fex-upstream
          git -C /tmp/kernix-fex-upstream checkout --quiet --detach "$sha"
          git -C /tmp/kernix-fex-upstream submodule update --init --recursive --quiet
          test "$(git -C /tmp/kernix-fex-upstream rev-parse HEAD)" = "$sha"
          echo "FEX_PIN=$sha" >> "$GITHUB_ENV"
          git -C /tmp/kernix-fex-upstream submodule status --recursive > dist/submodules.txt
          cp /tmp/kernix-fex-upstream/LICENSE dist/FEX-UPSTREAM-LICENSE.txt
      - name: Core-only Android NDK configure and compilation
        shell: bash
        run: |
          set -euo pipefail
          # A documented, minimal, throwaway upstream-root CMake adaptation.
          # Do not patch game frontend into pretending to support Android.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/kernix-fex-upstream/CMakeLists.txt')
          s=p.read_text()
          a='elseif (NOT (WIN32 OR CMAKE_SYSTEM_NAME STREQUAL "Linux"))'
          assert s.count(a)==1
          s=s.replace(a,a.replace('))',' OR ANDROID))'),1)
          a='add_subdirectory(Source/)'
          assert s.count(a)==1
          s=s.replace(a,'# Audit: do not build Linux-only executable frontend',1)
          p.write_text(s)
          # Android Bionic shared libraries require resolved dependencies
          # rather than relying on Linux ELF's permissive unresolved symbols.
          # These are genuine original FEX static libraries, not stubs.
          core=Path('/tmp/kernix-fex-upstream/FEXCore/Source/CMakeLists.txt')
          cs=core.read_text()
          assert 'AddLibrary(${PROJECT_NAME}_shared SHARED)' in cs
          assert 'target_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)' not in cs
          cs += '\n# CI-only Android fully linked original dependencies\n'
          cs += 'target_link_libraries(FEXCore_shared PRIVATE FEXCore_Base softfloat_3e)\n'
          core.write_text(cs)
          # Android Bionic does not declare glibc's getdents64 function.
          # Adapt the two actual Linux-kernel directory-entry calls through
          # Android's supported syscall() dispatcher; no fake return values.
          fileutils=Path('/tmp/kernix-fex-upstream/FEXCore/Source/Utils/FileUtils.cpp')
          fs=fileutils.read_text()
          anchor='#include <unistd.h>'
          assert fs.count(anchor)==1
          shim='''#include <sys/syscall.h>
          #ifdef __ANDROID__
          static inline ssize_t kernix_android_getdents64(int fd, void* buffer, size_t bytes) {
            return ::syscall(__NR_getdents64, fd, buffer, bytes);
          }
          #endif'''
          fs=fs.replace(anchor,anchor+'\n'+shim,1)
          assert fs.count('ssize_t read = getdents64(')==2
          fs=fs.replace('ssize_t read = getdents64(','ssize_t read = kernix_android_getdents64(')
          fileutils.write_text(fs)
          PY
          # G1 Linux A/B 41698161432 proved a host Config-order fault:
          # never patch genuine FEXCore SYSCALL register spilling on Android.
          # Only the pre-existing Android/Bionic build portability changes
          # are allowed in this ephemeral upstream checkout.
          git -C /tmp/kernix-fex-upstream diff -- \
            CMakeLists.txt FEXCore/Source/CMakeLists.txt FEXCore/Source/Utils/FileUtils.cpp \
            > dist/audit-only-cmake-diff.patch
          test -s dist/audit-only-cmake-diff.patch
          ! git -C /tmp/kernix-fex-upstream diff --name-only -- \
            FEXCore/Source/Interface/Core/OpcodeDispatcher.cpp \
            FEXCore/Source/Interface/Core/JIT/BranchOps.cpp | grep .
          ! grep -Fq 'KERNIX v0.16 Android-only fix' dist/audit-only-cmake-diff.patch
          echo KERNIX_FEX_UPSTREAM_SYSCALL_UNPATCHED_AFTER_G1_HOST_MODE_FIX
          set +e
          timeout 240 cmake -S /tmp/kernix-fex-upstream -B /tmp/kernix-fex-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$KERNIX_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \
            -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_TESTING=OFF -DENABLE_FEX_ALLOCATOR=ON \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_GDB_SYMBOLS=OFF -DENABLE_WERROR=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE -DTUNE_CPU=generic \
            >dist/configure.log 2>&1
          conf=$?
          build=125
          if [ "$conf" -eq 0 ]; then
            timeout 780 cmake --build /tmp/kernix-fex-android --target FEXCore_shared \
              --parallel 2 >dist/build.log 2>&1
            build=$?
          else
            echo 'Not attempted: CMake configuration failed' >dist/build.log
          fi
          set -e
          echo "CONFIGURE_RC=$conf" >> "$GITHUB_ENV"
          echo "BUILD_RC=$build" >> "$GITHUB_ENV"
          tail -n 40 dist/configure.log
          tail -n 50 dist/build.log
      - name: Audit actual Android cross-build and remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess,shutil
          from pathlib import Path
          root=Path('/tmp/kernix-fex-android')
          binaries=list(root.rglob('libFEXCore.so')) if root.exists() else []
          evidence={
            'schema':'kernix.real-fexcore-android-ndk-probe.v1',
            'source_upstream':'FEX-Emu/FEX','source_sha':os.environ['FEX_PIN'],
            'android_ndk_target':'arm64-v8a API 26',
            'ci_only_source_patch_recorded':True,
            'syscall_register_source_patched':False,
            'guest64_mode_set_after_config_reload_in_android_host':True,
            'configure_rc':int(os.environ['CONFIGURE_RC']),
            'build_rc':int(os.environ['BUILD_RC']),
            'bionic_library_built':False,
            'device_loaded':False,'guest_instruction_execution':False,
            'wine_connected':False,'windows_game_tested':False,
            'admitted_to_component_registry':False}
          if evidence['build_rc']==0 and len(binaries)==1:
            p=binaries[0]
            from tools.kernix_native_artifact_gate import attest_arm64_elf
            digest=hashlib.sha256(p.read_bytes()).hexdigest()
            a=attest_arm64_elf(p,digest)
            elf=Path(os.environ['KERNIX_NDK'])/'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
            dyn=subprocess.run([str(elf),'-d',str(p)],capture_output=True,text=True,check=True).stdout
            hdr=subprocess.run([str(elf),'-h',str(p)],capture_output=True,text=True,check=True).stdout
            needed=[s.split('Shared library: [',1)[1].split(']',1)[0]
                for s in dyn.splitlines() if 'Shared library: [' in s]
            if 'AArch64' not in hdr or any(n in needed for n in ('libc.so.6','libstdc++.so.6','libpthread.so.0')):
              raise ValueError('Not an Android-compatible ELF dependency set')
            shutil.copy2(p,'dist/libFEXCore-android-build-only.so')
            evidence['bionic_library_built']=True
            evidence['elf']={'sha256':digest,'bytes':p.stat().st_size,'needed':needed}
          Path('dist/compile-result.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('KERNIX_FEXCORE_ANDROID_COMPILE_EVIDENCE',json.dumps(evidence))
          PY
      - name: Cross-compile real FEXCore x86-64 fixed ALU guest execution harness
        if: env.BUILD_RC == '0'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/libFEXCore-android-build-only.so
          CORE_DIR="$(dirname "$(find /tmp/kernix-fex-android -type f -name libFEXCore.so | head -1)")"
          test -s "$CORE_DIR/libFEXCore.so"
          NDK_BIN="$KERNIX_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$NDK_BIN/aarch64-linux-android26-clang++"
          test -x "$CXX"
          set +e
          "$CXX" -std=c++20 -O2 -fPIE -pie -static-libstdc++ -fno-exceptions -Wall -Wextra \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -Wl,-rpath,'$ORIGIN' \
            -I/tmp/kernix-fex-upstream/FEXCore/include \
            -I/tmp/kernix-fex-upstream/External/fmt/include \
            -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
            -I/tmp/kernix-fex-upstream/External/xxhash \
            -I/tmp/kernix-fex-android/include \
            -I/tmp/kernix-fex-android/generated \
            native-engine/android-host/kernix_fexcore_x86_64_alu_probe.cpp \
            -L"$CORE_DIR" -lFEXCore \
            -o dist/libkernix_fexcore_x86_64_alu_probe.so \
            >dist/x86-guest-harness-crosscompile.log 2>&1
          rc=$?
          set -e
          cat dist/x86-guest-harness-crosscompile.log
          test "$rc" -eq 0
          sha256sum dist/libkernix_fexcore_x86_64_alu_probe.so \
            >dist/x86-guest-harness.sha256
          "$NDK_BIN/llvm-readelf" -h -l -d \
            dist/libkernix_fexcore_x86_64_alu_probe.so \
            >dist/x86-guest-harness-elf.txt
          grep -Fq '/system/bin/linker64' dist/x86-guest-harness-elf.txt
          grep -Fq 'Shared library: [libFEXCore.so]' dist/x86-guest-harness-elf.txt
          grep -Fq 'Shared library: [libc.so]' dist/x86-guest-harness-elf.txt
          if grep -Fq 'Shared library: [libc++_shared.so]' dist/x86-guest-harness-elf.txt; then
            echo "::error::FEXCore x86 guest runner must not depend on unbundled libc++ shared runtime" >&2
            exit 1
          fi
          echo KERNIX_STATIC_LIBCXX_FEXCORE_X86_GUEST_PROCESS_DEPENDENCIES_VERIFIED
          python3 tools/kernix_native_artifact_gate.py elf \
            dist/libkernix_fexcore_x86_64_alu_probe.so \
            --sha256 "$(cut -d' ' -f1 dist/x86-guest-harness.sha256)"
          echo KERNIX_REAL_FEXCORE_GUEST_ALU_RUNNER_CROSSCOMPILED_NOT_DEVICE_EXECUTED
          set +e
          "$CXX" -std=c++20 -O2 -fPIE -pie -static-libstdc++ -fno-exceptions -Wall -Wextra \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -Wl,-rpath,'$ORIGIN' \
            -I/tmp/kernix-fex-upstream/FEXCore/include \
            -I/tmp/kernix-fex-upstream/External/fmt/include \
            -I/tmp/kernix-fex-upstream/External/unordered_dense/include \
            -I/tmp/kernix-fex-upstream/External/xxhash \
            -I/tmp/kernix-fex-android/include \
            -I/tmp/kernix-fex-android/generated \
            native-engine/android-host/kernix_fexcore_x86_64_getpid_probe.cpp \
            -L"$CORE_DIR" -lFEXCore \
            -o dist/libkernix_fexcore_x86_64_getpid_probe.so \
            >dist/x86-syscall-bridge-crosscompile.log 2>&1
          rc=$?
          set -e
