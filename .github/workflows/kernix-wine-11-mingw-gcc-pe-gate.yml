name: KERNIX Wine 11 MinGW-GCC PE compiler native x64 executable gate
on:
  workflow_dispatch:
  push:
    branches: [kernix-native-engine-v1]
    paths:
      - '.github/workflows/kernix-wine-11-mingw-gcc-pe-gate.yml'
permissions:
  contents: read
jobs:
  source-build-wine-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install clean upstream Wine x86_64 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang-19 lld-19 git bison flex pkg-config python3 \
            libfreetype-dev libfontconfig-dev libx11-dev libxext-dev \
            libxrender-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxxf86vm-dev libxcomposite-dev libxfixes-dev \
            libxkbcommon-dev libgl-dev libvulkan-dev libgnutls28-dev libssl-dev \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 xvfb xauth
      - name: Checkout immutable official Wine 11.0 release source commit
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/wine-mirror/wine.git /tmp/kernix-wine-src
          git -C /tmp/kernix-wine-src checkout --detach db11d0fe6a169c457e23d007e20404643d067aa8
          test "$(git -C /tmp/kernix-wine-src rev-parse HEAD)" = db11d0fe6a169c457e23d007e20404643d067aa8
          echo WINE_UPSTREAM_SHA=db11d0fe6a169c457e23d007e20404643d067aa8 >> "$GITHUB_ENV"
      - name: Configure and compile original 64-bit Wine on Linux x86_64
        run: |
          set -euo pipefail
          # Clang 18 crashes in Wine's generated MSVC RTTI inline assembly.
          # Select Ubuntu's packaged Clang/LLD 19 for BOTH Unix and PE builds.
          mkdir -p /tmp/kernix-wine-compiler /tmp/kernix-wine-build
          ln -sf /usr/bin/clang-19 /tmp/kernix-wine-compiler/clang
          ln -sf /usr/bin/clang++-19 /tmp/kernix-wine-compiler/clang++
          ln -sf /usr/bin/ld.lld-19 /tmp/kernix-wine-compiler/ld.lld
          # Wine invokes an unprefixed dlltool. GNU dlltool defaults to host
          # 'as', which cannot encode PE/COFF RVA relocations. Pin BOTH tools
          # to the same x86_64-w64-mingw32 target to avoid BFD_RELOC_RVA.
          test -x /usr/bin/x86_64-w64-mingw32-dlltool
          test -x /usr/bin/x86_64-w64-mingw32-as
          cat > /tmp/kernix-wine-compiler/dlltool <<'SH'
          #!/bin/sh
          exec /usr/bin/x86_64-w64-mingw32-dlltool --as=/usr/bin/x86_64-w64-mingw32-as "$@"
          SH
          chmod +x /tmp/kernix-wine-compiler/dlltool
          export PATH="/tmp/kernix-wine-compiler:$PATH"
          # Host Wine/Linux ELF remains Clang 19. PE ABI compilation is
          # switched to the independently packaged Windows MinGW-w64 GCC,
          # because both earlier Clang-generated PE builds failed to boot.
          export CC=clang-19 CXX=clang++-19
          export x86_64_CC=/usr/bin/x86_64-w64-mingw32-gcc
          export x86_64_CXX=/usr/bin/x86_64-w64-mingw32-g++
          export DLLTOOL=/tmp/kernix-wine-compiler/dlltool
          "$x86_64_CC" --version | head -n 1
          test -x "$x86_64_CC"
          test -x "$x86_64_CXX"
          command -v dlltool
          dlltool --version | head -n 1
          # Real PE/COFF import-library smoke test, before the expensive Wine build.
          mkdir -p /tmp/kernix-wine-toolchain-smoke
          printf 'LIBRARY kernix-smoke.dll\nEXPORTS\n  kernix_smoke\n' > /tmp/kernix-wine-toolchain-smoke/kernix.def
          dlltool --machine i386:x86-64 --input-def /tmp/kernix-wine-toolchain-smoke/kernix.def \
            --output-lib /tmp/kernix-wine-toolchain-smoke/libkernix-smoke.a
          test -s /tmp/kernix-wine-toolchain-smoke/libkernix-smoke.a
          /usr/bin/x86_64-w64-mingw32-objdump -f /tmp/kernix-wine-toolchain-smoke/libkernix-smoke.a \
            | grep -q 'file format pe-x86-64'
          clang --version | head -n 1
          clang -print-prog-name=ld.lld
          test "$(clang --version | head -n 1 | grep -c 'version 19')" -eq 1
          cd /tmp/kernix-wine-build
          /tmp/kernix-wine-src/configure --enable-win64 --disable-tests --with-x \
            --prefix=/opt/kernix-wine-linux-x64
          grep '^x86_64_CC *=' Makefile | tee /tmp/kernix-wine-cross-compiler.txt
          grep -q 'x86_64-w64-mingw32-gcc' /tmp/kernix-wine-cross-compiler.txt
          make -j 4
      - name: Verify actual Wine executable reports its own version
        run: |
          set -euo pipefail
          mkdir -p dist
          WINE_BIN="$(find /tmp/kernix-wine-build -maxdepth 3 -type f -name wine -perm /111 | head -n 1)"
          test -n "$WINE_BIN"
          file "$WINE_BIN" | tee dist/wine-binary-type.txt
          "$WINE_BIN" --version | tee dist/wine-version.txt
          grep -F 'wine-11.0' dist/wine-version.txt
          sha256sum "$WINE_BIN" | tee dist/wine-linux-x64.sha256
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data={'schema':'kernix.wine-upstream-linux-x64-baseline.v1',
            'repo':'wine-mirror/wine',
            'git_sha':os.environ['WINE_UPSTREAM_SHA'],
            'wine_version':Path('dist/wine-version.txt').read_text().strip(),
            'host':'ubuntu-24.04-linux-x86_64-glibc',
            'android_arm64_compatible':False,'fex_linux_arm64_smoke_tested':False,
            'wine_windows_game_tested':False,
            'full_runtime_packaged':False}
          Path('dist/wine-build-evidence.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Install full-X Wine build at original isolated compile prefix
        run: |
          set -euo pipefail
          export PATH="/tmp/kernix-wine-compiler:$PATH"
          export CC=clang-19 CXX=clang++-19 DLLTOOL=/tmp/kernix-wine-compiler/dlltool
          export x86_64_CC=/usr/bin/x86_64-w64-mingw32-gcc
          export x86_64_CXX=/usr/bin/x86_64-w64-mingw32-g++
          sudo make -C /tmp/kernix-wine-build -j 4 install
          test -x /opt/kernix-wine-linux-x64/bin/wine
          cp /tmp/kernix-wine-cross-compiler.txt dist/wine11-pe-compiler-evidence.txt
          find /opt/kernix-wine-linux-x64/lib/wine -type f \
            \( -name 'kernel32.dll' -o -name 'kernelbase.dll' -o -name 'cmd.exe' -o -name 'wininet.dll' \) \
            | tee dist/wine-full-x-core-windows-dlls.txt
          test "$(grep -c '/kernel32.dll$' dist/wine-full-x-core-windows-dlls.txt)" -eq 1
          file /opt/kernix-wine-linux-x64/bin/wine | tee dist/wine-full-x-native-elf-file.txt
      - name: Compile a tiny independently checkable Windows PE console program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/kernix-minimal-win32-smoke.c <<'C'
          #include <windows.h>
          int main(void) {
              static const char message[] = "KERNIX_TINY_WINDOWS_PE_ACTUALLY_EXECUTED\n";
              DWORD written = 0;
              HANDLE out = GetStdHandle(STD_OUTPUT_HANDLE);
              if (out == NULL || out == INVALID_HANDLE_VALUE) return 21;
              if (!WriteFile(out, message, sizeof(message) - 1, &written, NULL)) return 22;
              return written == sizeof(message) - 1 ? 0 : 23;
          }
          C
          /usr/bin/x86_64-w64-mingw32-gcc -Os \
            -o dist/kernix-minimal-win32-smoke.exe dist/kernix-minimal-win32-smoke.c
          file dist/kernix-minimal-win32-smoke.exe | tee dist/kernix-tiny-pe-file-type.txt
          grep -F 'PE32+ executable' dist/kernix-tiny-pe-file-type.txt
          sha256sum dist/kernix-minimal-win32-smoke.exe > dist/kernix-tiny-pe.sha256
      - name: Diagnose native Wine startup process states, tiny Windows PE and cmd.exe
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p dist
          export WINEARCH=win64
          export WINEDEBUG=+err,+warn
          export KERNIX_PROBE_EXE="$PWD/dist/kernix-minimal-win32-smoke.exe"
          export KERNIX_EVIDENCE_DIR="$PWD/dist"
          xvfb-run -a python3 - <<'PY'
          import json,os,signal,subprocess,time
          from pathlib import Path
          out=Path(os.environ['KERNIX_EVIDENCE_DIR'])
          wine='/opt/kernix-wine-linux-x64/bin/wine'
          def probe(label, command, prefix, seconds=42):
              env=os.environ.copy()
              env['WINEPREFIX']=str(Path.home()/prefix)
              log=out/(label+'.log')
              snaps=[]
              with log.open('wb') as output:
                  process=subprocess.Popen(command,env=env,stdout=output,stderr=subprocess.STDOUT,
                                           start_new_session=True)
                  launched=time.monotonic()
                  deadline=launched+seconds
                  timed_out=False
                  while process.poll() is None:
                      left=deadline-time.monotonic()
                      if left<=0:
                          timed_out=True
                          break
                      try:
                          process.wait(timeout=min(8,max(0.1,left)))
                      except subprocess.TimeoutExpired:
                          snapshot=subprocess.run(
                              ['ps','-eo','pid,ppid,stat,wchan:28,etime,args'],
                              capture_output=True,text=True,timeout=10).stdout
                          filtered=[line for line in snapshot.splitlines()
                                    if any(term in line for term in (
                                      'wineserver','wineboot','services.exe','plugplay.exe',
                                      'winedevice.exe','svchost.exe','cmd.exe','wine-preloader',
                                      'kernix-minimal-win32-smoke','/bin/wine ','Xvfb'))]
                          snaps.append({'elapsed_seconds':round(time.monotonic()-launched,1),
                                        'active_processes':filtered[:60]})
                  if timed_out:
                      try: os.killpg(process.pid,signal.SIGTERM)
                      except ProcessLookupError: pass
                      try: process.wait(timeout=4)
                      except subprocess.TimeoutExpired:
                          try: os.killpg(process.pid,signal.SIGKILL)
                          except ProcessLookupError: pass
                          process.wait(timeout=4)
                      rc=124
                  else:
                      rc=process.returncode
              (out/(label+'-process-snapshots.json')).write_text(json.dumps(snaps,indent=2)+'\n')
              output_text=log.read_text(errors='replace')
              result={'exit_code':rc,'timed_out':timed_out,'elapsed_seconds':round(time.monotonic()-launched,1),
                      'process_snapshots':len(snaps),
                      'kernel32_loader_failed':'could not load kernel32.dll' in output_text,
                      'wineboot_wininet_failed':'wininet.dll" failed to initialize' in output_text}
              print(label,json.dumps(result),flush=True)
              return result,output_text
          # Compare cold init, minimal PE (separate brand-new profile) and
          # cmd.exe after init; each receives its own bounded log and snapshots.
          boot,boot_log=probe('wineboot',[wine,'wineboot','-u'],
                              '.kernix-min-gcc-diagnostics-boot',42)
          tiny,tiny_log=probe('tiny-pe',[wine,os.environ['KERNIX_PROBE_EXE']],
                              '.kernix-min-gcc-diagnostics-tiny-pe',42)
          cmd,cmd_log=probe('cmd-pe',[wine,'cmd','/c','echo','KERNIX_MINGW_GCC_BUILT_WINE_PE_CMD_EXE_PASS'],
                             '.kernix-min-gcc-diagnostics-boot',42)
          tiny['windows_pe_executed']=tiny['exit_code']==0 and 'KERNIX_TINY_WINDOWS_PE_ACTUALLY_EXECUTED' in tiny_log
          cmd['windows_cmd_executed']=cmd['exit_code']==0 and 'KERNIX_MINGW_GCC_BUILT_WINE_PE_CMD_EXE_PASS' in cmd_log
          data={'schema':'kernix.wine11-mingw-gcc-native-x64-pe-boot-gate.v3',
                'source':'wine-mirror/wine','commit':os.environ['WINE_UPSTREAM_SHA'],
                'wine_pe_cross_compiler':'x86_64-w64-mingw32-gcc',
                'fex_involved':False,'android_bionic_compatible':False,'game_tested':False,
                'tests':{'wineboot':boot,'minimal_windows_pe':tiny,'windows_cmd':cmd},
                'windows_cmd_executed':cmd['windows_cmd_executed']}
          (out/'wine11-mingw-gcc-native-pe-evidence.json').write_text(json.dumps(data,indent=2)+'\n')
          print('KERNIX_WINDOWS_PE_DIAGNOSTIC_V3',json.dumps(data),flush=True)
          PY
          test -f dist/wine11-mingw-gcc-native-pe-evidence.json
      - name: Publish real Win32 boot proof or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KERNIX-Wine11-MinGW-GCC-native-PE-boot-evidence-NOT-Android
          path: dist/
          if-no-files-found: warn
          retention-days: 30
      - name: Require real MinGW GCC PE Windows cmd.exe execution
        if: always()
        run: |
          set -euo pipefail
          test -f dist/wine11-mingw-gcc-native-pe-evidence.json
          python3 - <<'PY'
          import json
          result=json.load(open('dist/wine11-mingw-gcc-native-pe-evidence.json'))
          assert result['windows_cmd_executed'] is True
          assert result['tests']['minimal_windows_pe']['windows_pe_executed'] is True
          assert result['fex_involved'] is False
          assert result['android_bionic_compatible'] is False
          print('KERNIX_WINE_11_MINGW_GCC_PE_CMD_EXE_EXECUTION_PASS')
          PY
