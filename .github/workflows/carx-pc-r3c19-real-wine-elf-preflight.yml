name: CarX R3C19 Real Wine ELF64 Dynamic Linker Preflight and Adversarial Tests
on:
  push:
    branches: [carx-pc-runtime-r3c19-wine-elf-preflight]
    paths:
      - 'carxpc/r3c19/**'
      - '.github/workflows/carx-pc-r3c19-real-wine-elf-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-guest-linker-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact previous source-verified guest rootfs
        uses: actions/download-artifact@v4
        with:
          name: CarX-R3C16-Ubuntu-Wine64-x64-Guest-Kernel32-Positive-Control
          repository: RM11Cor/RM11-WinCore
          run-id: 43598239873
          github-token: ${{ github.token }}
          path: /tmp/carx-r3c19-input
      - name: Validate original source archive SHA and ensure no substitution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/carx-r3c19-input')
          d=json.loads((p/'guest-provenance.json').read_text())
          with (p/'kernix-ubuntu-noble-wine-linux-x64-rootfs.tar.gz').open('rb') as f:
              h=hashlib.file_digest(f,'sha256').hexdigest()
          assert h==d['tar_sha256']=='86fafa2f5072aa2c47b7025ca591d945007584ecda37ae92eee208a95283f4b0'
          print('CARX_R3C19_GUEST_WINE_SOURCE_ARCHIVE_HASH_VERIFIED',h)
          PY
      - name: Compile Java ABI-compatible Android read-only Wine ELF/PE parser
        run: |
          set -euo pipefail
          mkdir -p /tmp/carx-r3c19-classes /tmp/carx-r3c19-private-files
          javac -encoding UTF-8 -d /tmp/carx-r3c19-classes \
            carxpc/r3c18/android/GuestRootfsInstaller.java \
            carxpc/r3c19/android/WineGuestElfPreflight.java \
            carxpc/r3c19/tests/WineGuestElfPreflightIntegrationTest.java
          echo CARX_R3C19_READONLY_WINE_GUEST_ELF_AND_KERNEL32_PARSER_JAVA_COMPILED
      - name: Execute read-only ELF parser on actual 1.26GB Wine unpacked content and five malicious changes
        run: |
          set -euo pipefail
          timeout 420s java -Xmx1024m -cp /tmp/carx-r3c19-classes \
            com.r4.carxpc.WineGuestElfPreflightIntegrationTest \
            /tmp/carx-r3c19-input/kernix-ubuntu-noble-wine-linux-x64-rootfs.tar.gz \
            /tmp/carx-r3c19-private-files | tee r3c19-source-evidence.log
          grep -Fq 'CARX_R3C19_REAL_WINE64_ELF64_AMD64_INTERP_AND_DT_NEEDED_AUDIT_PASS' r3c19-source-evidence.log
          grep -Fq 'CARX_R3C19_FIVE_REAL_BINARY_CORRUPTION_NEGATIVES_REJECTED' r3c19-source-evidence.log
          grep -Fq 'NO_ANDROID_WINE_EXECUTION_CLAIM' r3c19-source-evidence.log
      - name: Verify no native guest execution claimed or Android TLS modified in read-only preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('carxpc/r3c19/android/WineGuestElfPreflight.java').read_text()
          for key in ['PT_INTERP','PT_DYNAMIC','PT_LOAD','DT_NEEDED','GUEST_SYMLINK_ESCAPED_ROOTFS',
                    'NOT_GUEST_AMD64_ELF_EXEC_OR_PIE','KERNEL32_NOT_AMD64_PE32PLUS_DLL',
                    'guestLinuxX64Executed=false','androidWineExecuted=false',
                    'win64PeAndroidExecuted=false','carxGameBootProven=false',
                    'vulkanTrianglePresented=false']:
              assert key in s,key
          for bad in ['Runtime.getRuntime().exec','ProcessBuilder','System.loadLibrary','native void']:
              assert bad not in s,bad
          print('CARX_R3C19_ELF_READONLY_SOURCE_NO_SPOOFED_ANDROID_WINE_EXECUTION_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CarX-R3C19-OriginalWineELF-ReadOnlyGuestLinker-Source-Audit-NOT-Android
          path: r3c19-source-evidence.log
          retention-days: 14
