name: Build CarX PC Runtime R1 Inspector APK
on:
  push:
    branches:
      - carx-pc-runtime-r1
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout separate runtime branch
        uses: actions/checkout@v4
      - name: Restore verified application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/carxpc-r1
          cat carxpc/r1.part{1,2,3}.b64 | base64 --decode > /tmp/carxpc-r1.tar.xz
          echo "cf820c3abc3bc61c9ff2b0209f65e2a39d58b52ebddb25f49f1ea92883eb6190  /tmp/carxpc-r1.tar.xz" | sha256sum -c -
          tar -xJf /tmp/carxpc-r1.tar.xz -C /tmp/carxpc-r1
          test -s /tmp/carxpc-r1/app/src/main/java/com/r4/carxpc/MainActivity.java
          test -s /tmp/carxpc-r1/app/src/main/java/com/r4/carxpc/GameInspector.java
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify PE parser on ten synthetic cases
        working-directory: /tmp/carxpc-r1
        run: |
          mkdir -p /tmp/r1host
          javac -d /tmp/r1host app/src/main/java/com/r4/carxpc/PEParser.java tests/PEParserHostTest.java
          java -cp /tmp/r1host PEParserHostTest
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug APK
        working-directory: /tmp/carxpc-r1
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK ZIP and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/carxpc-r1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload signed R1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarX-PC-Runtime-R1-Inspector-APK
          path: /tmp/carxpc-r1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
