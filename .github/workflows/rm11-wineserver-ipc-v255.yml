# Upload this ONE file via GitHub > RM11-WinCore > .github/workflows/.
# Builds v2.5.5 from committed v2.5.4 sources. Restores exactly the signed v2.5.4
# Wine/FEX payload, repairs the premature WineServer exit gate, and publishes an APK.
# This does not invent a child re-exec shim or guarantee game compatibility.
name: RM11 v2.5.5 - WineServer IPC Bring-up Signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rm11-wineserver-ipc-v255.yml'
  workflow_dispatch:

permissions:
  contents: write # Needed to publish a prerelease APK directly, not to edit source.
  actions: read   # Needed to restore the previously built artifact.

concurrency:
  group: rm11-v255-ipc-build
  cancel-in-progress: false

jobs:
  build-signed-apk:
    if: github.repository == 'RM11Cor/RM11-WinCore'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout committed v2.5.4 source for v2.5.5 integration
        uses: actions/checkout@v4

      - name: Confirm exact app identity and integration source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.rm11.autocore'" app/build.gradle
          grep -Fq 'versionCode 29' app/build.gradle
          grep -Fq "versionName '2.5.4-runtime-integration'" app/build.gradle
          test -s app/src/main/java/com/rm11/autocore/integration/RuntimeCatalog.java
          test -s app/src/main/java/com/rm11/autocore/integration/RuntimeIntegrationAudit.java
          test -s app/src/main/java/com/rm11/autocore/integration/WineDriveMapper.java
          test -s app/src/main/java/com/rm11/autocore/integration/Elf64Inspection.java
          test -s app/src/test/java/com/rm11/autocore/integration/IntegrationContractTest.java
          grep -Fq 'runtimeIntegrationAuditButton' app/src/main/java/com/rm11/autocore/MainActivity.java
          echo 'PASS: v2.5.4 source and app identity'

      - name: Download the previous signed Wine/FEX APK (v2.5.4)
        uses: actions/download-artifact@v4
        with:
          name: RM11-v2.5.4-Runtime-Integration-SIGNED-APK
          run-id: 39826538633
          repository: RM11Cor/RM11-WinCore
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-signed-apk

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and native toolchain
        uses: android-actions/setup-android@v4

      - name: Install Android 36, NDK, CMake, and GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools unzip

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify original APK signature and restore the pinned runtime payload
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_APK="$(find previous-signed-apk -type f -name '*.apk' -print -quit)"
          test -n "$PREVIOUS_APK"
          test -s "$PREVIOUS_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-certs.txt"
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/previous-certs.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PREVIOUS_APK" | grep -Fq "versionCode='29' versionName='2.5.4-runtime-integration'"
          python3 - "$PREVIOUS_APK" <<'PYRESTORE'
          import hashlib
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          source = Path(sys.argv[1])
          expected = {
              'assets/runtime/rm11-wine-stack.zip': 1000,
              'assets/runtime/rm11-prefix-prepared.zip': 1000,
              'assets/rm11-win32-smoke-v2420.exe': 1000,
              'lib/arm64-v8a/libwineprobe.so': 1000,
              'lib/arm64-v8a/libwine_ntdll.so': 1000,
              'lib/arm64-v8a/libwineserverrm11.so': 1000,
          }
          with ZipFile(source) as apk:
              for name, minimum in expected.items():
                  assert apk.getinfo(name).file_size > minimum, name
                  if name.startswith('assets/'):
                      destination = Path('app/src/main/assets') / name.removeprefix('assets/')
                  else:
                      destination = Path('app/src/main/jniLibs') / name.removeprefix('lib/')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(apk.read(name))
                  print('Restored', name, destination.stat().st_size, 'bytes')
          smoke = Path('app/src/main/assets/rm11-win32-smoke-v2420.exe')
          assert hashlib.sha256(smoke.read_bytes()).hexdigest() == '3bbe50165aa735bc54b5e647861cf192ed603468fea89024f563de9be6547fe9', 'Incorrect smoke EXE'
          with ZipFile('app/src/main/assets/runtime/rm11-prefix-prepared.zip') as prefix:
              assert prefix.testzip() is None, 'Corrupt Windows prefix archive'
              assert {'system.reg', 'user.reg', '_rm11_symlinks.tsv'} <= set(prefix.namelist())
          print('PASS: source runtime and prefix restored from signed v2.5.4')
          PYRESTORE

      - name: Implement v2.5.5 WineServer/client IPC bring-up (source patch)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH_V255'
          from pathlib import Path
          app = Path('app/build.gradle')
          build = app.read_text(encoding='utf-8')
          assert build.count('versionCode 29') == 1, 'Expected current v2.5.4 source only'
          assert build.count("versionName '2.5.4-runtime-integration'") == 1
          app.write_text(build.replace('versionCode 29','versionCode 30',1).replace("versionName '2.5.4-runtime-integration'", "versionName '2.5.5-ipc-bringup'",1), encoding='utf-8')

          check = Path('scripts-check.py')
          source = check.read_text(encoding='utf-8')
          assert source.count("'versionCode 29'") == 1
          assert source.count("versionName '2.5.4-runtime-integration'") == 1
          check.write_text(source.replace("'versionCode 29'","'versionCode 30'",1).replace("versionName '2.5.4-runtime-integration'", "versionName '2.5.5-ipc-bringup'",1), encoding='utf-8')

          runner = Path('app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV253.java')
          code = runner.read_text(encoding='utf-8')
          start = code.index('            // A bounded startup grace period; never infer IPC success just from isAlive().')
          finish = code.index('            boolean completed = wine.process.waitFor(40, TimeUnit.SECONDS);', start)
          old = code[start:finish]
          assert 'SERVER_EARLY_EXIT' in old
          assert 'wine = new Running(processBuilder(plan.wineCommand, plan)' in old
          # Launch Wine client while WineServer is starting. Its IPC must be
          # proven by the Win32 marker, not by waiting for a server that has no client.
          nl = chr(10)
          bs = chr(92)
          replacement = (
              '            result.append("Starting verified Wine client immediately for IPC handshake...' + bs + 'n");' + nl
              + '            wine = new Running(processBuilder(plan.wineCommand, plan), "rm11-55-wine");' + nl
          )
          code = code[:start] + replacement + code[finish:]
          assert 'SERVER_EARLY_EXIT' not in code, 'Old fail-fast must be absent'
          assert code.count('wine = new Running(processBuilder(plan.wineCommand, plan)') == 1
          code = code.replace('RM11 v2.5.3 - committed-prefix IPC and Win32 execution', 'RM11 v2.5.5 - WineServer + Wine client IPC bring-up', 1)
          code = code.replace('Native child re-exec shim: NOT INTEGRATED', 'Native child re-exec shim: NOT INTEGRATED (diagnostic only)', 1)
          code = code.replace('"rm11-53-wineserver"','"rm11-55-wineserver"', 1)
          old_note = '"' + chr(92) + 'nFEX/child re-exec, display, games: NOT VERIFIED unless separately demonstrated."'
          new_note = ('"' + chr(92) + 'nServer at client exit: " + (server.process.isAlive() ? "ALIVE" : ("EXIT=" + server.process.exitValue())) + "'
                     + chr(92) + 'nFEX/child re-exec, display, games: NOT VERIFIED unless separately demonstrated."')
          assert code.count(old_note) == 1
          code = code.replace(old_note, new_note, 1)
          # Distinct source class avoids replacing v2.5.3 implementation in history.
          code = code.replace('UnifiedWineRunnerV253', 'UnifiedWineRunnerV255')
          newer = Path('app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV255.java')
          assert not newer.exists(), 'Refusing to overwrite a future v2.5.5 source'
          newer.write_text(code, encoding='utf-8')
          assert 'exit == 42 && marker' in code, 'Must require real Win32 stdout and exit marker'
          assert 'WINE_TIMEOUT' in code and 'ensureVerifiedSmoke(ctx, exe)' in code
          print('PASS: client no longer suppressed by premature server-exit gate')

          activity = Path('app/src/main/java/com/rm11/autocore/MainActivity.java')
          ui = activity.read_text(encoding='utf-8')
          assert ui.count('RM11 v2.5.3: تشغيل WineServer وWindows EXE بالـPrefix الجديد') == 1
          ui = ui.replace('RM11 v2.5.3: تشغيل WineServer وWindows EXE بالـPrefix الجديد',
            'RM11 v2.5.5: اختبار اتصال WineServer وWine وإثبات تنفيذ EXE',1)
          old_runner = 'String report = UnifiedWineRunnerV253.run(this);'
          assert ui.count(old_runner) == 1
          ui = ui.replace(old_runner, 'String report = UnifiedWineRunnerV255.run(this);',1)
          activity.write_text(ui,encoding='utf-8')
          PYPATCH_V255

      - name: Compile Vulkan shaders and validate source layout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compile_shaders.py
          python3 scripts-check.py

      - name: Run Android unit tests including runtime integration
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Restore permanent signing identity and build release APK
        shell: bash
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RM11_RELEASE_KEYSTORE_B64:-}"
          test -n "${RM11_RELEASE_PASSWORD:-}"
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rm11-autocore-release.p12"
          chmod 600 "$RUNNER_TEMP/rm11-autocore-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/rm11-autocore-release.p12" -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" -alias rm11-autocore > /dev/null
          export RM11_RELEASE_KEYSTORE="$RUNNER_TEMP/rm11-autocore-release.p12"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed v2.5.5 APK and preserved Wine/FEX assets
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new-certs.txt"
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/new-certs.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='com.rm11.autocore' versionCode='30' versionName='2.5.5-ipc-bringup'"
          python3 - <<'PYVERIFY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          required = {
              'assets/runtime/rm11-wine-stack.zip': Path('app/src/main/assets/runtime/rm11-wine-stack.zip'),
              'assets/runtime/rm11-prefix-prepared.zip': Path('app/src/main/assets/runtime/rm11-prefix-prepared.zip'),
              'assets/rm11-win32-smoke-v2420.exe': Path('app/src/main/assets/rm11-win32-smoke-v2420.exe'),
              'lib/arm64-v8a/libwineprobe.so': Path('app/src/main/jniLibs/arm64-v8a/libwineprobe.so'),
              'lib/arm64-v8a/libwine_ntdll.so': Path('app/src/main/jniLibs/arm64-v8a/libwine_ntdll.so'),
              'lib/arm64-v8a/libwineserverrm11.so': Path('app/src/main/jniLibs/arm64-v8a/libwineserverrm11.so'),
          }
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.getinfo('classes.dex').file_size > 1000
              for entry, source in required.items():
                  assert hashlib.sha256(apk.read(entry)).digest() == hashlib.sha256(source.read_bytes()).digest(), entry
          print('PASS: APK v2.5.5, original certificate, identical runtime payload. Game execution is NOT verified.')
          PYVERIFY

      - name: Publish the signed APK as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM11-v2.5.5-WineServer-IPC-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Commit verified v2.5.5 source to main (no APKs or secrets)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/build.gradle scripts-check.py \
            app/src/main/java/com/rm11/autocore/MainActivity.java \
            app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV255.java
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: v2.5.5 WineServer/client IPC bring-up with Win32 proof gate'
            git push origin HEAD:main
          fi

      - name: Publish direct APK download as a prerelease
        # Release publishing is additional: the Actions artifact above is the fallback.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v2.5.5-ipc-bringup'
          SOURCE='app/build/outputs/apk/release/app-release.apk'
          ASSET="$SOURCE#RM11-WinCore-v2.5.5.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title 'RM11-WinCore v2.5.5 (WineServer IPC Bring-up)' \
              --notes 'Signed diagnostic Android ARM64 APK. Removes artificial 2.2s WineServer gate so a verified Wine client can attempt IPC. Native child re-exec and game compatibility are not proven.' \
              --prerelease
          fi
          gh release view "$TAG" --json url --jq '.url'
