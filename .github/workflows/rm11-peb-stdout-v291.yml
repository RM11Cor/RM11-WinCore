name: RM11 v2.9.1 - Clean Stdout Wine PEB Probe

on:
  push:
    branches: [rm11-v291-peb-stdout-capture]
    paths:
      - ".github/workflows/rm11-peb-stdout-v291.yml"
      - "tools/rm11_peb_identity_stdout_v291.c"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readonly-win64-identity-probe:
    if: github.repository == 'RM11Cor/RM11-WinCore'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Enable installed 64-bit MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile CRT-free 64-bit PEB diagnostic EXE
        run: |
          New-Item -ItemType Directory -Path external-test -Force | Out-Null
          cl.exe /nologo /O1 /W4 /WX /GS- /TC tools/rm11_peb_identity_stdout_v291.c /Fe:external-test/rm11-peb-stdout-v291.exe /link /NODEFAULTLIB /ENTRY:mainCRTStartup /SUBSYSTEM:CONSOLE kernel32.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 PEB diagnostic failed to compile' }
          @'
          import struct,hashlib
          from pathlib import Path
          p=Path('external-test/rm11-peb-stdout-v291.exe')
          x=p.read_bytes()
          assert 1024<len(x)<16*1024*1024,len(x)
          assert x[:2]==b'MZ'
          pe=struct.unpack_from('<I',x,0x3c)[0]
          assert x[pe:pe+4]==b'PE\0\0'
          assert struct.unpack_from('<H',x,pe+4)[0]==0x8664
          assert struct.unpack_from('<H',x,pe+24)[0]==0x20b
          assert struct.unpack_from('<H',x,pe+24+0x44)[0]==3
          assert b'OutputDebugStringA' not in x, "No OutputDebugStringA in PE imports or contents"
          for m in (b'RM11_V291_STDOUT_ONLY_NO_DEBUG_SEH_EXCEPTION',
                    b'RM11_V291_PEB_IDENTITY_MATCH',
                    b'RM11_V291_PEB_IDENTITY_MISMATCH',
                    b'RM11_V291_WINEDATADIR_WINDOWS_ENV_PRESENT',
                    b'RM11_V291_WINEDATADIR_WINDOWS_ENV_ABSENT',
                    b'RM11_V291_NTQUERY_GDI_TABLE_AFTER',
                    b'RM11_V291_NTUSER_INIT_EXPORT_RESOLVED',
                    b'RM11_V291_READONLY_GDI_PEB_CHECK_COMPLETE'):
            assert m in x,m
          print('RM11_V291_WIN64_PE32_PLUS_PEB_DIAGNOSTIC_VERIFIED')
          print('SHA256',hashlib.sha256(x).hexdigest())
          print('FILE_BYTES',len(x))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'PE64 validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RM11-v291-Clean-Stdout-PEB-Diagnostic
          path: external-test/rm11-peb-stdout-v291.exe
          if-no-files-found: error
      - name: Publish standalone probe EXE (no Android APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v2.9.1-peb-stdout-test'
          $asset='external-test/rm11-peb-stdout-v291.exe'
          gh release view $tag --repo RM11Cor/RM11-WinCore 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo RM11Cor/RM11-WinCore --clobber
          } else {
            gh release create $tag $asset --repo RM11Cor/RM11-WinCore --target $env:GITHUB_SHA --title 'RM11 PEB compare Win64 EXE with clean stdout (no debug exception storm)' --notes 'Corrects truncated diagnostics in v2.9.0 by using WriteFile(STD_OUTPUT_HANDLE) only, never OutputDebugStringA (which generates megabytes of +seh trace). Standalone PE64 x64 read-only diagnostic for installed RM11 v2.8.5 APK. Compares x86-64 GS TEB PEB with NtQueryInformationProcess Wine PEB, tests GDI table pointer, WINEDATADIR propagation and USER32/Win32u loading. Does not call private initialization API or GDI, does not modify registry, Wine binaries, game files or Android data. Does not show a window. Select it from existing embedded X11 test and export one new diagnostics ZIP.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
