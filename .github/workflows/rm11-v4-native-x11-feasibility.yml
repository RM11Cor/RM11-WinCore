name: RM11 v4 - Native X11 Source Build Gate (no APK release)

on:
  workflow_dispatch:
  push:
    branches:
      - rm11-v4-native-x11-backend
    paths:
      - '.github/workflows/rm11-v4-native-x11-feasibility.yml'
      - 'tools/v4_verify_xlorie.py'
      - 'tools/v4_verify_lorie_aar.py'
      - 'docs/V4_NATIVE_X11_BACKEND_MIGRATION.md'

permissions:
  contents: read

concurrency:
  group: rm11-v4-native-x11-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-audit-and-native-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_PIN: 7e5f5c5c9226e2cdab392b2efba91bc4bd86463e
      UPSTREAM_DIR: ${{ github.workspace }}/.build/v4/termux-x11
      REPORT_DIR: ${{ github.workspace }}/.build/v4/reports
    steps:
      - name: Checkout RM11 source (read-only; no release keys)
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y bison flex pkg-config ninja-build cmake git binutils python3

      - name: Clone exact GPLv3 Termux X11 source and pinned X.Org dependencies
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$UPSTREAM_DIR")" "$REPORT_DIR"
          git clone --no-checkout --filter=blob:none https://github.com/termux/termux-x11.git "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" fetch --depth 1 origin "$UPSTREAM_PIN"
          git -C "$UPSTREAM_DIR" checkout --detach "$UPSTREAM_PIN"
          git -C "$UPSTREAM_DIR" submodule sync --recursive
          git -C "$UPSTREAM_DIR" submodule update --init --recursive --jobs 4 --depth 1
          test "$(git -C "$UPSTREAM_DIR" rev-parse HEAD)" = "$UPSTREAM_PIN"
          echo "Pinned upstream revision: $UPSTREAM_PIN"

      - name: Reject missing X.Org RENDER or incomplete JNI source before build
        run: |
          set -euo pipefail
          python3 tools/v4_verify_xlorie.py --source "$UPSTREAM_DIR" --report "$REPORT_DIR/source-audit.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_DIR'])/'source-audit.json').read_text())
          assert report['xorg_render_link_target_in_source'] is True
          assert report['jni_surface_and_cmd_bridge_in_source'] is True
          assert report['arm64_library_built'] is False
          assert report['wine_glyphs_visible'] is False
          PY

      - name: Compile upstream NDK X.Org server for ARM64 (proof of build only)
        working-directory: ${{ github.workspace }}/.build/v4/termux-x11
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :lorie:assembleDebug --no-daemon --max-workers=4 \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Verify native libXlorie.so ARM64 ELF and Android dependency closure
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find "$UPSTREAM_DIR/lorie/build" -type f -path '*/arm64-v8a/libXlorie.so' | sort)
          if [ "${#candidates[@]}" -lt 1 ]; then
            echo "::error::Pinned upstream native ARM64 Xlorie library missing"
            exit 1
          fi
          elf="${candidates[${#candidates[@]}-1]}"
          file "$elf"
          readelf -h "$elf" | grep -F 'AArch64'
          python3 tools/v4_verify_xlorie.py --source "$UPSTREAM_DIR" \
            --elf "$elf" --report "$REPORT_DIR/native-arm64-audit.json"
          echo 'Native ARM64 build is proven, actual Wine GUI rendering remains untested.'

      - name: Verify complete Lorie Android AAR (surface / JNI / ARM64 source build)
        run: |
          set -euo pipefail
          aar="$UPSTREAM_DIR/lorie/build/outputs/aar/lorie-debug.aar"
          python3 tools/v4_verify_lorie_aar.py --aar "$aar" \
            --report "$REPORT_DIR/android-aar-audit.json"
          cp "$UPSTREAM_DIR/LICENSE" "$REPORT_DIR/UPSTREAM-GPL3-LICENSE.txt"
          {
            echo "Upstream GPLv3 source: https://github.com/termux/termux-x11"
            echo "Exact upstream commit: $UPSTREAM_PIN"
            echo "Reproducible build command: ./gradlew :lorie:assembleDebug -Pandroid.injected.build.abi=arm64-v8a"
            echo "Submodule revisions:"
            git -C "$UPSTREAM_DIR" submodule status --recursive
            echo "This component was NOT merged into the RM11 app and is NOT verified to render Wine."
          } > "$REPORT_DIR/UPSTREAM-SOURCE-REVISIONS.txt"

      - name: Store native Android integration component (AAR, NOT an APK)
        uses: actions/upload-artifact@v4
        with:
          name: rm11-v4-xorg-arm64-android-library
          path: |
            .build/v4/termux-x11/lorie/build/outputs/aar/lorie-debug.aar
            .build/v4/reports/android-aar-audit.json
            .build/v4/reports/UPSTREAM-GPL3-LICENSE.txt
            .build/v4/reports/UPSTREAM-SOURCE-REVISIONS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish build feasibility report ONLY (not a user APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm11-v4-native-x11-feasibility
          path: .build/v4/reports/*.json
          if-no-files-found: warn
          retention-days: 14
