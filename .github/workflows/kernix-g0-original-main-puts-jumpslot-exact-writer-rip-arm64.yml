          break native-engine/android-host/tests/kernix_g0_original_fex_full_ptload_source_executable_range_arm64.cpp:5151
          commands
          silent
          printf "KERNIX_G0_PUTS_JUMP_SLOT_WATCH_ARMED_PRE_FEX target={target} source_initial=0x1030 bind_now=true\\n"
          x/gx {target}
          watch -location *(unsigned long long *){target}
          continue
          end
          run
          printf "KERNIX_G0_PUTS_JUMP_SLOT_NATIVE_HW_STOP_NOT_SYMBOL_VERSION_OR_GUEST_RIP_PROOF\\n"
          info registers pc x4 x13 x7 x10 x28
          x/16i $pc-48
          # Only source/runtime observation. Do not modify FEX or guest
          # state; all reads are from active native JIT after genuine
          # source puts GOT hardware data watchpoint.
          set $jit_h = *(unsigned long long *)$x28
          if $jit_h != 0
            set $jit_off = *(unsigned int *)$jit_h
            set $jit_t = $jit_h + $jit_off
            set $jit_len = *(unsigned long long *)$jit_t
            set $jit_guest = *(unsigned long long *)($jit_t + 8)
            set $jit_guest_len = *(unsigned long long *)($jit_t + 16)
            set $jit_rip_count = *(unsigned int *)($jit_t + 24)
            set $jit_rip_off = *(unsigned int *)($jit_t + 28)
            printf "KERNIX_G0_PUTS_JIT_SOURCE_HEADER_READONLY header=0x%lx offset=0x%x size=0x%lx guest_entry=0x%lx guest_size=0x%lx rip_entries=%u rip_entry_offset=0x%x host_writer=0x%lx\\n", $jit_h, $jit_off, $jit_len, $jit_guest, $jit_guest_len, $jit_rip_count, $jit_rip_off, $pc-4
            if $jit_guest_len > 0 && $jit_guest_len <= 24 && $jit_rip_count > 0 && $jit_rip_count <= 8
              printf "KERNIX_G0_PUTS_JIT_GUEST_SOURCE_BYTES_START\\n"
              x/24bx $jit_guest
              printf "KERNIX_G0_PUTS_JIT_GUEST_SOURCE_BYTES_END\\n"
              if $jit_rip_off < $jit_len - $jit_off
                printf "KERNIX_G0_PUTS_JIT_RIP_MAP_BYTES_START\\n"
                x/16bx $jit_t+$jit_rip_off
                printf "KERNIX_G0_PUTS_JIT_RIP_MAP_BYTES_END\\n"
              end
            end
          end
          printf "KERNIX_G0_PUTS_JUMP_SLOT_POSTWRITE_MEMORY_READONLY\\n"
          x/gx {target}
          bt 6
          quit
          """
          Path('dist/original-main-puts-jumpslot-watch.gdb').write_text(
              '\n'.join(x.strip() for x in gdb.splitlines())+'\n')
          print('KERNIX_G0_SOURCE_SHA256_ORIGINAL_PUTS_JUMP_SLOT_WATCH_TARGET_READY_RUNTIME_NOT_PROVEN',target)
          PY
      - name: Observe actual original puts JUMP_SLOT hardware write while original FEX executes on Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdb
          CORE="$(find /tmp/kernix-g2ec2-fex-native -type f -name libFEXCore.so | head -1)"
          export LD_LIBRARY_PATH="$(dirname "$CORE")"
          set +e
          timeout -k 5s 55s gdb -q -nx -batch \
            -x dist/original-main-puts-jumpslot-watch.gdb \
            --args "$PWD/dist/kernix-g0-original-main-relro-next-source-audit-linux-arm64" \
            "$PWD/dist/original-source-pinned-root" \
            >dist/original-main-puts-jumpslot-watch.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" >dist/original-main-puts-jumpslot-gdb-exit.txt
          tail -n 120 dist/original-main-puts-jumpslot-watch.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          source=json.loads(Path('dist/original-main-plt-jumpslot-source-inventory.json').read_text())
          raw=Path('dist/original-main-puts-jumpslot-watch.log').read_text(errors='replace')
          code=int(Path('dist/original-main-puts-jumpslot-gdb-exit.txt').read_text())
          target=source['source_JUMP_SLOT_guest_target']
          expected_old=int(source['source_file_backed_GOT_initial'],16)
          assert source['source_JUMP_SLOT_symbol']=='puts'
          assert source['source_bind_now_requested'] is True
          assert target=='0x800003fd0' and expected_old==0x1030
          def check(log,exit_code):
              armed=log.find('KERNIX_G0_PUTS_JUMP_SLOT_WATCH_ARMED_PRE_FEX '
                             'target='+target+' source_initial=0x1030 bind_now=true')
              hw=list(re.finditer(r'(?m)^Hardware watchpoint\s+\d+:',log))
              boundary=log.find(
                'KERNIX_G0_REAL_ORIGINAL_LIBC_SOURCE_GNU_RELRO_MPROTECT10_RW_TO_RO_FOUR_4K_PAGES_PASS')
              stopped=log.find(
                'KERNIX_G0_PUTS_JUMP_SLOT_NATIVE_HW_STOP_NOT_SYMBOL_VERSION_OR_GUEST_RIP_PROOF')
              after=log.find('KERNIX_G0_PUTS_JUMP_SLOT_POSTWRITE_MEMORY_READONLY')
              old=re.search(r'(?m)^Old value =\s*(0x[0-9a-fA-F]+|\d+)',log)
              new=re.search(r'(?m)^New value =\s*(0x[0-9a-fA-F]+|\d+)',log)
              pc=re.search(r'(?m)^pc\s+(0x[0-9a-fA-F]+)',log)
              mem=(re.search(r'(?m)^[ \t]*'+re.escape(target)+
                             r':\s*(0x[0-9a-fA-F]+)',log[after:])
                   if after>=0 else None)
              if (exit_code!=0 or armed<0 or len(hw)!=2 or boundary<0 or
                  stopped<0 or after<0 or not old or not new or not pc or not mem):
                  return None
              earlier=int(old.group(1),0)
              later=int(new.group(1),0)
              if (not(armed<hw[0].start()<boundary<hw[1].start()<
                      old.start()<new.start()<stopped<after)
                  or earlier!=expected_old or later==earlier or later==0 or
                  not(0x800000000<=later<0x900000000) or
                  int(mem.group(1),16)!=later):
                  return None
              return later
          observed=check(raw,code)
          if observed is not None:
              old=re.search(r'(?m)^Old value =\s*(0x[0-9a-fA-F]+|\d+)',raw)
              new=re.search(r'(?m)^New value =\s*(0x[0-9a-fA-F]+|\d+)',raw)
              negatives=[
                  raw.replace('Hardware watchpoint','Watchpoint'),
                  raw.replace('source_initial=0x1030','source_initial=0x1031'),
                  raw.replace('target='+target,'target=0x800003fd8'),
                  raw.replace('bind_now=true','bind_now=false'),
                  raw.replace('KERNIX_G0_REAL_ORIGINAL_LIBC_SOURCE_GNU_RELRO_MPROTECT10_RW_TO_RO_FOUR_4K_PAGES_PASS','FAKE_LIBC_RELRO'),
                  raw.replace('KERNIX_G0_PUTS_JUMP_SLOT_NATIVE_HW_STOP_NOT_SYMBOL_VERSION_OR_GUEST_RIP_PROOF','FAKE_STOP'),
                  raw.replace('KERNIX_G0_PUTS_JUMP_SLOT_POSTWRITE_MEMORY_READONLY','FAKE_READBACK'),
                  raw.replace(old.group(0),'Old value = 0x1031'),
                  raw.replace(new.group(0),'New value = 0x0'),
              ]
              assert all(check(forged,code) is None for forged in negatives),(
                 'Corrupt source/hardware puts JUMP_SLOT witness accepted')
              print('KERNIX_G0_AUTHENTIC_ORIGINAL_PUTS_JUMP_SLOT_REAL_HARDWARE_GOT_WRITE_PASS'
                    +' target='+target+' old='+hex(expected_old)+' new='+hex(observed))
              print('KERNIX_G0_ORIGINAL_PUTS_JUMP_SLOT_NINE_SPOOF_NEGATIVES_PASS')
          else:
              print('KERNIX_G0_ORIGINAL_PUTS_JUMP_SLOT_HARDWARE_WRITE_NOT_PROVEN')
          output=dict(source)
          output.update(
              original_puts_JUMP_SLOT_hardware_write_observed=observed is not None,
              original_puts_JUMP_SLOT_postwrite_value=hex(observed) if observed is not None else None,
              original_puts_versioned_libc_symbol_verified=False,
              exact_original_guest_writer_RIP_proven=False,
              all_original_main_relocations_proven=False,
              original_main_RELRO_sealed=False,
              Android_Bionic_or_phone_executed=False,
              Wine_Proton_or_gameplay_proven=False,
              gdb_exit_code=code)
          Path('dist/original-puts-jumpslot-hardware-writer-evidence.json').write_text(
              json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          if observed is None:
              raise SystemExit('Real original puts JUMP_SLOT data writer not proven; fail closed')
          PY
