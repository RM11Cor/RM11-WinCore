# Upload this ONE file via GitHub > RM11-WinCore > .github/workflows/.
# Builds v2.5.6 from committed v2.5.5 sources. Preserves signed v2.5.5 Wine/FEX
# assets and adds an APK-native read-only NLS data path redirect. Device proof required.
name: RM11 v2.5.6 - Wine NLS Path Redirect Signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rm11-wine-nls-v256.yml'
  workflow_dispatch:

permissions:
  contents: write # Needed to publish a prerelease APK directly, not to edit source.
  actions: read   # Needed to restore the previously built artifact.

concurrency:
  group: rm11-v256-nls-build
  cancel-in-progress: false

jobs:
  build-signed-apk:
    if: github.repository == 'RM11Cor/RM11-WinCore'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout committed v2.5.5 source for v2.5.6 integration
        uses: actions/checkout@v4

      - name: Confirm exact app identity and integration source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.rm11.autocore'" app/build.gradle
          grep -Fq 'versionCode 30' app/build.gradle
          grep -Fq "versionName '2.5.5-ipc-bringup'" app/build.gradle
          test -s app/src/main/java/com/rm11/autocore/integration/RuntimeCatalog.java
          test -s app/src/main/java/com/rm11/autocore/integration/RuntimeIntegrationAudit.java
          test -s app/src/main/java/com/rm11/autocore/integration/WineDriveMapper.java
          test -s app/src/main/java/com/rm11/autocore/integration/Elf64Inspection.java
          test -s app/src/test/java/com/rm11/autocore/integration/IntegrationContractTest.java
          grep -Fq 'runtimeIntegrationAuditButton' app/src/main/java/com/rm11/autocore/MainActivity.java
          echo 'PASS: v2.5.5 source and app identity'

      - name: Download the previous signed Wine/FEX APK (v2.5.5)
        uses: actions/download-artifact@v4
        with:
          name: RM11-v2.5.5-WineServer-IPC-SIGNED-APK
          run-id: 39829481061
          repository: RM11Cor/RM11-WinCore
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-signed-apk

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and native toolchain
        uses: android-actions/setup-android@v4

      - name: Install Android 36, NDK, CMake, and GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools unzip

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify original APK signature and restore the pinned runtime payload
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_APK="$(find previous-signed-apk -type f -name '*.apk' -print -quit)"
          test -n "$PREVIOUS_APK"
          test -s "$PREVIOUS_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-certs.txt"
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/previous-certs.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PREVIOUS_APK" | grep -Fq "versionCode='30' versionName='2.5.5-ipc-bringup'"
          python3 - "$PREVIOUS_APK" <<'PYRESTORE'
          import hashlib
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          source = Path(sys.argv[1])
          expected = {
              'assets/runtime/rm11-wine-stack.zip': 1000,
              'assets/runtime/rm11-prefix-prepared.zip': 1000,
              'assets/rm11-win32-smoke-v2420.exe': 1000,
              'lib/arm64-v8a/libwineprobe.so': 1000,
              'lib/arm64-v8a/libwine_ntdll.so': 1000,
              'lib/arm64-v8a/libwineserverrm11.so': 1000,
          }
          with ZipFile(source) as apk:
              for name, minimum in expected.items():
                  assert apk.getinfo(name).file_size > minimum, name
                  if name.startswith('assets/'):
                      destination = Path('app/src/main/assets') / name.removeprefix('assets/')
                  else:
                      destination = Path('app/src/main/jniLibs') / name.removeprefix('lib/')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(apk.read(name))
                  print('Restored', name, destination.stat().st_size, 'bytes')
          smoke = Path('app/src/main/assets/rm11-win32-smoke-v2420.exe')
          assert hashlib.sha256(smoke.read_bytes()).hexdigest() == '3bbe50165aa735bc54b5e647861cf192ed603468fea89024f563de9be6547fe9', 'Incorrect smoke EXE'
          with ZipFile('app/src/main/assets/runtime/rm11-prefix-prepared.zip') as prefix:
              assert prefix.testzip() is None, 'Corrupt Windows prefix archive'
              assert {'system.reg', 'user.reg', '_rm11_symlinks.tsv'} <= set(prefix.namelist())
          print('PASS: source runtime and prefix restored from signed v2.5.5')
          PYRESTORE

      - name: Patch v2.5.6 NLS data bridge source and version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp
          cat > app/src/main/cpp/wine_data_redirect.c <<'RM11_SHIM_C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <limits.h>
          #include <stdarg.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/syscall.h>
          #include <sys/types.h>
          #include <unistd.h>
          
          /* Read-only compatibility shim for Wine ntdll loaded from Android APK JNI libs.
           * Wine 11 derives its NLS data path from the ntdll ELF's own installation path.
           * This redirects only absolute Wine NLS reads to the already provisioned ImageFs.
           * No writes or arbitrary executable redirects are permitted.
           */
          static const char *adjust_nls_path(const char *source, char *out, size_t capacity) {
              static const char marker[] = "/share/wine/nls/";
              if (!source || source[0] != '/') return source;
              const char *part = strstr(source, marker);
              if (!part) return source;
              const char *filename = part + sizeof(marker) - 1;
              if (!*filename || strlen(filename) > 100 || strstr(filename, "..") || strchr(filename, '/')) return source;
              for (const char *p = filename; *p; ++p) {
                  char c = *p;
                  if (!((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') ||
                        (c >= '0' && c <= '9') || c == '_' || c == '-' || c == '.')) return source;
              }
              const char *datadir = getenv("RM11_WINE_DATADIR");
              if (!datadir || datadir[0] != '/' || strlen(datadir) >= PATH_MAX - 128) return source;
              size_t datalen = strlen(datadir);
              if (strncmp(source, datadir, datalen) == 0 && strcmp(source + datalen, part + sizeof("/share/wine") - 1) == 0)
                  return source;
              int length = snprintf(out, capacity, "%s/nls/%s", datadir, filename);
              if (length < 0 || (size_t)length >= capacity) return source;
              static int reported;
              if (__atomic_exchange_n(&reported, 1, __ATOMIC_RELAXED) == 0) {
                  static const char report[] = "RM11_NLS_REDIRECT_ACTIVE\n";
                  (void)write(STDERR_FILENO, report, sizeof(report) - 1);
              }
              return out;
          }
          
          static mode_t get_mode(int flags, va_list ap) {
              if (flags & O_CREAT) return (mode_t)va_arg(ap, int);
          #ifdef O_TMPFILE
              if ((flags & O_TMPFILE) == O_TMPFILE) return (mode_t)va_arg(ap, int);
          #endif
              return 0;
          }
          
          static int redirected_openat(int dirfd, const char *path, int flags, mode_t mode) {
              char alternative[PATH_MAX];
              const char *used = path;
              /* Redirect ONLY reads. Creation, truncation and all writes use original paths. */
              if (!(flags & (O_WRONLY | O_RDWR | O_CREAT | O_TRUNC)))
                  used = adjust_nls_path(path, alternative, sizeof alternative);
              return (int)syscall(SYS_openat, dirfd, used, flags, mode);
          }
          
          int open(const char *path, int flags, ...) {
              va_list ap; va_start(ap, flags);
              mode_t mode = get_mode(flags, ap); va_end(ap);
              return redirected_openat(AT_FDCWD, path, flags, mode);
          }
          int open64(const char *path, int flags, ...) {
              va_list ap; va_start(ap, flags);
              mode_t mode = get_mode(flags, ap); va_end(ap);
              return redirected_openat(AT_FDCWD, path, flags, mode);
          }
          int openat(int dirfd, const char *path, int flags, ...) {
              va_list ap; va_start(ap, flags);
              mode_t mode = get_mode(flags, ap); va_end(ap);
              return redirected_openat(dirfd, path, flags, mode);
          }
          int openat64(int dirfd, const char *path, int flags, ...) {
              va_list ap; va_start(ap, flags);
              mode_t mode = get_mode(flags, ap); va_end(ap);
              return redirected_openat(dirfd, path, flags, mode);
          }
          int __open_2(const char *path, int flags) {
              return redirected_openat(AT_FDCWD, path, flags, 0);
          }
          int __openat_2(int dirfd, const char *path, int flags) {
              return redirected_openat(dirfd, path, flags, 0);
          }
          RM11_SHIM_C
          python3 - <<'RM11_PATCH_PY'
          from pathlib import Path
          app = Path('app/build.gradle')
          build=app.read_text(encoding='utf-8')
          assert build.count('versionCode 30')==1
          assert build.count("versionName '2.5.5-ipc-bringup'")==1
          app.write_text(build.replace('versionCode 30','versionCode 31',1).replace("versionName '2.5.5-ipc-bringup'", "versionName '2.5.6-nls-redirect'",1),encoding='utf-8')
          
          checks=Path('scripts-check.py')
          s=checks.read_text(encoding='utf-8')
          assert s.count("'versionCode 30'")==1 and s.count("versionName '2.5.5-ipc-bringup'")==1
          s=s.replace("'versionCode 30'", "'versionCode 31'",1).replace("versionName '2.5.5-ipc-bringup'", "versionName '2.5.6-nls-redirect'",1)
          s += """
          # v2.5.6 NLS data shim shipped as a signed APK native library.
          for filename in ['app/src/main/cpp/wine_data_redirect.c', 'app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java']:
              if not Path(filename).is_file() or Path(filename).stat().st_size == 0:
                  raise SystemExit('Missing NLS relocation source: ' + filename)
          if 'add_library(rm11_wine_data_redirect' not in Path('app/src/main/cpp/CMakeLists.txt').read_text(encoding='utf-8'):
              raise SystemExit('NLS relocation CMake target is missing')
          print('RM11 v2.5.6: APK-native NLS redirect source present (on-device test required).')
          """
          checks.write_text(s,encoding='utf-8')
          
          cfile=Path('app/src/main/cpp/CMakeLists.txt')
          s=cfile.read_text(encoding='utf-8')
          assert 'rm11_wine_data_redirect' not in s
          s += """
          # Dedicated read-only NLS redirect for the APK-hosted native Wine ntdll.
          add_library(rm11_wine_data_redirect SHARED wine_data_redirect.c)
          target_compile_features(rm11_wine_data_redirect PRIVATE c_std_11)
          target_compile_options(rm11_wine_data_redirect PRIVATE -Wall -Wextra -Werror)
          """
          cfile.write_text(s,encoding='utf-8')
          
          bridge=Path('app/src/main/java/com/rm11/autocore/runtime/BionicLaunchEnvironment.java')
          s=bridge.read_text(encoding='utf-8')
          old='        env.put("WINE_DATADIR", p.wineShare.resolve("wine").toString());'
          assert s.count(old)==1 and 'RM11_WINE_DATADIR' not in s
          s=s.replace(old,old+'\n        // Wine\'s Unix ntdll derives NLS data from the actual APK .so path; the\n        // preloaded APK-native shim transparently redirects read-only NLS opens.\n        env.put("RM11_WINE_DATADIR", p.wineShare.resolve("wine").toString());\n        env.put("LD_PRELOAD", p.apkNativeLibs.resolve("librm11_wine_data_redirect.so").toString());',1)
          s=s.replace('        // Deliberately no WINELOADERNOEXEC / LD_PRELOAD / DISPLAY defaults.',
                      '        // Deliberately no WINELOADERNOEXEC / DISPLAY defaults.',1)
          bridge.write_text(s,encoding='utf-8')
          
          runner=Path('app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV255.java')
          s=runner.read_text(encoding='utf-8')
          assert 'RM11 v2.5.5 - WineServer + Wine client IPC bring-up' in s
          assert 'public final class UnifiedWineRunnerV255' in s
          assert 'exit == 42 && marker' in s
          s=s.replace('UnifiedWineRunnerV255','UnifiedWineRunnerV256')
          s=s.replace('RM11 v2.5.5 - WineServer + Wine client IPC bring-up','RM11 v2.5.6 - APK Wine NLS data redirect + IPC')
          needle='            WineExecutionPlan plan = WineExecutionPlan.forBundledSmokeExe(layout, exe);'
          assert s.count(needle)==1
          s=s.replace(needle,'            Path nlsFolder = layout.wineShare.resolve("wine/nls");\n            for (String name : new String[]{"locale.nls", "l_intl.nls"}) {\n                Path candidate = nlsFolder.resolve(name);\n                if (!Files.isRegularFile(candidate) || Files.size(candidate) < 1024)\n                    throw new IOException("Required NLS data is missing/too small: " + candidate);\n            }\n            Path redirect = layout.apkNativeLibs.resolve("librm11_wine_data_redirect.so");\n            if (!Files.isRegularFile(redirect))\n                throw new IOException("Signed APK native NLS redirection library missing: " + redirect);\n            WineExecutionPlan plan = WineExecutionPlan.forBundledSmokeExe(layout, exe);\n            if (!redirect.toString().equals(plan.environment.get("LD_PRELOAD")))\n                throw new IOException("Native NLS preload path mismatch");\n            result.append("NLS source: ").append(nlsFolder).append(" (locale.nls + l_intl.nls verified)\\n")\n                  .append("NLS preload: ").append(redirect).append("\\n");',1)
          needle='            boolean marker = wineLog.contains(MARKER);'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'\n            boolean nlsRedirect = wineLog.contains("RM11_NLS_REDIRECT_ACTIVE") || server.capture.text().contains("RM11_NLS_REDIRECT_ACTIVE");\n            result.append("Native NLS redirect observed: ").append(nlsRedirect ? "YES" : "NO").append("\\n");',1)
          newrunner=Path('app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java')
          assert not newrunner.exists()
          newrunner.write_text(s,encoding='utf-8')
          
          activity=Path('app/src/main/java/com/rm11/autocore/MainActivity.java')
          s=activity.read_text(encoding='utf-8')
          assert s.count('RM11 v2.5.5: اختبار اتصال WineServer وWine وإثبات تنفيذ EXE')==1
          assert s.count('String report = UnifiedWineRunnerV255.run(this);')==1
          s=s.replace('RM11 v2.5.5: اختبار اتصال WineServer وWine وإثبات تنفيذ EXE',
                      'RM11 v2.5.6: إصلاح مسار NLS وفحص اتصال WineServer',1)
          s=s.replace('String report = UnifiedWineRunnerV255.run(this);',
                      'String report = UnifiedWineRunnerV256.run(this);',1)
          activity.write_text(s,encoding='utf-8')
          print('PASS: source patched for NLS redirect and v2.5.6, without removing old Wine smoke logic')
          RM11_PATCH_PY
      - name: Verify Wine NLS preload interceptor on CI Linux host
        shell: bash
        run: |
          set -euo pipefail
          clang -fPIC -shared -Wall -Wextra -Werror -O2 app/src/main/cpp/wine_data_redirect.c -o /tmp/librm11_wine_data_redirect.so
          cat > /tmp/rm11-nls-check.c <<'CTEST'
          #include <fcntl.h>
          #include <string.h>
          #include <unistd.h>
          int main(void) {
            char buf[64] = {0};
            int fd = open("/data/app/RM11/lib/arm64/../../share/wine/nls/locale.nls", O_RDONLY);
            if (fd < 0) return 1;
            int n = read(fd, buf, sizeof(buf)); close(fd);
            return n > 0 && strstr(buf, "rm11-preload-test") != 0 ? 0 : 2;
          }
          CTEST
          clang -Wall -Wextra -Werror /tmp/rm11-nls-check.c -o /tmp/rm11-nls-check
          mkdir -p /tmp/rm11-nls-source/nls
          printf 'rm11-preload-test\n' > /tmp/rm11-nls-source/nls/locale.nls
          RM11_WINE_DATADIR=/tmp/rm11-nls-source LD_PRELOAD=/tmp/librm11_wine_data_redirect.so /tmp/rm11-nls-check
          echo 'PASS: host shared-library intercept verified (device IPC not proven)'
      - name: Compile Vulkan shaders and validate source layout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compile_shaders.py
          python3 scripts-check.py

      - name: Run Android unit tests including runtime integration
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Restore permanent signing identity and build release APK
        shell: bash
        env:
          RM11_RELEASE_KEYSTORE_B64: ${{ secrets.RM11_RELEASE_KEYSTORE_B64 }}
          RM11_RELEASE_PASSWORD: ${{ secrets.RM11_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RM11_RELEASE_KEYSTORE_B64:-}"
          test -n "${RM11_RELEASE_PASSWORD:-}"
          printf '%s' "$RM11_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rm11-autocore-release.p12"
          chmod 600 "$RUNNER_TEMP/rm11-autocore-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/rm11-autocore-release.p12" -storetype PKCS12 -storepass "$RM11_RELEASE_PASSWORD" -alias rm11-autocore > /dev/null
          export RM11_RELEASE_KEYSTORE="$RUNNER_TEMP/rm11-autocore-release.p12"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signed v2.5.6 APK and preserved Wine/FEX assets
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new-certs.txt"
          grep -Fq 'd398e7effe9302645e449fb02ecc42a409f7e7566274cbc37c4361e0482152f0' "$RUNNER_TEMP/new-certs.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='com.rm11.autocore' versionCode='31' versionName='2.5.6-nls-redirect'"
          python3 - <<'PYVERIFY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          required = {
              'assets/runtime/rm11-wine-stack.zip': Path('app/src/main/assets/runtime/rm11-wine-stack.zip'),
              'assets/runtime/rm11-prefix-prepared.zip': Path('app/src/main/assets/runtime/rm11-prefix-prepared.zip'),
              'assets/rm11-win32-smoke-v2420.exe': Path('app/src/main/assets/rm11-win32-smoke-v2420.exe'),
              'lib/arm64-v8a/libwineprobe.so': Path('app/src/main/jniLibs/arm64-v8a/libwineprobe.so'),
              'lib/arm64-v8a/libwine_ntdll.so': Path('app/src/main/jniLibs/arm64-v8a/libwine_ntdll.so'),
              'lib/arm64-v8a/libwineserverrm11.so': Path('app/src/main/jniLibs/arm64-v8a/libwineserverrm11.so'),
          }
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.getinfo('classes.dex').file_size > 1000
              assert apk.getinfo('lib/arm64-v8a/librm11_wine_data_redirect.so').file_size > 1000
              for entry, source in required.items():
                  assert hashlib.sha256(apk.read(entry)).digest() == hashlib.sha256(source.read_bytes()).digest(), entry
          print('PASS: APK v2.5.6, original certificate, unchanged pinned runtime. Device IPC NOT VERIFIED.')
          PYVERIFY

      - name: Publish the signed APK as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM11-v2.5.6-Wine-NLS-Redirect-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Commit verified v2.5.6 source to main (no APKs or secrets)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/build.gradle scripts-check.py \
            app/src/main/cpp/CMakeLists.txt app/src/main/cpp/wine_data_redirect.c \
            app/src/main/java/com/rm11/autocore/runtime/BionicLaunchEnvironment.java \
            app/src/main/java/com/rm11/autocore/MainActivity.java \
            app/src/main/java/com/rm11/autocore/UnifiedWineRunnerV256.java
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: v2.5.6 APK-native NLS data path redirect for Wine client'
            git push origin HEAD:main
          fi

      - name: Publish direct APK download as a prerelease
        # Release publishing is additional: the Actions artifact above is the fallback.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v2.5.6-nls-redirect'
          SOURCE='app/build/outputs/apk/release/app-release.apk'
          ASSET="$SOURCE#RM11-WinCore-v2.5.6.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title 'RM11-WinCore v2.5.6 (NLS Path Diagnostic)' \
              --notes 'Signed Android ARM64 diagnostic APK. Redirects Wine NLS reads from APK-native paths into the existing ImageFs Wine data directory. Neither IPC nor game execution is proven until tested on device.' \
              --prerelease
          fi
          gh release view "$TAG" --json url --jq '.url'
