name: RM11 - Private Turnip GPU to Android Surface CPU Bridge (NO APK)
on:
  push:
    branches: [rm11-engine-rebuild]
    paths:
      - '.github/workflows/rm11-turnip-buffer-surface-native.yml'
      - 'app/src/main/cpp/rm11_turnip_buffer_surface.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: NDK AArch64 compile, ELF and no-system-Vulkan gates
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC=app/src/main/cpp/rm11_turnip_buffer_surface.c
          ELF="$RUNNER_TEMP/librm11_turnip_buffer_surface.so"
          "$NDK/aarch64-linux-android29-clang" \
            -std=c11 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -Wl,-z,max-page-size=16384 -o "$ELF" "$SRC" -ldl -landroid
          "$NDK/llvm-readelf" -h "$ELF" | grep -Eq 'Machine:.*AArch64'
          "$NDK/llvm-readelf" -d "$ELF" > "$RUNNER_TEMP/needed.txt"
          if grep -Eq 'Shared library: \[libvulkan.so(\.1)?\]' \
            "$RUNNER_TEMP/needed.txt"; then
            echo 'FATAL: unexpected system Vulkan linkage'
            exit 1
          fi
          "$NDK/llvm-nm" -D "$ELF" > "$RUNNER_TEMP/symbols.txt"
          grep -Fq 'Java_com_rm11_autocore_RM11TurnipBufferSurface_nativeRun' \
            "$RUNNER_TEMP/symbols.txt"
          grep -Fq 'ANativeWindow_lock' "$RUNNER_TEMP/symbols.txt"
          grep -Fq 'ANativeWindow_unlockAndPost' "$RUNNER_TEMP/symbols.txt"
          echo 'RM11_GPU_BUFFER_TO_ANDROID_CPU_SURFACE_ARM64_JNI_VALID_NO_SYSTEM_VULKAN'
